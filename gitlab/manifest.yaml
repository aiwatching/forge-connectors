id: gitlab
name: GitLab
icon: "🦊"
version: "1.8.3"
author: forge
category: connector
mode: server-side

# Home Kanban card (read by Forge's kanban seeder, ignored by the connector
# loader). The card renders a WidgetSpec produced from the prompt below.
kanban:
  cards:
    - title: "MRs — load & release watch"
      icon: "🦊"
      period_sec: 1800
      prompt: |
        Show my GitLab merge-request load. Gather all three relationships
        (state=opened):
        - Assigned to me:        list_my_mrs(state=opened)
        - Authored by me:        list_authored_mrs(state=opened)
        - Review requested of me: search_mrs(reviewer_username='me', state='opened')
        Put a metric_row at the top with three counts: assigned / authored /
        review.
        Then LIST the actual MRs (do not just count) as items, grouped in this
        order: first "Review requested" (badge blue 'REVIEW'), then "Assigned
        to me" (badge amber 'ASSIGNED'), then any targeting the upcoming 7.6
        release branch (badge violet '7.6' — these come from the authored/
        assigned sets where target_branch is '7.6' or 'release/7.6'). For each
        item show title + project, link to its web_url, and add a red
        'CONFLICTS' or 'DRAFT' badge where applicable. De-duplicate an MR that
        falls in several groups (show it once with the most important badge).
        Cap ~8 items, newest first. Set the widget "accent" to "violet". English.
description: |
  GitLab REST API connector (server-side via Personal Access Token).
  Covers issues, merge requests, projects, pipelines, branches, files,
  and notes — about 25 tools. All requests run inside Forge — no
  browser tab needed — so it works from chat, jobs, pipelines, and
  the CLI alike.

  Replaces the 0.2.x browser-DOM-scraping connector.

catalog_summary: |
  GitLab REST API (server-side, Personal Access Token auth). Read and
  search merge requests (search_mrs, list_my_todos), view issues and
  epics, read files and diffs, post notes/todos, manage labels, trigger
  pipelines, query projects/branches/commits. 25+ tools.

settings:
  base_url:
    type: string
    label: GitLab base URL (no trailing /api/v4)
    description: e.g. https://gitlab.com or https://gitlab.example.com
    required: true
  token_name:
    type: string
    label: PAT label
    description: |
      The name you gave the Personal Access Token when you created it on
      GitLab — i.e. the "Token name" field on the PAT creation page, NOT
      your login. Other connectors cross-reference this value via
      `{connector:gitlab.token_name}`; Jenkins passes it as the
      TOKEN_USER build param so triggered jobs can push to git using
      the PAT.
    required: false
  token:
    type: secret
    label: Personal Access Token
    description: |
      Create at <base_url>/-/user_settings/personal_access_tokens.
      Suggested scopes: `api` (full) or `read_api + write_repository`
      if you only need browse + MR/comment.

      Stored AES-256-GCM-encrypted in ~/.forge/data/plugin-configs.json
      with the key at ~/.forge/data/.encrypt-key.
    required: true
  default_project_path:
    type: string
    label: Default project path
    description: |
      Repo path with namespace, e.g. "team-x/some-service". When set,
      tools that take a project (find_project, search_mrs, list_my_todos,
      etc.) fall back to this when the LLM doesn't pass one — so users
      can say "list my open MRs" without spelling out the repo every
      time. Leave empty to require an explicit project on every call.
    required: false

test:
  description: "GET /api/v4/user — verifies base_url + PAT reach GitLab."
  request:
    method: GET
    url: "{settings.base_url}/api/v4/user"
    headers:
      PRIVATE-TOKEN: "{settings.token}"
  ok_template: "Authenticated as {{username}} ({{name}})"
  timeout_ms: 15000

tools:
  # ─── User ──────────────────────────────────────────────────
  me:
    description: "Get the current authenticated user (id, username, email, name)."
    protocol: http
    request:
      method: GET
      url: '{settings.base_url}/api/v4/user'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
    returns: "{ id, username, name, email, avatar_url, web_url, state }"

  # ─── Projects ──────────────────────────────────────────────
  list_my_projects:
    description: |
      List projects the authenticated user is a member of. Returns common
      fields you need (id, path_with_namespace, name, default_branch,
      web_url). Use `find_project` if you want to search by name.
    protocol: http
    parameters:
      per_page:
        description: "Page size (GitLab caps at 100)."
        type: number
        default: 50
      order_by:
        description: "Sort field — id | name | path | created_at | updated_at | last_activity_at."
        type: string
        default: "last_activity_at"
    request:
      method: GET
      url: '{settings.base_url}/api/v4/projects'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      query:
        membership: 'true'
        simple: 'true'
        per_page: '{args.per_page}'
        order_by: '{args.order_by}'
    returns: "[ { id, name, path_with_namespace, default_branch, web_url, ... } ]"

  find_project:
    description: |
      Search projects by name / path. Returns top matches with numeric ids —
      use those as `project_id` for other tools so you don't need to
      URL-encode the path.
    protocol: http
    parameters:
      query:
        description: "Substring matched against project name + path."
        type: string
        required: true
      per_page:
        description: "Page size cap (max 100)."
        type: number
        default: 10
    request:
      method: GET
      url: '{settings.base_url}/api/v4/projects'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      query:
        search: '{args.query}'
        simple: 'true'
        per_page: '{args.per_page}'
    returns: "[ { id, name, path_with_namespace, web_url } ]"

  get_project:
    description: "Get one project by numeric id. Use find_project to look up id from a name."
    protocol: http
    parameters:
      project_id:
        description: "GitLab project numeric id (use find_project to resolve from a path)."
        type: number
        required: true
    request:
      method: GET
      url: '{settings.base_url}/api/v4/projects/{args.project_id}'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'

  list_branches:
    description: "List branches in a project (default branch shown as `default_branch` on get_project)."
    protocol: http
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      per_page:
        description: "Page size cap (max 100)."
        type: number
        default: 50
      search:
        description: "Filter branches whose name contains this substring."
        type: string
        required: false
    request:
      method: GET
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/repository/branches'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      query:
        per_page: '{args.per_page}'
        search: '{args.search}'

  get_branch:
    description: "Get a single branch by name."
    protocol: http
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      branch:
        description: "Branch name — URL-encoded automatically by Forge."
        type: string
        required: true
    request:
      method: GET
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/repository/branches/{args.branch}'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'

  read_file:
    description: |
      Read a file from a project at a given ref (branch / tag / sha). Returns
      raw text. For large files use the GitLab UI directly.
    protocol: http
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      file_path:
        type: string
        required: true
        description: "File path inside the repo. Slashes are fine; GitLab handles them."
      ref:
        description: "Branch / tag / commit SHA to read from."
        type: string
        default: "main"
    request:
      method: GET
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/repository/files/{args.file_path}/raw'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'text/plain'
      query:
        ref: '{args.ref}'

  list_commits:
    description: "List commits on a branch / ref."
    protocol: http
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      ref_name:
        type: string
        description: "Branch / tag / sha"
        default: "main"
      per_page:
        description: "Page size cap (max 100)."
        type: number
        default: 25
    request:
      method: GET
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/repository/commits'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      query:
        ref_name: '{args.ref_name}'
        per_page: '{args.per_page}'

  # ─── Issues ────────────────────────────────────────────────
  list_my_issues:
    description: "List issues assigned to me across all projects. state ∈ {opened, closed, all}."
    protocol: http
    parameters:
      state:
        description: "opened | closed | all."
        type: string
        default: "opened"
      labels:
        type: string
        description: "Comma-separated label names"
        required: false
      per_page:
        description: "Page size cap (max 100)."
        type: number
        default: 50
    request:
      method: GET
      url: '{settings.base_url}/api/v4/issues'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      query:
        scope: 'assigned_to_me'
        state: '{args.state}'
        labels: '{args.labels}'
        per_page: '{args.per_page}'
    returns: "[ { iid, project_id, title, state, labels, milestone, assignees, web_url, ... } ]"

  list_issues:
    description: "List issues in a project with optional filters."
    protocol: http
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      state:
        description: "opened | closed | all."
        type: string
        default: "opened"
      labels:
        description: "Comma-separated label names (must have ALL)."
        type: string
        required: false
      milestone:
        description: "Milestone title — exact match."
        type: string
        required: false
      assignee_username:
        description: "GitLab username of the assignee (not display name)."
        type: string
        required: false
      search:
        type: string
        description: "Free-text search on title + description"
        required: false
      per_page:
        description: "Page size cap (max 100)."
        type: number
        default: 50
    request:
      method: GET
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/issues'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      query:
        state: '{args.state}'
        labels: '{args.labels}'
        milestone: '{args.milestone}'
        assignee_username: '{args.assignee_username}'
        search: '{args.search}'
        per_page: '{args.per_page}'

  get_issue:
    description: "Get one issue by project + iid (project-scoped issue number)."
    protocol: http
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      issue_iid:
        description: "Project-scoped issue number (the #N shown in the UI), not the global id."
        type: number
        required: true
    request:
      method: GET
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/issues/{args.issue_iid}'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'

  search_issues:
    description: "Search issues across ALL projects visible to the user."
    protocol: http
    parameters:
      query:
        description: "Free-text search on title + description."
        type: string
        required: true
      state:
        description: "opened | closed | all."
        type: string
        default: "opened"
      per_page:
        description: "Page size cap (max 100)."
        type: number
        default: 25
    request:
      method: GET
      url: '{settings.base_url}/api/v4/issues'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      query:
        search: '{args.query}'
        state: '{args.state}'
        per_page: '{args.per_page}'

  create_issue:
    description: "Create an issue in a project. Returns the created issue including iid + web_url."
    protocol: http
    destructive: true
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      title:
        description: "Issue title (required)."
        type: string
        required: true
      description:
        description: "Issue description body (Markdown)."
        type: string
        required: false
      labels:
        description: "Comma-separated label names to apply."
        type: string
        required: false
      assignee_ids:
        type: string
        description: "Comma-separated user ids"
        required: false
      milestone_id:
        description: "Numeric milestone id to attach."
        type: number
        required: false
    request:
      method: POST
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/issues'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      body:
        title: '{args.title}'
        description: '{args.description}'
        labels: '{args.labels}'
        assignee_ids: '{args.assignee_ids}'
        milestone_id: '{args.milestone_id}'

  update_issue:
    description: |
      Partial update — only fields you set change. Common uses:
      change state ('close' / 'reopen'), reassign, edit labels.
    protocol: http
    destructive: true
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      issue_iid:
        description: "Project-scoped issue number to update."
        type: number
        required: true
      title:
        description: "New title (omit to leave unchanged)."
        type: string
        required: false
      description:
        description: "New description (omit to leave unchanged)."
        type: string
        required: false
      state_event:
        type: string
        description: "'close' | 'reopen'"
        required: false
      labels:
        description: "Replace label set with this comma-separated list."
        type: string
        required: false
      assignee_ids:
        description: "Comma-separated user ids to assign (empty to clear)."
        type: string
        required: false
    request:
      method: PUT
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/issues/{args.issue_iid}'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      body:
        title: '{args.title}'
        description: '{args.description}'
        state_event: '{args.state_event}'
        labels: '{args.labels}'
        assignee_ids: '{args.assignee_ids}'

  list_issue_notes:
    description: "List comments on an issue."
    protocol: http
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      issue_iid:
        description: "Project-scoped issue number."
        type: number
        required: true
      per_page:
        description: "Page size cap (max 100)."
        type: number
        default: 50
      sort:
        description: "asc | desc — order by created_at."
        type: string
        default: "asc"
    request:
      method: GET
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/issues/{args.issue_iid}/notes'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      query:
        per_page: '{args.per_page}'
        sort: '{args.sort}'

  add_issue_note:
    description: "Post a comment on an issue."
    protocol: http
    destructive: true
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      issue_iid:
        description: "Project-scoped issue number to comment on."
        type: number
        required: true
      body:
        description: "Comment body (Markdown)."
        type: string
        required: true
    request:
      method: POST
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/issues/{args.issue_iid}/notes'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      body:
        body: '{args.body}'

  # ─── Merge requests ────────────────────────────────────────
  list_my_mrs:
    description: "List MRs assigned to me (as reviewer/assignee) across all projects."
    protocol: http
    parameters:
      state:
        description: "opened | closed | merged | locked | all."
        type: string
        default: "opened"
      target_branch:
        type: string
        description: "Optional target-branch filter, e.g. main / 7.6"
      per_page:
        description: "Page size cap (max 100)."
        type: number
        default: 50
    request:
      method: GET
      url: '{settings.base_url}/api/v4/merge_requests'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      query:
        scope: 'assigned_to_me'
        state: '{args.state}'
        target_branch: '{args.target_branch}'
        per_page: '{args.per_page}'

  list_authored_mrs:
    description: |
      List MRs I created (where I'm the author). Use this for
      "watch my own MRs for incoming review comments" — pair with
      the mr-review-fix pipeline. Distinct from list_my_mrs which
      covers MRs assigned to me as reviewer/assignee.
    protocol: http
    parameters:
      state:
        description: "opened | closed | merged | locked | all."
        type: string
        default: "opened"
      target_branch:
        type: string
        description: "Optional target-branch filter, e.g. main / 7.6"
      per_page:
        description: "Page size cap (max 100)."
        type: number
        default: 50
    request:
      method: GET
      url: '{settings.base_url}/api/v4/merge_requests'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      query:
        scope: 'created_by_me'
        state: '{args.state}'
        target_branch: '{args.target_branch}'
        per_page: '{args.per_page}'

  list_my_todos:
    description: |
      List pending Todos for the current user — same set that appears in
      GitLab's web UI "Todos" panel. One call covers every project the
      token can see, so this is the right tool for "watch for incoming
      attention items" without one Job per MR.

      Action cheat-sheet (observed in the wild on dops-git106):
        - review_submitted   ← someone finished reviewing your MR
                               (the case you want for "reviewer left
                               feedback on my MR, go fix the code")
        - mentioned          ← someone @-mentioned you in a comment
        - review_requested   ← someone asked you to review their MR
        - assigned           ← MR/Issue was assigned to you
        - approval_required, unmergeable, build_failed,
          directly_addressed, merge_train_removed, marked

      Omit `action` to get all of them — dedup on `id` and let the
      pipeline branch on `action_name`. Each todo carries `target` with
      iid + project_id + title + web_url + author, so you can hand it
      straight to a `mr-review-fix` pipeline.
    protocol: http
    parameters:
      action:
        type: string
        description: |
          One of the values above, or omit for all. **There is no
          'commented' action — review-style comments arrive as
          'review_submitted' or 'mentioned'.**
        required: false
      target_type:
        type: string
        description: "MergeRequest | Issue | Commit | DesignManagement::Design | AlertManagement::Alert. Omit for all."
        required: false
      state:
        type: string
        default: "pending"
        description: "pending (default — unread) | done"
      author_id:
        type: number
        description: "Filter by todo author (the user whose action created the todo)."
        required: false
      project_id:
        type: number
        description: "Filter to one project."
        required: false
      per_page:
        description: "Page size cap (max 100)."
        type: number
        default: 50
    request:
      method: GET
      url: '{settings.base_url}/api/v4/todos'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      query:
        action:      '{args.action}'
        type:        '{args.target_type}'
        state:       '{args.state}'
        author_id:   '{args.author_id}'
        project_id:  '{args.project_id}'
        per_page:    '{args.per_page}'

  list_mrs:
    description: "List merge requests in a project with filters."
    protocol: http
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      state:
        type: string
        default: "opened"
        description: "opened | closed | merged | locked | all"
      source_branch:
        description: "Exact source branch name."
        type: string
        required: false
      target_branch:
        description: "Exact target branch name (e.g. main, release/7.6)."
        type: string
        required: false
      labels:
        description: "Comma-separated label names (must have ALL)."
        type: string
        required: false
      search:
        description: "Free-text search on title + description."
        type: string
        required: false
      per_page:
        description: "Page size cap (max 100)."
        type: number
        default: 50
    request:
      method: GET
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/merge_requests'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      query:
        state: '{args.state}'
        source_branch: '{args.source_branch}'
        target_branch: '{args.target_branch}'
        labels: '{args.labels}'
        search: '{args.search}'
        per_page: '{args.per_page}'

  get_mr:
    description: "Get a merge request by project + iid."
    protocol: http
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      mr_iid:
        description: "Project-scoped MR number (the !N shown in the UI)."
        type: number
        required: true
    request:
      method: GET
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/merge_requests/{args.mr_iid}'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'

  get_mr_changes:
    description: "Get the diff + changed files for a merge request."
    protocol: http
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      mr_iid:
        description: "Project-scoped MR number."
        type: number
        required: true
    request:
      method: GET
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/merge_requests/{args.mr_iid}/changes'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
    returns: "{ id, iid, changes: [ { old_path, new_path, diff } ], ... }"

  search_mrs:
    description: |
      Search merge requests across ALL projects the token can see. Filter
      by author / assignee / reviewer (usernames, not numeric ids),
      source / target branch, labels, free-text query, time windows.

      Typical review loop:
        1. search_mrs(reviewer_username='me', state='opened') → list MRs
        2. get_mr_changes(project_id, mr_iid) → diff
        3. add_mr_note(project_id, mr_iid, body=...) → post review
    protocol: http
    parameters:
      query:
        type: string
        description: "Free-text search on title + description."
        required: false
      state:
        type: string
        default: "opened"
        description: "opened | closed | merged | locked | all"
      author_username:
        type: string
        description: "Filter to MRs opened by this user (GitLab username, not display name)."
        required: false
      assignee_username:
        type: string
        description: "Filter to MRs assigned to this user."
        required: false
      reviewer_username:
        type: string
        description: "Filter to MRs where this user is a requested reviewer."
        required: false
      source_branch:
        type: string
        description: "Exact source branch name."
        required: false
      target_branch:
        type: string
        description: "Exact target branch name (e.g. 'main', 'release/7.6')."
        required: false
      labels:
        type: string
        description: "Comma-separated label names (must have ALL)."
        required: false
      milestone:
        description: "Milestone title — exact match."
        type: string
        required: false
      scope:
        type: string
        description: |
          all | created_by_me | assigned_to_me. Default 'all' — needs token
          with view permission for any returned MR.
        default: "all"
      wip:
        type: string
        description: "yes | no — restrict to (or exclude) Draft/WIP MRs."
        required: false
      created_after:
        type: string
        description: "ISO 8601 (e.g. 2026-05-01T00:00:00Z). MRs opened on/after this."
        required: false
      created_before:
        description: "ISO 8601 upper bound — MRs opened on/before this."
        type: string
        required: false
      updated_after:
        type: string
        description: "ISO 8601. Useful for 'MRs updated since yesterday' polls."
        required: false
      updated_before:
        description: "ISO 8601 upper bound — MRs updated on/before this."
        type: string
        required: false
      order_by:
        type: string
        description: "created_at | updated_at | title — default updated_at."
        default: "updated_at"
      sort:
        type: string
        description: "asc | desc — default desc (newest first)."
        default: "desc"
      per_page:
        description: "Page size cap (max 100)."
        type: number
        default: 25
      page:
        type: number
        description: "1-based page number for pagination."
        required: false
    request:
      method: GET
      url: '{settings.base_url}/api/v4/merge_requests'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      query:
        search: '{args.query}'
        state: '{args.state}'
        author_username: '{args.author_username}'
        assignee_username: '{args.assignee_username}'
        reviewer_username: '{args.reviewer_username}'
        source_branch: '{args.source_branch}'
        target_branch: '{args.target_branch}'
        labels: '{args.labels}'
        milestone: '{args.milestone}'
        scope: '{args.scope}'
        wip: '{args.wip}'
        created_after: '{args.created_after}'
        created_before: '{args.created_before}'
        updated_after: '{args.updated_after}'
        updated_before: '{args.updated_before}'
        order_by: '{args.order_by}'
        sort: '{args.sort}'
        per_page: '{args.per_page}'
        page: '{args.page}'
    returns: |
      Array of MR objects: id, iid, project_id, title, description, state,
      author, assignees[], reviewers[], source_branch, target_branch,
      labels[], web_url, created_at, updated_at, merge_status,
      draft (=WIP), …. Pair with get_mr_changes / list_mr_notes /
      add_mr_note for review workflows.

  create_mr:
    description: |
      Create a merge request. Common pattern after a Forge pipeline pushes a
      fix branch: create_mr(project_id, source_branch=fix/..., target_branch=main, title=..., description=...).
    protocol: http
    destructive: true
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      source_branch:
        description: "Branch containing the changes."
        type: string
        required: true
      target_branch:
        description: "Branch to merge into (e.g. main)."
        type: string
        required: true
      title:
        description: "MR title."
        type: string
        required: true
      description:
        description: "MR description (Markdown)."
        type: string
        required: false
      remove_source_branch:
        description: "Delete source branch after merge (default true)."
        type: boolean
        default: true
      squash:
        description: "Squash commits when merging (default false)."
        type: boolean
        default: false
      assignee_ids:
        type: string
        description: "Comma-separated user ids"
        required: false
      labels:
        description: "Comma-separated label names to apply."
        type: string
        required: false
    request:
      method: POST
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/merge_requests'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      body:
        source_branch: '{args.source_branch}'
        target_branch: '{args.target_branch}'
        title: '{args.title}'
        description: '{args.description}'
        remove_source_branch: '{args.remove_source_branch}'
        squash: '{args.squash}'
        assignee_ids: '{args.assignee_ids}'
        labels: '{args.labels}'

  update_mr:
    description: "Partial update — title / description / state_event ('close' | 'reopen') / labels / assignees."
    protocol: http
    destructive: true
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      mr_iid:
        description: "Project-scoped MR number to update."
        type: number
        required: true
      title:
        description: "New title (omit to leave unchanged)."
        type: string
        required: false
      description:
        description: "New description (omit to leave unchanged)."
        type: string
        required: false
      state_event:
        description: "'close' | 'reopen'."
        type: string
        required: false
      labels:
        description: "Replace label set with this comma-separated list."
        type: string
        required: false
      assignee_ids:
        description: "Comma-separated user ids to assign (empty to clear)."
        type: string
        required: false
    request:
      method: PUT
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/merge_requests/{args.mr_iid}'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      body:
        title: '{args.title}'
        description: '{args.description}'
        state_event: '{args.state_event}'
        labels: '{args.labels}'
        assignee_ids: '{args.assignee_ids}'

  approve_mr:
    description: "Approve a merge request (requires Developer+ role)."
    protocol: http
    destructive: true
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      mr_iid:
        description: "Project-scoped MR number to approve."
        type: number
        required: true
    request:
      method: POST
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/merge_requests/{args.mr_iid}/approve'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'

  merge_mr:
    description: "Actually merge a merge request. Verify CI passed + approvals met first."
    protocol: http
    destructive: true
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      mr_iid:
        description: "Project-scoped MR number to merge."
        type: number
        required: true
      merge_commit_message:
        description: "Override the auto-generated merge commit message."
        type: string
        required: false
      should_remove_source_branch:
        description: "Delete source branch after merge (default true)."
        type: boolean
        default: true
      squash:
        description: "Squash commits when merging (default false)."
        type: boolean
        default: false
      merge_when_pipeline_succeeds:
        description: "Queue the merge to fire once the running pipeline passes."
        type: boolean
        default: false
    request:
      method: PUT
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/merge_requests/{args.mr_iid}/merge'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      body:
        merge_commit_message: '{args.merge_commit_message}'
        should_remove_source_branch: '{args.should_remove_source_branch}'
        squash: '{args.squash}'
        merge_when_pipeline_succeeds: '{args.merge_when_pipeline_succeeds}'

  list_mr_notes:
    description: "List comments on a merge request."
    protocol: http
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      mr_iid:
        description: "Project-scoped MR number."
        type: number
        required: true
      per_page:
        description: "Page size cap (max 100)."
        type: number
        default: 50
      sort:
        description: "asc | desc — order by created_at."
        type: string
        default: "asc"
    request:
      method: GET
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/merge_requests/{args.mr_iid}/notes'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      query:
        per_page: '{args.per_page}'
        sort: '{args.sort}'

  add_mr_note:
    description: "Post a comment on a merge request."
    protocol: http
    destructive: true
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      mr_iid:
        description: "Project-scoped MR number to comment on."
        type: number
        required: true
      body:
        description: "Comment body (Markdown)."
        type: string
        required: true
    request:
      method: POST
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/merge_requests/{args.mr_iid}/notes'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      body:
        body: '{args.body}'

  # ─── Pipelines / CI ────────────────────────────────────────
  list_pipelines:
    description: "List pipelines for a project. Filter by ref / status / username."
    protocol: http
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      ref:
        description: "Branch / tag name to filter pipelines by."
        type: string
        required: false
      status:
        type: string
        description: "running | pending | success | failed | canceled | skipped | manual"
        required: false
      username:
        description: "GitLab username — filter to pipelines triggered by this user."
        type: string
        required: false
      per_page:
        description: "Page size cap (max 100)."
        type: number
        default: 20
    request:
      method: GET
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/pipelines'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      query:
        ref: '{args.ref}'
        status: '{args.status}'
        username: '{args.username}'
        per_page: '{args.per_page}'

  get_pipeline:
    description: "Get one pipeline's details by id."
    protocol: http
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      pipeline_id:
        description: "Pipeline numeric id (from list_pipelines)."
        type: number
        required: true
    request:
      method: GET
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/pipelines/{args.pipeline_id}'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'

  list_pipeline_jobs:
    description: "List jobs in a pipeline."
    protocol: http
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      pipeline_id:
        description: "Pipeline numeric id whose jobs to list."
        type: number
        required: true
      scope:
        type: string
        description: "Comma list of: running, pending, finished, branches, tags. Empty = all."
        required: false
    request:
      method: GET
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/pipelines/{args.pipeline_id}/jobs'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
      query:
        scope: '{args.scope}'

  retry_pipeline:
    description: "Retry failed jobs in a pipeline."
    protocol: http
    destructive: true
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      pipeline_id:
        description: "Pipeline numeric id to retry failed jobs for."
        type: number
        required: true
    request:
      method: POST
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/pipelines/{args.pipeline_id}/retry'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'

  cancel_pipeline:
    description: "Cancel all running jobs in a pipeline."
    protocol: http
    destructive: true
    parameters:
      project_id:
        description: "GitLab project numeric id."
        type: number
        required: true
      pipeline_id:
        description: "Pipeline numeric id to cancel."
        type: number
        required: true
    request:
      method: POST
      url: '{settings.base_url}/api/v4/projects/{args.project_id}/pipelines/{args.pipeline_id}/cancel'
      headers:
        Authorization: 'Bearer {settings.token}'
        Accept: 'application/json'
