id: teams
name: Microsoft Teams
icon: "💬"
version: "0.10.33"
author: forge
category: connector
mode: browser-side
runner: isolated
# Teams misbehaves in the extension (throttled/focus-stealing); prefer the
# off-screen CDP runtime, fall back to the extension if CDP is unavailable.
runtime: cdp
# Teams web is slow to load — keep the tab Forge opens alive and reuse it
# (host_match match) on subsequent calls instead of reopening every time.
tab_strategy: persistent

# Home Kanban default card. After adding it, edit the prompt to fill in the
# real team + channel names. Runs as a CLI task (Teams is a heavy SPA).
kanban:
  cards:
    - title: "Teams — channels watch"
      icon: "💬"
      period_sec: 1800
      mode: task
      prompt: |
        Monitor one or more Microsoft Teams channels and summarize what's new.

        # === Editable variables (change the values; keep the names) ===
        CHANNELS     = ["FortiNAC / General"]   # each entry: "Team / Channel"
        MAX_MESSAGES = 10                        # recent posts per channel
        # =============================================================

        If CHANNELS is empty, render a single amber callout "Set CHANNELS on
        this card" and STOP. Otherwise process the entries ONE AT A TIME,
        SEQUENTIALLY — wait for each read_channel to return before starting the
        next. NEVER call read_channel in parallel: the connector drives a single
        Teams tab, so concurrent calls collide and each times out (~60s). For
        each entry split it on " / " into <team> and <channel>, then call
        mcp__forge__call_connector plugin_id='teams' tool='read_channel'
        args={team:<team>, channel:<channel>, max_messages: <the MAX_MESSAGES
        value>}. If a call returns an error, note that channel as failed and
        continue with the next; don't retry it. Collect all posts, tagging each
        with its source channel.

        Each post has: subject, author (who started the thread), body, timestamp,
        post_url, attachments, and replies:[{author, body, timestamp}] (oldest→
        newest). ANALYZE each thread — don't just echo the title:
        - topic: one line on what the thread is actually about / the problem asked.
        - answered?: are there replies? who gave the LAST reply (replies[-1].author)
          and roughly when. If no replies → unanswered.
        - needs reply?: TRUE when the thread is an open question / request / report
          AND (no replies, OR the last message is from the original asker again, i.e.
          a follow-up/ping with no answer after it). FALSE when the last reply
          resolves it (e.g. an answer/ack from someone other than the asker, or
          wording like "done/fixed/resolved/thanks").

        Sort: NEEDS-REPLY threads first, then unanswered, then recently-active.
        metric_row at top: total threads / needs-reply / answered.
        list (cap ~10), each item:
          - text: "<channel> · <topic>"
          - sub: "asked by <author> · <N> replies · last: <last replier or '—'>"
          - badge: red 'NEEDS REPLY' if needs-reply; green 'ANSWERED' if resolved;
            gray 'FYI' otherwise. Add amber 'FILES' if attachments present.
          - href: the post's post_url (jump to the message).
        Set accent "purple". English, scannable. If a channel returned an error,
        add one amber callout naming it and continue with the others.

description: |
  Microsoft Teams web (v2 UI). Reuses the user's logged-in session via
  the runner's ISOLATED world — page CSP doesn't apply, but window
  globals (MSAL token etc.) are NOT accessible. Pure DOM extraction.

  Wait strategy:
    - Runner checks chrome.tabs.query first and reuses any existing
      Teams tab via host_match.
    - Each script waits up to ~30s for Teams hydration before extracting,
      so cold-load is handled.
    - Switching chats/channels polls up to 30s for the new content to
      render (Teams can be slow on enterprise networks).

  Selectors verified on teams.microsoft.com/v2/ via chrome-devtools-mcp.
  Microsoft rotates Fluent UI hooks — when extraction starts returning
  empty, re-probe and bump this manifest.

  Left-rail anchors (v0.9.4 — precise, replaced fragile aria-level):
    - Chats:    [role="treeitem"][data-item-type="chat"|"muted-chat"]
    - Channels: [role="treeitem"][data-item-type="channel"]
    - Teams:    [role="treeitem"][data-item-type="team"]
    A channel's owning team = the nearest preceding data-item-type="team"
    in document order. The stable thread id lives in the suffix of
    data-fui-tree-item-value (after the last '|'). aria-level is NOT used
    for selection — level 2 mixes chats + teams + menu items, which was
    the root cause of mis-targeting.
    Lazy lists: items past "See more" (chats) / "See all your teams"
    (teams) aren't in the DOM until that expander is clicked — each tool
    clicks it once and retries before giving up.

catalog_summary: |
  Microsoft Teams web client (browser-runner, isolated CSP world).
  Read messages from channels, group chats, and 1:1 DMs; list channels
  + recent chats; open a chat by display name; send messages to any
  chat by name (creates new DM if needed). Pure DOM extraction.

settings:
  base_url:
    type: string
    label: Teams base URL
    description: "Usually https://teams.microsoft.com"
    default: "https://teams.microsoft.com"
    required: true
  # M365 tenant email — fills login.microsoftonline.com's email gate
  # (input#i0116) during unified IdP login. Three input styles:
  #   @fortinet-us.com         Suffix only. Forge prepends the unified-login
  #                            username at sign-in time. Recommended when
  #                            the local-part matches your SSO username.
  #   zliu@fortinet-us.com     Full email — used verbatim. Use when the
  #                            local-part differs from your SSO username.
  #   (blank)                  Falls back to the unified-login username
  #                            (with the displayEmail domain auto-appended
  #                            if the username has no '@').
  tenant_email:
    type: string
    label: M365 tenant email or domain suffix (e.g. @fortinet-us.com)
    description: "Fills login.microsoftonline.com's email page (input#i0116). Recommended: enter just the M365 domain with a leading '@' (e.g. @fortinet-us.com) — Forge prepends your unified-login username at sign-in time, so you don't repeat it. You may also enter a full email (zliu@fortinet-us.com) to override the local-part, or leave blank when M365 and your SSO IdP use the same address."
    required: false
  # For unattended automation (chat reads/sends while Teams tab is in the
  # background) enable the Forge extension's "Activate connector tab while
  # running (steals focus)" toggle in the extension's Settings tab. The
  # extension auto-activates the Teams tab before each script run and
  # restores your previous tab/window after — this bypasses Chrome's
  # bg-tab throttling that would otherwise make chat switching unreliable
  # (channel reads stay bg-safe via MutationObserver regardless). No
  # connector-side setting — the extension toggle covers all browser
  # connectors uniformly.

host_match: "{base_url}/*"
login_redirect: "login.microsoftonline.com"

test:
  description: "Opens a Teams tab; ✓ if logged in, ✗ if redirected to login OR the top-right avatar shows Unknown presence (dead/stale SW-cached session)."
  probe: browser
  timeout_ms: 45000  # Teams web is slow to settle on first load
  # Stale-session detection: a dead session still renders the cached shell
  # (looks logged in, old chats visible) but never redirects to login — the
  # only tell is the top-right ME avatar's presence = "Unknown". Match it two
  # ways on the me-control-avatar-trigger button (scoped to YOUR avatar so an
  # Offline colleague's identical ring doesn't trip it): aria-label "…status
  # Unknown", or the empty hollow-ring glyph (path M5 1a4 4…). Present → logged out.
  auth_required_selector: '[data-tid="me-control-avatar-trigger"][aria-label*="Unknown" i], [data-tid="me-control-avatar-trigger"] svg path[d^="M5 1a4 4 0 1 0 0 8"]'

tools:
  list_chats:
    description: |
      List 1:1 and group chats from the left rail (recent + favorites,
      including muted). Returns title + stable thread_id + muted/unread
      flags. Virtualized + lazy — chats past "See more" aren't rendered
      until expanded; read_chat(name) expands on demand.
    parameters:
      limit:
        type: number
        default: 100
    returns: "{ chats: [{ title, thread_id, muted, unread }], total }"
    page:
      url: "{base_url}/v2/"
      on_target: "teams.microsoft.com"
      settle_after_load_ms: 5000
    script: |
      // Precise chat list via data-item-type (chat + muted-chat). The old
      // aria-level grouping pulled in teams + menu items; this is clean.
      const CHAT_SEL = '[role="treeitem"][data-item-type="chat"], [role="treeitem"][data-item-type="muted-chat"]';
      const firstLine = (el) => (el.innerText || '').split('\n').filter(Boolean)[0] || '';
      const threadIdOf = (el) => {
        const v = el.getAttribute('data-fui-tree-item-value') || '';
        const m = (v.split('/').pop() || '').match(/\|(.+)$/);
        return m ? m[1] : null;
      };

      // Chats live under collapsible folders (Chats / Favorites / Meetings —
      // types "chats" + "custom-folder"). A collapsed folder drops its chats
      // from the DOM, so reads miss them. Expand any collapsed chat folder
      // (click only toggles collapsed ones; cheap to re-run each tick).
      const expandChatFolders = () => {
        let n = 0;
        for (const h of document.querySelectorAll('[role="treeitem"][data-item-type="chats"], [role="treeitem"][data-item-type="custom-folder"]')) {
          if (h.getAttribute('aria-expanded') === 'false') { try { h.click(); n++; } catch {} }
        }
        return n;
      };
      const tStart = Date.now();
      while (Date.now() - tStart < 30000) {
        expandChatFolders();
        if (document.querySelectorAll(CHAT_SEL).length > 0) break;
        await new Promise(r => setTimeout(r, 500));
      }
      // Some folders may have been open while others were collapsed — expand the
      // rest so the list is complete, then let them render.
      if (expandChatFolders() > 0) await new Promise(r => setTimeout(r, 700));

      const limit = args.limit || 100;
      const chats = [...document.querySelectorAll(CHAT_SEL)].map(el => ({
        title: firstLine(el),
        thread_id: threadIdOf(el),
        muted: el.getAttribute('data-item-type') === 'muted-chat',
        unread: /\bUnread\b/.test(el.getAttribute('aria-label') || '') || /\bUnread\b/.test(el.innerText || ''),
      })).filter(c => c.title);

      return {
        chats: chats.slice(0, limit),
        total: chats.length,
        _note: 'Virtualized + lazy — chats past "See more" need it expanded (read_chat does this on demand).',
        _waited_ms: Date.now() - tStart,
        _page: location.href,
      };

  list_messages_in_current_chat:
    description: |
      Extract messages from the currently-open chat (the one visible in
      the main pane). Returns id, author, body, timestamp. The user
      should open the target chat in Teams first.

      Prefer `read_chat(name)` instead — it does the switching for you.
    parameters:
      limit:
        type: number
        label: Max messages (most recent)
        default: 50
    returns: "{ chat_title, messages: [...], total, _virtualized }"
    page:
      url: "{base_url}/v2/"
      on_target: "teams.microsoft.com"
      settle_after_load_ms: 5000
    script: |
      // Wait up to 30s for chat content to render
      const tStart = Date.now();
      while (Date.now() - tStart < 30000) {
        if (document.querySelectorAll('[data-tid="chat-pane-item"]').length > 0) break;
        await new Promise(r => setTimeout(r, 500));
      }

      const items = Array.from(document.querySelectorAll('[data-tid="chat-pane-item"]'));
      const messages = items.map(item => {
        const msg = item.querySelector('[data-tid="chat-pane-message"]');
        const mid = msg?.getAttribute('data-mid') || '';
        const authorEl = item.querySelector('[data-tid="message-author-name"]');
        const contentEl = mid ? document.getElementById('content-' + mid) : null;
        const tsEl = mid ? document.getElementById('timestamp-' + mid) : null;
        const subjectEl = mid ? document.getElementById('subject-line-' + mid) : null;
        const reactionEls = item.querySelectorAll('[data-tid="diverse-reaction-pill-button"], [data-tid*="reaction-pill"]');
        const reactions = Array.from(reactionEls).map(r => r.getAttribute('aria-label') || r.textContent.trim()).filter(Boolean);
        return {
          mid,
          author: authorEl?.innerText.trim() || '',
          body: contentEl?.innerText.trim() || msg?.innerText.trim() || '',
          subject: subjectEl?.innerText.trim() || '',
          timestamp: tsEl?.getAttribute('title') || tsEl?.innerText.trim() || '',
          reactions,
        };
      }).filter(m => m.body || m.author);

      const headerParticipant = document.querySelector('[data-tid^="participant-"]');
      let chatTitle = '';
      if (headerParticipant) {
        const node = headerParticipant.closest('div[class*="container"], div[class*="header"]');
        chatTitle = (node?.innerText || headerParticipant.innerText || '').split('\n')[0].trim();
      }

      const limit = args.limit || 50;
      return {
        chat_title: chatTitle,
        messages: messages.slice(-limit),
        total: messages.length,
        _virtualized: true,
        _waited_ms: Date.now() - tStart,
        _page: location.href,
      };

  get_current_chat_info:
    description: |
      Identify the currently-open chat — title, participants if visible.
      Useful as a quick "where am I" call before list_messages.
    returns: "{ chat_title, participants, url }"
    page:
      url: "{base_url}/v2/"
      on_target: "teams.microsoft.com"
      settle_after_load_ms: 5000
    script: |
      const tStart = Date.now();
      while (Date.now() - tStart < 30000) {
        if (document.querySelector('[data-tid^="participant-"]')) break;
        await new Promise(r => setTimeout(r, 500));
      }

      const participantEls = Array.from(document.querySelectorAll('[data-tid^="participant-"]'));
      const participants = participantEls.map(p => ({
        name: (p.innerText || '').trim().split('\n')[0],
        data_tid: p.getAttribute('data-tid') || '',
      })).filter(p => p.name);

      const seen = new Set();
      const unique = participants.filter(p => {
        if (seen.has(p.data_tid)) return false;
        seen.add(p.data_tid);
        return true;
      });

      const chatTitle = unique.map(p => p.name).join(', ');
      return { chat_title: chatTitle, participants: unique, url: location.href };

  read_chat:
    description: |
      Switch to a specific 1:1 or group chat by name (substring match,
      case-insensitive) and extract its messages. Combines open + read
      into one tool — no need to open the chat manually first.

      Waits up to 30s for Teams to hydrate (handles cold load) and up
      to 30s for the chat switch to complete.

      ⚠ If this returns `{ ok: false, error: "Teams tab is hidden ..." }`:
      SURFACE THE ERROR TO THE USER and STOP. Do not retry. The Teams tab
      is in a background state where Chrome throttles JS — chat switching
      can't proceed. Tell the user EITHER (a) bring the Teams tab
      on-screen and retry, OR (b) enable the Forge extension's "Activate
      connector tab while running (steals focus)" toggle in the
      extension's Settings tab, which auto-activates the tab before each
      run and restores their previous tab/window after.
    parameters:
      name:
        type: string
        label: Chat name (substring, case-insensitive — e.g. "Alice Wang", "Eng Leaders")
        required: true
      limit:
        type: number
        label: Max messages (most recent)
        default: 50
    returns: "{ ok, chat_title, thread_id, messages: [{ author, body, timestamp, attachments:[{name,url}], images:[{url,alt,width,height}] }], total, switched_in_ms }"
    page:
      url: "{base_url}/v2/"
      on_target: "teams.microsoft.com"
      settle_after_load_ms: 5000
    script: |
      const name = String(args.name || '').trim();
      if (!name) return { ok: false, error: 'name parameter is required' };
      const lower = name.toLowerCase();
      // Self-bounding: every loop gates on within() so the tool returns well
      // before the 60s RPC kill.
      const _t0 = Date.now();
      const within = () => Date.now() - _t0 < 45000;

      // Background-tab fast-fail. Chrome throttles JS in hidden tabs so
      // heavily (observed setTimeout(500) → 80s+) that rail click+switch
      // can't complete inside the 60s RPC cap. Return a clear error in
      // ~ms. For unattended automation, enable the Forge extension's
      // "Activate connector tab while running" toggle — the extension
      // auto-activates the tab and restores focus, removing this guard.
      if (document.visibilityState === 'hidden') {
        return { ok: false, error: 'Teams tab is hidden (Chrome throttles bg-tab JS — chat switching is unreliable). Bring the Teams tab on-screen, OR enable the Forge extension\'s "Activate connector tab while running (steals focus)" toggle in the extension Settings tab for unattended automation.', visibilityState: 'hidden' };
      }

      // Precise chat anchor — data-item-type, NOT aria-level (which mixes
      // chats/teams/menu items). Covers normal + muted chats.
      const CHAT_SEL = '[role="treeitem"][data-item-type="chat"], [role="treeitem"][data-item-type="muted-chat"]';
      const firstLine = (el) => (el.innerText || '').split('\n').filter(Boolean)[0] || '';
      const threadIdOf = (el) => {
        const v = el.getAttribute('data-fui-tree-item-value') || '';
        const m = (v.split('/').pop() || '').match(/\|(.+)$/);
        return m ? m[1] : null;
      };

      // Chats live under collapsible folders (Chats / Favorites / Meetings —
      // types "chats" + "custom-folder"). A collapsed folder hides its chats
      // from the DOM, so the target can't be found. Expand any collapsed chat
      // folder (toggles only collapsed ones; cheap to re-run).
      const expandChatFolders = () => {
        let n = 0;
        for (const h of document.querySelectorAll('[role="treeitem"][data-item-type="chats"], [role="treeitem"][data-item-type="custom-folder"]')) {
          if (h.getAttribute('aria-expanded') === 'false') { try { h.click(); n++; } catch {} }
        }
        return n;
      };

      // 1. SEARCH-BOX path (PRIMARY when available). Type the query, wait
      //    for a "Person ..." suggestion (PEOPLE or TOPHITS), click it →
      //    Teams navigates straight to the 1:1. Covers ANY Teams user
      //    (including users not in the rail, like sund@→Dancheng Sun).
      //    Caveat: the search backend only fires on KEYBOARD events; an
      //    isolated-world content script can only emit isTrusted=false
      //    synthetic events. In a backgrounded tab this combined with
      //    Chrome's JS throttling means the backend never queries → no
      //    suggestions. Visible-tab behaviour we let the live test reveal.
      //    Capped at 5s wait so a quiet backend doesn't dominate; rail
      //    fallback runs if search yields nothing.
      const setNative = (el, v) => { const d = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set; d.call(el, v); el.dispatchEvent(new Event('input', { bubbles: true })); };
      const typeSearch = (el, v) => {
        el.focus();
        const d = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set; d.call(el, v);
        el.dispatchEvent(new InputEvent('input', { bubbles: true, data: v, inputType: 'insertText' }));
        const k = v.slice(-1) || 'a';
        for (const t of ['keydown', 'keyup']) el.dispatchEvent(new KeyboardEvent(t, { bubbles: true, key: k }));
      };
      let openedViaSearch = false, searchedPerson = null, waitedMs = 0, waitedForReadyMs = 0, expandedSeeMore = false, match = null;
      const searchBox = document.querySelector('input[data-tid="AUTOSUGGEST_INPUT"], #ms-searchux-input');
      if (searchBox) {
        const titleBefore = document.title;
        try {
          searchBox.focus(); setNative(searchBox, ''); await new Promise(r => setTimeout(r, 150)); typeSearch(searchBox, name);
          // Pick a "Person <name>" suggestion (either PEOPLE or TOPHITS
          // bucket) whose aria-label/text contains the query or its
          // email local-part (matches the "(alias)" form too).
          const qLocal = lower.split('@')[0];
          const PERSON_SEL = '[role="option"][data-tid*="AUTOSUGGEST_SUGGESTION_PEOPLE"], [role="option"][data-tid*="AUTOSUGGEST_SUGGESTION_TOPHITS"]';
          const matchPerson = () => [...document.querySelectorAll(PERSON_SEL)]
            .filter(o => /^person\b/i.test((o.getAttribute('aria-label') || '').trim()))
            .find(o => { const s = ((o.getAttribute('aria-label') || '') + ' ' + firstLine(o)).toLowerCase(); return s.includes(lower) || (qLocal.length >= 3 && s.includes(qLocal)); }) || null;
          let person = null;
          for (let i = 0; i < 12 && !person && within(); i++) { await new Promise(r => setTimeout(r, 400)); person = matchPerson(); }
          if (person) {
            searchedPerson = firstLine(person);
            (person.querySelector('[role="button"],a,button') || person).click();
            // Wait for chat pane to populate. MutationObserver-style — but
            // for simplicity reuse the same poll; tab is visible here so
            // setTimeout isn't throttled.
            for (let i = 0; i < 40 && within(); i++) {
              await new Promise(r => setTimeout(r, 200)); waitedMs += 200;
              if (document.title !== titleBefore && document.querySelectorAll('[data-tid="chat-pane-message"]').length > 0) { openedViaSearch = true; break; }
            }
          }
        } catch {}
        try { setNative(searchBox, ''); searchBox.blur(); } catch {}
      }
      // 2. RAIL fallback. Runs ONLY if search-box path didn't open the chat
      //    (no search box / search backend didn't query / no Person match).
      //    Rail items show DISPLAY NAMES only (no email), match the visible
      //    name OR an email local-part whose separator-stripped form equals
      //    the squashed display name (binxu@→"binxu"). EXACT-first scoring
      //    prefers 1:1 "Dancheng Sun" over group chat "Alvin, Dancheng Sun,
      //    David, +6" which both contain the substring.
      const squash = (s) => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      const qLocal2 = lower.split('@')[0];
      const qSquash = squash(qLocal2);
      const scoreItem = (t) => {
        const fl = firstLine(t).toLowerCase();
        if (fl === lower) return 3;
        if (qSquash.length >= 4 && squash(fl) === qSquash) return 2;
        if (fl.includes(lower)) return 1;
        if (((t.innerText || '') + ' ' + (t.getAttribute('aria-label') || '')).toLowerCase().includes(lower)) return 0.5;
        return 0;
      };
      const pickBest = () => {
        let best = null;
        for (const t of document.querySelectorAll(CHAT_SEL)) {
          const s = scoreItem(t);
          if (s > 0 && (!best || s > best.score)) best = { el: t, score: s };
        }
        return best ? best.el : null;
      };
      if (!openedViaSearch) {
        const readyStart = Date.now();
        while (Date.now() - readyStart < 12000 && within()) {
          expandChatFolders();
          if (document.querySelectorAll(CHAT_SEL).length > 0) break;
          await new Promise(r => setTimeout(r, 500));
        }
        waitedForReadyMs = Date.now() - readyStart;
        const railCount = document.querySelectorAll(CHAT_SEL).length;
        if (railCount === 0) {
          return { ok: false, error: 'Teams did not finish loading in time — try again or refresh the tab.' };
        }
        match = pickBest();
        if (!match && expandChatFolders() > 0) { await new Promise(r => setTimeout(r, 700)); match = pickBest(); }
        if (!match) {
          const seeMore = [...document.querySelectorAll('[role="treeitem"]')].find(el => /^See more$/i.test(firstLine(el)));
          if (seeMore) { try { seeMore.click(); } catch {} expandedSeeMore = true; await new Promise(r => setTimeout(r, 900)); match = pickBest(); }
        }
        if (!match) {
          return {
            ok: false,
            error: `No chat matching "${name}" — search box didn't surface them and the rail (recent chats) doesn't contain them. Pass the exact display name, or open the chat manually in Teams once so it appears in the rail.`,
            search_tried: !!searchBox,
            expanded_see_more: expandedSeeMore,
            visible_chats: [...document.querySelectorAll(CHAT_SEL)].slice(0, 40).map(firstLine).filter(Boolean),
          };
        }
      }
      const matchedName = openedViaSearch ? (searchedPerson || name) : firstLine(match);
      let alreadyHere = openedViaSearch || document.title.toLowerCase().includes(matchedName.toLowerCase());
      if (!alreadyHere) {
        const oldMids = new Set([...document.querySelectorAll('[data-tid="chat-pane-message"]')].map(e => e.getAttribute('data-mid')).filter(Boolean));
        try { match.click(); } catch (e) { }
        // Background-tab Chrome throttles setTimeout to 80+s/tick — any
        // setTimeout polling loop blows the 60s RPC cap (proven live).
        // MutationObserver fires on real DOM events, NOT timers, so it's
        // unaffected by throttling. Wait for a chat-pane-message not in
        // oldMids to appear.
        const switchStart = Date.now();
        const checkMids = () => {
          const cur = [...document.querySelectorAll('[data-tid="chat-pane-message"]')].map(e => e.getAttribute('data-mid')).filter(Boolean);
          return cur.length > 0 && cur.some(m => !oldMids.has(m));
        };
        const switched = await new Promise(resolve => {
          if (checkMids()) { resolve(true); return; }
          let done = false;
          const finish = (v) => { if (done) return; done = true; try { obs.disconnect(); } catch {} resolve(v); };
          const obs = new MutationObserver(() => { if (checkMids()) finish(true); });
          obs.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['data-mid'] });
          // Fallback timeout — itself bg-throttled; if click was ignored or
          // the chat is empty, observer never fires and we'll be late.
          const remaining = Math.max(2000, 40000 - (Date.now() - _t0));
          setTimeout(() => finish(false), remaining);
        });
        waitedMs = Date.now() - switchStart;
        if (!switched) { return { ok: false, error: 'Timed out waiting for chat to switch — Teams tab may be heavily backgrounded by Chrome. Bring the Forge extension Chrome window to the foreground and retry.', target_name: name, matched_rail: firstLine(match) }; }
      }
      const matchedThreadId = match ? threadIdOf(match) : null;
      // 4. Extract messages. Prefer time[datetime] (clean ISO) over the
      //    human "Yesterday 5:27 PM" timestamp text. Attachments + pasted
      //    screenshots matter for issue analysis — images expose the REAL
      //    data-orig-src (asyncgw AMS URL), not the useless blob: src.
      // Real SharePoint file URL lives in React props, not the DOM — walk
      // the card's fiber and match by filename. object_url → onedrive.download_file.
      const _fiberOf = (n) => { const k = Object.keys(n).find(k => k.startsWith('__reactFiber$') || k.startsWith('__reactInternalInstance$')); return k ? n[k] : null; };
      const _urlForName = (g, name) => {
        const want = (name || '').toLowerCase(); let best = null, any = null; const seen = new Set();
        let scanned = 0;
        const scan = (o, d) => {
          // Hard node cap: React fibers are huge cyclic graphs; an unbounded
          // walk per attachment is a primary read hang. 4000 nodes is plenty
          // to find a sharepoint URL near the card.
          if (!o || d > 4 || typeof o !== 'object' || seen.has(o) || ++scanned > 4000) return; seen.add(o);
          for (const k of Object.keys(o)) {
            let v; try { v = o[k]; } catch (e) { continue; }
            if (typeof v === 'string' && /^https?:\/\/[^ ]*sharepoint/i.test(v)) {
              if (!any) any = v;
              try { if (decodeURIComponent(new URL(v).pathname).toLowerCase().endsWith(want)) best = v; } catch (e) {}
            } else if (v && typeof v === 'object' && d < 4) scan(v, d + 1);
          }
        };
        let f = _fiberOf(g);
        for (let i = 0; i < 10 && f && !best; i++, f = f.return) { if (f.memoizedProps) scan(f.memoizedProps, 0); }
        return best || any || null;
      };
      const extractAttachments = (root) => {
        const out = [];
        root.querySelectorAll('[data-tid="file-attachment-grid"] [role="group"][aria-label]').forEach(g => {
          const lines = (g.getAttribute('aria-label') || '').split('\n').map(s => s.trim()).filter(Boolean);
          const nm = lines[0] || '';
          if (!nm || /toolbar/i.test(nm)) return;
          const object_url = _urlForName(g, nm) || lines.find(l => /^https?:\/\//.test(l)) || g.querySelector('a[href]')?.getAttribute('href') || null;
          out.push({ name: nm, object_url, url: object_url });
        });
        return out;
      };
      const extractImages = (root) => [...root.querySelectorAll('[data-tid="lazy-image-2"]')].map(el => {
        const e = el.tagName === 'IMG' ? el : (el.querySelector('img') || el);
        return { url: e.getAttribute('data-orig-src') || e.getAttribute('data-gallery-src') || null, alt: e.getAttribute('alt') || null, width: e.naturalWidth || null, height: e.naturalHeight || null };
      }).filter(im => im.url);

      const items = [...document.querySelectorAll('[data-tid="chat-pane-item"]')];
      const messages = items.map(item => {
        const msg = item.querySelector('[data-tid="chat-pane-message"]');
        const mid = msg?.getAttribute('data-mid') || '';
        const authorEl = item.querySelector('[data-tid="message-author-name"]');
        const contentEl = mid ? document.getElementById('content-' + mid) : null;
        const tsEl = mid ? document.getElementById('timestamp-' + mid) : null;
        const timeEl = item.querySelector('time[datetime]');
        const reactionEls = item.querySelectorAll('[data-tid="diverse-reaction-pill-button"], [data-tid*="reaction-pill"]');
        const reactions = [...reactionEls].map(r => r.getAttribute('aria-label') || r.textContent.trim()).filter(Boolean);
        return {
          mid,
          author: authorEl?.innerText.trim() || '',
          body: contentEl?.innerText.trim() || msg?.innerText.trim() || '',
          timestamp: timeEl?.getAttribute('datetime') || tsEl?.getAttribute('title') || tsEl?.innerText.trim() || '',
          reactions,
          attachments: extractAttachments(item),
          images: extractImages(item),
        };
      }).filter(m => m.body || m.author || m.attachments.length || m.images.length);

      // document.title updates async after navigation — observed stale
      // (showing the PREVIOUS chat name) right after a switch even though
      // messages.length already reflects the new chat. Prefer matchedName
      // (taken from the rail item we clicked) as authoritative.
      const titleParts = (document.title || '').split('|').map(s => s.trim()).filter(Boolean);
      const titleChat = titleParts.length >= 3 ? titleParts[1] : (titleParts[0] || '');
      const chatTitle = matchedName || titleChat;

      const limit = args.limit || 50;
      return {
        ok: true,
        chat_title: chatTitle,
        matched_name: matchedName || chatTitle,
        thread_id: matchedThreadId,
        expanded_see_more: expandedSeeMore,
        switched: !alreadyHere,
        switched_in_ms: waitedMs,
        waited_for_ready_ms: waitedForReadyMs,
        messages: messages.slice(-limit),
        total: messages.length,
        _virtualized: true,
        _page: location.href,
      };

  read_channel:
    description: |
      Switch to a specific channel by team name + channel name and
      extract its top-level posts WITH attachments and pasted screenshots
      — channels are mostly customer issues, so file names (logs, configs)
      and screenshot URLs are essential for analysis. Each post + reply
      carries attachments:[{name,url}] and images:[{url,alt,w,h}] where
      url is the real authenticated Teams AMS image URL.

      Locates the channel precisely via data-item-type (not aria-level);
      auto-expands "See all your teams" once if the team isn't visible.
    parameters:
      team:
        type: string
        label: Team name (substring, case-insensitive)
        required: true
      channel:
        type: string
        label: Channel name (substring, case-insensitive)
        required: true
      max_messages:
        type: number
        label: How many posts to collect (scrolls up through the virtualized list to load older history)
        description: "Default 20 (recent only). Higher values scroll up to harvest older posts — slower (~1s per scroll round)."
        default: 20
      limit:
        type: number
        description: "Cap on returned posts after collection. Defaults to max_messages."
        default: 20
    returns: "{ ok, team, channel, channel_thread_id, scroll_rounds, posts: [{ subject, author, timestamp, post_url, body, attachments:[{name,url}], images:[{url,alt,width,height}], replies:[...] }], total }"
    page:
      url: "{base_url}/v2/"
      on_target: "teams.microsoft.com"
      settle_after_load_ms: 5000
    script: |
      const teamName = String(args.team || '').trim();
      const channelName = String(args.channel || '').trim();
      if (!teamName || !channelName) {
        return { ok: false, error: 'team and channel parameters are required' };
      }
      const tLower = teamName.toLowerCase(), cLower = channelName.toLowerCase();
      // Self-bounding: the whole tool MUST return before the 60s RPC kill.
      // We stamp phase timings and stop scrolling/parsing once the soft budget
      // is hit, returning partial + _timing instead of hanging to a hard timeout.
      const _t0 = Date.now();
      const SOFT_BUDGET_MS = Math.min(55000, Number(args.budget_ms) || 45000);
      const within = () => Date.now() - _t0 < SOFT_BUDGET_MS;
      const _timing = {};
      const firstLine = (el) => (el.innerText || '').split('\n').filter(Boolean)[0] || '';
      const threadIdOf = (el) => {
        const v = el.getAttribute('data-fui-tree-item-value') || '';
        const m = (v.split('/').pop() || '').match(/\|(.+)$/);
        return m ? m[1] : null;
      };

      // The "Teams and channels" group can be COLLAPSED by the user. When it is,
      // every team/channel treeitem leaves the DOM and reads fail with the
      // misleading "tab not loaded" — a very common, universal failure. So
      // first expand that group (row-click toggles it; verified via DOM probe).
      const teamCount = () => document.querySelectorAll('[role="treeitem"][data-item-type="team"]').length;
      const expandGroup = async () => {
        const g = document.querySelector('[role="treeitem"][data-item-type="teams-and-channels"]');
        if (g && g.getAttribute('aria-expanded') === 'false') { try { g.click(); } catch {} return true; }
        return false;
      };
      // Ready gate: wait for the TEAM list to render (channels only appear once a
      // team is expanded, so gate on teams, not channels). Expand the group if
      // collapsed; give cold Teams v2 hydration up to 30s. switch+scroll still
      // self-bound the rest under the 60s RPC cap.
      const readyStart = Date.now();
      let groupExpanded = false;
      while (Date.now() - readyStart < 30000) {
        if (teamCount() > 0) break;
        if (!groupExpanded) groupExpanded = await expandGroup();
        await new Promise(r => setTimeout(r, 500));
      }
      if (teamCount() === 0) {
        return { ok: false, error: 'Teams did not finish loading (no teams in left rail in 30s — the "Teams and channels" group may be collapsed, or the tab is still loading). Open the Teams tab, expand "Teams and channels", let it load, then retry.' };
      }
      _timing.ready_ms = Date.now() - _t0;

      // EXACT-FIRST matching. "FortiNAC - Dev" is a substring of "FortiNAC -
      // Development Questions" and "RADIUS" of "RADIUS Questions", so naive
      // includes() opens the WRONG team/channel. Prefer an EXACT team-name match
      // (fall back to includes only when no team matches exactly), and among
      // a team's channels prefer the EXACT channel name over a substring.
      const norm = (s) => (s || '').trim().toLowerCase();
      const teamNames = [...document.querySelectorAll('[role="treeitem"][data-item-type="team"]')].map(t => norm(firstLine(t)));
      const hasExactTeam = teamNames.includes(tLower);
      const teamMatches = (n) => hasExactTeam ? (n === tLower) : n.includes(tLower);
      const locate = () => {
        const items = [...document.querySelectorAll('[role="treeitem"]')];
        let curTeam = null, curOk = false, best = null, collapsedTeam = null;
        for (const el of items) {
          const ty = el.getAttribute('data-item-type');
          if (ty === 'team') {
            curTeam = firstLine(el); curOk = teamMatches(norm(curTeam));
            if (curOk && el.getAttribute('aria-expanded') === 'false') collapsedTeam = el;
          } else if (ty === 'channel' && curOk) {
            const cn = norm(firstLine(el));
            const score = cn === cLower ? 2 : cn.includes(cLower) ? 1 : 0;   // exact channel beats substring
            if (score && (!best || score > best.score)) best = { channelEl: el, teamLabel: curTeam, score };
          }
        }
        return best || { collapsedTeam };
      };
      let hit = locate();
      let expanded = groupExpanded;
      // Target team collapsed → expand it (channels render on demand), retry.
      for (let i = 0; !hit.channelEl && hit.collapsedTeam && i < 3; i++) {
        try { hit.collapsedTeam.click(); } catch {}
        expanded = true;
        await new Promise(r => setTimeout(r, 900));
        hit = locate();
      }
      // Still not found → team may be behind "See all your teams"; expand + retry.
      if (!hit.channelEl) {
        const seeAll = [...document.querySelectorAll('[role="treeitem"]')]
          .find(el => /^See all your teams$/i.test(firstLine(el)));
        if (seeAll) {
          try { seeAll.click(); } catch {}
          expanded = true;
          await new Promise(r => setTimeout(r, 1000));
          hit = locate();
          for (let i = 0; !hit.channelEl && hit.collapsedTeam && i < 3; i++) {
            try { hit.collapsedTeam.click(); } catch {}
            await new Promise(r => setTimeout(r, 900));
            hit = locate();
          }
        }
      }
      // Still not found → the channel is likely HIDDEN from the rail (a team
      // with many channels shows only a few + a "See all channels" link that
      // opens a right-side panel). Open that panel for the matching team and
      // click the channel row's "Go to channel" button — it navigates straight
      // to the channel WITHOUT changing the user's pinned rail (verified).
      if (!hit.channelEl) {
        let curT = null, sacEl = null;
        for (const el of document.querySelectorAll('[role="treeitem"]')) {
          const ty = el.getAttribute('data-item-type');
          if (ty === 'team') curT = firstLine(el);
          if (/^See all channels$/i.test(firstLine(el)) && curT && teamMatches(norm(curT))) { sacEl = el; break; }
        }
        if (sacEl) {
          try { sacEl.click(); } catch {}
          let panel = null;
          for (let i = 0; i < 20 && !panel; i++) { await new Promise(r => setTimeout(r, 300)); panel = document.querySelector('[data-tid="user-onboarding-team-channel-list-viewport"], [data-tid="user-onboarding-team-channel-list-runway"]'); }
          if (panel) {
            const prows = [...panel.querySelectorAll('[role="row"]')];
            const row = prows.find(r => norm(firstLine(r)) === cLower) || prows.find(r => norm(firstLine(r)).includes(cLower));   // exact channel first
            const goBtn = row && [...row.querySelectorAll('button')].find(b => /go to channel/i.test(b.getAttribute('aria-label') || ''));
            if (goBtn) {
              try { goBtn.click(); } catch {}
              expanded = true;
              for (let i = 0; i < 20 && !document.title.toLowerCase().includes(cLower); i++) await new Promise(r => setTimeout(r, 300));
              hit = { channelEl: goBtn, teamLabel: curT, viaPanel: true };
            }
          }
        }
      }
      if (!hit.channelEl) {
        const teams = [...document.querySelectorAll('[role="treeitem"][data-item-type="team"]')].map(firstLine);
        return {
          ok: false,
          error: `Channel "${channelName}" under team "${teamName}" not found in the rail or via "See all channels". The team may not be joined, or the name didn't match.`,
          expanded_any: expanded,
          visible_teams: teams,
        };
      }
      const channel = hit.channelEl;
      const channelThreadId = hit.viaPanel ? null : threadIdOf(channel);

      // Hydration gate. The title can already say we're on the channel
      // while the message pane never rendered (a long-lived tab stuck
      // half-loaded → stream_found:false). The old code trusted `alreadyHere`
      // and harvested an EMPTY stream, silently returning posts:[]. So:
      // require a non-empty message stream; if it's empty, (re-)open the
      // channel — up to 2 attempts — and only then give up with a crisp
      // "page stuck" error instead of fake-empty results.
      const streamCount = () => document.querySelectorAll('[data-tid="channel-pane-message"]').length;
      const alreadyHere = document.title.toLowerCase().includes(cLower);
      let waitedMs = 0, switched = false, reopened = false;
      // Background-tab safe: MutationObserver fires on real DOM events, not
      // setTimeout, so it works even when Chrome heavily throttles bg-tab
      // timers (a 500ms tick was observed at 80+s in real bg state — any
      // setTimeout polling blows the 60s RPC cap). Channel-monitoring jobs
      // need this path to be reliable while the user is doing other things.
      if (!(alreadyHere && streamCount() > 0)) {
        for (let attempt = 0; attempt < 2 && !switched; attempt++) {
          const oldKeys = new Set(
            [...document.querySelectorAll('[data-tid="channel-pane-message"]')].map(e => e.id).filter(Boolean)
          );
          try { channel.click(); } catch (e) {}
          if (attempt > 0) reopened = true;
          const t0 = Date.now();
          const checkStream = () => {
            const cur = [...document.querySelectorAll('[data-tid="channel-pane-message"]')].map(e => e.id).filter(Boolean);
            // alreadyHere: accept any rendered message (re-click may not mint
            // new ids); otherwise require a freshly-appeared message.
            return cur.length > 0 && (alreadyHere || cur.some(k => !oldKeys.has(k)));
          };
          await new Promise(resolve => {
            if (checkStream()) { resolve(); return; }
            let done = false;
            const finish = () => { if (done) return; done = true; try { obs.disconnect(); } catch {} resolve(); };
            const obs = new MutationObserver(() => { if (checkStream()) { switched = true; finish(); } });
            obs.observe(document.body, { childList: true, subtree: true });
            // Hard cap per attempt — itself bg-throttled, but observer path
            // resolves fast on real DOM updates.
            setTimeout(finish, 12000);
          });
          waitedMs = Date.now() - t0;
        }
        if (!switched && streamCount() === 0) {
          return {
            ok: false,
            error: 'Teams channel pane never hydrated (page stuck / half-loaded) — the message stream did not render. This is NOT an empty channel. Reload the Teams tab and retry.',
            channel: channelName,
            channel_thread_id: channelThreadId,
            reopened,
            stream_count: 0,
            title: document.title,
          };
        }
      }

      _timing.switch_ms = (Date.now() - _t0) - (_timing.ready_ms || 0);

      // Attachments + pasted screenshots — critical for customer-issue
      // analysis. Attachments: filename (+ SharePoint link when present).
      // Images: data-orig-src is the REAL authenticated Teams AMS URL (the
      // visible src is a session-scoped blob: that's useless outside the
      // page). Scope each extractor to a node so replies don't leak the
      // parent post's media.
      // The visible file card only shows the filename; the real SharePoint
      // URL lives in React props. urlForName walks the card's fiber and
      // picks the sharepoint URL whose path ends with this file's name
      // (a message with N files holds all N URLs on a shared ancestor —
      // matching by name keeps each card's own link). Hand object_url to
      // onedrive.download_file to pull the bytes.
      const _fiberOf = (n) => { const k = Object.keys(n).find(k => k.startsWith('__reactFiber$') || k.startsWith('__reactInternalInstance$')); return k ? n[k] : null; };
      const _urlForName = (g, name) => {
        const want = (name || '').toLowerCase(); let best = null, any = null; const seen = new Set();
        let scanned = 0;
        const scan = (o, d) => {
          // Hard node cap: React fibers are huge cyclic graphs; an unbounded
          // walk per attachment is a primary read hang. 4000 nodes is plenty
          // to find a sharepoint URL near the card.
          if (!o || d > 4 || typeof o !== 'object' || seen.has(o) || ++scanned > 4000) return; seen.add(o);
          for (const k of Object.keys(o)) {
            let v; try { v = o[k]; } catch (e) { continue; }
            if (typeof v === 'string' && /^https?:\/\/[^ ]*sharepoint/i.test(v)) {
              if (!any) any = v;
              try { if (decodeURIComponent(new URL(v).pathname).toLowerCase().endsWith(want)) best = v; } catch (e) {}
            } else if (v && typeof v === 'object' && d < 4) scan(v, d + 1);
          }
        };
        let f = _fiberOf(g);
        for (let i = 0; i < 10 && f && !best; i++, f = f.return) { if (f.memoizedProps) scan(f.memoizedProps, 0); }
        return best || any || null;
      };
      // MUST run on a LIVE node, never a cloneNode() copy: object_url lives
      // in the card's React fiber (__reactFiber$ expando), and cloneNode
      // copies attributes/children but NOT expando props — so a cloned root
      // always yields object_url:null (images still work, they use the
      // data-orig-src attribute which clones fine — that asymmetry is why
      // screenshots downloaded but file attachments didn't). excludeNodes
      // lets the root post skip cards that belong to its replies.
      const extractAttachments = (root, excludeNodes) => {
        const out = [];
        root.querySelectorAll('[data-tid="file-attachment-grid"] [role="group"][aria-label]').forEach(g => {
          if (excludeNodes && excludeNodes.some(ex => ex && ex.contains && ex.contains(g))) return;
          const lines = (g.getAttribute('aria-label') || '').split('\n').map(s => s.trim()).filter(Boolean);
          const name = lines[0] || '';
          if (!name || /toolbar/i.test(name)) return;
          const object_url = _urlForName(g, name) || lines.find(l => /^https?:\/\//.test(l)) || g.querySelector('a[href]')?.getAttribute('href') || null;
          out.push({ name, object_url, url: object_url });
        });
        return out;
      };
      const extractImages = (root) => [...root.querySelectorAll('[data-tid="lazy-image-2"]')].map(el => {
        const e = el.tagName === 'IMG' ? el : (el.querySelector('img') || el);
        return {
          url: e.getAttribute('data-orig-src') || e.getAttribute('data-gallery-src') || null,
          alt: e.getAttribute('alt') || null,
          width: e.naturalWidth || null,
          height: e.naturalHeight || null,
        };
      }).filter(im => im.url);

      const parsePost = (post) => {
        const midMatch = (post.id || '').match(/reply-chain-summary-(\d+)/);
        const mid = midMatch ? midMatch[1] : (post.id || '');
        const subject = post.querySelector('[data-tid="subject-line"]')?.textContent.trim() || '';
        const subheader = post.querySelector('[data-tid="post-message-subheader"]')?.textContent.trim() || '';
        const ts = post.querySelector('[data-tid="timestamp"]')?.textContent.trim() || '';
        const allBodies = [...post.querySelectorAll('[data-tid="message-body"]')];
        const bodyEl = allBodies.find(b => b.closest('[role="group"]')?.id === post.id) || allBodies[0];
        const author = subheader.replace(new RegExp('\\s*' + ts.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '.*$'), '').replace(/(Edited|New).*$/, '').trim();
        const replyContainers = [...post.querySelectorAll('[role="group"][id^="message-body-"]')].filter(r => !r.id.includes(mid));
        const replies = replyContainers.map(r => {
          const rMid = (r.id.match(/message-body-(\d+)/) || [])[1] || '';
          return {
            mid: rMid,
            author: (rMid ? document.getElementById('author-' + rMid)?.textContent.trim() : '') || '',
            body: (rMid ? document.getElementById('content-' + rMid)?.innerText.trim() : '') || r.querySelector('[data-tid="message-body"]')?.innerText.trim() || '',
            timestamp: r.querySelector('[data-tid="timestamp"]')?.textContent.trim() || '',
            attachments: extractAttachments(r),
            images: extractImages(r),
          };
        });
        // Root-post media = everything in the post minus what belongs to replies.
        const replyIds = new Set(replyContainers.map(r => r.id));
        const ownScope = post.cloneNode(true);
        ownScope.querySelectorAll('[role="group"][id^="message-body-"]').forEach(r => { if (replyIds.has(r.id)) r.remove(); });
        // Best-effort deep link to this post. Teams sometimes wraps the
        // timestamp in an <a>, or exposes an /l/message/ permalink; fall back
        // to the channel URL (location.href) so the link is never dead.
        const tsEl = post.querySelector('[data-tid="timestamp"]');
        const linkEl = post.querySelector('a[href*="/l/message/"], a[href*="/message/"]')
          || (tsEl && tsEl.closest('a'));
        const post_url = (linkEl && linkEl.href) || location.href;
        return {
          mid, subject, author, timestamp: ts, post_url,
          body: (bodyEl?.innerText || '').trim(),
          // Attachments from the LIVE post (fiber-backed object_url), excluding
          // reply cards. Images can stay on the cloned ownScope (attribute-based).
          attachments: extractAttachments(post, replyContainers),
          images: extractImages(ownScope),
          replies,
        };
      };

      // The message list is virtualized — only ~5-9 posts in the DOM at once,
      // recycled as you scroll. To collect history we harvest (parse + dedup
      // by mid) at EACH scroll step, scrolling UP from the bottom until the
      // scroll height stops growing (reached the oldest) or we hit max_messages.
      const maxMessages = Math.max(1, Number(args.max_messages) || 20);
      const harvested = new Map();
      const grab = () => {
        for (const p of document.querySelectorAll('[data-tid="channel-pane-message"]')) {
          if (!within()) break;                       // stop heavy parse near budget
          // Cheap mid first; skip re-parsing posts we already harvested. Without
          // this, the expensive parsePost (fiber walk + cloneNode) re-ran on
          // every visible post EVERY scroll round — the main 60s timeout cause.
          const m = (p.id || '').match(/reply-chain-summary-(\d+)/);
          const mid = m ? m[1] : (p.id || '');
          if (mid && harvested.has(mid)) continue;
          const r = parsePost(p);
          if (r.mid && !harvested.has(r.mid)) harvested.set(r.mid, r);
        }
      };
      const vp = document.querySelector('[data-tid="channel-pane-viewport"]');
      let scrollRounds = 0;
      if (!vp || harvested.size >= maxMessages) {
        grab();
      } else {
        vp.scrollTop = vp.scrollHeight;              // jump to newest
        await new Promise(r => setTimeout(r, 700));
        grab();
        // Cap scroll rounds so total tool time stays under the 60s RPC budget
        // (hydrate + channel-switch already eat a chunk). Newest posts come
        // first anyway, so a few rounds cover MAX_MESSAGES in practice.
        // Dry signal = harvested GROWTH, not scrollHeight/scrollTop: a short
        // channel (e.g. 4 posts) never shrinks its height nor reaches the top,
        // so the old scroll-based dry counter never tripped and ground all 12
        // rounds (~8s each on heavy posts) into the 60s timeout. Keying on "did
        // this round add a new post?" stops after 2 empty rounds.
        let prevHarvest = harvested.size, dry = 0;
        while (dry < 2 && scrollRounds < 12 && harvested.size < maxMessages && within()) {
          scrollRounds++;
          vp.scrollTop = Math.max(0, vp.scrollTop - vp.clientHeight * 0.8);
          vp.dispatchEvent(new WheelEvent('wheel', { deltaY: -400, bubbles: true }));
          await new Promise(r => setTimeout(r, 900));
          if (!within()) break;                 // never start a heavy grab past budget
          grab();
          if (harvested.size > prevHarvest) dry = 0; else dry++;
          prevHarvest = harvested.size;
        }
      }
      // mid is the post's epoch-ms id → sort ascending = oldest-first (chronological).
      const ordered = [...harvested.values()].sort((a, b) => (Number(a.mid) || 0) - (Number(b.mid) || 0));
      const titleParts = (document.title || '').split('|').map(s => s.trim()).filter(Boolean);
      const channelTitle = titleParts.length >= 3 ? titleParts[1] : (titleParts[0] || '');

      return {
        ok: true,
        team: hit.teamLabel,
        channel: channelTitle,
        channel_thread_id: channelThreadId,
        expanded_see_all: expanded,
        switched: !alreadyHere,
        switched_in_ms: waitedMs,
        scroll_rounds: scrollRounds,
        posts: ordered.slice(-(args.limit || maxMessages)),
        total: harvested.size,
        // Self-bounding diagnostics: where the time went, and whether we
        // stopped early on the soft budget (partial=true → fewer posts, but a
        // real result instead of a 60s hard timeout).
        _timing: { ...(_timing), scroll_ms: (Date.now() - _t0) - (_timing.ready_ms || 0) - (_timing.switch_ms || 0), total_ms: Date.now() - _t0 },
        partial: !within(),
        _page: location.href,
      };

  list_teams_and_channels:
    description: |
      List joined Teams (organizations) and their visible channels from
      the left rail. Channels under collapsed teams aren't in DOM —
      expand the team in Teams to render them.
    parameters:
      limit:
        type: number
        default: 50
    returns: "{ teams: [{ name, unread, channels: [{ name, unread }] }], total }"
    page:
      url: "{base_url}/v2/"
      on_target: "teams.microsoft.com"
      settle_after_load_ms: 5000
    script: |
      // Expand the "Teams and channels" group if the user collapsed it —
      // otherwise NO team/channel nodes are in the DOM at all (row-click toggles).
      const tStart = Date.now();
      let _grpTried = false;
      while (Date.now() - tStart < 30000) {
        if (document.querySelectorAll('[role="treeitem"][data-item-type="team"]').length > 0) break;
        if (!_grpTried) {
          const g = document.querySelector('[role="treeitem"][data-item-type="teams-and-channels"]');
          if (g && g.getAttribute('aria-expanded') === 'false') { try { g.click(); } catch {} }
          _grpTried = true;
        }
        await new Promise(r => setTimeout(r, 500));
      }
      const firstLine = (el) => (el.innerText || '').split('\n').filter(Boolean)[0] || '';
      // A long team list is truncated behind "See all your teams" — click it
      // once so every team (and its channels) renders before we enumerate.
      const _seeAllTeams = [...document.querySelectorAll('[role="treeitem"]')]
        .find(el => /^See all your teams$/i.test(firstLine(el)));
      if (_seeAllTeams) { try { _seeAllTeams.click(); } catch {} await new Promise(r => setTimeout(r, 1000)); }
      const threadIdOf = (el) => {
        const v = el.getAttribute('data-fui-tree-item-value') || '';
        const m = (v.split('/').pop() || '').match(/\|(.+)$/);
        return m ? m[1] : null;
      };

      // Walk the flat tree in document order; channels attach to the
      // nearest preceding team. data-item-type is precise (no aria-level).
      const items = [...document.querySelectorAll('[role="treeitem"][data-item-type="team"], [role="treeitem"][data-item-type="channel"]')];
      const teams = [];
      let cur = null;
      for (const el of items) {
        const ty = el.getAttribute('data-item-type');
        const unread = /\bUnread\b/.test(el.getAttribute('aria-label') || '') || /\bUnread\b/.test(el.innerText || '');
        if (ty === 'team') {
          cur = { name: firstLine(el), thread_id: threadIdOf(el), unread, channels: [] };
          teams.push(cur);
        } else if (ty === 'channel' && cur) {
          cur.channels.push({ name: firstLine(el), thread_id: threadIdOf(el), unread });
        }
      }
      if (teams.length === 0) {
        return { teams: [], total: 0, _error: 'No teams in left rail (Teams and channels section may be empty or not loaded)' };
      }
      return {
        teams: teams.slice(0, args.limit || 50).map(t => ({ ...t, channels_visible: t.channels.length, channels_collapsed: t.channels.length === 0 })),
        total: teams.length,
        _virtualized_channels: true,
        _page: location.href,
      };

  list_channel_posts:
    description: |
      Read top-level posts from the currently-open channel. For each
      post, returns subject, author, timestamp, body, visible inline
      replies, and a hint about hidden reply count.

      Prefer `read_channel(team, channel)` to do switch+read in one tool.
    parameters:
      limit:
        type: number
        default: 20
    returns: "{ channel, posts: [...], total }"
    page:
      url: "{base_url}/v2/"
      on_target: "teams.microsoft.com"
      settle_after_load_ms: 5000
    script: |
      // Wait up to 30s for channel content to render
      const tStart = Date.now();
      while (Date.now() - tStart < 30000) {
        if (document.querySelectorAll('[data-tid="channel-pane-message"]').length > 0) break;
        await new Promise(r => setTimeout(r, 500));
      }

      const posts = Array.from(document.querySelectorAll('[data-tid="channel-pane-message"]'));
      const titleParts = (document.title || '').split('|').map(s => s.trim()).filter(Boolean);
      const channelName = titleParts.length >= 3 ? titleParts[1] : (titleParts[0] || '');

      const parsed = posts.map(post => {
        const midMatch = (post.id || '').match(/reply-chain-summary-(\d+)/);
        const mid = midMatch ? midMatch[1] : '';
        const subjectEl = post.querySelector('[data-tid="subject-line"]');
        const subheaderEl = post.querySelector('[data-tid="post-message-subheader"]');
        const tsEl = post.querySelector('[data-tid="timestamp"]');
        const allBodies = Array.from(post.querySelectorAll('[data-tid="message-body"]'));
        const postBody = allBodies.find(b => {
          const closest = b.closest('[role="group"]');
          return closest === null || closest.id === post.id;
        }) || allBodies[0];
        const subheaderText = subheaderEl?.textContent.trim() || '';
        const tsText = tsEl?.textContent.trim() || '';
        const author = subheaderText.replace(new RegExp('\\s*' + tsText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '.*$'), '').replace(/(Edited|New).*$/, '').trim();
        const replyContainers = Array.from(post.querySelectorAll('[role="group"][id^="message-body-"]'))
          .filter(r => !r.id.includes(mid));
        const replies = replyContainers.map(r => {
          const rMid = (r.id.match(/message-body-(\d+)/) || [])[1] || '';
          const rTs = r.querySelector('[data-tid="timestamp"]');
          const rContent = rMid ? document.getElementById('content-' + rMid) : null;
          const rAuthor = rMid ? document.getElementById('author-' + rMid) : null;
          return {
            mid: rMid,
            author: rAuthor?.textContent.trim() || '',
            timestamp: rTs?.textContent.trim() || '',
            body: (rContent?.innerText || r.querySelector('[data-tid="message-body"]')?.innerText || '').trim(),
          };
        });
        let openRepliesBtn = null;
        const parent = post.parentElement;
        if (parent) {
          const allButtons = parent.querySelectorAll('button[aria-label*="replies from"], button[aria-label*="Open"][aria-label*="replies"]');
          for (const btn of allButtons) {
            if (post.compareDocumentPosition(btn) & Node.DOCUMENT_POSITION_FOLLOWING) {
              openRepliesBtn = btn;
              break;
            }
          }
        }
        const moreLabel = openRepliesBtn?.getAttribute('aria-label') || '';
        const moreMatch = moreLabel.match(/(\d+)\s+replies/);
        const totalReplyCount = moreMatch ? Number(moreMatch[1]) : replies.length;
        const hiddenReplies = Math.max(0, totalReplyCount - replies.length);

        return {
          mid,
          subject: subjectEl?.textContent.trim() || '',
          author,
          timestamp: tsText,
          body: (postBody?.innerText || '').trim(),
          replies,
          more_replies: hiddenReplies > 0 ? hiddenReplies : 0,
        };
      });

      const ordered = parsed.slice().reverse();
      return {
        channel: channelName,
        posts: ordered.slice(0, args.limit || 20),
        total: parsed.length,
        _virtualized: true,
        _waited_ms: Date.now() - tStart,
        _page: location.href,
      };

  _probe:
    description: |
      Diagnostic — returns the current Teams page state without touching
      anything. Use to debug failed send_message / read_chat. Reports:
      where we landed (URL + title), composer + send-button presence,
      current chat header info, left-rail group + chat counts, top search
      input + popup state, message stream height. Returns rich JSON; run
      it after a failed call and share the output.
    parameters: {}
    returns: "{ url, title, ready, composer, send_btn, chat_header, left_rail, search, messages, time_ms }"
    page:
      url: "{base_url}/v2/"
      on_target: "teams.microsoft.com"
      settle_after_load_ms: 2000
    script: |
      const t0 = Date.now();
      function quickCount(sel) { try { return document.querySelectorAll(sel).length; } catch { return 0; } }
      function quickEl(sel) {
        try {
          const el = document.querySelector(sel);
          if (!el) return null;
          return {
            present: true,
            disabled: el.hasAttribute('disabled') || el.getAttribute('aria-disabled') === 'true',
            dataTid: el.getAttribute('data-tid'),
            ariaLabel: (el.getAttribute('aria-label') || '').slice(0, 60),
            text: (el.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 80),
          };
        } catch { return null; }
      }
      const lefRailLevel1 = [...document.querySelectorAll('[role="treeitem"][aria-level="1"]')].slice(0, 12).map(g => ({
        label: (g.innerText || '').split('\n')[0].trim().slice(0, 30),
        expanded: g.getAttribute('aria-expanded'),
      }));
      const composer = quickEl('[role="textbox"][contenteditable="true"][data-tid="ckeditor"]');
      const sendBtn = quickEl('[data-tid="sendMessageCommands-send"]');
      const chatHeader = quickEl('[data-tid^="participant-"]') || quickEl('[role="banner"]');
      const popup = document.querySelector('[data-tid="ms-searchux-popup"]');
      const messageStream = document.querySelector('[role="log"], [data-tid="message-pane-list-viewport"]');
      return {
        ok: true,
        url: location.href,
        title: document.title,
        ready: !!composer && !!sendBtn,
        composer,
        send_btn: sendBtn,
        chat_header: chatHeader,
        left_rail: {
          level_1_count: quickCount('[role="treeitem"][aria-level="1"]'),
          level_2_count: quickCount('[role="treeitem"][aria-level="2"]'),
          groups: lefRailLevel1,
        },
        search: {
          input: !!document.querySelector('#ms-searchux-input'),
          toggle_btn: !!document.querySelector('[data-tid="title-bar-toggle-search-btn"]'),
          popup_present: !!popup,
          popup_text_len: popup ? (popup.innerText || '').length : 0,
        },
        messages: {
          stream_found: !!messageStream,
          scroll_height: messageStream?.scrollHeight ?? 0,
          li_count: quickCount('[role="log"] [role="listitem"], [data-tid="message-pane-list-viewport"] [data-tid^="chat-pane-message"]'),
        },
        ckeditor_classes_seen: [...document.querySelectorAll('[data-tid="ckeditor"]')].map(e => e.className.toString().slice(0, 30)).slice(0, 3),
        time_ms: Date.now() - t0,
      };

  download_image:
    description: |
      Download an inline image / pasted screenshot from a Teams message to
      Forge's tmp/ dir, so it can be fed to vision or analyzed. Pass the
      image `url` from a read_channel / read_chat `images[].url` (the AMS
      `data-orig-src`). Result's `_files[0].path` is a tmp/ path — read it
      with read_forge_file (as_base64) or hand it to a vision model.

      NOTE: this is for INLINE images (pasted screenshots), which live on
      Teams' own AMS host and are fetchable here. A file attachment that
      happens to be an image (.png/.jpg in the attachment grid) is a
      SharePoint file — use its attachment `object_url` with
      onedrive.download_file instead.
    parameters:
      url:
        type: string
        label: Image URL
        description: "The AMS image URL from a read_channel/read_chat images[].url (data-orig-src)."
        required: true
      filename:
        type: string
        label: Filename
        description: "Optional saved filename. Defaults to a name derived from the URL."
        required: false
    returns: "{ _files: [{ filename, path, file_url, size_bytes, content_type }] }"
    page:
      url: "{base_url}/v2/"
      on_target: "teams.microsoft.com"
    script: |
      const raw = String(args.url || '').trim();
      if (!raw) return { error: 'url is required (a read_channel/read_chat images[].url)' };
      // Inline Teams images are served from the AMS host (asm.skype.com);
      // a credentialed fetch from the Teams origin succeeds (verified) even
      // though it's cross-origin, because AMS allows it.
      const r = await fetch(raw, { method: 'GET', credentials: 'include' });
      if (!r.ok) return { error: 'image fetch HTTP ' + r.status, status: r.status };
      const contentType = (r.headers.get('content-type') || 'image/jpeg').split(';')[0];
      const ext = (contentType.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
      let serverName = '';
      const cd = r.headers.get('content-disposition') || '';
      const m = cd.match(/filename\*?=(?:utf-8''|")?([^";]+)/i);
      if (m) { try { serverName = decodeURIComponent(m[1]); } catch (e) { serverName = m[1]; } }
      const filename = (args.filename || serverName || ('teams-image.' + ext)).replace(/[\0/\\]/g, '_');
      const buf = await r.arrayBuffer();
      const u8 = new Uint8Array(buf);
      let bin = '';
      const CHUNK = 0x8000;
      for (let i = 0; i < u8.length; i += CHUNK) bin += String.fromCharCode.apply(null, u8.subarray(i, i + CHUNK));
      return {
        ok: true,
        _files: [{ filename: filename, content_base64: btoa(bin), content_type: contentType }],
        size_bytes: u8.length,
      };

  send_message:
    description: |
      Send a Teams chat message — ONLY for Teams chat / IM scenarios.

      **NOT a substitute for email.** If the user said "send email" / "发邮件"
      / asked to email someone, use the OWA `send_mail` tool instead. Do
      NOT fall back from email to Teams on OWA failures — surface the OWA
      error to the user and stop.

      **Do NOT retry on failure.** If this tool returns `ok: false`, surface
      the error to the user and stop. Do not re-invoke with different
      params (different `name`, different `email`, dropping params, etc).
      A second attempt with the same wording produces the same failure;
      with different wording it risks delivering to the wrong recipient.

      Specifically for `"Teams tab is hidden ..."` errors: surface to the
      user and stop. Tell them to EITHER (a) bring the Teams tab on-screen
      and retry, OR (b) enable the Forge extension's "Activate connector
      tab while running (steals focus)" toggle in the extension Settings
      tab — that auto-activates the tab per call and restores focus after.

      Target resolution:

      A. With `email` (PREFERRED — uniquely identifies a Teams user):
         Skip left-rail entirely (those are display names), drive the top
         search box (#ms-searchux-input) directly with the email. Picks
         the popup result whose innerText / aria-label contains the email,
         falling back to the first match if none does.

      B. With `name` (substring of display name, may be ambiguous):
         Three tiers — (1) left-rail treeitem, (2) expand collapsed
         left-rail group headings then retry, (3) fall through to search.

      Without `email` or `name`: send to the currently-open chat.

      ⚠ Sends IMMEDIATELY without user confirmation. Caller is responsible
      for verifying the target and content before invoking. Plain text only
      — CKEditor 5 paste injection + click on the Send button.
    parameters:
      text:
        type: string
        label: Message text
        required: true
      email:
        type: string
        label: Recipient email (preferred — unique). Goes straight to the search box.
        required: false
      name:
        type: string
        label: Chat name (optional — substring, case-insensitive). Used only when email is omitted. Pass a SHORT clean display name (e.g. "Bin Xu") — no titles, parentheticals, or extra words; Teams autosuggest resolves a bare name fastest.
        required: false
    returns: "{ ok, sent_text, chat_title, switched, switched_in_ms, resolve_tier, groups_expanded, search_picked }"
    page:
      url: "{base_url}/v2/"
      on_target: "teams.microsoft.com"
      settle_after_load_ms: 5000
    script: |
      // Dead/stale-session self-check. A re-auth-needed Teams still renders the
      // cached shell (looks logged in, old chats visible) but the live connection
      // is dead — the tell is the top-right ME presence = "Unknown". Bail early
      // with needs_login instead of blindly searching and failing with a
      // misleading "no person match", so the caller re-authenticates (and, being
      // a write that returns an error, is not auto-retried).
      if (document.querySelector('[data-tid="me-control-avatar-trigger"][aria-label*="Unknown" i], [data-tid="me-control-avatar-trigger"] svg path[d^="M5 1a4 4 0 1 0 0 8"]')) {
        return { ok: false, needs_login: true, error: 'Teams session expired — presence is "Unknown" (the cached UI looks logged in, but the live connection is dead). Re-authenticate Teams, then retry.' };
      }
      const text = String(args.text || args.message || args.body || args.content || '').trim();
      if (!text) return { ok: false, error: 'text is required and must be non-empty (accepts text / message / body / content)' };
      const email = String(args.email || '').trim();
      const name = String(args.name || '').trim();
      // Background-tab fast-fail. Search-box and Send-button click both need
      // a visible tab to fire reliably (see read_chat for the trusted-event
      // analysis). For unattended automation, enable the Forge extension's
      // "Activate connector tab while running" toggle — the extension
      // auto-activates the tab and restores focus, removing this guard.
      if (document.visibilityState === 'hidden') {
        return { ok: false, error: 'Teams tab is hidden (Chrome throttles bg-tab JS — send is unreliable). Bring the Teams tab on-screen, OR enable the Forge extension\'s "Activate connector tab while running (steals focus)" toggle in the extension Settings tab.', visibilityState: 'hidden' };
      }
      // Email is the canonical identifier — when set, skip the left-rail
      // (those are display names, ambiguous) and drive the search box
      // straight with the email string.
      // Clean the typed query: Teams autosuggest resolves a bare name
      // fast, but a decorated string (e.g. "Bin Xu (in message…)", trailing
      // titles/parentheticals the caller tacked on) confuses it. Strip from
      // the first parenthesis/bracket onward and collapse whitespace. Emails
      // have no parens so they're untouched.
      const clean = (s) => s.replace(/[([{].*$/, '').replace(/\s+/g, ' ').trim();
      const searchQuery = clean(email || name);
      const skipLeftRail = !!email;

      // Overall deadline. The RPC layer kills us at 60s with an opaque
      // "timed out" — budget our own waits under that so we can return a
      // crisp, actionable error (with hydration state) instead.
      const DEADLINE = Date.now() + 48000;
      const timeLeft = () => DEADLINE - Date.now();
      const COMPOSER_SEL = '[role="textbox"][contenteditable="true"][data-tid="ckeditor"]';

      // Wait for Teams ready (composer or left-rail). Capped so it can't eat
      // the whole budget before we reach the send path.
      const readyStart = Date.now();
      while (Date.now() - readyStart < 15000) {
        if (document.querySelector(COMPOSER_SEL)) break;
        if (document.querySelectorAll('[role="treeitem"][aria-level="2"]').length > 0 && name) break;
        await new Promise(r => setTimeout(r, 500));
      }

      // ─── Resolve target chat by name (3-tier) ─────────────────────
      let switched = false;
      let switchedMs = 0;
      let resolveTier = null;      // 'already-here' / 'left-rail' / 'expanded-group' / 'search'
      let groupsExpanded = [];
      let searchPicked = null;

      function findLeftRailMatch(lower) {
        const items = [...document.querySelectorAll('[role="treeitem"][aria-level="2"]')];
        return items.find(t => (t.innerText || '').split('\n')[0].trim().toLowerCase().includes(lower)) || null;
      }
      async function waitForChatSwitch(lowerName, titleBefore, maxMs = 30000) {
        const t0 = Date.now();
        while (Date.now() - t0 < maxMs) {
          await new Promise(r => setTimeout(r, 200));
          if (document.title !== titleBefore &&
              (!lowerName || document.title.toLowerCase().includes(lowerName))) {
            return Date.now() - t0;
          }
        }
        return -1;
      }
      // The open chat's header participants (data-tid="participant-*", same
      // selector get_current_chat_info uses). document.title is an unreliable
      // switch signal — it doesn't flip when opening your OWN / an already-open
      // chat, which is why a search-open used to falsely report "didn't open"
      // and only worked on the 2nd call. Confirming by participant name is both
      // the missing positive signal AND a guard against sending to the wrong chat.
      function chatHeaderMatches(needle) {
        if (!needle) return false;
        return [...document.querySelectorAll('[data-tid^="participant-"]')].some(p => {
          const n = (p.innerText || '').trim().split('\n')[0].toLowerCase();
          return n && (n.includes(needle) || needle.includes(n));
        });
      }
      async function waitHeaderMatch(needle, maxMs) {
        const t0 = Date.now();
        while (Date.now() - t0 < maxMs) {
          if (chatHeaderMatches(needle)) return Date.now() - t0;
          await new Promise(r => setTimeout(r, 250));
        }
        return -1;
      }

      if (searchQuery) {
        const lower = searchQuery.toLowerCase();
        if (!skipLeftRail && document.title.toLowerCase().includes(lower)) {
          resolveTier = 'already-here';
        } else {
          // Tier 1+2 only run when no email — emails don't appear in
          // left-rail labels, so trying to match would just waste time.
          let match = skipLeftRail ? null : findLeftRailMatch(lower);
          if (!match && !skipLeftRail) {
            const collapsed = [...document.querySelectorAll('[role="treeitem"][aria-level="1"][aria-expanded="false"]')];
            for (const g of collapsed) {
              const label = (g.innerText || '').split('\n')[0].trim();
              try { g.click(); groupsExpanded.push(label); } catch {}
              await new Promise(r => setTimeout(r, 250));
            }
            if (groupsExpanded.length > 0) {
              await new Promise(r => setTimeout(r, 600));
              match = findLeftRailMatch(lower);
            }
          }

          if (match) {
            resolveTier = groupsExpanded.length > 0 ? 'expanded-group' : 'left-rail';
            const titleBefore = document.title;
            match.click();
            const took = await waitForChatSwitch(lower, titleBefore);
            if (took < 0) {
              return { ok: false, error: 'Timed out waiting for chat switch (30s).', target_name: name, resolve_tier: resolveTier, groups_expanded: groupsExpanded };
            }
            switchedMs = took; switched = true;
            await new Promise(r => setTimeout(r, 800));     // composer remount settle
          } else {
            // Tier 3: top search box. Open it (some Teams layouts collapse
            // the search bar behind a button), then type and pick.
            let searchInput = document.querySelector('#ms-searchux-input');
            if (!searchInput) {
              const toggle = document.querySelector('[data-tid="title-bar-toggle-search-btn"]');
              if (toggle) {
                try { toggle.click(); } catch {}
                for (let i = 0; i < 20 && !searchInput; i++) {
                  await new Promise(r => setTimeout(r, 150));
                  searchInput = document.querySelector('#ms-searchux-input');
                }
              }
            }
            if (!searchInput) {
              return {
                ok: false,
                error: `No left-rail match for "${searchQuery}" and search input not found. Open the chat manually first.`,
                groups_expanded: groupsExpanded,
                visible_chats: [...document.querySelectorAll('[role="treeitem"][aria-level="2"]')].slice(0, 30).map(c => (c.innerText || '').split('\n')[0].trim()).filter(Boolean),
              };
            }
            // Programmatic type — Teams uses React-controlled input and
            // sometimes also listens to keyboard events to trigger the
            // backend autosuggest fetch. Empirically: synthetic
            // \`input\` alone left the popup empty; pairing it with
            // beforeinput/keydown/keyup makes Teams actually call the
            // search backend.
            searchInput.focus(); searchInput.click();
            await new Promise(r => setTimeout(r, 200));
            const nativeSetter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
            nativeSetter.call(searchInput, '');
            searchInput.dispatchEvent(new Event('input', { bubbles: true }));
            for (let i = 0; i < searchQuery.length; i++) {
              const ch = searchQuery[i];
              const partial = searchQuery.slice(0, i + 1);
              searchInput.dispatchEvent(new KeyboardEvent('keydown', { key: ch, bubbles: true }));
              nativeSetter.call(searchInput, partial);
              searchInput.dispatchEvent(new InputEvent('beforeinput', { inputType: 'insertText', data: ch, bubbles: true, cancelable: true }));
              searchInput.dispatchEvent(new InputEvent('input', { inputType: 'insertText', data: ch, bubbles: true }));
              searchInput.dispatchEvent(new KeyboardEvent('keyup', { key: ch, bubbles: true }));
              await new Promise(r => setTimeout(r, 40));
            }

            const lowerQuery = searchQuery.toLowerCase();
            // Teams pops a "Search for '<q>' in messages" / "Messages" /
            // "Files" / "See more results" COMMAND row almost instantly —
            // before the actual people/chat suggestions arrive from the
            // backend. Clicking one opens a search-results view, not a chat,
            // so the old code (break on any popup text, then pick the first
            // row containing the query) would grab that junk row → chat never
            // switches → 60s timeout, and search_picked showed "…in messages".
            // Skip command rows and poll until a REAL matching row appears.
            const isCommandRow = (t) =>
              !t ||
              /\bin (messages?|chat|files|people)\b/i.test(t) ||
              /^(search\b|messages$|files$|people$|chats$|see (more|all))/i.test(t);
            const SEL = '[role="option"], [data-tid^="search-suggestion"], [data-tid$="-result"], li, button, div[tabindex="-1"]';
            const collect = () => {
              const popup = document.querySelector('[data-tid="ms-searchux-popup"]');
              if (!popup) return { popup: null, cands: [] };
              const seen = new Set(); const cands = [];
              for (const el of popup.querySelectorAll(SEL)) {
                const txt = (el.innerText || '').replace(/\s+/g, ' ').trim();
                const aria = (el.getAttribute('aria-label') || '').toLowerCase();
                if (!txt || seen.has(txt) || txt.length > 200) continue;
                seen.add(txt);
                if (isCommandRow(txt)) continue;            // drop "…in messages" etc.
                if ((txt + ' ' + aria).toLowerCase().includes(lowerQuery)) cands.push({ el, text: txt });
                if (cands.length >= 8) break;
              }
              return { popup, cands };
            };
            // Poll up to ~12s for a non-command matching row (don't settle for
            // the instant command-only popup).
            let popup = null, candidates = [];
            for (let i = 0; i < 60; i++) {
              await new Promise(r => setTimeout(r, 200));
              const r = collect();
              popup = r.popup;
              if (r.cands.length) { candidates = r.cands; break; }
            }
            if (!popup) {
              nativeSetter.call(searchInput, ''); searchInput.dispatchEvent(new Event('input', { bubbles: true }));
              return { ok: false, error: 'Search popup did not appear within 12s', query: searchQuery };
            }
            // Email mode fallback: backend already filtered to the person, so
            // if no row literally contains the email, take the first
            // non-command row rather than failing.
            if (email && candidates.length === 0) {
              for (const el of popup.querySelectorAll(SEL)) {
                const txt = (el.innerText || '').replace(/\s+/g, ' ').trim();
                if (txt && !isCommandRow(txt) && txt.length <= 200) { candidates.push({ el, text: txt }); break; }
              }
            }
            if (candidates.length === 0) {
              const preview = (popup.innerText || '').slice(0, 400);
              nativeSetter.call(searchInput, ''); searchInput.dispatchEvent(new Event('input', { bubbles: true }));
              return { ok: false, error: `Search popup had no person/chat row matching "${searchQuery}" (only command rows).`, popup_text_preview: preview };
            }
            searchPicked = candidates[0].text;
            resolveTier = 'search';

            const headerNeedle = (typeof name === 'string' && name.trim()) ? name.trim().toLowerCase() : lower;
            const titleBefore = document.title;
            try { candidates[0].el.click(); } catch {}
            // Confirm the switch. document.title alone is unreliable (it doesn't
            // flip for your own / an already-open chat — the "worked on the 2nd
            // try" bug), so also accept a participant-header match, which also
            // guards against landing on the wrong chat.
            let took = await waitForChatSwitch(null, titleBefore, 12000);
            if (took < 0 && chatHeaderMatches(headerNeedle)) took = 0;
            if (took < 0) {
              // Fallback: keyboard Enter on the search input, then re-confirm by
              // title OR header before giving up.
              searchInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
              let took2 = await waitForChatSwitch(null, titleBefore, 8000);
              if (took2 < 0) took2 = await waitHeaderMatch(headerNeedle, 6000);
              if (took2 < 0) {
                return { ok: false, error: 'Clicking the search result did not open a chat (no title change and no matching chat header).', search_picked: searchPicked, header_needle: headerNeedle };
              }
              switchedMs = took2;
            } else {
              switchedMs = took;
            }
            switched = true;
            // The composer takes a beat to mount on a fresh 1:1 chat
            await new Promise(r => setTimeout(r, 1200));
          }
        }
      }

      // Find composer (might have just remounted after switch). On a
      // long-lived tab the channel pane sometimes never hydrates — composer
      // stays null. Poll within budget; if still missing, attempt ONE SPA
      // re-open of the current chat (re-click its left-rail item) to force a
      // remount, then poll again. A true browser reload would self-heal more
      // reliably but can't be done from inside the page (it destroys this
      // script's context) — that belongs to the extension runner.
      const waitComposer = async (maxMs) => {
        const t0 = Date.now();
        let c = document.querySelector(COMPOSER_SEL);
        while (!c && Date.now() - t0 < maxMs && timeLeft() > 1000) {
          await new Promise(r => setTimeout(r, 200));
          c = document.querySelector(COMPOSER_SEL);
        }
        return c;
      };
      const hydrationSnapshot = () => ({
        composer_present: !!document.querySelector(COMPOSER_SEL),
        message_stream: !!document.querySelector('[data-tid="message-pane-list-runway"], [role="list"]'),
        left_rail_items: document.querySelectorAll('[role="treeitem"][aria-level="2"]').length,
        title: document.title,
      });

      let composer = await waitComposer(Math.min(6000, timeLeft()));
      let reopened = false;
      if (!composer && timeLeft() > 12000) {
        // Re-open: click the left-rail item matching the open chat's title.
        const titleHead = (document.title.split('|')[1] || '').trim().toLowerCase();
        const rail = [...document.querySelectorAll('[role="treeitem"][aria-level="2"]')];
        const target = titleHead
          ? rail.find(t => (t.innerText || '').split('\n')[0].trim().toLowerCase().includes(titleHead))
          : null;
        if (target) {
          try { target.click(); reopened = true; } catch {}
          await new Promise(r => setTimeout(r, 1000));
          composer = await waitComposer(Math.min(8000, timeLeft()));
        }
      }
      if (!composer) {
        return {
          ok: false,
          error: 'Teams composer never mounted — page stuck / unhydrated (not a wording problem; do NOT retry this run). The next scheduled run will try a freshly-loaded tab.',
          reopened,
          hydration: hydrationSnapshot(),
        };
      }

      // Inject text FIRST. The Send button (sendMessageCommands-send) only
      // renders/enables once the composer has content — checking for it
      // before typing was the bug: empty composer → "Send button not found".
      composer.focus();
      const dt = new DataTransfer();
      dt.setData('text/plain', text);
      composer.dispatchEvent(new ClipboardEvent('paste', { clipboardData: dt, bubbles: true, cancelable: true }));
      await new Promise(r => setTimeout(r, 300));

      // Verify the paste landed — but compare with whitespace COLLAPSED.
      // CKEditor 5 reflows newlines into <p> blocks, so a multi-line text
      // with "\n\n" comes back as several "\n" and a strict includes()
      // false-fails even though the content is all there. Collapse runs of
      // whitespace on both sides before comparing.
      const norm = (s) => (s || '').replace(/\s+/g, ' ').trim();
      const composerText = composer.innerText.trim();
      if (!norm(composerText).includes(norm(text))) {
        return {
          ok: false,
          error: 'Composer did not accept the input — CKEditor may have rejected the paste.',
          composer_text: composerText.slice(0, 200),
        };
      }

      const headerParticipant = document.querySelector('[data-tid^="participant-"]');
      const chatTitle = headerParticipant
        ? (headerParticipant.innerText || '').trim().split('\n')[0]
        : (document.title.split('|').map(s => s.trim())[1] || '');

      // Resilient send: poll up to ~6s for an ENABLED send button (data-tid
      // primary, aria-label "Send (…)" fallback — survives Fluent hook
      // rotation). If it never shows (search-opened chats sometimes leave
      // the toolbar in a transient state), fall back to the keyboard
      // shortcut the button itself advertises: Cmd/Ctrl+Enter.
      const findSend = () => {
        const cands = [...document.querySelectorAll('[data-tid="sendMessageCommands-send"], button[aria-label^="Send"]')];
        return cands.find(b => !(b.hasAttribute('disabled') || b.getAttribute('aria-disabled') === 'true')) || null;
      };
      let sendBtn = null;
      for (let i = 0; i < 30 && !sendBtn; i++) {
        sendBtn = findSend();
        if (sendBtn) break;
        await new Promise(r => setTimeout(r, 200));
      }

      let sentVia = 'button';
      if (sendBtn) {
        sendBtn.click();
      } else {
        // Keyboard fallback — Teams sends on Cmd/Ctrl+Enter (per the send
        // button's own "Send (⌘ Return)" label).
        sentVia = 'keyboard';
        composer.focus();
        for (const mod of [{ metaKey: true }, { ctrlKey: true }]) {
          composer.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', code: 'Enter', keyCode: 13, which: 13, bubbles: true, cancelable: true, ...mod }));
        }
      }
      await new Promise(r => setTimeout(r, 500));

      // Verify it actually sent — composer should be empty again.
      // Normalize whitespace + compare a leading slice (multi-line safe).
      const stillThere = norm(composer.innerText).includes(norm(text).slice(0, 30));
      if (stillThere) {
        return { ok: false, error: `Message typed but send did not go through (tried ${sentVia}). Composer still holds the text.`, sent_via: sentVia };
      }

      return {
        ok: true,
        sent_text: text,
        sent_via: sentVia,
        chat_title: chatTitle,
        switched,
        switched_in_ms: switchedMs,
        resolve_tier: resolveTier,
        groups_expanded: groupsExpanded,
        search_picked: searchPicked,
        url: location.href,
      };
