id: gitlab-web
name: GitLab (Web Session)
icon: 🦊
version: 0.2.0
author: forge
category: connector
mode: browser-side
tab_strategy: reuse
description: |
  GitLab REST API via the user's logged-in BROWSER SESSION (cookie + CSRF),
  NOT a Personal Access Token. Same 34 tools as the `gitlab` HTTP connector
  (issues, MRs, projects, pipelines, branches, files, notes), but every call
  runs as same-origin fetch(/api/v4/..., {credentials:include}) inside a GitLab
  tab, carrying your web session. Use this when the org restricts PATs to
  read-only scope: the web session keeps full write rights (comment, approve,
  merge, create MR), so it works where the PAT-based `gitlab` connector 403s.
catalog_summary: |
  GitLab via logged-in browser session (cookie auth, no PAT). Read + WRITE
  merge requests / issues / notes / pipelines / branches / files. Preferred
  when PATs are read-only: web session retains write (add_mr_note, approve_mr,
  merge_mr, create_mr, update_mr). 34 tools. Same shapes as the `gitlab`
  connector; pick this for write ops under a read-only-PAT policy.
settings:
  base_url:
    type: string
    label: GitLab base URL
    description: e.g. https://gitlab.example.com — the origin your browser is logged into.
    required: true
host_match: '{base_url}/*'
login_redirect: /users/sign_in
tools:
  me:
    description: Get the current authenticated user (id, username, email, name).
    returns: '{ id, username, name, email, avatar_url, web_url, state }'
    page:
      url: '{base_url}/'
      on_target: /
    script: |
      const CSRF = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
      const q = new URLSearchParams();
      const path = `user`;
      const qs = q.toString();
      const url = '/api/v4/' + path + (qs ? ('?' + qs) : '');
      const headers = { 'Accept': 'application/json' };
      const init = { method: 'GET', credentials: 'include', headers };
      let r, text, data;
      try { r = await fetch(url, init); text = await r.text(); } catch (e) { return { ok: false, error: String(e), url }; }
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
      if (!r.ok) return { ok: false, status: r.status, error: (data && data.message) ? data.message : data, url };
      return { ok: true, status: r.status, data };
  list_my_projects:
    description: |
      List projects the authenticated user is a member of. Returns common
      fields you need (id, path_with_namespace, name, default_branch,
      web_url). Use `find_project` if you want to search by name.
    parameters:
      per_page:
        description: Page size (GitLab caps at 100).
        type: number
        default: 50
      order_by:
        description: Sort field — id | name | path | created_at | updated_at | last_activity_at.
        type: string
        default: last_activity_at
    returns: '[ { id, name, path_with_namespace, default_branch, web_url, ... } ]'
    page:
      url: '{base_url}/'
      on_target: /
    script: |
      const CSRF = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
      const q = new URLSearchParams();
      q.set('membership', 'true');
      q.set('simple', 'true');
      if (args.per_page !== undefined && args.per_page !== null && String(args.per_page) !== '') q.set('per_page', String(args.per_page));
      if (args.order_by !== undefined && args.order_by !== null && String(args.order_by) !== '') q.set('order_by', String(args.order_by));
      const path = `projects`;
      const qs = q.toString();
      const url = '/api/v4/' + path + (qs ? ('?' + qs) : '');
      const headers = { 'Accept': 'application/json' };
      const init = { method: 'GET', credentials: 'include', headers };
      let r, text, data;
      try { r = await fetch(url, init); text = await r.text(); } catch (e) { return { ok: false, error: String(e), url }; }
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
      if (!r.ok) return { ok: false, status: r.status, error: (data && data.message) ? data.message : data, url };
      return { ok: true, status: r.status, data };
  find_project:
    description: |
      Search projects by name / path. Returns top matches with numeric ids —
      use those as `project_id` for other tools so you don't need to
      URL-encode the path.
    parameters:
      query:
        description: Substring matched against project name + path.
        type: string
        required: true
      per_page:
        description: Page size cap (max 100).
        type: number
        default: 10
    returns: '[ { id, name, path_with_namespace, web_url } ]'
    page:
      url: '{base_url}/'
      on_target: /
    script: |
      const CSRF = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
      const q = new URLSearchParams();
      if (args.query !== undefined && args.query !== null && String(args.query) !== '') q.set('search', String(args.query));
      q.set('simple', 'true');
      if (args.per_page !== undefined && args.per_page !== null && String(args.per_page) !== '') q.set('per_page', String(args.per_page));
      const path = `projects`;
      const qs = q.toString();
      const url = '/api/v4/' + path + (qs ? ('?' + qs) : '');
      const headers = { 'Accept': 'application/json' };
      const init = { method: 'GET', credentials: 'include', headers };
      let r, text, data;
      try { r = await fetch(url, init); text = await r.text(); } catch (e) { return { ok: false, error: String(e), url }; }
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
      if (!r.ok) return { ok: false, status: r.status, error: (data && data.message) ? data.message : data, url };
      return { ok: true, status: r.status, data };
  get_project:
    description: Get one project by numeric id. Use find_project to look up id from a name.
    parameters:
      project_id:
        description: GitLab project numeric id (use find_project to resolve from a path).
        type: number
        required: true
    page:
      url: '{base_url}/'
      on_target: /
    script: |
      const CSRF = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
      const q = new URLSearchParams();
      const path = `projects/${encodeURIComponent(args.project_id)}`;
      const qs = q.toString();
      const url = '/api/v4/' + path + (qs ? ('?' + qs) : '');
      const headers = { 'Accept': 'application/json' };
      const init = { method: 'GET', credentials: 'include', headers };
      let r, text, data;
      try { r = await fetch(url, init); text = await r.text(); } catch (e) { return { ok: false, error: String(e), url }; }
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
      if (!r.ok) return { ok: false, status: r.status, error: (data && data.message) ? data.message : data, url };
      return { ok: true, status: r.status, data };
  list_branches:
    description: List branches in a project (default branch shown as `default_branch` on get_project).
