      if (args.per_page !== undefined && args.per_page !== null && String(args.per_page) !== '') q.set('per_page', String(args.per_page));
      if (args.search !== undefined && args.search !== null && String(args.search) !== '') q.set('search', String(args.search));
      const path = `projects/${encodeURIComponent(args.project_id)}/repository/branches`;
      const qs = q.toString();
      const url = '/api/v4/' + path + (qs ? ('?' + qs) : '');
