      let r, text, data;
      try { r = await fetch(url, init); text = await r.text(); } catch (e) { return { ok: false, error: String(e), url }; }
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
      if (!r.ok) return { ok: false, status: r.status, error: (data && data.message) ? data.message : data, url };
      return { ok: true, status: r.status, data };
  list_my_issues:
    description: List issues assigned to me across all projects. state ∈ {opened, closed, all}.
    parameters:
      state:
        description: opened | closed | all.
        type: string
        default: opened
      labels:
        type: string
        description: Comma-separated label names
        required: false
      per_page:
        description: Page size cap (max 100).
        type: number
        default: 50
    returns: '[ { iid, project_id, title, state, labels, milestone, assignees, web_url, ... } ]'
    page:
      url: '{base_url}/'
      on_target: /
    script: |
      const CSRF = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
      const q = new URLSearchParams();
      q.set('scope', 'assigned_to_me');
      if (args.state !== undefined && args.state !== null && String(args.state) !== '') q.set('state', String(args.state));
      if (args.labels !== undefined && args.labels !== null && String(args.labels) !== '') q.set('labels', String(args.labels));
      if (args.per_page !== undefined && args.per_page !== null && String(args.per_page) !== '') q.set('per_page', String(args.per_page));
      const path = `issues`;
      const qs = q.toString();
      const url = '/api/v4/' + path + (qs ? ('?' + qs) : '');
      const headers = { 'Accept': 'application/json' };
      const init = { method: 'GET', credentials: 'include', headers };
      let r, text, data;
      try { r = await fetch(url, init); text = await r.text(); } catch (e) { return { ok: false, error: String(e), url }; }
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
      if (!r.ok) return { ok: false, status: r.status, error: (data && data.message) ? data.message : data, url };
      return { ok: true, status: r.status, data };
  list_issues:
    description: List issues in a project with optional filters.
    parameters:
      project_id:
        description: GitLab project numeric id.
        type: number
        required: true
      state:
        description: opened | closed | all.
        type: string
        default: opened
      labels:
        description: Comma-separated label names (must have ALL).
        type: string
        required: false
      milestone:
        description: Milestone title — exact match.
        type: string
        required: false
      assignee_username:
        description: GitLab username of the assignee (not display name).
        type: string
        required: false
      search:
        type: string
        description: Free-text search on title + description
        required: false
      per_page:
        description: Page size cap (max 100).
        type: number
        default: 50
    page:
      url: '{base_url}/'
      on_target: /
    script: |
      const CSRF = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
      const q = new URLSearchParams();
      if (args.state !== undefined && args.state !== null && String(args.state) !== '') q.set('state', String(args.state));
      if (args.labels !== undefined && args.labels !== null && String(args.labels) !== '') q.set('labels', String(args.labels));
      if (args.milestone !== undefined && args.milestone !== null && String(args.milestone) !== '') q.set('milestone', String(args.milestone));
      if (args.assignee_username !== undefined && args.assignee_username !== null && String(args.assignee_username) !== '') q.set('assignee_username', String(args.assignee_username));
      if (args.search !== undefined && args.search !== null && String(args.search) !== '') q.set('search', String(args.search));
      if (args.per_page !== undefined && args.per_page !== null && String(args.per_page) !== '') q.set('per_page', String(args.per_page));
      const path = `projects/${encodeURIComponent(args.project_id)}/issues`;
      const qs = q.toString();
      const url = '/api/v4/' + path + (qs ? ('?' + qs) : '');
      const headers = { 'Accept': 'application/json' };
      const init = { method: 'GET', credentials: 'include', headers };
      let r, text, data;
      try { r = await fetch(url, init); text = await r.text(); } catch (e) { return { ok: false, error: String(e), url }; }
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
      if (!r.ok) return { ok: false, status: r.status, error: (data && data.message) ? data.message : data, url };
      return { ok: true, status: r.status, data };
  get_issue:
    description: Get one issue by project + iid (project-scoped issue number).
    parameters:
      project_id:
        description: GitLab project numeric id.
        type: number
        required: true
      issue_iid:
        description: 'Project-scoped issue number (the #N shown in the UI), not the global id.'
        type: number
        required: true
    page:
      url: '{base_url}/'
      on_target: /
    script: |
      const CSRF = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
      const q = new URLSearchParams();
      const path = `projects/${encodeURIComponent(args.project_id)}/issues/${encodeURIComponent(args.issue_iid)}`;
      const qs = q.toString();
      const url = '/api/v4/' + path + (qs ? ('?' + qs) : '');
      const headers = { 'Accept': 'application/json' };
      const init = { method: 'GET', credentials: 'include', headers };
      let r, text, data;
      try { r = await fetch(url, init); text = await r.text(); } catch (e) { return { ok: false, error: String(e), url }; }
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
      if (!r.ok) return { ok: false, status: r.status, error: (data && data.message) ? data.message : data, url };
      return { ok: true, status: r.status, data };
  search_issues:
    description: Search issues across ALL projects visible to the user.
    parameters:
      query:
        description: Free-text search on title + description.
        type: string
        required: true
      state:
        description: opened | closed | all.
        type: string
        default: opened
      per_page:
        description: Page size cap (max 100).
        type: number
        default: 25
    page:
      url: '{base_url}/'
      on_target: /
    script: |
      const CSRF = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
      const q = new URLSearchParams();
      if (args.query !== undefined && args.query !== null && String(args.query) !== '') q.set('search', String(args.query));
      if (args.state !== undefined && args.state !== null && String(args.state) !== '') q.set('state', String(args.state));
      if (args.per_page !== undefined && args.per_page !== null && String(args.per_page) !== '') q.set('per_page', String(args.per_page));
      const path = `issues`;
      const qs = q.toString();
      const url = '/api/v4/' + path + (qs ? ('?' + qs) : '');
      const headers = { 'Accept': 'application/json' };
      const init = { method: 'GET', credentials: 'include', headers };
      let r, text, data;
      try { r = await fetch(url, init); text = await r.text(); } catch (e) { return { ok: false, error: String(e), url }; }
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
      if (!r.ok) return { ok: false, status: r.status, error: (data && data.message) ? data.message : data, url };
      return { ok: true, status: r.status, data };
  create_issue:
    description: Create an issue in a project. Returns the created issue including iid + web_url.
    destructive: true
    parameters:
      project_id:
        description: GitLab project numeric id.
        type: number
        required: true
      title:
        description: Issue title (required).
        type: string
        required: true
      description:
        description: Issue description body (Markdown).
        type: string
        required: false
      labels:
        description: Comma-separated label names to apply.
        type: string
        required: false
      assignee_ids:
        type: string
        description: Comma-separated user ids
        required: false
      milestone_id:
        description: Numeric milestone id to attach.
        type: number
        required: false
    page:
      url: '{base_url}/'
      on_target: /
    script: |
      const CSRF = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
      const q = new URLSearchParams();
      const path = `projects/${encodeURIComponent(args.project_id)}/issues`;
      const qs = q.toString();
      const url = '/api/v4/' + path + (qs ? ('?' + qs) : '');
      const headers = { 'Accept': 'application/json' };
      const init = { method: 'POST', credentials: 'include', headers };
      const body = {};
      if (args.title !== undefined && args.title !== null && String(args.title) !== '') body['title'] = args.title;
      if (args.description !== undefined && args.description !== null && String(args.description) !== '') body['description'] = args.description;
      if (args.labels !== undefined && args.labels !== null && String(args.labels) !== '') body['labels'] = args.labels;
      if (args.assignee_ids !== undefined && args.assignee_ids !== null && String(args.assignee_ids) !== '') body['assignee_ids'] = args.assignee_ids;
      if (args.milestone_id !== undefined && args.milestone_id !== null && String(args.milestone_id) !== '') body['milestone_id'] = args.milestone_id;
      headers['X-CSRF-Token'] = CSRF;
      if (Object.keys(body).length) { headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(body); }
      let r, text, data;
      try { r = await fetch(url, init); text = await r.text(); } catch (e) { return { ok: false, error: String(e), url }; }
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
      if (!r.ok) return { ok: false, status: r.status, error: (data && data.message) ? data.message : data, url };
      return { ok: true, status: r.status, data };
  update_issue:
    description: |
      Partial update — only fields you set change. Common uses:
      change state ('close' / 'reopen'), reassign, edit labels.
    destructive: true
    parameters:
      project_id:
        description: GitLab project numeric id.
        type: number
        required: true
      issue_iid:
        description: Project-scoped issue number to update.
        type: number
        required: true
      title:
        description: New title (omit to leave unchanged).
        type: string
        required: false
      description:
        description: New description (omit to leave unchanged).
        type: string
        required: false
      state_event:
        type: string
        description: '''close'' | ''reopen'''
        required: false
      labels:
        description: Replace label set with this comma-separated list.
        type: string
        required: false
      assignee_ids:
        description: Comma-separated user ids to assign (empty to clear).
        type: string
        required: false
    page:
      url: '{base_url}/'
      on_target: /
    script: |
      const CSRF = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
      const q = new URLSearchParams();
      const path = `projects/${encodeURIComponent(args.project_id)}/issues/${encodeURIComponent(args.issue_iid)}`;
      const qs = q.toString();
      const url = '/api/v4/' + path + (qs ? ('?' + qs) : '');
      const headers = { 'Accept': 'application/json' };
      const init = { method: 'PUT', credentials: 'include', headers };
      const body = {};
      if (args.title !== undefined && args.title !== null && String(args.title) !== '') body['title'] = args.title;
      if (args.description !== undefined && args.description !== null && String(args.description) !== '') body['description'] = args.description;
      if (args.state_event !== undefined && args.state_event !== null && String(args.state_event) !== '') body['state_event'] = args.state_event;
      if (args.labels !== undefined && args.labels !== null && String(args.labels) !== '') body['labels'] = args.labels;
      if (args.assignee_ids !== undefined && args.assignee_ids !== null && String(args.assignee_ids) !== '') body['assignee_ids'] = args.assignee_ids;
      headers['X-CSRF-Token'] = CSRF;
