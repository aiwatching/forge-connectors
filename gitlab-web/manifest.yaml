  list_my_todos:
    description: |
      List pending Todos for the current user — same set that appears in
      GitLab's web UI "Todos" panel. One call covers every project the
      token can see, so this is the right tool for "watch for incoming
      attention items" without one Job per MR.

      Action cheat-sheet (observed in the wild on dops-git106):
        - review_submitted   ← someone finished reviewing your MR
                               (the case you want for "reviewer left
                               feedback on my MR, go fix the code")
        - mentioned          ← someone @-mentioned you in a comment
        - review_requested   ← someone asked you to review their MR
        - assigned           ← MR/Issue was assigned to you
        - approval_required, unmergeable, build_failed,
          directly_addressed, merge_train_removed, marked

      Omit `action` to get all of them — dedup on `id` and let the
      pipeline branch on `action_name`. Each todo carries `target` with
      iid + project_id + title + web_url + author, so you can hand it
      straight to a `mr-review-fix` pipeline.
    parameters:
      action:
        type: string
        description: |
          One of the values above, or omit for all. **There is no
          'commented' action — review-style comments arrive as
          'review_submitted' or 'mentioned'.**
        required: false
      target_type:
        type: string
        description: MergeRequest | Issue | Commit | DesignManagement::Design | AlertManagement::Alert.
          Omit for all.
        required: false
      state:
        type: string
        default: pending
        description: pending (default — unread) | done
      author_id:
        type: number
        description: Filter by todo author (the user whose action created the todo).
        required: false
      project_id:
        type: number
        description: Filter to one project.
        required: false
