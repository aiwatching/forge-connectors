      let r, text, data;
      try { r = await fetch(url, init); text = await r.text(); } catch (e) { return { ok: false, error: String(e), url }; }
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
      if (!r.ok) return { ok: false, status: r.status, error: (data && data.message) ? data.message : data, url };
      return { ok: true, status: r.status, data };
  get_branch:
    description: Get a single branch by name.
    parameters:
      project_id:
        description: GitLab project numeric id.
        type: number
        required: true
      branch:
        description: Branch name — URL-encoded automatically by Forge.
        type: string
        required: true
    page:
      url: '{base_url}/'
      on_target: /
    script: |
      const CSRF = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
      const q = new URLSearchParams();
      const path = `projects/${encodeURIComponent(args.project_id)}/repository/branches/${encodeURIComponent(args.branch)}`;
      const qs = q.toString();
      const url = '/api/v4/' + path + (qs ? ('?' + qs) : '');
      const headers = { 'Accept': 'application/json' };
      const init = { method: 'GET', credentials: 'include', headers };
      let r, text, data;
      try { r = await fetch(url, init); text = await r.text(); } catch (e) { return { ok: false, error: String(e), url }; }
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
      if (!r.ok) return { ok: false, status: r.status, error: (data && data.message) ? data.message : data, url };
      return { ok: true, status: r.status, data };
  read_file:
    description: |
      Read a file from a project at a given ref (branch / tag / sha). Returns
      raw text. For large files use the GitLab UI directly.
    parameters:
      project_id:
        description: GitLab project numeric id.
        type: number
        required: true
      file_path:
        type: string
        required: true
        description: File path inside the repo. Slashes are fine; GitLab handles them.
      ref:
        description: Branch / tag / commit SHA to read from.
        type: string
        default: main
    page:
      url: '{base_url}/'
      on_target: /
    script: |
      const CSRF = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
      const q = new URLSearchParams();
      if (args.ref !== undefined && args.ref !== null && String(args.ref) !== '') q.set('ref', String(args.ref));
      const path = `projects/${encodeURIComponent(args.project_id)}/repository/files/${encodeURIComponent(args.file_path)}/raw`;
      const qs = q.toString();
      const url = '/api/v4/' + path + (qs ? ('?' + qs) : '');
      const headers = { 'Accept': 'application/json' };
      const init = { method: 'GET', credentials: 'include', headers };
      let r, text, data;
      try { r = await fetch(url, init); text = await r.text(); } catch (e) { return { ok: false, error: String(e), url }; }
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
      if (!r.ok) return { ok: false, status: r.status, error: (data && data.message) ? data.message : data, url };
      return { ok: true, status: r.status, data };
  list_commits:
    description: List commits on a branch / ref.
    parameters:
      project_id:
        description: GitLab project numeric id.
        type: number
        required: true
      ref_name:
        type: string
        description: Branch / tag / sha
        default: main
      per_page:
        description: Page size cap (max 100).
        type: number
