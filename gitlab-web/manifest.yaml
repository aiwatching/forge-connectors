      const q = new URLSearchParams();
      if (args.ref_name !== undefined && args.ref_name !== null && String(args.ref_name) !== '') q.set('ref_name', String(args.ref_name));
      if (args.per_page !== undefined && args.per_page !== null && String(args.per_page) !== '') q.set('per_page', String(args.per_page));
      const path = `projects/${encodeURIComponent(args.project_id)}/repository/commits`;
      const qs = q.toString();
      const url = '/api/v4/' + path + (qs ? ('?' + qs) : '');
      const headers = { 'Accept': 'application/json' };
