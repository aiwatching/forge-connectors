id: nac
name: FortiNAC Device
icon: 🛡️
version: "0.12.1"
author: forge
category: connector
mode: server-side
description: |
  Direct management of a FortiNAC appliance — SSH/CLI plus REST API,
  one connector, one set of credentials. Built because driving NAC
  through TP's automation page proved unstable.

  Connection: every tool takes `host` (the NAC IP — supply it per
  call, it is NOT stored in the connector). Username/password come
  from connector settings so one install can drive many NACs that
  share admin credentials.

  CLI tools (protocol: ssh, via PTY) — for OS-level ops:
    - upgrade: `execute restore image scp …` with auto-y/N and reboot.
    - get_version: read running version/build.
    - run_command: arbitrary CLI command.
    - reboot: `execute reboot`.

  REST tools (protocol: http) — for structured queries against the
  mgmt API. All endpoints live under /actions/<path> (verified on a
  live v7.6 GUI; the OpenAPI schema's logical /host/* / /user/* paths
  are NOT directly reachable):
    - login: POST /actions/user/current-session/login → sessionKey +
      JSESSIONID cookie.
    - logout / get_session_info: session lifecycle.
    - get_host_by_mac: lookup a Host record by MAC.

  Auth model for REST tools (v0.5 — caller-explicit cookie + token):
    1. login(host) returns LoginResult.sessionKey in the body AND a
       Set-Cookie JSESSIONID in response headers (surfaced via Forge's
       capture_response_headers preamble line).
    2. Pipeline parses BOTH out of the response and threads them into
       every subsequent REST tool as `jsessionid` + `session_key` args.
    3. Forge then attaches:
         Cookie:        JSESSIONID=<jsessionid>
         Authorization: <session_key>   ← bare, no Bearer/Basic prefix
    4. Sessions expire ~30 min idle. Re-login if a long run needs more.
       FortiNAC v7.6 has no long-lived API-user concept (unlike
       FortiGate), so login-once-per-run is the canonical pattern.

settings:
  port:
    type: string
    label: Default SSH port
    description: "Fallback SSH port when a call doesn't pass one. Default 22."
    default: "22"
  username:
    type: string
    label: Default username
    description: "Fallback SSH user when a call doesn't pass one. FortiNAC default is admin."
    default: "admin"
  password:
    type: secret
    label: Default password
    description: "Fallback SSH/REST password (encrypted at rest, sent silently, never logged). Used by SSH tools (override per-call) and as the REST login() password."

# Connector-level HTTP runtime knobs. NAC ships a self-signed cert
# (CN=at16-fortinac and similar) so Node fetch's default cert verify
# fails. Turn off verification — the alternative is trusting NAC's
# cert in the OS trust store on every Forge install.
http:
  verify_tls: false

tools:

  # ─────────── upgrade (destructive) ───────────
  upgrade:
    description: |
      Upgrade the FortiNAC firmware by restoring an image over SCP, the
      same flow you run by hand:
        execute restore image scp <image_path> <scp_host> <scp_user> <scp_pass>
      The tool SSHes in, sends that command, auto-answers the (y/N)
      confirmations (including the signature-validation warning for dev
      builds), and streams the restore until the image is written
      ("Done installing image"). The appliance then REBOOTS on its own
      (~3-5 min) and comes back on the new build — verify with
      get_version afterwards (compare build number).

      Returns from_version / to_version / target_build, and `rebooted`
      ONLY if the box auto-rebooted (FortiNAC's restore does this
      inconsistently — sometimes it reboots itself, sometimes it just
      prints "Please reboot").

      IMPORTANT — after a successful upgrade, check captured.rebooted:
        • present  → it rebooted itself; the registered watch will
          confirm the new build. Done.
        • ABSENT   → image is written but NOT yet running. You MUST call
          `reboot` (same host) to switch to the new build, otherwise the
          device stays on the old version and the watch times out.
    destructive: true
    protocol: ssh
    parameters:
      host:
        type: string
        required: true
        description: "NAC management IP/hostname to upgrade, e.g. 10.15.52.152."
      port:
        type: string
        description: "SSH port. Omit to use the connector default (22)."
      username:
        type: string
        description: "SSH user. Omit to use the connector default (admin)."
      password:
        type: string
        description: "SSH password. Omit to use the connector's saved default (preferred — avoids putting the password in chat)."
      image_path:
        type: string
        required: true
        description: "Absolute path of the .out image ON the scp source server, e.g. /var/lib/jenkins/jobs/fortinac-build-7.6-token/builds/17/archive/nacos/FNAC_ESX-v7-build6957-FORTINET_job1_17.out"
      scp_host:
        type: string
        default: "10.15.33.5"
        description: "SCP source server holding the image (the jenkins build host)."
      scp_user:
        type: string
        default: "jenkins"
        description: "SCP username."
      scp_pass:
        type: string
        default: "fortinet"
        description: "SCP password."
    ssh:
      prompt_regex: "#[ \\t]*$"
      commands:
        - "execute restore image scp {args.image_path} {args.scp_host} {args.scp_user} {args.scp_pass}"
      auto_answer:
        # Intent `yes` → the runner reads each prompt's offered options and
        # sends the right token (y for (y/N), yes for (yes/no)), explicitly.
        - match: "\\(y/?n\\)|\\(yes/no\\)|do you want to continue"
          send: "yes"
      done_when: "Done installing image|Rebooting primary server"
      fail_when: "No space left on device|Permission denied, please try again|Host key verification failed|command parse error|Unknown action|Invalid value for positional|^Usage: |Invalid server / port value"
      capture:
        from_version: "from version ([0-9][0-9.]+)"
        to_version: "to version ([0-9][0-9.]+)"
        target_build: "build([0-9]+)"          # from the echoed image filename — the build we're moving to
        rebooted: "(Rebooting primary server|system is going down for reboot)"   # present ONLY if it auto-rebooted
      timeout_sec: 240
    # Long-task watch: upgrade returns when the image is written, but the
    # box then reboots (~3-5 min). The watch polls get_version until the
    # running build matches the target, then reports back in chat.
    # NOTE: poll_args carries host/port/username only — NOT the password.
    # get_version falls back to the connector's saved password, so set it
    # in the nac connector settings for the auto-verify to authenticate
    # (we don't persist the password into the watch row).
    async:
      poll: get_version
      poll_args:
        host: "{args.host}"
        port: "{args.port}"
        username: "{args.username}"
      done_match:
        path: captured.build
        equals: "{result.captured.target_build}"
      interval_sec: 60
      timeout_sec: 900
      max_polls: 15
      on_done:
        mode: chat
        message: "NAC {args.host} upgrade confirmed — now running build {poll.captured.build} ({poll.captured.version})."
      on_fail:
        mode: chat
        message: "NAC {args.host} did not reach the target build in time — please verify manually (nac.get_version). If the image was written but the box never rebooted, run nac.reboot."
      progress:
        show: true
        message: "Upgrading NAC {args.host}… poll {poll_count}/{max_polls}, current build {poll.captured.build}"

  # ─────────── get_version ───────────
  get_version:
    description: |
      Read the running FortiNAC version via `get system status`. Returns
      the full version string, the numeric build, firmware signature and
      hostname. Use to confirm an upgrade landed: poll until `build`
      matches the target (e.g. 6957) — the device is unreachable for a
      few minutes mid-reboot, so expect connection errors until it's up.
    protocol: ssh
    parameters:
      host:
        type: string
        required: true
        description: "NAC management IP/hostname, e.g. 10.15.52.152."
      port:
        type: string
        description: "SSH port. Omit to use the connector default (22)."
      username:
        type: string
        description: "SSH user. Omit to use the connector default (admin)."
      password:
        type: string
        description: "SSH password. Omit to use the connector's saved default."
    ssh:
      prompt_regex: "#[ \\t]*$"
      commands:
        - "get system status"
        - "exit"
      done_when: "Version:\\s*FortiNAC[^\\n]*build[0-9]+"
      capture:
        version: "Version:\\s*(FortiNAC[^\\r\\n]+)"
        build: "build([0-9]+)"
        signature: "Firmware Signature:\\s*([^\\r\\n]+)"
        hostname: "Hostname:\\s*([^\\r\\n]+)"
      success_on_close: true
      timeout_sec: 45

  # ─────────── run_command ───────────
  run_command:
    description: |
      Run a single FortiNAC CLI command and capture its output, e.g.
      'get system ha', 'get system interface', 'diagnose ...'. For the
      firmware version use get_version. For upgrades use upgrade (this
      tool does NOT auto-answer (y/N) prompts).
    protocol: ssh
    parameters:
      host:
        type: string
        required: true
        description: "NAC management IP/hostname."
      port:
        type: string
        description: "SSH port. Omit to use the connector default (22)."
      username:
        type: string
        description: "SSH user. Omit to use the connector default (admin)."
      password:
        type: string
        description: "SSH password. Omit to use the connector's saved default."
      command:
        type: string
        required: true
        description: "The CLI command to run (e.g. 'get system status')."
    ssh:
      prompt_regex: "#[ \\t]*$"
      commands:
        - "{args.command}"
        - "exit"
      success_on_close: true
      timeout_sec: 60

  # ─────────── reboot (destructive) ───────────
  reboot:
    description: |
      Reboot a FortiNAC appliance — `execute reboot` (auto-answers the
      y/n confirm). The SSH connection drops as the box goes down; that
      is treated as success.

      Primary use: finish an `upgrade` whose image was written but which
      did NOT auto-reboot (upgrade's result has no `captured.rebooted`).
      After this reboot the device boots the new build, and any pending
      upgrade watch will confirm it. ~3-5 min to come back.
    destructive: true
    protocol: ssh
    parameters:
      host:
        type: string
        required: true
        description: "NAC management IP/hostname to reboot."
      port:
        type: string
        description: "SSH port. Omit to use the connector default (22)."
      username:
        type: string
        description: "SSH user. Omit to use the connector default (admin)."
      password:
        type: string
        description: "SSH password. Omit to use the connector's saved default."
    ssh:
      prompt_regex: "#[ \\t]*$"
      commands:
        - "execute reboot"
      auto_answer:
        - match: "\\(y/?n\\)|\\(yes/no\\)|do you want to continue|reboot the system"
          send: "yes"
      done_when: "system is going down for reboot|Rebooting|Restarting system|going down"
      fail_when: "Permission denied|command parse error|Unknown action"
      success_on_close: true
      timeout_sec: 60

  # ─────────── REST tools (protocol: http) ───────────
  # NAC 7.6 real-world auth (probed via Chrome DevTools on the live GUI):
  #
  #   • All REST endpoints live under /actions/<path>, NOT /api/v2/* as
  #     the OpenAPI schema's logical groupings suggest.
  #   • Login is POST /actions/user/current-session/login with form body
  #     user=... & password=... — returns 200 + Set-Cookie JSESSIONID +
  #     JSON { sessionKey: "<32-char token>", userRecord: {...} }.
  #   • Every subsequent call needs BOTH:
  #       Cookie:        JSESSIONID=<value-from-login>
  #       Authorization: <sessionKey>      ← bare token, no Bearer/Basic
  #     Cookie alone → 400. Token alone → 401. Both → 200.
  #   • Every URL needs the GUI's standard query-param boilerplate:
  #       ?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=
  #     Missing it → 400 even with valid auth.
  #
  # Pipeline auth dance (v0.5 — caller threads cookie+key explicitly):
  #   1. login(host=...) → result.content has the body PLUS a captured
  #      `set-cookie:` line in the preamble (Forge core: capture_response_headers).
  #      Extract both fields:
  #        BODY=$(echo "$RESP" | jq -r '.content' | tail -n +N)   # skip preamble
  #        KEY=$(echo "$BODY" | jq -r '.sessionKey')
  #        JS=$(echo "$RESP" | jq -r '.content' | sed -n 's/^set-cookie: JSESSIONID=\([^;]*\).*/\1/p')
  #   2. Pass `jsessionid=$JS, session_key=$KEY` to every subsequent tool.
  #   3. Session times out at ~30 min idle; long pipelines should renew.

  login:
    description: |
      Log in to FortiNAC's REST API at /actions/user/current-session/login.
      Returns LoginResult JSON (incl. `sessionKey`) AND a `set-cookie:
      JSESSIONID=…` line in the preamble (via Forge's capture_response_headers).

      Pipelines need BOTH:
        SK=$(echo "$RESP" | jq -r '.content' | tail -n +N | jq -r '.sessionKey')
        JS=$(echo "$RESP" | jq -r '.content' | sed -n 's/^set-cookie: JSESSIONID=\([^;]*\).*/\1/p')
      then pass jsessionid=$JS, session_key=$SK to every other REST tool.

      Username/password come from connector settings (SHARED with the
      ssh tools — same admin credential drives both surfaces).
    protocol: http
    parameters:
      host:
        type: string
        required: true
        description: "NAC mgmt IP/hostname, e.g. 10.15.52.152."
      port:
        type: number
        default: 8443
        description: "FortiNAC mgmt HTTPS port. Default 8443."
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/user/current-session/login"
      body_form:
        user: "{settings.username}"
        password: "{settings.password}"
      capture_response_headers:
        - set-cookie
    returns: "LoginResult { status, sessionKey, userRecord, errorMessage, ... } · preamble carries `set-cookie: JSESSIONID=…`"

  logout:
    description: |
      Invalidate the current REST session. Best-effort — the server
      expires idle sessions automatically (~30 min).
    protocol: http
    parameters:
      host:
        type: string
        required: true
        description: "NAC mgmt IP/hostname, same as login()."
      port:
        type: number
        default: 8443
      jsessionid:
        type: string
        required: true
        description: "JSESSIONID cookie value from a prior login() (parsed out of `set-cookie:` in the login preamble)."
      session_key:
        type: string
        required: true
        description: "sessionKey from the login() body — sent as bare Authorization header."
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/user/current-session/logout?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "BaseResult { status, errorMessage }"

  get_session_info:
    description: |
      Seconds remaining before the current REST session expires.
      Returns 0 / negative if the key is no longer valid.
    protocol: http
    parameters:
      host:
        type: string
        required: true
      port:
        type: number
        default: 8443
      jsessionid:
        type: string
        required: true
        description: "JSESSIONID cookie value from login()."
      session_key:
        type: string
        required: true
        description: "sessionKey from login() body."
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/user/current-session/timeout?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "UserSessionTimeoutResult { status, timeout, errorMessage }"

  get_host_by_mac:
    description: |
      Look up a Host record by its MAC address. Returns full host
      details — hostName, operatingSystem, ip, adapters[], connected,
      role, creationTime, validForTime, etc.

      Useful for verifying a fix landed: after applying a change, query
      this to confirm the device shows up in the expected state (correct
      group, online, has the right role).
    protocol: http
    parameters:
      host:
        type: string
        required: true
        description: "NAC mgmt IP/hostname holding the Host record."
      port:
        type: number
        default: 8443
      jsessionid:
        type: string
        required: true
        description: "JSESSIONID cookie value from login()."
      session_key:
        type: string
        required: true
        description: "sessionKey from login() body."
      mac:
        type: string
        required: true
        description: "MAC address in canonical form (AA:BB:CC:DD:EE:FF). Case-insensitive."
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/host/by-mac/{args.mac}?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [HostRecord{ hostName, operatingSystem, ip, adapters, connected, role, type, creationTime, validForTime, ... }] }"

  # ─────────── Host lookup ───────────

  get_host_by_ip:
    description: |
      Look up a Host record by its IP address. Returns the same shape
      as get_host_by_mac. Use when a Mantis bug only mentions the IP.
    protocol: http
    parameters:
      host:        { type: string, required: true, description: "NAC mgmt IP/hostname." }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true, description: "JSESSIONID from login()." }
      session_key: { type: string, required: true, description: "sessionKey from login() body." }
      ip:          { type: string, required: true, description: "Endpoint IPv4 address, e.g. 10.10.21.10." }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/host/by-ip/{args.ip}?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [HostRecord] }"

  find_hosts_for_user:
    description: |
      List all Host records associated with the given user record id.
      Useful when verifying that a user's devices land on the right policy
      after a fix.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      user_id:     { type: string, required: true, description: "User record DBID (NOT login name — use list_users first if you only have the username)." }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/host/for-user?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&userID={args.user_id}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [HostRecord] }"

  hosts_connected_to_port:
    description: |
      List all Host records currently connected to the given switch port.
      Useful for diagnosing "wrong VLAN" / "wrong access" Mantis bugs by
      finding everything the port has touched.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      port_id:     { type: string, required: true, description: "Port record DBID." }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/host/connected-to-port?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&portID={args.port_id}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [HostRecord] }"

  # ─────────── Host detail (by DBID) ───────────

  get_host:
    description: |
      Get a full Host record by its DBID. Returns the same shape as
      get_host_by_mac. Used when you already have the id from a list
      query — saves the MAC/IP lookup step.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      id:          { type: string, required: true, description: "Host record DBID (the numeric id from a list query)." }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/host/{args.id}?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [HostRecord] }"

  get_host_policy:
    description: |
      Get the policy info for a Host — which access / authentication /
      remediation / endpoint compliance policies apply. Use to verify
      that after a config change, the host lands on the EXPECTED policy.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      id:          { type: string, required: true, description: "Host record DBID." }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/host/{args.id}/policy?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: { accessPolicy, authPolicy, remediationPolicy, ... } }"

  get_host_health:
    description: |
      Get current health info for a Host — compliance scan status,
      last-scan timestamp, etc. Use to verify a host is "healthy" per
      the policy after a fix.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      id:          { type: string, required: true, description: "Host record DBID." }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/host/{args.id}/health?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: { complianceScanStatus, complianceScanDate, ... } }"

  list_host_applications:
    description: |
      List Scanned Applications detected on a Host (installed software,
      OS-level apps). Useful for endpoint-compliance Mantis bugs where
      a specific app's presence/absence is the trigger.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      host_id:     { type: string, required: true, description: "Host record DBID (NOT MAC) — get from get_host_by_mac().results[0].id" }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/host/scanned-application/for-host?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&hostID={args.host_id}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [ScannedApplication{ name, version, vendor, installDate, ... }] }"

  # ─────────── Host filter / list / count ───────────

  list_hosts:
    description: |
      Paginated list of Host records matching an optional filter.
      Filter syntax (verified against the live GUI):
        filters=physAddress==AA:BB:CC:DD:EE:FF
        filters=hostName==linux
        filters=status==1                  (1 = registered, 0 = rogue)
        filters=connected==true
        filters=role==NAC-Default
      Combine with `&` only for two separate filter clauses — NOT
      with a logical AND. Use list with a tight filter, not a full scan.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      filters:     { type: string, description: "Filter expression. E.g. 'physAddress==00:50:56:B5:9E:70' or 'connected==true'." }
      start:       { type: number, default: 0, description: "Pagination offset." }
      count:       { type: number, default: 50, description: "Max records (server caps at a few thousand)." }
      sort_key:    { type: string, default: "physAddress", description: "Field to sort by." }
      sort_dir:    { type: string, default: "asc", description: "asc | desc." }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/host?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&start={args.start}&count={args.count}&sortKey={args.sort_key}&sortDir={args.sort_dir}&filters={args.filters}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [HostRecord], filtered: N, total: N }"

  count_hosts:
    description: |
      Return the count of Host records matching the filter (or all if
      no filter). Fast — use to size up a query before listing.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      filters:     { type: string, default: "", description: "Filter expression; empty = total count." }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/host/count?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&filters={args.filters}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [], total: N }"

  list_recent_hosts:
    description: |
      Newly discovered Host records grouped by OS, within a date range.
      Useful to spot a rogue / unexpected device that appeared during
      a window relevant to a Mantis bug.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      start_date:  { type: number, required: true, description: "Unix ms epoch." }
      end_date:    { type: number, required: true, description: "Unix ms epoch." }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/host/recent?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&startDate={args.start_date}&endDate={args.end_date}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [{ os, count, hosts: [...] }] }"

  # ─────────── Network session / connection logs ───────────

  list_connection_events:
    description: |
      Network Session Events — who connected where, when, on what port.
      Filterable by MAC, IP, date range. Primary evidence source for
      Mantis bugs about connectivity, VLAN assignment, auth failures.

      Filter examples:
        filters=physAddress==00:50:56:B5:9E:70
        filters=startTime>=1780300000000   (after this epoch ms)
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      filters:     { type: string, default: "", description: "Filter expression (see list_hosts for syntax)." }
      start:       { type: number, default: 0 }
      count:       { type: number, default: 50 }
      sort_key:    { type: string, default: "startTime" }
      sort_dir:    { type: string, default: "desc" }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/logging/connection?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&start={args.start}&count={args.count}&sortKey={args.sort_key}&sortDir={args.sort_dir}&filters={args.filters}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [ConnectionEvent{ physAddress, ip, startTime, endTime, switchIP, port, vlan, ... }], total }"

  list_events:
    description: |
      System events — alarms, config changes, scan results, auth events.
      Broader than connection logs (which are network-session-only).
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      filters:     { type: string, default: "" }
      start:       { type: number, default: 0 }
      count:       { type: number, default: 50 }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/logging/event?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&start={args.start}&count={args.count}&sortKey=timestamp&sortDir=desc&filters={args.filters}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [Event{ timestamp, type, severity, message, ... }], total }"

  # ─────────── Policy ───────────

  list_access_policies:
    description: |
      All Access Policy records. Use to see what's available before
      asking which policy applies to a specific host (get_host_policy).
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      filters:     { type: string, default: "" }
      start:       { type: number, default: 0 }
      count:       { type: number, default: 100 }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/policy/access?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&start={args.start}&count={args.count}&filters={args.filters}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [AccessPolicy{ name, rank, enabled, ... }], total }"

  # ─────────── Generic escape hatch ───────────

  call_api:
    description: |
      Generic NAC REST call — use this when no specific tool above
      fits and the OpenAPI schema (1301 endpoints) shows one for your
      need.

      ALL endpoints live under /actions/<path>. Pass `path` WITHOUT the
      /actions prefix and WITHOUT the leading slash — Forge prepends both.
      Examples (verified):
        path: "system/local-properties/cluster"
        path: "device/port/12345"
        path: "user/admin-profile"

      The standard query params (resetUserTimeout, APIDEBUG, NAC_SERVER)
      are auto-added. Add tool-specific args in `extra_query`.

      Auth (cookie+token) is auto-applied; you only pass jsessionid +
      session_key. method defaults to GET; for POST/PUT, set `body_json`.

      Skip this tool if a specific typed tool exists — typed tools have
      better parameter docs and clearer return shapes.
    protocol: http
    parameters:
      host:         { type: string, required: true }
      port:         { type: number, default: 8443 }
      jsessionid:   { type: string, required: true }
      session_key:  { type: string, required: true }
      path:         { type: string, required: true, url_encoding: none, description: "Path under /actions/ — e.g. 'system/local-properties/cluster' or 'device/port/12345'. NO leading slash, NO /actions prefix. Slashes preserved (url_encoding: none)." }
      method:       { type: string, default: "GET", description: "GET | POST | PUT | DELETE." }
      extra_query:  { type: string, default: "", description: "Extra query string fragment (no leading ?). E.g. 'start=0&count=10&filters=...'. Standard NAC params auto-added." }
      body_json:    { type: string, default: "", description: "JSON body for POST/PUT (string-encoded; will be sent as application/json). Leave empty for GET/DELETE — Forge will not send a body." }
    request:
      method: "{args.method}"
      url: "https://{args.host}:{args.port}/actions/{args.path}?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&{args.extra_query}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.body_json}"
    returns: "Whatever the NAC endpoint returns — typically { status, results, errorMessage }."

  # ─────────── Network device (switch / AP) queries ───────────

  list_devices:
    description: |
      Paginated list of Network Device records (managed switches, APs,
      controllers). Same filter syntax as list_hosts.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      filters:     { type: string, default: "" }
      start:       { type: number, default: 0 }
      count:       { type: number, default: 50 }
      sort_key:    { type: string, default: "name" }
      sort_dir:    { type: string, default: "asc" }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/device?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&start={args.start}&count={args.count}&sortKey={args.sort_key}&sortDir={args.sort_dir}&filters={args.filters}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [NetworkDevice{ id, name, ip, type, model, status, container, ... }], total }"

  count_devices:
    description: "Count of Network Device records matching the filter (or all if empty)."
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      filters:     { type: string, default: "" }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/device/count?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&filters={args.filters}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, total }"

  get_device:
    description: |
      Get a Network Device record (switch/AP detail) by DBID. Returns
      mgmt IP, model, firmware, ports summary, container assignment, etc.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      id:          { type: string, required: true, description: "Network Device DBID." }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/device/{args.id}?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [NetworkDevice] }"

  list_device_ports:
    description: |
      Summary of all Ports on a specific Network Device (or list of
      devices). Useful for diagnosing "host on wrong port" bugs.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      device_id:   { type: string, required: true, description: "Network Device DBID (or comma-separated list of DBIDs)." }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/device/port/by-device?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&devID={args.device_id}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [Port{ id, name, status, vlan, connectedHost, ... }] }"

  get_port:
    description: "Get a Port record by DBID — current VLAN, connected host, admin/oper status."
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      id:          { type: string, required: true, description: "Port record DBID." }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/device/port/{args.id}?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [Port] }"

  list_port_changes_for_port:
    description: |
      Port Change events for a specific port — VLAN changes, link state,
      enforcement actions. Primary evidence source for Mantis bugs about
      ports flapping or VLANs not landing.
    protocol: http
    parameters:
      host:         { type: string, required: true }
      port:         { type: number, default: 8443 }
      jsessionid:   { type: string, required: true }
      session_key:  { type: string, required: true }
      port_id:      { type: string, required: true, description: "Port record DBID." }
      date_start:   { type: number, description: "Unix ms epoch — only include changes after this time." }
      date_end:     { type: number, description: "Unix ms epoch — only include changes before this time." }
      date_last_x:  { type: number, description: "Alternative: only include changes from the last N seconds." }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/device/port-changes/for-port?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&portID={args.port_id}&dateStart={args.date_start}&dateEnd={args.date_end}&dateLastX={args.date_last_x}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [PortChange{ timestamp, type, oldValue, newValue, vlan, ... }] }"

  # ─────────── Destructive host actions ───────────
  # All require destructive: true so the LLM gets a confirm prompt.
  # NAC POSTs are application/x-www-form-urlencoded.

  enable_host_by_mac:
    description: |
      Re-enable a previously-disabled Host (by MAC). Sets the host's
      'enabled' state back to true so NAC stops blocking it.
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      mac:         { type: string, required: true, description: "MAC address (AA:BB:CC:DD:EE:FF)." }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/host/enable-by-mac?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
      body_form:
        mac: "{args.mac}"
    returns: "{ status, errorMessage }"

  disable_host_by_mac:
    description: |
      Disable a Host (by MAC). NAC will block/quarantine it on next
      network event. Useful for "kick a misbehaving device" verification.
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      mac:         { type: string, required: true, description: "MAC address." }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/host/disable-by-mac?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
      body_form:
        mac: "{args.mac}"
    returns: "{ status, errorMessage }"

  set_host_role:
    description: |
      Change the role assignment for one or more Host records. The role
      drives which Access Policy NAC applies. Use to verify a fix
      changes policy as expected.

      `host_ids` is a CSV of Host DBIDs (NOT MACs — look up first via
      get_host_by_mac).
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      host_ids:    { type: string, required: true, description: "CSV of Host record DBIDs, e.g. '1462264256688154' or '1234,5678'." }
      role:        { type: string, required: true, description: "Role name to assign (e.g. 'NAC-Default', 'Quarantine'). Use list_access_policies / get_host_policy to discover available roles." }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/host/set-role?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
      body_form:
        id: "{args.host_ids}"
        role: "{args.role}"
    returns: "{ status, errorMessage }"

  rescan_host_with_profile:
    description: |
      Force NAC to re-scan a Host with a particular Device Profiling
      Rule (script profile). Use to verify a profiling rule fix re-
      categorises a previously-misclassified device.
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      id:          { type: string, required: true, description: "Host record DBID." }
      profile_id:  { type: string, required: true, description: "Device Profiling Rule DBID. List via call_api path='host/device-profiling-rule/simple'." }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/host/{args.id}/rescan-with-profile?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
      body_form:
        profileID: "{args.profile_id}"
    returns: "{ status, errorMessage }"

  validate_dpc_host:
    description: |
      Force a re-validation of the device profile for one or more
      Dynamic Profile Clients. NAC re-runs profiling rules against the
      device's current attributes.

      Use after applying a profiling-rule fix to verify the device now
      lands in the right Type.
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      ids:         { type: string, required: true, description: "CSV of DynamicClient DBIDs." }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/host/dpc-hosts-table/validate?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&ids={args.ids}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, errorMessage }"

  # ─────────── Network ops (destructive) ───────────

  set_port_properties:
    description: |
      Set administration properties on a switch port — VLAN, admin
      state (enable/disable), uplink mode, description, label, notes,
      etc. The workhorse for "fix the port's VLAN" Mantis bugs.

      `properties_json` is the full PortPropertiesRequest payload.
      Minimum useful shape (look up the current port first via get_port
      to see what NOT to overwrite):
        {"id": <port_dbid>, "currentVlan": "10", "desc": "QA-VLAN"}
      Common fields:
        id          (required, port DBID)
        currentVlan (string VLAN id)
        adminStatus ("up" | "down")
        uplinkMode  (0=normal, 1=uplink)
        desc        free-text description
        label       short tag
        note        operator note
    destructive: true
    protocol: http
    parameters:
      host:           { type: string, required: true }
      port:           { type: number, default: 8443 }
      jsessionid:     { type: string, required: true }
      session_key:    { type: string, required: true }
      properties_json: { type: string, required: true, description: "JSON-encoded PortPropertiesRequest. Must include `id`. See tool description for common fields." }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/device/port/properties?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.properties_json}"
    returns: "{ status, errorMessage }"

  start_l3_scan:
    description: |
      Start an L3 scan — NAC probes the network from L3 sources to
      discover endpoints by IP. Useful after a routing / VLAN config
      change to confirm devices reappear on the expected segment.

      Long-running. Use call_api 'device/l3scan/status' to poll.
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/device/l3scan/start?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, errorMessage }"

  stop_l3_scan:
    description: "Stop an in-progress L3 scan."
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/device/l3scan/stop?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, errorMessage }"

  start_device_discovery:
    description: |
      Start device discovery — NAC reaches into one or more IP ranges
      (or specific seed IPs) and registers anything that responds as a
      Network Device, adding it to the specified Container. Use to
      onboard new switches after rack-install Mantis tickets.

      `discovery_data_json` is a JSON ARRAY of DiscoveryData objects.
      Each entry has:
        { "containerName": "MyContainer",
          "ipRanges": ["10.1.1.0/24", "10.2.0.1-10.2.0.50"],
          "seeds":    ["192.168.1.1"],          # optional, specific IPs
          "snmpRead": "public", "snmpWrite": "public",
          ... other discovery params }
      Most users only need containerName + ipRanges. SNMP creds come
      from NAC's saved settings if omitted.
    destructive: true
    protocol: http
    parameters:
      host:                  { type: string, required: true }
      port:                  { type: number, default: 8443 }
      jsessionid:            { type: string, required: true }
      session_key:           { type: string, required: true }
      discovery_data_json:   { type: string, required: true, description: "JSON ARRAY of DiscoveryData. See tool description for shape." }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/device/discovery/discover?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.discovery_data_json}"
    returns: "{ status, errorMessage }"

  stop_device_discovery:
    description: "Stop discovery for one container (by name)."
    destructive: true
    protocol: http
    parameters:
      host:           { type: string, required: true }
      port:           { type: number, default: 8443 }
      jsessionid:     { type: string, required: true }
      session_key:    { type: string, required: true }
      container_name: { type: string, required: true, description: "Container name (the same one start_device_discovery was launched with)." }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/device/discovery/discover/stop?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
      body_form:
        containerName: "{args.container_name}"
    returns: "{ status, errorMessage }"

  # ─────────── Access Policy management (destructive) ───────────
  # Policies are evaluated in rank order (1 = highest). Each policy
  # matches based on its Access Configuration (groups, time, location)
  # and routes the host to a specific network access profile.
  # Use list_access_policies (read tool, v0.6) to discover ids + ranks.

  enable_access_policy:
    description: "Enable an Access Policy so it participates in evaluation. Disabled policies are skipped."
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      id:          { type: string, required: true, description: "Access Policy DBID." }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/policy/access/{args.id}/enable?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, errorMessage }"

  disable_access_policy:
    description: "Disable an Access Policy so it is skipped during evaluation."
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      id:          { type: string, required: true, description: "Access Policy DBID." }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/policy/access/{args.id}/disable?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, errorMessage }"

  swap_access_policy_rank:
    description: |
      Swap the rank positions of two Access Policies. Policies are
      evaluated in rank order so this changes precedence. Less
      disruptive than set_access_policy_rank because it only touches
      two policies (no cascading shift).
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      id1:         { type: string, required: true, description: "First Access Policy DBID." }
      id2:         { type: string, required: true, description: "Second Access Policy DBID." }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/policy/access/rank/swap?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
      body_form:
        id1: "{args.id1}"
        id2: "{args.id2}"
    returns: "{ status, errorMessage }"

  set_access_policy_rank:
    description: |
      Set the absolute rank of an Access Policy. Other policies'
      ranks shift to make room. Riskier than swap_access_policy_rank —
      use only when you're inserting a NEW policy at a specific spot.
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      id:          { type: string, required: true, description: "Access Policy DBID." }
      rank:        { type: number, required: true, description: "Target rank (1 = highest precedence)." }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/policy/access/rank/set?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
      body_form:
        id: "{args.id}"
        rank: "{args.rank}"
    returns: "{ status, errorMessage }"

  update_access_policy:
    description: |
      Create or update an Access Policy. POST shape is the full
      AccessPolicy schema (JSON). If `id` field is present and matches
      an existing record, NAC updates; otherwise creates new.

      `policy_json` is the full AccessPolicy payload — read the
      existing policy first via call_api path='policy/access/{id}' so
      you don't drop fields you didn't mean to change.
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      policy_json: { type: string, required: true, description: "Full AccessPolicy JSON (include all fields you want preserved — this is a replace, not a merge)." }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/policy/access?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.policy_json}"
    returns: "{ status, errorMessage, results: [AccessPolicy] }"

  delete_access_policy:
    description: |
      Delete an Access Policy by DBID. Fails if the policy is in use.
      Highly destructive — prefer disable_access_policy unless you're
      sure no host has been routed through it recently.
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      id:          { type: string, required: true, description: "Access Policy DBID." }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/policy/access/{args.id}/delete?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, errorMessage }"

  # ─────────── User records ───────────

  list_users:
    description: |
      Paginated list of User records (the User table — separate from
      Host records). Same filter syntax as list_hosts.

      Filter examples:
        filters=userID==jsmith
        filters=role==NAC-Default
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      filters:     { type: string, default: "" }
      start:       { type: number, default: 0 }
      count:       { type: number, default: 50 }
      sort_key:    { type: string, default: "userID" }
      sort_dir:    { type: string, default: "asc" }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/user?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&start={args.start}&count={args.count}&sortKey={args.sort_key}&sortDir={args.sort_dir}&filters={args.filters}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [User{ id, userID, firstName, lastName, role, email, ... }], total }"

  get_user:
    description: "Get a User record by DBID — full profile + role + last-activity timestamps."
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      id:          { type: string, required: true, description: "User record DBID. Use list_users to find one if you only have a userID name." }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/user/{args.id}?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [User] }"

  get_user_policy:
    description: |
      Which policy(ies) apply to a User. Mirror of get_host_policy but
      for the user side. Useful for "wrong access policy for this user"
      Mantis bugs.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      id:          { type: string, required: true, description: "User record DBID." }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/user/{args.id}/policy?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: { accessPolicy, authPolicy, ... } }"

  search_user_directory:
    description: |
      Look up a user in the upstream directory (LDAP / AD / Azure AD)
      by name fragment. Returns directory attributes — NOT the NAC
      User record. Use to map "the user the bug mentions" → directory
      info before checking get_user.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      search:      { type: string, required: true, description: "Name fragment (first name, last name, or userID)." }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/user/search-user?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&search={args.search}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [DirectoryUser{ userID, displayName, mail, distinguishedName, ... }] }"

  # ─────────── System status ───────────

  get_cluster_info:
    description: |
      All servers in the local NAC cluster (Control/Application/NCM).
      Shows server role, status, IP, hostname. Use to confirm HA
      topology after a config change.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      nac_servers: { type: boolean, default: true, description: "Include NAC application servers." }
      ncm_servers: { type: boolean, default: false, description: "Include NCM (Network Configuration Manager) servers." }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/system/local-properties/cluster?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&nacServers={args.nac_servers}&ncmServers={args.ncm_servers}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [Server{ name, ip, role, status, ... }] }"

  get_software_details:
    description: "Running version, build, FortiNAC product variant, kernel — what's on the box right now."
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/system/local-properties/software-details?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: { version, build, productVariant, ... } }"

  get_hardware_status:
    description: |
      Hardware health + performance — CPU, memory, disk, temperature,
      power, etc. Use to check whether a Mantis bug correlates with
      resource exhaustion.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/system/local-properties/hardware?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: { cpu, memory, disk, temperature, ... } }"

  get_license_info:
    description: "License entitlements + usage — concurrent count, expiration, features enabled."
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/system/local-properties/license?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: { licensedHosts, usedHosts, expiration, features: [...] } }"

  get_high_availability:
    description: "Currently configured HA settings — primary/secondary roles, sync status."
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/system/high-availability?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: { mode, primary, secondary, sync, ... } }"

  list_background_tasks:
    description: |
      All background tasks for the current user (long-running scans,
      backups, profiling sweeps). Useful for "is NAC still processing
      X?" debug after triggering an action.
    protocol: http
    parameters:
      host:                  { type: string, required: true }
      port:                  { type: number, default: 8443 }
      jsessionid:            { type: string, required: true }
      session_key:           { type: string, required: true }
      include_assigner:      { type: boolean, default: true }
      include_descendants:   { type: boolean, default: false }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/system/background-task/current-user?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&includeAssigner={args.include_assigner}&includeDescendants={args.include_descendants}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [BackgroundTask{ id, name, status, progress, startTime, ... }] }"

  list_groups:
    description: |
      Group records (host groups, port groups, user groups, device
      groups). Filter by element class via `filters=type==<class>`.
      Use to find the group id before adding hosts / ports / users.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      filters:     { type: string, default: "" }
      start:       { type: number, default: 0 }
      count:       { type: number, default: 100 }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/system/group?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&start={args.start}&count={args.count}&filters={args.filters}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [Group{ id, name, type, memberCount, ... }], total }"

  # ─────────── Integration (LDAP / AAA) ───────────

  list_ldap_directories:
    description: |
      All configured LDAP/AD directory connections. Use to confirm a
      directory binding is healthy when Mantis bug mentions auth failing
      for users from a specific domain.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/settings/authentication/ldap/directories?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [LdapDirectory{ name, host, port, baseDN, bindDN, enabled, ... }] }"

  list_aaa_servers:
    description: |
      All configured AAA (RADIUS / TACACS) servers. Use to confirm
      AAA endpoints reachable when bug mentions RADIUS-based auth
      issues.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      filters:     { type: string, default: "" }
      start:       { type: number, default: 0 }
      count:       { type: number, default: 50 }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/settings/integration/aaa?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&start={args.start}&count={args.count}&filters={args.filters}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [AaaServer{ name, host, port, protocol, enabled, ... }], total }"

  # ─────────── Integration (MDM / SAML / syslog / email / SNMP / ...) ───────────

  list_mdm_servers:
    description: |
      All configured MDM (Mobile Device Management) servers — Intune,
      Workspace ONE, JAMF, etc. Use to verify MDM integration is on
      when bug mentions a managed mobile device.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      filters:     { type: string, default: "" }
      start:       { type: number, default: 0 }
      count:       { type: number, default: 50 }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/settings/integration/mdm?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&start={args.start}&count={args.count}&filters={args.filters}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [MdmServer{ id, name, type, host, enabled, ... }] }"

  list_saml_connectors:
    description: |
      All SAML SSO IdP connectors. Use to confirm SAML federation is
      on when bug mentions a user failing SSO into the captive portal.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/settings/integration/saml-sso?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [SamlConnector{ id, name, entityId, ssoUrl, enabled, ... }] }"

  list_syslog_parsers:
    description: |
      All syslog parser configurations — third-party security tools
      that pipe events into NAC. Useful for bugs about "NAC didn't see
      the alarm from <tool>".
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      filters:     { type: string, default: "" }
      start:       { type: number, default: 0 }
      count:       { type: number, default: 50 }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/settings/integration/syslog?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&start={args.start}&count={args.count}&filters={args.filters}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [SyslogParser{ id, name, sourceIP, pattern, ... }] }"

  list_vulnerability_scanners:
    description: |
      Configured vulnerability scanner integrations (Qualys, Tenable,
      Rapid7…). Use when a Mantis bug ties to a vuln-driven quarantine
      action.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      filters:     { type: string, default: "" }
      start:       { type: number, default: 0 }
      count:       { type: number, default: 50 }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/settings/integration/vulnerability-scanner?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&start={args.start}&count={args.count}&filters={args.filters}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [VulnScanner{ id, name, type, host, enabled, ... }] }"

  list_firewall_tags:
    description: |
      Firewall Tag records — labels NAC pushes to integrated firewalls
      (FortiGate, etc.) to drive policy on their side. Useful for
      bugs about "FortiGate isn't seeing the tag NAC should have sent".
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      filters:     { type: string, default: "" }
      start:       { type: number, default: 0 }
      count:       { type: number, default: 50 }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/settings/integration/firewall-tag?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER=&start={args.start}&count={args.count}&filters={args.filters}"
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [FirewallTag{ id, name, color, ... }] }"

  get_email_settings:
    description: "Currently configured email/SMTP server (host, port, from-address, TLS). No password (use call_api for /email/password if needed)."
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/settings/integration/email?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: { smtpHost, smtpPort, fromAddr, useTls, ... } }"

  get_fsso_settings:
    description: "Fortinet Single Sign-On (FSSO) server settings — used when NAC participates in FortiGate's FSSO domain."
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/settings/integration/FSSO?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: { server, port, secret, enabled, ... } }"

  get_snmp_settings:
    description: "Global SNMP settings used to poll managed switches (version, community/credentials)."
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/settings/integration/SNMP?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: { version, community, authUser, ... } }"

  get_proxy_settings:
    description: "Outbound HTTP proxy NAC uses for external calls (license server, FortiGuard, etc.)."
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/settings/integration/proxy?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: { host, port, user, enabled, ... } }"

  get_recent_syslog_messages:
    description: |
      Most recent syslog messages NAC has received (source IP +
      payload pairs). Live debug: confirm a third-party tool actually
      reached NAC's syslog listener when a bug says "NAC didn't react
      to the upstream alarm".
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/actions/settings/integration/security-event-parser/recent-syslog?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, results: [{ sourceIP, message, timestamp, ... }] }"

  # ─────────── Group writes (destructive) ───────────

  add_devices_to_group:
    description: |
      Add one or more Network Devices to a Device group. The group's
      members table gets the new entries; existing members are unchanged.

      For HOST / PORT / USER groups, use call_api with path
      'system/group/add-members' and the right `type` byte (host=1,
      port=2, user=0, device=3 — discover via list_groups response
      `type` field if unsure).
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      group_id:    { type: string, required: true, description: "Group record DBID." }
      device_ids:  { type: string, required: true, description: "Comma-separated Network Device DBIDs, e.g. '1234' or '1234,5678'." }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/system/group/{args.group_id}/add-devices?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
      body_form:
        deviceList: "{args.device_ids}"
    returns: "{ status, errorMessage }"

  remove_devices_from_group:
    description: |
      Remove one or more Network Devices from a Device group. Other
      members untouched. Same caveat as add_devices_to_group for
      HOST / PORT / USER groups — use call_api with 'remove-members'.
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      group_id:    { type: string, required: true, description: "Group record DBID." }
      device_ids:  { type: string, required: true, description: "Comma-separated Network Device DBIDs." }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/system/group/{args.group_id}/remove-devices?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
      body_form:
        deviceList: "{args.device_ids}"
    returns: "{ status, errorMessage }"

  copy_group:
    description: |
      Create a copy of an existing group with a new name. Useful for
      "duplicate the prod group and edit the copy" pattern when testing
      group-membership-driven policy changes.
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      id:          { type: string, required: true, description: "Source group DBID." }
      name:        { type: string, required: true, description: "Name for the new copy. Must be unique within the same group type." }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/system/group/copy?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
      body_form:
        id: "{args.id}"
        name: "{args.name}"
    returns: "{ status, errorMessage, results: [Group] }"

  update_group:
    description: |
      Update an existing group's metadata (name, description, access
      policy id, aging settings, etc). Replaces the GroupDto record —
      read the existing group first via list_groups so you don't drop
      fields by omission.
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      id:          { type: string, required: true, description: "Group record DBID." }
      group_json:  { type: string, required: true, description: "Full GroupDto JSON. Common fields: name, description, accessPolicy (int), daysValid, daysInactive. Read existing first to preserve fields you don't mean to change." }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/system/group/{args.id}?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.group_json}"
    returns: "{ status, errorMessage, results: [Group] }"

  delete_group:
    description: |
      Delete a group by DBID. Fails if the group is referenced by an
      Access Policy, Authentication Config, or has active members
      tied to policy evaluation. Highly destructive — preferred path
      is to remove members first, then delete.
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8443 }
      jsessionid:  { type: string, required: true }
      session_key: { type: string, required: true }
      id:          { type: string, required: true, description: "Group record DBID." }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/actions/system/group/{args.id}/delete?resetUserTimeout=false&APIDEBUG=false&NAC_SERVER="
      headers:
        Cookie: "JSESSIONID={args.jsessionid}"
        Authorization: "{args.session_key}"
        Accept: "application/json"
    returns: "{ status, errorMessage }"
