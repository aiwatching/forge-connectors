id: jenkins
name: Jenkins
icon: 🔧
version: "0.2.2"
author: forge
category: connector
mode: server-side

# Home Kanban card (read by Forge's kanban seeder, ignored by the loader).
kanban:
  cards:
    - title: "Jenkins — build status"
      icon: "⚙️"
      period_sec: 900
      mode: task
      prompt: |
        Show Jenkins jobs that are CURRENTLY BUILDING, plus the latest status
        of recently-active jobs.

        # === Editable variables (change the values; keep the names) ===
        JOBS        = []   # only these job names (substring match), e.g. ["nightly","release-7.6"]; [] = all
        FOLDER_PATH = ""   # Jenkins folder path if jobs live in a team folder; "" = root
        # =============================================================

        Get data with mcp__forge__call_connector: plugin_id='jenkins',
        tool='list_jobs', args={folder_path: <the FOLDER_PATH value>} (default
        instance). If JOBS is non-empty, KEEP ONLY jobs whose name contains one
        of the JOBS entries (case-insensitive); [] = all jobs. The `color`
        field: a "_anime" suffix = building now; blue=SUCCESS, red=FAILURE,
        yellow=UNSTABLE, grey/disabled. Set accent "blue". Be terse.
        - callout: amber "N jobs building" if any *_anime; red "N failing" if any red.
        - metric_row: building / failing / passing.
        - list (cap ~10, BUILDING first, then failing): text=job name,
          sub=last result, badge 'BUILD'(gray) / 'FAIL'(red) / 'UNSTABLE'(amber)
          / 'PASS'(green), link to the job url.

# Jenkins appliances often ship a self-signed TLS cert — skip cert verification.
http:
  verify_tls: false
description: |
  Jenkins REST API connector — trigger builds, monitor status, fetch
  console logs and artifacts; read job configs, views and credential ids;
  create folders, views and jobs, update job config, enable/disable jobs
  (writes need approved: true; dry_run previews). All requests run inside
  Forge (no browser tab needed), so the API token never reaches the caller.

  Supports folder-nested jobs via slash-separated `job/` paths:
    job_path: "job/team-x/job/deploy-app"

  Supports multiple Jenkins servers in one install via
  `settings.instances` — refer to one by `instance: "prod"` when calling
  a tool, defaults to the first.

catalog_summary: |
  Jenkins REST API (server-side, API token auth, multi-instance).
  Trigger parameterized builds, poll build status, fetch console logs
  and artifacts, list jobs. Read config.xml, views, plugins, credential ids;
  check_access shows what the account may create. Create folder / view /
  job, update config, enable / disable (approved: true, dry_run). No deletes.
  Folder-nested job paths supported. Pass
  `instance: "prod"` to pick which Jenkins server when multiple configured.

settings:
  instances:
    type: instances
    label: Jenkins instances
    description: |
      Add one row per Jenkins server. Reference one from any tool by
      passing `instance: "<name>"`; the first entry is the default.
      Get an api_token at <base_url>/user/<your-username>/configure →
      "API Token" → Add new Token → Generate.
    required: true
    fields:
      name:
        type: string
        label: Name
        required: true
        description: "Short identifier (e.g. prod, staging, autotest)."
      base_url:
        type: string
        label: Base URL
        required: true
        description: "e.g. https://jenkins.company.com (no trailing slash)."
      username:
        type: string
        label: Username
        required: true
      api_token:
        type: secret
        label: API token
        required: true
      default_job_path:
        type: string
        label: Default job_path
        required: false
        description: |
          Used by trigger_build / get_job / etc. when the LLM omits
          `job_path`. Example for Fortinet:
            job/fortinac-build-7.6-token
          Leave empty to require an explicit job_path on every call.
      inject_params:
        type: instances
        label: "Auto-inject build params"
        description: |
          Each row = one extra Jenkins build parameter Forge auto-adds
          to every trigger_build on this instance. Typical use: a
          credential (GitLab PAT, SSH key, etc.) that some Jenkins
          jobs take as a build parameter. The LLM never sees these
          values; Forge merges them into the form body server-side.
          Leave empty if your jobs don't need extra params.
        fields:
          name:
            type: string
            label: "Param name"
            required: true
            description: "Exactly as the Jenkins job expects (e.g. TOKEN_PASSWORD, TOKEN_USER, GITLAB_PAT)."
          value:
            type: string
            label: "Value"
            required: true
            description: |
              Plain string. Use a cross-connector reference for credentials
              you already hold elsewhere — e.g. `{connector:gitlab.token}`
              (resolved at request time, never re-typed here) or
              `{secret:scope.path}`. Hard-coded raw tokens are accepted
              but stored AS-IS (no encryption — this field is a literal
              passthrough by design).

auth:
  type: basic
  username: '{settings.username}'
  password: '{settings.api_token}'

test:
  description: "GET /api/json — verifies the first instance's base_url + credentials."
  request:
    method: GET
    url: "{settings.base_url}/api/json?tree=mode,nodeName,numExecutors"
  ok_template: "Connected · mode={{mode}} · node={{nodeName}} · executors={{numExecutors}}"
  timeout_ms: 15000

tools:
  list_jobs:
    description: |
      List jobs at the Jenkins root, or inside a folder. Returns each
      child's name, color (build status), _class, and url.

      Colors: blue = last build SUCCESS, red = FAILURE, yellow = UNSTABLE,
      aborted = ABORTED, notbuilt = never built, *_anime = currently building.
      _class `...Folder` means this entry is a folder you can drill into.
    protocol: http
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      folder_path:
        type: string
        url_encoding: none
        description: |
          Optional folder path. Empty = root. For folders use the
          pre-formatted "job/" notation: "job/team-x", "job/team-x/job/sub".
        default: ""
    request:
      method: GET
      url: '{settings.base_url}/{args.folder_path}/api/json?tree=jobs[name,color,_class,url]'
    returns: "{ jobs: [ { name, color, _class, url } ] }"

  get_job:
    description: |
      Fetch a single job's metadata: description, buildable, color,
      lastBuild, lastSuccessfulBuild, healthReport. Use this to find
      the most recent build number before fetching its console.
    protocol: http
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      job_path:
        type: string
        required: true
        url_encoding: none
        description: |
          Full job path with "job/" prefixes:
            "job/deploy-app"
            "job/team-x/job/deploy-app"
    request:
      method: GET
      url: '{settings.base_url}/{args.job_path}/api/json'
    returns: "{ name, description, buildable, color, lastBuild, lastSuccessfulBuild, healthReport, ... }"

  get_job_params:
    description: |
      Fetch the parameter definitions for a job. Use this BEFORE
      `trigger_build` so you know which params the job accepts, their
      types (StringParameterDefinition, BooleanParameterDefinition,
      ChoiceParameterDefinition, ...), and their default values.
    protocol: http
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      job_path:
        type: string
        required: true
        url_encoding: none
        description: 'Full job path with "job/" prefixes.'
    request:
      method: GET
      url: '{settings.base_url}/{args.job_path}/api/json?tree=property[parameterDefinitions[name,type,description,defaultParameterValue[value],choices]]'
    returns: |
      { property: [ { parameterDefinitions: [
        { name, type, description, defaultParameterValue: { value }, choices? }
      ] } ] }

  get_next_build_number:
    description: |
      Get the build number Jenkins will assign to the next triggered
      build. Useful so you can predict the build # before calling
      `trigger_build`, then poll `get_build` on that number.
    protocol: http
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      job_path:
        type: string
        required: true
        url_encoding: none
        description: 'Full job path with "job/" prefixes.'
    request:
      method: GET
      url: '{settings.base_url}/{args.job_path}/api/json?tree=nextBuildNumber'
    returns: '{ nextBuildNumber: number }'

  trigger_build:
    description: |
      Trigger a job build. Supply `params` as an object of build-parameter
      key/values (use `get_job_params` first to know what keys the job
      accepts). Jenkins responds 201 with an empty body — the actual
      build number isn't returned.

      `job_path` is optional — if the selected instance has
      `default_job_path` configured, Forge uses it when you omit the
      arg. So "build the default job" works without spelling out the
      path; pass an explicit path to override.

      To track the build:
        1. call `get_next_build_number` BEFORE this to learn the # that
           will be assigned, then poll `get_build` on that number, OR
        2. call `get_queue` after to find the queue item, then follow
           `executable.number` once Jenkins assigns one.

      AUTO-INJECTED PARAMS — DO NOT INCLUDE IN `params`:
      The selected instance may have `inject_params` configured (a list
      of {name, value} pairs in connector settings — typically
      credentials like GITLAB_PAT / TOKEN_PASSWORD / TOKEN_USER that
      the Jenkins job takes as build parameters). Forge merges all of
      them into the form body server-side. You don't know what's
      configured and don't need to — pass only the build-specific
      params (BRANCH, ENV, etc.); the credentials show up
      automatically.
    protocol: http
    destructive: true
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      job_path:
        type: string
        required: false
        url_encoding: none
        description: |
          Full job path with "job/" prefixes (e.g. "job/deploy-app").
          Omit to use the instance's `default_job_path` if set.
      params:
        type: json
        description: |
          Flat object of build parameters, e.g.:
            { "BRANCH": "main", "ENV": "staging", "DEPLOY": true }
          Keys must match the job's parameterDefinitions.
        default: {}
    request:
      method: POST
      url: '{settings.base_url}/{args.job_path}/buildWithParameters'
      body_form: '{args.params}'
      # Server-side inject: if the selected instance has gitlab_pat set,
      # Forge merges GITLAB_PAT into the form body. LLM never sees the
      # value; if gitlab_pat is empty, the key is dropped entirely.
      # Inject every row of the selected instance's `inject_params`
      # list as a form key/value pair. User configures the param names
      # + values once per instance (in the connector settings UI); LLM
      # never sees the values. Drop rows whose name or value is empty.
      body_form_inject_from: 'inject_params'
    returns: 'HTTP 201 Created (empty body — use get_queue or get_build to track)'

  get_queue:
    description: |
      List items currently waiting in the Jenkins build queue. Useful
      right after `trigger_build` to find your queued item — match by
      `task.url` or `task.name`. Once `executable` is populated the
      build has started and `executable.number` is its build number.
    protocol: http
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
    request:
      method: GET
      url: '{settings.base_url}/queue/api/json?tree=items[id,inQueueSince,why,stuck,blocked,buildable,task[name,url],executable[number,url]]'
    returns: '{ items: [ { id, why, task: { name, url }, executable?: { number } } ] }'

  get_queue_item:
    description: |
      Fetch a single queue item by id. Returns the same shape as get_queue
      entries — check `executable.number` to learn the build number once
      Jenkins assigns it.
    protocol: http
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      queue_id:
        type: number
        required: true
        description: 'Queue item id from get_queue.'
    request:
      method: GET
      url: '{settings.base_url}/queue/item/{args.queue_id}/api/json'
    returns: '{ id, why, task: { name, url }, executable?: { number, url } }'

  get_build:
    description: |
      Fetch a build's status. `building: true` = still running, `false`
      = finished and `result` is one of SUCCESS / FAILURE / UNSTABLE /
      ABORTED. Also returns duration, estimatedDuration, timestamp.
    protocol: http
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      job_path:
        type: string
        required: true
        url_encoding: none
        description: 'Full job path with "job/" prefixes.'
      build_number:
        type: number
        required: true
        description: 'Build number (or use "lastBuild" / "lastSuccessfulBuild" string aliases).'
    request:
      method: GET
      url: '{settings.base_url}/{args.job_path}/{args.build_number}/api/json'
    returns: '{ id, number, building, result, duration, estimatedDuration, timestamp, url, ... }'

  get_console:
    description: |
      Fetch the console (stdout+stderr) of a build. Plain-text response.
      The full log can be very large — pass `start` (byte offset) to fetch
      only what's new since your last call (e.g. for tailing a running
      build); start=0 returns the whole log.
    protocol: http
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      job_path:
        type: string
        required: true
        url_encoding: none
        description: 'Full job path with "job/" prefixes.'
      build_number:
        type: number
        required: true
        description: 'Build number to fetch console output for.'
      start:
        type: number
        description: 'Byte offset to start from. Default 0 (whole log).'
        default: 0
    request:
      method: GET
      url: '{settings.base_url}/{args.job_path}/{args.build_number}/logText/progressiveText?start={args.start}'
    returns: 'Plain text log. Response headers X-Text-Size + X-More-Data carry tailing info but Forge only surfaces the body.'

  list_artifacts:
    description: |
      List the artifact files produced by a build. Each entry has
      `fileName` (basename) and `relativePath` (use as `artifact_path`
      for `get_artifact`).
    protocol: http
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      job_path:
        type: string
        required: true
        url_encoding: none
        description: 'Full job path with "job/" prefixes.'
      build_number:
        type: number
        required: true
        description: 'Build number.'
    request:
      method: GET
      url: '{settings.base_url}/{args.job_path}/{args.build_number}/api/json?tree=artifacts[fileName,relativePath,displayPath]'
    returns: '{ artifacts: [ { fileName, relativePath, displayPath } ] }'

  get_artifact:
    description: |
      Download an artifact file's content. Path is the `relativePath`
      from `list_artifacts`. Returns the raw file body (truncated to
      8KB by Forge — large binaries should be fetched elsewhere).
    protocol: http
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      job_path:
        type: string
        required: true
        url_encoding: none
        description: 'Full job path with "job/" prefixes.'
      build_number:
        type: number
        required: true
        description: 'Build number.'
      artifact_path:
        type: string
        required: true
        url_encoding: path_segments
        description: |
          relativePath from list_artifacts. Segments URL-encoded
          individually; nested paths like "reports/test/results.xml"
          stay traversable.
    request:
      method: GET
      url: '{settings.base_url}/{args.job_path}/{args.build_number}/artifact/{args.artifact_path}'
    returns: 'Raw artifact bytes (text-safe truncation 8KB).'

  stop_build:
    description: |
      Stop a running build. Jenkins replies 302 (redirect to job page).
      No-op if the build already finished.
    protocol: http
    destructive: true
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      job_path:
        type: string
        required: true
        url_encoding: none
        description: 'Full job path with "job/" prefixes.'
      build_number:
        type: number
        required: true
        description: 'Build number to stop.'
    request:
      method: POST
      url: '{settings.base_url}/{args.job_path}/{args.build_number}/stop'
    returns: 'Empty body (302 Found on success).'

  # ── Read: job config, views, plugins, credentials, identity ──

  whoami:
    description: |
      Which Jenkins account the configured API token belongs to, and its authorities.
    protocol: http
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
    request:
      method: GET
      url: '{settings.base_url}/whoAmI/api/json'
    returns: '{ name, authenticated, anonymous, authorities: [] }'

  get_job_config:
    description: |
      Raw config.xml of a job or folder. Read it before update_job_config, or copy an existing job as a template for create_job.
    protocol: http
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      job_path:
        type: string
        required: true
        url_encoding: none
        description: 'Full job path with "job/" prefixes, e.g. "job/team-x/job/deploy-app".'
    request:
      method: GET
      url: '{settings.base_url}/{args.job_path}/config.xml'
    returns: 'Raw XML.'

  list_views:
    description: |
      List the views at the root, or inside a folder.
    protocol: http
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      folder_path:
        type: string
        url_encoding: none
        description: 'Optional folder in "job/" notation ("job/team-x"). Empty = root.'
        default: ""
    request:
      method: GET
      url: '{settings.base_url}/{args.folder_path}/api/json?tree=views[name,url,_class]'
    returns: '{ views: [ { name, url, _class } ] }'

  get_view:
    description: |
      A view's description and the jobs in it.
    protocol: http
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      name:
        type: string
        required: true
        description: 'View name, e.g. "Prelude".'
      folder_path:
        type: string
        url_encoding: none
        description: 'Optional folder in "job/" notation ("job/team-x"). Empty = root.'
        default: ""
    request:
      method: GET
      url: '{settings.base_url}/{args.folder_path}/view/{args.name}/api/json?tree=name,description,url,jobs[name,url,color]'
    returns: '{ name, description, url, jobs: [ { name, url, color } ] }'

  list_plugins:
    description: |
      Installed plugins with version and active flag (the whole list; filter it yourself).
      Needs Overall/Administer; without it Jenkins answers 403, so use check_access instead.
      Useful checks: cloudbees-folder (folders), workflow-aggregator (Pipeline), pipeline-utility-steps (readYaml/readJSON),
      email-ext, credentials-binding, git, docker-workflow.
    protocol: http
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
    request:
      method: GET
      url: '{settings.base_url}/pluginManager/api/json?tree=plugins[shortName,version,active,enabled]'
    returns: '{ plugins: [ { shortName, version, active, enabled } ] }'

  list_credentials:
    description: |
      Credential ids, descriptions and types in a credential store. Never returns secret values.
      Root (global) store by default; for a folder pass folder_path and store "folder".
    protocol: http
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      folder_path:
        type: string
        url_encoding: none
        description: 'Optional folder in "job/" notation ("job/team-x"). Empty = root.'
        default: ""
      store:
        type: string
        description: '"system" for the root store, "folder" for a folder store.'
        default: system
    request:
      method: GET
      url: '{settings.base_url}/{args.folder_path}/credentials/store/{args.store}/domain/_/api/json?tree=credentials[id,description,typeName,displayName]'
    returns: '{ credentials: [ { id, description, typeName, displayName } ] }'

  get_pending_script_approvals:
    description: |
      In-process script approval page (Manage Jenkins > In-process Script Approval): pending scripts and signatures.
      Read-only. Needs admin rights; Jenkins has no JSON API for it, so this returns the page HTML.
    protocol: http
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
    request:
      method: GET
      url: '{settings.base_url}/manage/scriptApproval/'
    returns: 'HTML page; pending items are under "pending" sections.'

  # ── Write: every tool needs approved: true (or dry_run: true to preview). Runs server-side; the token stays in Forge. No delete tools. ──

  create_view:
    description: |
      Create a list view (optionally in a folder), set its description, and add jobs to it.
      Refuses if the view already exists. Use when the Folders plugin is missing or a lightweight grouping is enough.
    protocol: shell
    destructive: true
    timeout_ms: 60000
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      name:
        type: string
        required: true
        description: 'View name.'
      description:
        type: string
        description: 'Optional view description.'
      jobs:
        type: json
        description: 'Optional list of job names to add, e.g. ["release-freeze-guard"].'
      folder:
        type: string
        description: 'Optional parent folder, "team-x" or "job/team-x". Empty = Jenkins root.'
        default: ""
      approved:
        type: boolean
        description: 'Must be true to send. Set it only after the user has confirmed this exact change.'
        default: false
      dry_run:
        type: boolean
        description: 'Preview: run the read-only checks and return the planned requests without sending them.'
        default: false
    command:
      - node
      - -e
      - &jenkins_write_js |
        const E = process.env;
        const v = (k) => { const s = E[k]; return s == null || /^\{(args|settings)\./.test(s) ? '' : s.trim(); };
        const out = (o) => console.log(JSON.stringify(o, null, 2));
        const fail = (error, extra) => { out({ ok: false, error, ...extra }); process.exit(1); };
        const base = v('J_BASE').replace(/\/+$/, '');
        const auth = 'Basic ' + Buffer.from(v('J_USER') + ':' + E.J_TOKEN).toString('base64');
        const action = v('J_ACTION');
        const approved = v('J_APPROVED') === 'true';
        const dryRun = v('J_DRY_RUN') === 'true';
        if (!base) fail('instance has no base_url');
        // Accepts "job/a/job/b" as-is, or "a/b" and turns it into job/a/job/b.
        const jp = (s) => !s ? '' : s.startsWith('job/') ? s.replace(/\/+$/, '') : s.split('/').filter(Boolean).map((x) => 'job/' + encodeURIComponent(x)).join('/');
        const pre = (p) => (p ? '/' + p : '');
        let crumb = null;
        async function http(method, path, { body, ctype } = {}) {
          const headers = { Authorization: auth };
          if (ctype) headers['Content-Type'] = ctype;
          if (method !== 'GET' && crumb) Object.assign(headers, crumb);
          const r = await fetch(base + path, { method, headers, body, redirect: 'manual' });
          return { status: r.status, text: await r.text(), headers: r.headers };
        }
        async function exists(path) { const r = await http('GET', path + '/api/json?tree=name'); if (r.status === 401 || r.status === 403) fail('auth failed (' + r.status + ') on ' + path); return r.status === 200; }
        // API-token auth is exempt from CSRF on current Jenkins; send a crumb anyway when the issuer offers one.
        async function getCrumb() {
          const r = await http('GET', '/crumbIssuer/api/json');
          if (r.status !== 200) return;
          const j = JSON.parse(r.text);
          crumb = { [j.crumbRequestField]: j.crumb };
          const ck = r.headers.get('set-cookie');
          if (ck) crumb.Cookie = ck.split(';')[0];
        }
        const form = (o) => new URLSearchParams(o).toString();
        // Item types offered on New Item (the page loads them from itemCategories): the non-admin way to tell which job-type plugins are installed.
        async function itemTypes(folder) {
          // The default view is "all" at the root but "All" in a folder; ask for its real name.
          const pv = await http('GET', pre(folder) + '/api/json?tree=primaryView[name]');
          const vn = (pv.status === 200 && (JSON.parse(pv.text).primaryView || {}).name) || 'all';
          const r = await http('GET', pre(folder) + '/view/' + encodeURIComponent(vn) + '/itemCategories?depth=3');
          if (r.status !== 200) return { status: r.status, types: [] };
          const types = [];
          for (const c of JSON.parse(r.text).categories || []) for (const it of c.items || []) types.push(it.class);
          return { status: 200, types };
        }
        async function checkAccess(folder) {
          const res = {};
          const who = await http('GET', '/whoAmI/api/json');
          if (who.status === 200) { const j = JSON.parse(who.text); res.user = j.name; res.authorities = j.authorities; }
          const root = await http('GET', pre(folder) + '/');
          res.jenkins_version = root.headers.get('x-jenkins') || undefined;
          res.root_links = { newJob: /href="[^"]*newJob"/.test(root.text), newView: /href="[^"]*newView"/.test(root.text), manage: /href="\/manage\/?"/.test(root.text) };
          const nj = await itemTypes(folder);
          res.can_create_item = nj.status === 200;
          res.item_types = nj.types;
          res.has_folder_type = nj.types.some((t) => /folder/i.test(t));
          res.has_pipeline_type = nj.types.some((t) => /workflow|pipeline/i.test(t));
          const nv = await http('GET', pre(folder) + '/newView');
          res.can_create_view = nv.status === 200;
          if (nv.status !== 200) res.new_view_status = nv.status;
          const pl = await http('GET', '/pluginManager/api/json?tree=plugins[shortName,version,active]');
          if (pl.status === 200) {
            const want = ['cloudbees-folder', 'workflow-aggregator', 'workflow-job', 'pipeline-utility-steps', 'email-ext', 'credentials-binding', 'git', 'docker-workflow'];
            const all = JSON.parse(pl.text).plugins;
            res.plugins = Object.fromEntries(want.map((w) => { const x = all.find((q) => q.shortName === w); return [w, x ? x.version + (x.active ? '' : ' (inactive)') : null]; }));
          } else {
            res.plugins = 'plugin list needs Overall/Administer (HTTP ' + pl.status + ')';
            const steps = await http('GET', '/pipeline-syntax/html');
            if (steps.status === 200) {
              const want = { readYaml: 'pipeline-utility-steps', readJSON: 'pipeline-utility-steps', readTrusted: 'workflow-multibranch', emailext: 'email-ext', withCredentials: 'credentials-binding', git: 'git', withDockerContainer: 'docker-workflow' };
              res.pipeline_steps = Object.fromEntries(Object.entries(want).map(([w, plugin]) => [w + ' (' + plugin + ')', new RegExp('\\b' + w + '\\b').test(steps.text)]));
            } else res.pipeline_steps = 'pipeline-syntax page HTTP ' + steps.status;
          }
          return res;
        }

        const FORM = 'application/x-www-form-urlencoded';
        async function main() {
          const steps = []; const info = {};
          const name = v('J_NAME'), folder = jp(v('J_FOLDER')), job = jp(v('J_JOB_PATH')), view = v('J_VIEW'), desc = v('J_DESCRIPTION');
          const xml = E.J_CONFIG_XML && !/^\{args\./.test(E.J_CONFIG_XML) ? E.J_CONFIG_XML : '';
          const need = (val, n) => { if (!val) fail(n + ' is required'); };
          const viewBase = (f, vw) => pre(f) + '/view/' + encodeURIComponent(vw);
          switch (action) {
            case 'create_view': {
              need(name, 'name');
              if (await exists(viewBase(folder, name))) fail('view already exists: ' + name);
              const nv = await http('GET', pre(folder) + '/newView');
              if (nv.status !== 200) fail('cannot create views here (HTTP ' + nv.status + ' on newView): missing View/Create permission; use create_folder instead');
              const mode = 'hudson.model.ListView';
              steps.push({ method: 'POST', path: pre(folder) + '/createView', ctype: FORM, body: form({ name, mode, json: JSON.stringify({ name, mode }) }) });
              if (desc) steps.push({ method: 'POST', path: viewBase(folder, name) + '/submitDescription', ctype: FORM, body: form({ description: desc }) });
              let jobs = [];
              try { jobs = JSON.parse(v('J_JOBS') || '[]'); } catch { jobs = v('J_JOBS').split(',').map((s) => s.trim()).filter(Boolean); }
              for (const j of jobs) steps.push({ method: 'POST', path: viewBase(folder, name) + '/addJobToView?name=' + encodeURIComponent(j) });
              break;
            }
            case 'add_job_to_view': case 'remove_job_from_view': {
              need(view, 'view'); need(v('J_JOB'), 'job');
              if (!(await exists(viewBase(folder, view)))) fail('view not found: ' + view);
              steps.push({ method: 'POST', path: viewBase(folder, view) + (action === 'add_job_to_view' ? '/addJobToView' : '/removeJobFromView') + '?name=' + encodeURIComponent(v('J_JOB')) });
              break;
            }
            case 'create_folder': {
              need(name, 'name');
              const nj = await itemTypes(folder);
              if (nj.status !== 200) fail('cannot open New Item (HTTP ' + nj.status + '): missing Item/Create permission here?');
              if (!nj.types.some((t) => /folder/i.test(t))) fail('the Folder item type is not offered (cloudbees-folder plugin missing?); use create_view instead', { item_types: nj.types });
              if (await exists(pre(folder) + '/job/' + encodeURIComponent(name))) fail('item already exists: ' + name);
              const mode = 'com.cloudbees.hudson.plugins.folder.Folder';
              steps.push({ method: 'POST', path: pre(folder) + '/createItem', ctype: FORM, body: form({ name, mode, from: '', json: JSON.stringify({ name, mode, from: '' }) }) });
              if (desc) steps.push({ method: 'POST', path: pre(folder) + '/job/' + encodeURIComponent(name) + '/submitDescription', ctype: FORM, body: form({ description: desc }) });
              break;
            }
            case 'create_job': {
              need(name, 'name'); need(xml, 'config_xml');
              if (!xml.trimStart().startsWith('<')) fail('config_xml must be the job XML');
              if (folder && !(await exists(pre(folder)))) {
                if (!dryRun) fail('folder not found: ' + folder);
                info.warning = 'folder ' + folder + ' does not exist yet; create it before sending';
              } else if (!info.warning) {
                const nj = await itemTypes(folder);
                if (nj.status !== 200) fail('cannot open New Item (HTTP ' + nj.status + '): missing Item/Create permission here?');
              }
              if (!info.warning && await exists(pre(folder) + '/job/' + encodeURIComponent(name))) fail('job already exists, refusing to overwrite: ' + name + ' (use update_job_config)');
              steps.push({ method: 'POST', path: pre(folder) + '/createItem?name=' + encodeURIComponent(name), ctype: 'application/xml', body: xml });
              break;
            }
            case 'update_job_config': {
              need(job, 'job_path'); need(xml, 'config_xml');
              if (!xml.trimStart().startsWith('<')) fail('config_xml must be the job XML');
              const old = await http('GET', '/' + job + '/config.xml');
              if (old.status !== 200) fail('cannot read current config (' + old.status + '): ' + job);
              if (!dryRun && approved) {
                const fs = require('fs'), path = require('path'), os = require('os');
                const dir = path.join(E.FORGE_DATA_DIR || path.join(os.homedir(), '.forge', 'data'), 'jenkins-backups');
                fs.mkdirSync(dir, { recursive: true });
                info.backup_file = path.join(dir, job.replace(/[^A-Za-z0-9._-]+/g, '_') + '-' + new Date().toISOString().replace(/[:.]/g, '-') + '.xml');
                fs.writeFileSync(info.backup_file, old.text);
              }
              info.old_config_xml = old.text.length <= 5000 ? old.text : old.text.slice(0, 5000) + '\n...(truncated; full copy in backup_file)';
              steps.push({ method: 'POST', path: '/' + job + '/config.xml', ctype: 'application/xml', body: xml });
              break;
            }
            case 'enable_job': case 'disable_job': {
              need(job, 'job_path');
              if (!(await exists('/' + job))) fail('job not found: ' + job);
              steps.push({ method: 'POST', path: '/' + job + (action === 'enable_job' ? '/enable' : '/disable') });
              break;
            }
            case 'check_access': return out({ ok: true, ...(await checkAccess(folder)) });
            default: fail('unknown action: ' + action);
          }
          const plan = steps.map((s) => ({ method: s.method, url: base + s.path, body: s.body && s.body.length > 300 ? s.body.slice(0, 300) + '...' : s.body }));
          if (dryRun) return out({ ok: true, dry_run: true, action, plan, ...info });
          if (!approved) fail('not sent: pass approved: true after the user confirms (or dry_run: true to preview)', { action, plan });
          await getCrumb();
          const results = [];
          for (const s of steps) {
            const r = await http(s.method, s.path, { body: s.body, ctype: s.ctype });
            const ok = r.status >= 200 && r.status < 400;
            results.push({ method: s.method, path: s.path, status: r.status, ...(ok ? {} : { error: r.text.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').slice(0, 400) }) });
            if (!ok) fail('step failed with HTTP ' + r.status, { action, results, ...info });
          }
          out({ ok: true, action, results, ...info });
        }
        main().catch((e) => fail(String(e && e.message || e) + (e && e.cause ? ' (' + (e.cause.code || e.cause.message) + ')' : '')));
    env:
      J_BASE: '{settings.base_url}'
      J_USER: '{settings.username}'
      J_TOKEN: '{settings.api_token}'
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
      NODE_NO_WARNINGS: '1'
      J_APPROVED: '{args.approved}'
      J_DRY_RUN: '{args.dry_run}'
      J_ACTION: create_view
      J_NAME: '{args.name}'
      J_DESCRIPTION: '{args.description}'
      J_JOBS: '{args.jobs}'
      J_FOLDER: '{args.folder}'
    returns: '{ ok, action, results | plan }'

  add_job_to_view:
    description: |
      Add an existing job to a view.
    protocol: shell
    destructive: true
    timeout_ms: 60000
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      view:
        type: string
        required: true
        description: 'View name.'
      job:
        type: string
        required: true
        description: 'Job name (relative to the view''s folder).'
      folder:
        type: string
        description: 'Optional parent folder, "team-x" or "job/team-x". Empty = Jenkins root.'
        default: ""
      approved:
        type: boolean
        description: 'Must be true to send. Set it only after the user has confirmed this exact change.'
        default: false
      dry_run:
        type: boolean
        description: 'Preview: run the read-only checks and return the planned requests without sending them.'
        default: false
    command: [node, -e, *jenkins_write_js]
    env:
      J_BASE: '{settings.base_url}'
      J_USER: '{settings.username}'
      J_TOKEN: '{settings.api_token}'
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
      NODE_NO_WARNINGS: '1'
      J_APPROVED: '{args.approved}'
      J_DRY_RUN: '{args.dry_run}'
      J_ACTION: add_job_to_view
      J_VIEW: '{args.view}'
      J_JOB: '{args.job}'
      J_FOLDER: '{args.folder}'
    returns: '{ ok, action, results | plan }'

  remove_job_from_view:
    description: |
      Remove a job from a view (the job itself is untouched).
    protocol: shell
    destructive: true
    timeout_ms: 60000
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      view:
        type: string
        required: true
        description: 'View name.'
      job:
        type: string
        required: true
        description: 'Job name.'
      folder:
        type: string
        description: 'Optional parent folder, "team-x" or "job/team-x". Empty = Jenkins root.'
        default: ""
      approved:
        type: boolean
        description: 'Must be true to send. Set it only after the user has confirmed this exact change.'
        default: false
      dry_run:
        type: boolean
        description: 'Preview: run the read-only checks and return the planned requests without sending them.'
        default: false
    command: [node, -e, *jenkins_write_js]
    env:
      J_BASE: '{settings.base_url}'
      J_USER: '{settings.username}'
      J_TOKEN: '{settings.api_token}'
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
      NODE_NO_WARNINGS: '1'
      J_APPROVED: '{args.approved}'
      J_DRY_RUN: '{args.dry_run}'
      J_ACTION: remove_job_from_view
      J_VIEW: '{args.view}'
      J_JOB: '{args.job}'
      J_FOLDER: '{args.folder}'
    returns: '{ ok, action, results | plan }'

  create_folder:
    description: |
      Create a folder (needs the cloudbees-folder plugin; returns a clear error if it is missing).
      Refuses if an item with that name already exists.
    protocol: shell
    destructive: true
    timeout_ms: 60000
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      name:
        type: string
        required: true
        description: 'Folder name.'
      description:
        type: string
        description: 'Optional folder description.'
      folder:
        type: string
        description: 'Optional parent folder for a nested folder, "team-x" or "job/team-x". Empty = Jenkins root.'
        default: ""
      approved:
        type: boolean
        description: 'Must be true to send. Set it only after the user has confirmed this exact change.'
        default: false
      dry_run:
        type: boolean
        description: 'Preview: run the read-only checks and return the planned requests without sending them.'
        default: false
    command: [node, -e, *jenkins_write_js]
    env:
      J_BASE: '{settings.base_url}'
      J_USER: '{settings.username}'
      J_TOKEN: '{settings.api_token}'
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
      NODE_NO_WARNINGS: '1'
      J_APPROVED: '{args.approved}'
      J_DRY_RUN: '{args.dry_run}'
      J_ACTION: create_folder
      J_NAME: '{args.name}'
      J_DESCRIPTION: '{args.description}'
      J_FOLDER: '{args.folder}'
    returns: '{ ok, action, results | plan }'

  create_job:
    description: |
      Create a job from its config.xml (Pipeline, freestyle, ...), at the root or in a folder.
      Refuses to overwrite an existing job; use update_job_config for that. To create a job disabled,
      put <disabled>true</disabled> in the XML.
    protocol: shell
    destructive: true
    timeout_ms: 60000
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      name:
        type: string
        required: true
        description: 'Job name.'
      config_xml:
        type: string
        required: true
        description: 'Complete job config.xml.'
      folder:
        type: string
        description: 'Optional parent folder, "team-x" or "job/team-x". Empty = Jenkins root.'
        default: ""
      approved:
        type: boolean
        description: 'Must be true to send. Set it only after the user has confirmed this exact change.'
        default: false
      dry_run:
        type: boolean
        description: 'Preview: run the read-only checks and return the planned requests without sending them.'
        default: false
    command: [node, -e, *jenkins_write_js]
    env:
      J_BASE: '{settings.base_url}'
      J_USER: '{settings.username}'
      J_TOKEN: '{settings.api_token}'
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
      NODE_NO_WARNINGS: '1'
      J_APPROVED: '{args.approved}'
      J_DRY_RUN: '{args.dry_run}'
      J_ACTION: create_job
      J_NAME: '{args.name}'
      J_CONFIG_XML: '{args.config_xml}'
      J_FOLDER: '{args.folder}'
    returns: '{ ok, action, results | plan }'

  update_job_config:
    description: |
      Replace a job's config.xml. The old XML is returned in the result (old_config_xml) and saved
      under <forge data>/jenkins-backups/ before the change is sent.
    protocol: shell
    destructive: true
    timeout_ms: 60000
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      job_path:
        type: string
        required: true
        description: 'Job path, "job/team-x/job/deploy-app" or "team-x/deploy-app".'
      config_xml:
        type: string
        required: true
        description: 'Complete new config.xml.'
      approved:
        type: boolean
        description: 'Must be true to send. Set it only after the user has confirmed this exact change.'
        default: false
      dry_run:
        type: boolean
        description: 'Preview: run the read-only checks and return the planned requests without sending them.'
        default: false
    command: [node, -e, *jenkins_write_js]
    env:
      J_BASE: '{settings.base_url}'
      J_USER: '{settings.username}'
      J_TOKEN: '{settings.api_token}'
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
      NODE_NO_WARNINGS: '1'
      J_APPROVED: '{args.approved}'
      J_DRY_RUN: '{args.dry_run}'
      J_ACTION: update_job_config
      J_JOB_PATH: '{args.job_path}'
      J_CONFIG_XML: '{args.config_xml}'
    returns: '{ ok, action, results | plan, old_config_xml, backup_file }'

  enable_job:
