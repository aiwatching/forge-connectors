  check_access:
    description: |
      Read-only. What the configured account can do here, without admin rights: user, Jenkins version,
      whether it can create items and views (at the root or in a folder), the item types offered on
      New Item (Folder? Pipeline?), and installed plugins (only with Overall/Administer; otherwise the
      Pipeline steps available: readYaml, readJSON, emailext, withCredentials, git, docker). Run it before
      create_view / create_folder / create_job.
    protocol: shell
    timeout_ms: 60000
    parameters:
      instance:
        type: string
        description: 'Instance name from settings.instances. Defaults to the first.'
      folder:
        type: string
        description: 'Optional folder to check instead of the root, "team-x" or "job/team-x".'
        default: ""
    command: [node, -e, *jenkins_write_js]
    env:
      J_BASE: '{settings.base_url}'
      J_USER: '{settings.username}'
      J_TOKEN: '{settings.api_token}'
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
      NODE_NO_WARNINGS: '1'
      J_ACTION: check_access
      J_FOLDER: '{args.folder}'
    returns: '{ ok, user, can_create_item, can_create_view, item_types, has_folder_type, has_pipeline_type, plugins | pipeline_steps }'
