      host:    { type: string, required: true }
      port:    { type: number, default: 8889 }
      token:   { type: string, required: true }
      adom_id: { type: string, default: "1" }
      id:      { type: string, required: true, description: "Network device id." }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/api/v3/network-device/{args.id}"
      headers:
        Authorization: "{args.token}"
        AdomId: "{args.adom_id}"
