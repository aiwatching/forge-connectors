id: fortincm
name: FortiNCM Device
icon: 🌐
version: "0.3.1"
author: forge
category: connector
mode: server-side
min_forge_version: "0.10.24"
description: |
  Direct management of a FortiNCM (Network Configuration Manager)
  appliance — Fortinet's centralised manager for fleets of FortiNAC
  instances. SSH/CLI plus REST API, one connector, one set of
  credentials.

  Connection: every tool takes `host` (the NCM mgmt IP — supply it per
  call, NOT stored in the connector). Username/password come from
  connector settings so one install can drive many NCMs that share
  admin credentials. REST tools always hit port 443; SSH tools take
  a `port` arg with the connector default (22).

  CLI tools (protocol: ssh, via PTY) — for OS-level ops:
    - upgrade: `execute restore image scp …` with auto-y/N and reboot.
    - get_version: read running version/build.
    - run_command: arbitrary CLI command.
    - reboot: `execute reboot`.

  REST tools (protocol: http) — for structured queries against the
  v3 mgmt API at /api/v3/*. Default mgmt HTTPS port is 443
  (live-verified against 10.15.50.60).

  Auth model (v0.3 — fully automatic):
    Forge's connector-level `bearer-token-exchange` auth handles the
    JWT lifecycle silently. On the first REST call per (host, creds)
    Forge POSTs settings.username/password to
    `https://{host}/api/v3/auth/login`, extracts `result.jwt`, caches
    it for ~9 min, and injects `Authorization: <jwt>` (bare, no Bearer
    prefix — NCM rejects Bearer with 500) on every subsequent request.
    JWT TTL is 600s on the server; we refresh at 540s.

    LLMs/pipelines: just call any REST tool with `host` and the params
    it actually needs. No more `login`/`token` plumbing. AdomId still
    has to be supplied per-call where required — see `adom_id` param.

settings:
  port:
    type: string
    label: Default SSH port
    description: "Fallback SSH port when a call doesn't pass one. Default 22."
    default: "22"
  username:
    type: string
    label: Default username
    description: "REST + fallback SSH user. FortiNCM default is admin."
    default: "admin"
  password:
    type: secret
    label: Default password
    description: "REST + fallback SSH password (encrypted at rest, never logged). Used for the auto JWT exchange and as the SSH default."

# Connector-wide auto-auth: Forge exchanges username/password for a
# JWT once per (host, creds), caches for ~9 min (NCM TTL is 10 min),
# and injects `Authorization: <jwt>` on every REST tool below.
# Tools no longer take a `token` arg — the LLM never sees the JWT.
auth:
  type: bearer-token-exchange
  exchange_url: "https://{args.host}/api/v3/auth/login"
  exchange_method: POST
  exchange_body:
    username: "{settings.username}"
    password: "{settings.password}"
  bearer_path: result.jwt
  bearer_format: bare        # NCM rejects "Bearer <jwt>" with 500
  expires_ttl_sec: 540       # 9 min, 1 min safety margin on the 10 min TTL

# Connector-level HTTP runtime knobs. NCM ships a self-signed cert so
# Node fetch's default cert verify fails. Turn it off — alternative is
# importing NCM's cert into the OS trust store on every Forge install.
http:
  verify_tls: false

tools:

  # ─────────── upgrade (destructive) ───────────
  upgrade:
    description: |
      Upgrade the FortiNCM firmware by restoring an image over SCP, the
      same flow you run by hand:
        execute restore image scp <image_path> <scp_host> <scp_user> <scp_pass>
      The tool SSHes in, sends that command, auto-answers the (y/N)
      confirmations (including the signature-validation warning for dev
      builds), and streams the restore until the image is written
      ("Done installing image"). The appliance then REBOOTS on its own
      (~3-5 min) and comes back on the new build — verify with
      get_version afterwards (compare build number).

      Returns from_version / to_version / target_build, and `rebooted`
      ONLY if the box auto-rebooted (same inconsistency as FortiNAC's
      restore — sometimes it reboots itself, sometimes it just prints
      "Please reboot").

      IMPORTANT — after a successful upgrade, check captured.rebooted:
        • present  → it rebooted itself; the registered watch will
          confirm the new build. Done.
        • ABSENT   → image is written but NOT yet running. You MUST call
          `reboot` (same host) to switch to the new build, otherwise the
          device stays on the old version and the watch times out.
    destructive: true
    protocol: ssh
    parameters:
      host:
        type: string
        required: true
        description: "NCM management IP/hostname to upgrade, e.g. 10.15.50.60."
      port:
        type: string
        description: "SSH port. Omit to use the connector default (22)."
      username:
        type: string
        description: "SSH user. Omit to use the connector default (admin)."
      password:
        type: string
        description: "SSH password. Omit to use the connector's saved default (preferred — avoids putting the password in chat)."
      image_path:
        type: string
        required: true
        description: "Absolute path of the .out image ON the scp source server, e.g. /var/lib/jenkins/jobs/fortincm-build-8.0-token/builds/17/archive/FNCM_ESX-v8-build0123-FORTINET.out"
      scp_host:
        type: string
        default: "10.15.33.5"
        description: "SCP source server holding the image (the jenkins build host)."
      scp_user:
        type: string
        default: "jenkins"
        description: "SCP username."
      scp_pass:
        type: string
        default: "fortinet"
        description: "SCP password."
    ssh:
      prompt_regex: "#[ \\t]*$"
      commands:
        - "execute restore image scp {args.image_path} {args.scp_host} {args.scp_user} {args.scp_pass}"
      auto_answer:
        - match: "\\(y/?n\\)|\\(yes/no\\)|do you want to continue"
          send: "yes"
      done_when: "Done installing image|Rebooting primary server"
      fail_when: "No space left on device|Permission denied, please try again|Host key verification failed|command parse error|Unknown action|Invalid value for positional|^Usage: |Invalid server / port value"
      capture:
        from_version: "from version ([0-9][0-9.]+)"
        to_version: "to version ([0-9][0-9.]+)"
        target_build: "build([0-9]+)"
        rebooted: "(Rebooting primary server|system is going down for reboot)"
      timeout_sec: 240
    async:
      poll: get_version
      poll_args:
        host: "{args.host}"
        port: "{args.port}"
        username: "{args.username}"
      done_match:
        path: captured.build
        equals: "{result.captured.target_build}"
      interval_sec: 60
      timeout_sec: 900
      max_polls: 15
      on_done:
        mode: chat
        message: "NCM {args.host} upgrade confirmed — now running build {poll.captured.build} ({poll.captured.version})."
      on_fail:
        mode: chat
        message: "NCM {args.host} did not reach the target build in time — please verify manually (fortincm.get_version). If the image was written but the box never rebooted, run fortincm.reboot."
      progress:
        show: true
        message: "Upgrading NCM {args.host}… poll {poll_count}/{max_polls}, current build {poll.captured.build}"

  # ─────────── get_version ───────────
  get_version:
    description: |
      Read the running FortiNCM version via `get system status`. Returns
      the full version string, the numeric build, firmware signature and
      hostname. Use to confirm an upgrade landed: poll until `build`
      matches the target — the device is unreachable for a few minutes
      mid-reboot, so expect connection errors until it's up.
    protocol: ssh
    parameters:
      host:
        type: string
        required: true
        description: "NCM management IP/hostname, e.g. 10.15.50.60."
      port:
        type: string
        description: "SSH port. Omit to use the connector default (22)."
      username:
        type: string
        description: "SSH user. Omit to use the connector default (admin)."
      password:
        type: string
        description: "SSH password. Omit to use the connector's saved default."
    ssh:
      prompt_regex: "#[ \\t]*$"
      commands:
        - "get system status"
        - "exit"
      done_when: "Version:\\s*FortiN(?:AC|CM)[^\\n]*build[0-9]+"
      capture:
        version: "Version:\\s*(FortiN(?:AC|CM)[^\\r\\n]+)"
        build: "build([0-9]+)"
        signature: "Firmware Signature:\\s*([^\\r\\n]+)"
        hostname: "Hostname:\\s*([^\\r\\n]+)"
      success_on_close: true
      timeout_sec: 45

  # ─────────── run_command ───────────
  run_command:
    description: |
      Run a single FortiNCM CLI command and capture its output, e.g.
      'get system ha', 'get system interface', 'diagnose ...'. For the
      firmware version use get_version. For upgrades use upgrade (this
      tool does NOT auto-answer (y/N) prompts).
    protocol: ssh
    parameters:
      host:
        type: string
        required: true
        description: "NCM management IP/hostname."
      port:
        type: string
        description: "SSH port. Omit to use the connector default (22)."
      username:
        type: string
        description: "SSH user. Omit to use the connector default (admin)."
      password:
        type: string
        description: "SSH password. Omit to use the connector's saved default."
      command:
        type: string
        required: true
        description: "The CLI command to run (e.g. 'get system status')."
    ssh:
      prompt_regex: "#[ \\t]*$"
      commands:
        - "{args.command}"
        - "exit"
      success_on_close: true
      timeout_sec: 60

  # ─────────── reboot (destructive) ───────────
  reboot:
    description: |
      Reboot a FortiNCM appliance — `execute reboot` (auto-answers the
      y/n confirm). The SSH connection drops as the box goes down; that
      is treated as success.

      Primary use: finish an `upgrade` whose image was written but which
      did NOT auto-reboot (upgrade's result has no `captured.rebooted`).
      After this reboot the device boots the new build, and any pending
      upgrade watch will confirm it. ~3-5 min to come back.
    destructive: true
    protocol: ssh
    parameters:
      host:
        type: string
        required: true
        description: "NCM management IP/hostname to reboot."
      port:
        type: string
        description: "SSH port. Omit to use the connector default (22)."
      username:
        type: string
        description: "SSH user. Omit to use the connector default (admin)."
      password:
        type: string
        description: "SSH password. Omit to use the connector's saved default."
    ssh:
      prompt_regex: "#[ \\t]*$"
      commands:
        - "execute reboot"
      auto_answer:
        - match: "\\(y/?n\\)|\\(yes/no\\)|do you want to continue|reboot the system"
          send: "yes"
      done_when: "system is going down for reboot|Rebooting|Restarting system|going down"
      fail_when: "Permission denied|command parse error|Unknown action"
      success_on_close: true
      timeout_sec: 60

  # ═══════════════════════════════════════════════════════════
  # REST tools (protocol: http) — live-verified against NCM v8.0
  # All REST endpoints live at https://{host}/api/v3/* (port 443).
  # The Authorization header is injected by Forge's connector-level
  # auth (bearer-token-exchange). Tools just declare path + params.
  # AdomId header only on endpoints the spec marks as requiring it.
  # Root ADOM id is the long integer returned by login.result.adoms[]
  # — e.g. 330201025894400 on 10.15.50.60.
  # ═══════════════════════════════════════════════════════════

  get_current_user:
    description: |
      Identify which admin the auto-fetched JWT belongs to — returns
      admin profile, role, ADOM scope. Useful as an auth/sanity probe
      after configuring credentials (no params needed beyond host).
    protocol: http
    parameters:
      host: { type: string, required: true, description: "NCM mgmt IP/hostname." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/auth/getCurrentUser"
      headers:
        Accept: "application/json"
    returns: "{ result: { admin: { id, username, firstName, lastName, ... }, profile, role, adoms, ... } }"

  list_user_tokens:
    description: "Active sessions / API tokens for the current admin. Includes the JWT Forge just exchanged."
    protocol: http
    parameters:
      host: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}/api/v3/auth/tokens"
      headers:
        Accept: "application/json"
    returns: "{ result: { accessTokenCount, accessTokens: [{ createdAt, expireTime, ttlMinutes, ... }] } }"

  # ─────────── NCM Basic Information ───────────

  get_ncm_version:
    description: "FortiNCM software version (live returns just the major.minor string, e.g. '8.0'). Read-only, no AdomId."
    protocol: http
    parameters:
      host: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}/api/v3/version"
      headers:
        Accept: "application/json"
    returns: "string — version line, e.g. '8.0'"

  get_ncm_serial:
    description: "FortiNCM serial number (e.g. 'FNVX-MTM25000621'). Read-only, no AdomId."
    protocol: http
    parameters:
      host: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}/api/v3/serialNo"
      headers:
        Accept: "application/json"
    returns: "string — serial number"

  # ─────────── NCM Cluster ───────────
  # All cluster endpoints sit at /api/v3/ncm/cluster/* and DO NOT
  # require AdomId (cluster scope is global).

  get_cluster_nodes:
    description: |
      List all nodes in the local NCM cluster. Each entry has serial,
      nodeType (LEADER/WORKER/STANDALONE), nodeStatus, mgmt IP. Use to
      confirm HA topology and find the leader before issuing
      leader-only ops. Standalone installs return a single STANDALONE
      node.
    protocol: http
    parameters:
      host: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}/api/v3/ncm/cluster/nodes"
      headers:
        Accept: "application/json"
    returns: "{ result: [{ serialNumber, nodeName, nodeType, nodeStatus, ipAddress, appliance, vmPlatform, managedCampusCount, ... }] }"

  get_cluster_node:
    description: "Detail for one cluster node by its serial number."
    protocol: http
    parameters:
      host:   { type: string, required: true }
      serial: { type: string, required: true, description: "NCM node serial number (e.g. FNVX-MTM25000621)." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/ncm/cluster/node/{args.serial}"
      headers:
        Accept: "application/json"
    returns: "{ result: NCMNodeVo }"

  get_cluster_role:
    description: "Role of THIS node — LEADER / WORKER / STANDALONE. Returns a bare string in result."
    protocol: http
    parameters:
      host: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}/api/v3/ncm/cluster/role"
      headers:
        Accept: "application/json"
    returns: "{ result: 'LEADER' | 'WORKER' | 'STANDALONE' }"

  get_cluster_capacity:
    description: "Cluster capacity / utilisation summary — remaining vs total node + campus capacity."
    protocol: http
    parameters:
      host: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}/api/v3/ncm/cluster/capacity"
      headers:
        Accept: "application/json"
    returns: "{ result: { remainingClusterNodesCapacity, totalClusterNodesCapacity, currentCampusCount, campusCapacityPerNode, totalCampusCapacityPerCluster } }"

  get_failed_ncm_count:
    description: "Count of failed/unreachable NCM nodes in the cluster. Quick health probe."
    protocol: http
    parameters:
      host: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}/api/v3/ncm/cluster/failed"
      headers:
        Accept: "application/json"
    returns: "{ result: integer }"

  change_to_leader:
    description: |
      Promote the current node to LEADER. Use only when the existing
      leader is gone and an explicit failover is needed. Triggers a
      cluster election.
    destructive: true
    protocol: http
    parameters:
      host: { type: string, required: true }
    request:
      method: POST
      url: "https://{args.host}/api/v3/ncm/cluster/change/leader"
      headers:
        Accept: "application/json"
    returns: "{ code, message, result }"

  add_cluster_worker:
    description: |
      Add a new worker NCM to the cluster. `worker_json` is the full
      AddWorkerReq payload (serial, mgmt IP, etc.).
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      worker_json: { type: string, required: true, description: "AddWorkerReq JSON body." }
    request:
      method: POST
      url: "https://{args.host}/api/v3/ncm/cluster/add"
      headers:
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.worker_json}"
    returns: "{ code, message, result }"

  delete_cluster_worker:
    description: |
      Remove a worker NCM from the cluster. `delete_request_json` is
      the DeleteWorkerRequest JSON body (usually contains the serial
      or worker id to remove). Destructive — the removed node loses
      cluster membership.
    destructive: true
    protocol: http
    parameters:
      host:                  { type: string, required: true }
      delete_request_json:   { type: string, required: true, description: "DeleteWorkerRequest JSON body." }
    request:
      method: DELETE
      url: "https://{args.host}/api/v3/ncm/cluster/delete"
      headers:
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.delete_request_json}"
    returns: "{ code, message, result }"

  # ─────────── Firmware Upgrade (REST surface) ───────────
  # The REST upgrade endpoints drive the GUI's "push firmware to
  # managed Campuses/NCMs" flow. For the LOCAL appliance upgrade
  # over SSH/SCP, use the `upgrade` SSH tool instead.
  # None of these need AdomId per the spec.

  list_local_firmware_images:
    description: |
      List firmware images that have been uploaded LOCALLY to NCM.
      `image_type` is the bucket — CAMPUS / NCM / ADAPTER / etc.
      Empty array means no images uploaded for that bucket.
    protocol: http
    parameters:
      host:       { type: string, required: true }
      image_type: { type: string, required: true, description: "Image-type bucket, e.g. 'CAMPUS' | 'NCM' | 'ADAPTER'." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/firmware/local-images/{args.image_type}"
      headers:
        Accept: "application/json"
    returns: "{ result: [FirmwareImage{ id, name, version, uploadedAt, size, ... }] }"

  list_fortiguard_firmware:
    description: |
      List firmware images available from FortiGuard for the managed
      product lines. Returns `current` + branch/major/build info — use
      to discover image ids before downloading.
    protocol: http
    parameters:
      host: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}/api/v3/firmware/fg-images"
      headers:
        Accept: "application/json"
    returns: "{ result: { current: { name, version, major, minor, patch, build, releaseType, notes, ... }, ... } }"

  list_firmware_image_used_by:
    description: "Which Campuses / NCMs are currently running a given image — pre-flight check before deletion."
    protocol: http
    parameters:
      host:     { type: string, required: true }
      image_id: { type: string, required: true, description: "Local firmware image id." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/firmware/local-images/used-by/{args.image_id}"
      headers:
        Accept: "application/json"
    returns: "{ result: [{ campusId, campusName, deviceCount, ... }] }"

  start_firmware_upgrade:
    description: |
      Push firmware to one or more managed Campuses or to NCM cluster
      nodes. `upgrade_request_json` is the full FirmwareUpgradeRequest
      payload — targets[], imageId, scheduleAt, etc.

      Long-running. Poll status with get_firmware_upgrade_status.
    destructive: true
    protocol: http
    parameters:
      host:                  { type: string, required: true }
      upgrade_request_json:  { type: string, required: true, description: "Full FirmwareUpgradeRequest JSON." }
    request:
      method: POST
      url: "https://{args.host}/api/v3/firmware/upgrade"
      headers:
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.upgrade_request_json}"
    returns: "{ code, message, result: { upgradeId, status } }"

  get_firmware_upgrade_status:
    description: |
      Poll the status of an in-progress firmware upgrade started by
      start_firmware_upgrade. `status_request_json` is the
      FirmwareUpgradeStatusReq payload.
    protocol: http
    parameters:
      host:                  { type: string, required: true }
      status_request_json:   { type: string, required: true, description: "FirmwareUpgradeStatusReq JSON." }
    request:
      method: POST
      url: "https://{args.host}/api/v3/firmware/upgrade/status"
      headers:
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.status_request_json}"
    returns: "{ result: { upgradeId, overallStatus, perTarget: [{ id, status, progress, message }] } }"

  delete_firmware_images:
    description: |
      Delete one or more uploaded firmware images. `delete_request_json`
      is the DeleteImagesRequest body (usually `{"ids":[...]}`).
      Fails if any image is in use (check list_firmware_image_used_by).
    destructive: true
    protocol: http
    parameters:
      host:                  { type: string, required: true }
      delete_request_json:   { type: string, required: true, description: "DeleteImagesRequest JSON body." }
    request:
      method: DELETE
      url: "https://{args.host}/api/v3/firmware/local-images/delete"
      headers:
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.delete_request_json}"
    returns: "{ code, message, result }"

  # ─────────── ADOM management ───────────
  # ADOM list endpoints don't need AdomId; AdomAdmin endpoints do.

  list_adoms:
    description: "List all ADOMs visible to the current admin. No AdomId required. Root ADOM has `root: true`."
    protocol: http
    parameters:
      host: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}/api/v3/adoms"
      headers:
        Accept: "application/json"
    returns: "{ result: [{ id, name, description, root, campusCount, campusCapacity, ... }] }"

  get_adom:
    description: "Get one ADOM by its long-integer id."
    protocol: http
    parameters:
      host: { type: string, required: true }
      id:   { type: string, required: true, description: "ADOM id (e.g. 330201025894400 for root)." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/adoms/{args.id}"
      headers:
        Accept: "application/json"
    returns: "{ result: Adom }"

  get_root_adom:
    description: "Convenience: get the root ADOM (id, name, capacity). Useful at install/sanity time."
    protocol: http
    parameters:
      host: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}/api/v3/adoms/root"
      headers:
        Accept: "application/json"
    returns: "{ result: { id, name, isRoot, capacity, ... } }"

  list_adom_admins:
    description: |
      List AdomAdmin records (admin user → ADOM bindings) for an ADOM.
      Requires AdomId header — pass `adom_id` (default root).
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400", description: "AdomId header. Default root ADOM id (varies per install — list_adoms first)." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/adoms/admin/list"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: [AdomAdmin{ id, userId, profile, adomId, adomName, ... }] }"

  get_adom_admin:
    description: "Get one AdomAdmin by id."
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400", description: "AdomId header." }
      id:      { type: string, required: true, description: "AdomAdmin id." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/adoms/admin/{args.id}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: AdomAdmin }"

  delete_adom_admins:
    description: |
      Delete one or more AdomAdmin records. `delete_request_json` is
      the DeleteUserRequest body. Destructive.
    destructive: true
    protocol: http
    parameters:
      host:                { type: string, required: true }
      adom_id:             { type: string, default: "330201025894400" }
      delete_request_json: { type: string, required: true, description: "DeleteUserRequest JSON body." }
    request:
      method: DELETE
      url: "https://{args.host}/api/v3/adoms/admin"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.delete_request_json}"
    returns: "{ code, message }"

  # ─────────── Host (managed-fleet aggregate) ───────────
  # NCM aggregates Host records across all managed NACs. All Host
  # endpoints need AdomId. NOTE: live response shape uses `results[]`
  # (plural) not `records[]` as the spec suggests.

  list_hosts:
    description: |
      Paginated list of Host records visible in the given ADOM. Empty
      installs return `results: []`. Filter examples:
        filter=macAddress==AA:BB:CC:DD:EE:FF
        filter=hostName==linux
        filter=connected==true
    protocol: http
    parameters:
      host:           { type: string, required: true }
      adom_id:        { type: string, default: "330201025894400" }
      campus_id_list: { type: string, default: "" }
      adoms_id_list:  { type: string, default: "" }
      filter:         { type: string, default: "" }
      start:          { type: number, default: 0 }
      count:          { type: number, default: 25 }
      sort_key:       { type: string, default: "" }
      sort_dir:       { type: string, default: "asc" }
    request:
      method: GET
      url: "https://{args.host}/api/v3/host/list?campusIdList={args.campus_id_list}&adomsIdList={args.adoms_id_list}&filter={args.filter}&start={args.start}&count={args.count}&sortKey={args.sort_key}&sortDir={args.sort_dir}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ results: [HostRecordVO], total, filtered, totalPages, hasNext, pageIndex }"

  get_host:
    description: "Get a Host by id. Use list_hosts first to find the id from a MAC / IP / hostName filter."
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
      id:      { type: string, required: true, description: "Host record id." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/host/{args.id}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: HostRecordVO }"

  get_host_health:
    description: "Current compliance / health snapshot for one Host."
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
      host_id: { type: string, required: true, description: "Host record id." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/host/health/{args.host_id}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: { complianceScanStatus, lastScan, ... } }"

  get_host_health_history:
    description: "Historical health entries for a Host — when scans ran, results."
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
      host_id: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}/api/v3/host/health-history/{args.host_id}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: [HealthEntry{ timestamp, status, message, ... }] }"

  get_host_applications:
    description: |
      Installed-application list for one Host (endpoint-compliance
      evidence). Paginated — pass filter/start/count/sortKey/sortDir.
    protocol: http
    parameters:
      host:     { type: string, required: true }
      adom_id:  { type: string, default: "330201025894400" }
      host_id:  { type: string, required: true }
      filter:   { type: string, default: "" }
      start:    { type: number, default: 0 }
      count:    { type: number, default: 50 }
      sort_key: { type: string, default: "" }
      sort_dir: { type: string, default: "asc" }
    request:
      method: GET
      url: "https://{args.host}/api/v3/host/application/{args.host_id}?filter={args.filter}&start={args.start}&count={args.count}&sortKey={args.sort_key}&sortDir={args.sort_dir}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: [Application{ name, version, vendor, ... }] }"

  get_host_users:
    description: "Users currently / recently logged onto a Host."
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
      host_id: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}/api/v3/host/users/{args.host_id}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: [User{ userId, loggedOnAt, ... }] }"

  count_hosts_by_status:
    description: |
      Count Host records grouped by enabled/disabled state. Returns
      `{ DISABLED: n, ENABLED: n }`. This is the only `count_type`
      that works on live NCM v8.0 — see BROKEN-APIS.md for the others
      (OS returns empty, all other types 500). For richer breakdowns
      use list_hosts with filters.
    protocol: http
    parameters:
      host: { type: string, required: true }
    request:
      method: GET
      url: "https://{args.host}/api/v3/host/count-by-type/STATUS"
      headers:
        Accept: "application/json"
    returns: "{ result: { DISABLED: int, ENABLED: int } }"

  enable_disable_host:
    description: |
      Bulk enable / disable Host records. `payload_json` is the
      EnableDisableHostReq shape — typically
      `{"hostIds":[1,2,3], "enabled": true|false}`.
    destructive: true
    protocol: http
    parameters:
      host:         { type: string, required: true }
      adom_id:      { type: string, default: "330201025894400" }
      payload_json: { type: string, required: true, description: "EnableDisableHostReq JSON." }
    request:
      method: POST
      url: "https://{args.host}/api/v3/host/enable-disable"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.payload_json}"
    returns: "{ code, message, result }"

  rescan_host_with_profile:
    description: "Re-scan one Host against a Device Profiling rule."
    destructive: true
    protocol: http
    parameters:
      host:       { type: string, required: true }
      adom_id:    { type: string, default: "330201025894400" }
      host_id:    { type: string, required: true, description: "Host record id." }
      profile_id: { type: string, required: true, description: "Device Profiling rule id." }
    request:
      method: POST
      url: "https://{args.host}/api/v3/host/rescan-with-profile/{args.host_id}?profileID={args.profile_id}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ code, message, result }"

  delete_hosts:
    description: |
      Delete Host records. `delete_request_json` is the DeleteHostReq
      body — usually `{"hostIds":[1,2,3]}`. Highly destructive — prefer
      enable_disable_host(enabled=false) first.
    destructive: true
    protocol: http
    parameters:
      host:                { type: string, required: true }
      adom_id:             { type: string, default: "330201025894400" }
      delete_request_json: { type: string, required: true, description: "DeleteHostReq JSON body." }
    request:
      method: DELETE
      url: "https://{args.host}/api/v3/host/delete"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.delete_request_json}"
    returns: "{ code, message }"

  # ─────────── Groups ───────────

  list_groups:
    description: |
      List all groups in the ADOM. Group records are the membership
      tables that policies reference. Optional `remote=true` to
      include cross-cluster remote groups.
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
      remote:  { type: boolean, default: false, description: "Include remote groups." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/groups/group?remote={args.remote}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: [{ id, adomId, name, nameLabel, groupType, groupTypeValue, description, ... }] }"

  get_group:
    description: "Get one group by id — full membership + metadata."
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
      id:      { type: string, required: true, description: "Group id." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/groups/group/{args.id}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: GroupVo }"

  list_groups_by_type:
    description: |
      Groups filtered by `group_type` — integer per the spec.
      Common values (from live NCM): 1=DEVICE, 2=PORT, 10=ADMINISTRATOR.
      Earlier docs said this took a string — they were wrong; the
      server returns 400 for string types.
    protocol: http
    parameters:
      host:       { type: string, required: true }
      adom_id:    { type: string, default: "330201025894400" }
      group_type: { type: number, required: true, description: "Integer group type. 1=DEVICE, 2=PORT, 10=ADMINISTRATOR, etc." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/groups/group/type?groupType={args.group_type}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: [GroupVo] }"

  get_group_hierarchy:
    description: "Tree of group→subgroup membership for the ADOM."
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
    request:
      method: GET
      url: "https://{args.host}/api/v3/groups/group/tree/membership"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: [{ count, groupDto: {...}, children: [...] }] }"

  create_group:
    description: "Create a new group. `group_json` is the full GroupVo payload."
    destructive: true
    protocol: http
    parameters:
      host:       { type: string, required: true }
      adom_id:    { type: string, default: "330201025894400" }
      group_json: { type: string, required: true, description: "GroupVo JSON." }
    request:
      method: POST
      url: "https://{args.host}/api/v3/groups/group"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.group_json}"
    returns: "{ code, message, result: GroupVo }"

  update_group:
    description: "Update one group (full replace). Read get_group first to preserve fields you don't mean to drop."
    destructive: true
    protocol: http
    parameters:
      host:       { type: string, required: true }
      adom_id:    { type: string, default: "330201025894400" }
      id:         { type: string, required: true, description: "Group id." }
      group_json: { type: string, required: true, description: "Full GroupVo JSON." }
    request:
      method: PUT
      url: "https://{args.host}/api/v3/groups/group/{args.id}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.group_json}"
    returns: "{ code, message, result: GroupVo }"

  clone_group:
    description: "Clone a group with a new name. Useful for 'duplicate + edit the copy' patterns."
    destructive: true
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
      id:      { type: string, required: true, description: "Source group id." }
      name:    { type: string, required: true, description: "New group name." }
    request:
      method: POST
      url: "https://{args.host}/api/v3/groups/group/clone/{args.id}?name={args.name}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ code, message, result: GroupVo }"

  delete_groups:
    description: |
      Delete groups by id (pass CSV via `ids`). Fails if a group is
      referenced by a policy.
    destructive: true
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
      ids:     { type: string, required: true, description: "Comma-separated group ids." }
    request:
      method: DELETE
      url: "https://{args.host}/api/v3/groups/group?id={args.ids}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ code, message }"

  # ─────────── Backup / Restore ───────────
  # NOTE: live category strings are SYSTEM_BACKUP, DATABASE_BACKUP —
  # NOT SYSTEM / DB / ADOM as the spec implies. Verified on NCM v8.0.

  list_backup_files:
    description: |
      List backup files in the given category. Live-verified categories:
        SYSTEM_BACKUP     — config package tarballs
        DATABASE_BACKUP   — DB tarballs
      The categories the OpenAPI spec mentions (SYSTEM, DB, ADOM,
      CONFIGURATION) all return 400 on live NCM. AdomId is optional
      per spec.
    protocol: http
    parameters:
      host:             { type: string, required: true }
      adom_id:          { type: string, default: "330201025894400" }
      backup_category:  { type: string, required: true, description: "SYSTEM_BACKUP | DATABASE_BACKUP (live-verified). Other categories return 400." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/backup/{args.backup_category}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: [{ adomId, fileName, version }] }"

  list_remote_backup_settings:
    description: "Remote backup destinations (SCP/SFTP/etc.) and the timeout config."
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
    request:
      method: GET
      url: "https://{args.host}/api/v3/backup/remote-settings"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: { remoteTimeout, remoteSettingsDtoList: [{ id, name, host, protocol, ... }], lastModifiedTime, lastModifiedBy } }"

  backup_and_clean:
    description: |
      Run a backup and clean older files in one step. `retention_days`
      is the cutoff for cleanup; `backup_storage` is the storage key
      (LOCAL or a remote setting name).
    destructive: true
    protocol: http
    parameters:
      host:            { type: string, required: true }
      adom_id:         { type: string, default: "330201025894400" }
      retention_days:  { type: number, required: true, description: "Files older than this are removed." }
      backup_storage:  { type: string, required: true, description: "Storage destination key (LOCAL / remote setting name)." }
    request:
      method: POST
      url: "https://{args.host}/api/v3/backup/perform-and-clean?fileRetentionDays={args.retention_days}&backupStorage={args.backup_storage}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ code, message, result: { backupFile, removedCount } }"

  db_backup_and_clean:
    description: |
      Backup the database only, then clean older DB backups. Per spec
      this endpoint takes ONLY fileRetentionDays (no backupStorage, no
      AdomId).
    destructive: true
    protocol: http
    parameters:
      host:            { type: string, required: true }
      retention_days:  { type: number, required: true }
    request:
      method: POST
      url: "https://{args.host}/api/v3/backup/db/backup?fileRetentionDays={args.retention_days}"
      headers:
        Accept: "application/json"
    returns: "{ code, message, result }"

  restore_backup:
    description: |
      Restore a backup file by name within the given category. Highly
      destructive — overwrites current configuration / DB. Use the
      live-verified categories (SYSTEM_BACKUP / DATABASE_BACKUP).
    destructive: true
    protocol: http
    parameters:
      host:             { type: string, required: true }
      adom_id:          { type: string, default: "330201025894400" }
      backup_category:  { type: string, required: true, description: "SYSTEM_BACKUP | DATABASE_BACKUP." }
      file_name:        { type: string, required: true, description: "Backup file name to restore (from list_backup_files)." }
    request:
      method: POST
      url: "https://{args.host}/api/v3/restore/{args.backup_category}?fileName={args.file_name}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ code, message, result }"

  # ─────────── Policy Package ───────────

  list_policy_packages:
    description: "List all policy packages in the ADOM. Empty installs return []."
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
    request:
      method: GET
      url: "https://{args.host}/api/v3/policy-package"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: [PolicyPackageVo{ id, name, rank, blockIds, assignedCampuses, ... }] }"

  get_policy_package_assignments:
    description: "Which Campuses / managed devices a Policy Package is currently assigned to."
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
      id:      { type: string, required: true, description: "Policy package id." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/policy-package/{args.id}/assignments"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: [{ campusId, deviceId, assignedAt, ... }] }"

  list_policy_package_revisions:
    description: "Revision history for a Policy Package — every save / install creates a snapshot."
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
      id:      { type: string, required: true, description: "Policy package id." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/policy-package/{args.id}/revisions"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: [Revision{ id, createdAt, createdBy, comment, ... }] }"

  get_current_policy_package_revision:
    description: "The currently-active revision for a Policy Package — what's live."
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
      id:      { type: string, required: true, description: "Policy package id." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/policy-package/{args.id}/revisions/current"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: Revision }"

  restore_policy_package_revision:
    description: "Roll a Policy Package back to a specific revision."
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      adom_id:     { type: string, default: "330201025894400" }
      id:          { type: string, required: true, description: "Policy package id." }
      revision_id: { type: string, required: true, description: "Target revision id." }
    request:
      method: POST
      url: "https://{args.host}/api/v3/policy-package/{args.id}/restore/{args.revision_id}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ code, message, result }"

  delete_policy_package:
    description: "Delete a Policy Package by id. Fails if assigned to active Campuses."
    destructive: true
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
      id:      { type: string, required: true, description: "Policy package id." }
    request:
      method: DELETE
      url: "https://{args.host}/api/v3/policy-package/{args.id}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ code, message }"

  # ─────────── Policy Block ───────────

  list_policy_blocks:
    description: "List all Policy Blocks in the ADOM. Blocks are the reusable rule-sets composed into Policy Packages."
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
    request:
      method: GET
      url: "https://{args.host}/api/v3/policy-block"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: [PolicyBlockVo{ id, name, rank, rules, ... }] }"

  get_policy_block:
    description: "Get one Policy Block by id — full rule list."
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
      id:      { type: string, required: true, description: "Policy block id." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/policy-block/{args.id}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: PolicyBlockVo }"

  list_blocks_by_package:
    description: "Blocks included in a specific Policy Package. `type` filter optional."
    protocol: http
    parameters:
      host:        { type: string, required: true }
      adom_id:     { type: string, default: "330201025894400" }
      package_id:  { type: string, required: true, description: "Policy package id." }
      block_type:  { type: string, default: "", description: "Optional block type filter." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/policy-block/policy-package/{args.package_id}?type={args.block_type}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: [PolicyBlockVo] }"

  # ─────────── Scheduler ───────────
  # list_schedules returned 500 on live NCM v8.0 (see BROKEN-APIS.md).
  # Schedule MUTATION endpoints are kept — they target known ids and
  # should still work once you have ids from another source (e.g. GUI).

  get_schedule:
    description: "Get one schedule by id. No AdomId required."
    protocol: http
    parameters:
      host: { type: string, required: true }
      id:   { type: string, required: true, description: "Schedule id." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/schedules/{args.id}"
      headers:
        Accept: "application/json"
    returns: "{ result: Schedule }"

  list_schedule_activity_types:
    description: |
      All schedule activity / task type strings the server supports —
      discover before creating a new schedule. Returns rich metadata:
      taskType, tag (SYSTEM/USER/etc), display name, disabled flag.
    protocol: http
    parameters:
      host:        { type: string, required: true }
      adom_id:     { type: string, default: "330201025894400" }
      runs_on_ncm: { type: boolean, default: false }
    request:
      method: GET
      url: "https://{args.host}/api/v3/schedules/activity-types?runsOnNCM={args.runs_on_ncm}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: [{ taskType, tag, name, disabled, groupType }] }"

  run_schedule_now:
    description: |
      Trigger scheduled tasks immediately. `ids_json` is a JSON array
      of schedule ids, e.g. `[123,456]`. `wait=true` blocks until done.
      No AdomId required.
    destructive: true
    protocol: http
    parameters:
      host:     { type: string, required: true }
      ids_json: { type: string, required: true, description: "JSON array of schedule ids, e.g. '[123,456]'." }
      wait:     { type: boolean, default: false, description: "Block until tasks complete." }
    request:
      method: POST
      url: "https://{args.host}/api/v3/schedules/runNow?wait={args.wait}"
      headers:
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.ids_json}"
    returns: "{ code, message, result }"

  enable_schedules:
    description: "Enable schedules. `ids_json` is a JSON array of schedule ids — body, not query. No AdomId."
    destructive: true
    protocol: http
    parameters:
      host:     { type: string, required: true }
      ids_json: { type: string, required: true, description: "JSON array of ids, e.g. '[123,456]'." }
    request:
      method: PUT
      url: "https://{args.host}/api/v3/schedules/enable"
      headers:
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.ids_json}"
    returns: "{ code, message }"

  disable_schedules:
    description: "Disable schedules. `ids_json` is a JSON array. No AdomId."
    destructive: true
    protocol: http
    parameters:
      host:     { type: string, required: true }
      ids_json: { type: string, required: true, description: "JSON array of ids." }
    request:
      method: PUT
      url: "https://{args.host}/api/v3/schedules/disable"
      headers:
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.ids_json}"
    returns: "{ code, message }"

  # ─────────── Campus (the managed FortiNAC instances themselves) ───────────

  list_campuses:
    description: |
      List the FortiNAC instances ("campuses") managed by this NCM.
      Returns name, IP, version, status, role (STANDALONE / PRIMARY /
      SECONDARY), ADOM membership, and which NCM node is preferred for
      each. This is the "which NACs do I manage" tool.
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
    request:
      method: GET
      url: "https://{args.host}/api/v3/campus"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    response_fields:
      - result[].id
      - result[].name
      - result[].ipAddress
      - result[].version
      - result[].status
      - result[].role
      - result[].adomName
      - result[].preferredNCMName
    returns: "{ result: [CampusDto{ id, name, ipAddress, version, status, role, adomName, preferredNCMName, ... }] }"

  get_campus:
    description: "Detail for one managed FortiNAC (campus) by id."
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
      id:      { type: string, required: true, description: "Campus id (from list_campuses)." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/campus/{args.id}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"

  # ─────────── Network Devices (managed switches/APs in inventory) ───────────

  list_network_devices:
    description: "List managed Network Devices (switches, APs, controllers) tracked by NCM in the ADOM."
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
    request:
      method: GET
      url: "https://{args.host}/api/v3/network-device"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: [NetworkDeviceDto{ id, name, ip, model, vendor, status, ... }] }"

  get_network_device:
    description: "Detail for one Network Device by id."
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
      id:      { type: string, required: true, description: "Network device id." }
    request:
      method: GET
      url: "https://{args.host}/api/v3/network-device/{args.id}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: NetworkDeviceDto }"

  add_network_device:
    description: "Add a new Network Device. `device_json` is the full NetworkDeviceDto."
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      adom_id:     { type: string, default: "330201025894400" }
      device_json: { type: string, required: true, description: "NetworkDeviceDto JSON." }
    request:
      method: POST
      url: "https://{args.host}/api/v3/network-device"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.device_json}"
    returns: "{ code, message, result: NetworkDeviceDto }"

  update_network_device:
    description: "Update one Network Device (full replace). Read get_network_device first."
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      adom_id:     { type: string, default: "330201025894400" }
      id:          { type: string, required: true, description: "Network device id." }
      device_json: { type: string, required: true, description: "Full NetworkDeviceDto JSON." }
    request:
      method: PUT
      url: "https://{args.host}/api/v3/network-device/{args.id}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.device_json}"
    returns: "{ code, message, result: NetworkDeviceDto }"

  delete_network_devices:
    description: "Delete Network Devices by id (CSV via `ids` query param)."
    destructive: true
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
      ids:     { type: string, required: true, description: "Comma-separated network device ids." }
    request:
      method: DELETE
      url: "https://{args.host}/api/v3/network-device?ids={args.ids}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ code, message }"

  # ─────────── Endpoint Fingerprint ───────────
  # NOTE: count endpoint returns 400 for every count_type tried on
  # live NCM v8.0 — dropped from typed tools. See BROKEN-APIS.md.

  list_endpoint_fingerprints:
    description: |
      List Endpoint Fingerprint records — NCM's catalogue of device
      signatures used to classify managed endpoints. Live response
      uses `results[]` (plural). Filter via the single `filter` arg;
      for compound filters use call_api.
    protocol: http
    parameters:
      host:           { type: string, required: true }
      adom_id:        { type: string, default: "330201025894400" }
      campus_id_list: { type: string, default: "" }
      filter:         { type: string, default: "" }
      start:          { type: number, default: 0 }
      count:          { type: number, default: 50 }
      sort_key:       { type: string, default: "" }
      sort_dir:       { type: string, default: "asc" }
    request:
      method: GET
      url: "https://{args.host}/api/v3/endpoint-fingerprint/list?campusIdList={args.campus_id_list}&filter={args.filter}&start={args.start}&count={args.count}&sortKey={args.sort_key}&sortDir={args.sort_dir}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ results: [Fingerprint], total, filtered, totalPages, hasNext, pageIndex }"

  # ─────────── Dashboard (high-value reads) ───────────
  # Most dashboard endpoints use no AdomId; list_dashboards uses
  # the lowercase `adomId` header (spec quirk).

  list_dashboards:
    description: |
      List saved dashboards visible to the current admin. Spec uses
      lowercase `adomId` header (yes, lowercase a — a one-off quirk).
      Empty installs return [].
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
    request:
      method: GET
      url: "https://{args.host}/api/v3/dashboard/list"
      headers:
        adomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: [Dashboard{ id, name, widgets, ... }] }"

  get_dashboard_system_info:
    description: "High-level system info widget — hostname, serial, serviceType (FortiNAC-M), version, systemTime, upTime, license."
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
    request:
      method: GET
      url: "https://{args.host}/api/v3/dashboard/system-info"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: { hostName, serial, serviceType, version, systemTime, upTime, totalLicenseCount, ... } }"

  get_dashboard_system_performance:
    description: "Current system perf metrics — cpuUsage, memoryUsage, diskUsage (percentages)."
    protocol: http
    parameters:
      host:    { type: string, required: true }
      adom_id: { type: string, default: "330201025894400" }
    request:
      method: GET
      url: "https://{args.host}/api/v3/dashboard/system-performance"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: { cpuUsage: int, memoryUsage: int, diskUsage: int } }"

  # ─────────── Generic escape hatch ───────────

  call_api:
    description: |
      Generic FortiNCM REST call — use when no specific tool above
      fits and the OpenAPI schema (1062 endpoints) shows one for your
      need.

      ALL endpoints live under /api/v3/<path>.
      Pass `path` WITH the leading slash and WITHOUT the base URL.
      Examples:
        path: "/api/v3/ncm/cluster/nodes"
        path: "/api/v3/host/list"
        path: "/api/v3/policy-package/{id}"

      Auth (the Authorization header) is auto-applied by Forge's
      connector-level bearer-token-exchange — you do NOT pass a token.
      Many endpoints also need an `AdomId` header — pass `adom_id` to
      set it (harmless to set on endpoints that ignore it). method
      defaults to GET; for POST/PUT/DELETE-with-body, set `body_json`.
      Content-Type is added automatically.

      Skip this tool if a specific typed tool exists — typed tools
      have better parameter docs and clearer return shapes.
    protocol: http
    parameters:
      host:         { type: string, required: true }
      adom_id:      { type: string, default: "330201025894400", description: "AdomId header (most endpoints need it; some don't — value is still safe to send)." }
      path:         { type: string, required: true, description: "Full path including /api/v3/ prefix and leading slash, e.g. '/api/v3/ncm/cluster/nodes'." }
      method:       { type: string, default: "GET", description: "GET | POST | PUT | DELETE." }
      query_params: { type: string, default: "", description: "Query string fragment (no leading ?). E.g. 'start=0&count=10&filter=name%3D%3Dfoo'." }
      body_json:    { type: string, default: "", description: "JSON body for POST/PUT/DELETE (string-encoded)." }
    request:
      method: "{args.method}"
      url: "https://{args.host}{args.path}?{args.query_params}"
      headers:
        AdomId: "{args.adom_id}"
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.body_json}"
    returns: "Whatever the NCM endpoint returns — typically { code, message, result }."
