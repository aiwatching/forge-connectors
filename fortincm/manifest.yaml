  add_network_device:
    description: "Add a new Network Device. `device_json` is the full NetworkDeviceDto."
    destructive: true
    protocol: http
    parameters:
      host:        { type: string, required: true }
      port:        { type: number, default: 8889 }
      token:       { type: string, required: true }
      adom_id:     { type: string, default: "1" }
      device_json: { type: string, required: true, description: "NetworkDeviceDto JSON." }
    request:
      method: POST
      url: "https://{args.host}:{args.port}/api/v3/network-device"
      headers:
        Authorization: "{args.token}"
        AdomId: "{args.adom_id}"
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.device_json}"
    returns: "{ code, message, result: NetworkDeviceDto }"

  delete_network_devices:
    description: "Delete Network Devices by id (CSV). Destructive."
    destructive: true
    protocol: http
    parameters:
      host:    { type: string, required: true }
      port:    { type: number, default: 8889 }
      token:   { type: string, required: true }
      adom_id: { type: string, default: "1" }
      ids:     { type: string, required: true, description: "Comma-separated network device ids." }
    request:
      method: DELETE
      url: "https://{args.host}:{args.port}/api/v3/network-device?ids={args.ids}"
      headers:
        Authorization: "{args.token}"
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ code, message }"

  # ─────────── Endpoint Fingerprint ───────────

  list_endpoint_fingerprints:
    description: |
      List Endpoint Fingerprint records — NCM's catalogue of device
      signatures used to classify managed endpoints. Filter via the
      single `filter` arg; for compound filters use call_api.
    protocol: http
    parameters:
      host:           { type: string, required: true }
      port:           { type: number, default: 8889 }
      token:          { type: string, required: true }
      adom_id:        { type: string, default: "1" }
      campus_id_list: { type: string, default: "" }
      filter:         { type: string, default: "" }
      start:          { type: number, default: 0 }
      count:          { type: number, default: 50 }
      sort_key:       { type: string, default: "" }
      sort_dir:       { type: string, default: "asc" }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/api/v3/endpoint-fingerprint/list?campusIdList={args.campus_id_list}&filter={args.filter}&start={args.start}&count={args.count}&sortKey={args.sort_key}&sortDir={args.sort_dir}"
      headers:
        Authorization: "{args.token}"
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: { records: [Fingerprint{ id, signature, classification, ... }], total } }"

  count_endpoint_fingerprints:
    description: "Counts of Endpoint Fingerprint records grouped by `countType`."
    protocol: http
    parameters:
      host:       { type: string, required: true }
      port:       { type: number, default: 8889 }
      token:      { type: string, required: true }
      adom_id:    { type: string, default: "1" }
      count_type: { type: string, required: true, description: "Bucket type (discover via GUI)." }
    request:
      method: GET
      url: "https://{args.host}:{args.port}/api/v3/endpoint-fingerprint/count/{args.count_type}"
      headers:
        Authorization: "{args.token}"
        AdomId: "{args.adom_id}"
        Accept: "application/json"
    returns: "{ result: [{ bucket, count }] }"

  # ─────────── Generic escape hatch ───────────

  call_api:
    description: |
      Generic FortiNCM REST call — use when no specific tool above
      fits and the OpenAPI schema (1062 endpoints) shows one for your
      need.

      ALL endpoints live under /api/v3/<path> (a handful are under
      /api/v2/*, like the login endpoint). Pass `path` WITH the
      leading slash and WITHOUT the base URL.
      Examples:
        path: "/api/v3/ncm/cluster/nodes"
        path: "/api/v3/host/list"
        path: "/api/v3/policy-package/{id}"

      Auth (Authorization: <token>) is auto-applied; you only pass
      `token`. Many endpoints also need an `AdomId` header — pass
      `adom_id` to set it. method defaults to GET; for POST/PUT, set
      `body_json` (and Content-Type is added automatically).

      Skip this tool if a specific typed tool exists — typed tools
      have better parameter docs and clearer return shapes.
    protocol: http
    parameters:
      host:         { type: string, required: true }
      port:         { type: number, default: 8889 }
      token:        { type: string, required: true }
      adom_id:      { type: string, default: "1", description: "AdomId header (most endpoints need it; some don't — value is still safe to send)." }
      path:         { type: string, required: true, description: "Full path including /api/v3/ prefix and leading slash, e.g. '/api/v3/ncm/cluster/nodes'." }
      method:       { type: string, default: "GET", description: "GET | POST | PUT | DELETE." }
      query_params: { type: string, default: "", description: "Query string fragment (no leading ?). E.g. 'start=0&count=10&filter=name%3D%3Dfoo'." }
      body_json:    { type: string, default: "", description: "JSON body for POST/PUT (string-encoded)." }
    request:
      method: "{args.method}"
      url: "https://{args.host}:{args.port}{args.path}?{args.query_params}"
      headers:
        Authorization: "{args.token}"
        AdomId: "{args.adom_id}"
        Accept: "application/json"
        Content-Type: "application/json"
      body: "{args.body_json}"
    returns: "Whatever the NCM endpoint returns — typically { code, message, result }."
