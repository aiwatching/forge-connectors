id: tp
name: FortiNAC Test Platform
icon: 🧪
version: "0.5.2"
author: forge
category: connector
mode: browser-side
description: |
  FortiNAC Test Platform (TP) — browser-side connector reusing the
  user's logged-in session. Calls TP's internal REST API directly
  using the JWT held in localStorage (no DOM scraping, no token in
  Forge settings — re-login refreshes automatically).

  v0.3 — 5 read tools.
  v0.4 — 3 destructive tools: add_weekly_status, add_comment,
    edit_nfr_field. Endpoints captured by intercepting the page's
    own XHR submit (weekly_status + edit verified; add_comment
    follows the same naming convention but the modal didn't auto-
    open during probing, so a first call may surface 404 if the
    convention is off — try a single call to verify).

  v0.5 — full automation workflow (same connector, shared JWT auth):
    versions / labs / testcases discovery, run_pytest (destructive),
    test result + execution polling, lab lock + kill (destructive),
    and NAC upgrade: upgrade_lab / upgrade_device (destructive) +
    check_upgrade_status / check_lab_upgrade_status polling.
    Endpoints from docs/tp-automation-api.md (Automation.jsx contract).
    'file' upgrade mode (multipart image upload) is not exposed —
    chat can't pick a file; use GA / build / command.

settings:
  base_url:
    type: string
    label: TP base URL
    description: "e.g. https://nac-tp.fortinet-us.com"
    required: true
    default: "https://nac-tp.fortinet-us.com"
  api_base_url:
    type: string
    label: TP API base URL
    description: "TP's internal REST API host. NAC TP uses port 8000."
    required: true
    default: "https://nac-tp.fortinet-us.com:8000"
  username:
    type: string
    label: Your TP username
    description: |
      Used by 'owner_filter: me' to find NFRs you own across any of
      the assignee fields. Match the name as it appears in TP
      (e.g. 'Ryan Sun' — full name, not the email prefix).
    required: true

host_match: "{base_url}/*"
login_redirect: "/login"
runner: main
# Always open a fresh background tab per call (closed afterwards).
# Costs ~5-10s per call cold-load + SAML round-trip, but isolates
# every call from whatever stale state (expired JWT, wrong route,
# old SAML challenge) the user's existing TP tab might be in.
# Trade-off accepted in v0.4.3 after a session where a stale tab on
# the SSO login page made every API call return nginx 405.
tab_strategy: ephemeral

# ─── Shared script preamble (injected via {settings.*} expansion) ──
# Each tool's script duplicates the JWT lookup + fetch helper. Could
# be DRY'd via a shared file later — manifests don't support imports.

tools:

  # ─────────── list_nfrs (CA & NCM) ───────────
  list_nfrs:
    description: |
      List NFRs from the CA & NCM module via TP's REST API. Returns the
      full set for the given release in one call (no pagination).

      `owner_filter` searches nfr_owner / pd_assignee / backend_assignee /
      frontend_assignee / at_assignee / qa_assignee. Special value 'me'
      resolves to settings.username.

      `verbose: false` (default) → slim 14-field view (LLM-friendly).
      `verbose: true` → full ~50-field record per NFR.
    parameters:
      release:
        type: string
        default: "all"
        description: "Release filter. 'all' = every release; or an exact tag like '7.6.7' / '7.4.0'. Partial like '7.6' returns nothing — must be exact (call list_releases to see valid tags)."
      owner_filter:
        type: string
        description: "Filter rows where any owner/assignee column contains this string. 'me' = settings.username. Empty = no filter."
      verbose:
        type: boolean
        default: false
        description: "false = slim view. true = full payload (incl. dates, doc links, bugs list)."
    page:
      url: "{base_url}/nfr"
      on_target: "/nfr"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP. Open the TP tab and sign in, then retry.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const url = `${apiBase}/adc/get_nfr_list/${encodeURIComponent(args.release || 'all')}`;
      const r = await fetch(url, { headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' }, credentials: 'include' });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — JWT expired, re-login.`, url };
      if (!r.ok) return { _error: `API ${r.status}`, url };
      const all = await r.json();
      if (!Array.isArray(all)) return { _error: 'API did not return an array', url };
      const myName = '{settings.username}';
      let effOwner = (args.owner_filter || '').trim();
      if (effOwner === 'me') effOwner = myName;
      let filtered = all;
      if (effOwner) {
        const q = effOwner.toLowerCase();
        const matchFields = ['nfr_owner', 'pd_assignee', 'backend_assignee', 'frontend_assignee', 'at_assignee', 'qa_assignee'];
        filtered = all.filter(r => matchFields.some(f => (r[f] || '').toLowerCase().includes(q)));
      }
      const slim = (r) => ({
        id: r.id, subject: r.subject, release: r.release, priority: r.priority,
        category: r.category, source: r.source, status: r.status, progress: r.progress,
        nfr_owner: r.nfr_owner, qa_assignee: r.qa_assignee, backend_assignee: r.backend_assignee,
        bugs: r.bugs ? { total: r.bugs.total, assigned: r.bugs.assigned } : null,
        pmdb: r.pmdb, mantis_nfr: r.mantis_nfr,
        detail_url: `${location.origin}/nfr-detail?id=${r.id}`,
      });
      const rows = args.verbose ? filtered : filtered.map(slim);
      return { release: args.release || 'all', owner_filter: effOwner || null, total: all.length, returned: rows.length, verbose: !!args.verbose, rows };

  # ─────────── list_device_integration ───────────
  list_device_integration:
    description: |
      List items from the Device Integration module. Same shape as
      list_nfrs (owner_filter / verbose) — different upstream module.
      Useful when the user asks about device-integration NFRs.
    parameters:
      release:
        type: string
        default: "all"
        description: "Release tag (e.g. '7.6.7') or 'all'. Call list_releases module='Device Integration' to see valid tags."
      owner_filter:
        type: string
        description: "Same as list_nfrs. 'me' = settings.username."
      verbose:
        type: boolean
        default: false
    page:
      url: "{base_url}/device-integration"
      on_target: "/device-integration"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const url = `${apiBase}/adc/get_device_integration_agent_list/${encodeURIComponent(args.release || 'all')}/Device%20Integration`;
      const r = await fetch(url, { headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' }, credentials: 'include' });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — JWT expired, re-login.`, url };
      if (!r.ok) return { _error: `API ${r.status}`, url };
      const all = await r.json();
      if (!Array.isArray(all)) return { _error: 'API did not return an array', url };
      const myName = '{settings.username}';
      let effOwner = (args.owner_filter || '').trim();
      if (effOwner === 'me') effOwner = myName;
      let filtered = all;
      if (effOwner) {
        const q = effOwner.toLowerCase();
        const matchFields = ['nfr_owner', 'pd_assignee', 'backend_assignee', 'frontend_assignee', 'at_assignee', 'qa_assignee'];
        filtered = all.filter(r => matchFields.some(f => (r[f] || '').toLowerCase().includes(q)));
      }
      const slim = (r) => ({
        id: r.id, subject: r.subject, release: r.release, priority: r.priority,
        category: r.category, source: r.source, status: r.status, progress: r.progress,
        nfr_owner: r.nfr_owner, qa_assignee: r.qa_assignee,
        bugs: r.bugs ? { total: r.bugs.total, assigned: r.bugs.assigned } : null,
        pmdb: r.pmdb, mantis_nfr: r.mantis_nfr,
        detail_url: `${location.origin}/nfr-detail?id=${r.id}`,
      });
      const rows = args.verbose ? filtered : filtered.map(slim);
      return { module: 'Device Integration', release: args.release || 'all', owner_filter: effOwner || null, total: all.length, returned: rows.length, verbose: !!args.verbose, rows };

  # ─────────── list_agent ───────────
  list_agent:
    description: |
      List items from the Agent module. Same shape as list_nfrs.
    parameters:
      release:
        type: string
        default: "all"
        description: "Release tag or 'all'. Call list_releases module='Agent' to see valid tags."
      owner_filter:
        type: string
        description: "Same as list_nfrs. 'me' = settings.username."
      verbose:
        type: boolean
        default: false
    page:
      url: "{base_url}/agent"
      on_target: "/agent"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const url = `${apiBase}/adc/get_device_integration_agent_list/${encodeURIComponent(args.release || 'all')}/Agent`;
      const r = await fetch(url, { headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' }, credentials: 'include' });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — JWT expired, re-login.`, url };
      if (!r.ok) return { _error: `API ${r.status}`, url };
      const all = await r.json();
      if (!Array.isArray(all)) return { _error: 'API did not return an array', url };
      const myName = '{settings.username}';
      let effOwner = (args.owner_filter || '').trim();
      if (effOwner === 'me') effOwner = myName;
      let filtered = all;
      if (effOwner) {
        const q = effOwner.toLowerCase();
        const matchFields = ['nfr_owner', 'pd_assignee', 'backend_assignee', 'frontend_assignee', 'at_assignee', 'qa_assignee'];
        filtered = all.filter(r => matchFields.some(f => (r[f] || '').toLowerCase().includes(q)));
      }
      const slim = (r) => ({
        id: r.id, subject: r.subject, release: r.release, priority: r.priority,
        category: r.category, source: r.source, status: r.status, progress: r.progress,
        nfr_owner: r.nfr_owner, qa_assignee: r.qa_assignee,
        bugs: r.bugs ? { total: r.bugs.total, assigned: r.bugs.assigned } : null,
        pmdb: r.pmdb, mantis_nfr: r.mantis_nfr,
        detail_url: `${location.origin}/nfr-detail?id=${r.id}`,
      });
      const rows = args.verbose ? filtered : filtered.map(slim);
      return { module: 'Agent', release: args.release || 'all', owner_filter: effOwner || null, total: all.length, returned: rows.length, verbose: !!args.verbose, rows };

  # ─────────── get_nfr (full detail) ───────────
  get_nfr:
    description: |
      Fetch a single NFR with everything: full record fields, weekly
      status history, change history, and comments. Use when the
      user asks "what's the latest on NFR <id>" or wants to see
      progress notes.

      Pass `include` to slim the response — accepts a CSV of:
      detail, weekly, history, comments. Default: all four.
    parameters:
      id:
        type: number
        required: true
        description: "NFR id (the number in subject_url / detail page URL)."
      include:
        type: string
        default: "detail,weekly,history,comments"
        description: "CSV of sections to fetch. Default fetches everything. Use 'detail,weekly' to skip history+comments."
      weekly_limit:
        type: number
        default: 10
        description: "Cap the number of weekly status entries returned (newest first). Set 0 for no cap."
    page:
      url: "{base_url}/nfr-detail?id={args.id}"
      on_target: "/nfr-detail"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const hdr = { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' };
      const id = args.id;
      if (id == null) return { _error: 'id is required' };
      const include = String(args.include || 'detail,weekly,history,comments').split(',').map(s => s.trim()).filter(Boolean);
      const inc = new Set(include);
      const get = async (path) => {
        try {
          const r = await fetch(`${apiBase}${path}`, { headers: hdr, credentials: 'include' });
          if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status}` };
          if (!r.ok) return { _error: `${r.status}`, _path: path };
          const ct = r.headers.get('content-type') || '';
          return ct.includes('json') ? await r.json() : (await r.text()).slice(0, 500);
        } catch (e) { return { _error: String(e) }; }
      };
      const out = { id };
      if (inc.has('detail')) out.detail = await get(`/adc/get_nfr_detail/${id}`);
      if (inc.has('weekly')) {
        const w = await get(`/adc/get_nfr_weekly_status/${id}`);
        if (Array.isArray(w)) {
          const cap = Number(args.weekly_limit ?? 10);
          out.weekly_status = cap > 0 ? w.slice(0, cap) : w;
          out.weekly_status_total = w.length;
        } else {
          out.weekly_status = w;
        }
      }
      if (inc.has('history')) out.history = await get(`/adc/get_nfr_history/${id}`);
      if (inc.has('comments')) out.comments = await get(`/adc/get_nfr_comment/${id}`);
      return out;

  # ─────────── list_releases ───────────
  list_releases:
    description: |
      List valid release tags for a TP module. Call before list_*
      tools when the user doesn't know the exact release tag (TP
      requires exact tags like '7.6.7' — '7.6' returns nothing).
    parameters:
      module:
        type: select
        options: ["NFR", "Device Integration", "Agent"]
        default: "NFR"
        description: "Which TP module to query release tags for."
    page:
      url: "{base_url}/nfr"
      on_target: "/"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const url = `${apiBase}/adc/get_version_list/${encodeURIComponent(args.module || 'NFR')}`;
      const r = await fetch(url, { headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' }, credentials: 'include' });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.`, url };
      if (!r.ok) return { _error: `API ${r.status}`, url };
      const body = await r.json();
      return { module: args.module || 'NFR', releases: body };

  # ─────────── add_weekly_status (destructive) ───────────
  add_weekly_status:
    description: |
      Add a weekly status entry to an NFR. Status_message is HTML
      (the upstream UI uses a Quill rich-text editor — plain text or
      simple <p>...</p> wrappers are fine).

      Verified endpoint shape: POST /adc/add_nfr_weekly_status/ with
      JSON { nfr_id, week_starting_date, week_ending_date,
      status_message, user }. The user email is auto-derived from
      the JWT payload — no need to pass.

      Dates accept YYYY-MM-DD. If you omit them, the script defaults
      to the current week (Monday → Sunday).
    destructive: true
    parameters:
      nfr_id:
        type: number
        required: true
        description: "NFR id."
      status_message:
        type: string
        required: true
        description: "Status text. Plain text gets wrapped in <p>; full HTML is preserved."
      week_starting_date:
        type: string
        description: "YYYY-MM-DD. Default: this Monday."
      week_ending_date:
        type: string
        description: "YYYY-MM-DD. Default: this Sunday."
    page:
      url: "{base_url}/nfr-detail?id={args.nfr_id}"
      on_target: "/nfr-detail"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      // Decode JWT payload to grab the user email.
      let userEmail = '';
      try {
        const p = JSON.parse(atob(jwt.split('.')[1]));
        userEmail = p.email || p.username || '';
      } catch {}
      if (!userEmail) return { _error: 'Could not extract user email from JWT payload.' };

      // Default dates → current week (Mon..Sun)
      const today = new Date();
      const dow = today.getDay() === 0 ? 7 : today.getDay();   // Sunday=7 not 0
      const mon = new Date(today); mon.setDate(today.getDate() - (dow - 1));
      const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
      const iso = (d) => d.toISOString().slice(0, 10);
      const weekStart = args.week_starting_date || iso(mon);
      const weekEnd = args.week_ending_date || iso(sun);

      // Wrap plain text in <p> if it doesn't already look like HTML
      let msg = String(args.status_message || '');
      if (msg && !/<[a-z][^>]*>/i.test(msg)) msg = `<p>${msg.replace(/\n/g, '</p><p>')}</p>`;

      const body = JSON.stringify({
        nfr_id: Number(args.nfr_id),
        week_starting_date: weekStart,
        week_ending_date: weekEnd,
        status_message: msg,
        user: userEmail,
      });

      const r = await fetch(`${apiBase}/adc/add_nfr_weekly_status/`, {
        method: 'POST',
        headers: {
          'Authorization': `JWT ${jwt}`,
          'Accept': 'application/json',
          'Content-Type': 'application/json',
        },
        credentials: 'include',
        body,
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) {
        const t = await r.text();
        return { _error: `API ${r.status}`, body: t.slice(0, 500) };
      }
      const json = await r.json().catch(() => ({}));
      return {
        ok: true,
        nfr_id: Number(args.nfr_id),
        week_starting_date: weekStart,
        week_ending_date: weekEnd,
        created: json,
      };

  # ─────────── add_comment (destructive) ───────────
  add_comment:
    description: |
      Add a comment to an NFR. Verified endpoint:
      POST /adc/add_nfr_comment (no trailing slash) with JSON
      { id, comment, user, action: "add" }. Comment is plain text
      (the upstream UI wraps via Quill but the API accepts raw).
    destructive: true
    parameters:
      nfr_id:
        type: number
        required: true
        description: "NFR id."
      comment:
        type: string
        required: true
        description: "Comment text."
    page:
      url: "{base_url}/nfr-detail?id={args.nfr_id}"
      on_target: "/nfr-detail"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      let userEmail = '';
      try {
        const p = JSON.parse(atob(jwt.split('.')[1]));
        userEmail = p.email || p.username || '';
      } catch {}
      if (!userEmail) return { _error: 'Could not extract user email from JWT.' };

      const body = JSON.stringify({
        user: userEmail,
        comment: String(args.comment || ''),
        id: Number(args.nfr_id),
        action: 'add',
      });

      const r = await fetch(`${apiBase}/adc/add_nfr_comment`, {
        method: 'POST',
        headers: {
          'Authorization': `JWT ${jwt}`,
          'Accept': 'application/json, text/plain, */*',
          'Content-Type': 'application/json;charset=UTF-8',
        },
        credentials: 'include',
        body,
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) {
        const t = await r.text();
        return { _error: `API ${r.status}`, body: t.slice(0, 500) };
      }
      const json = await r.json().catch(() => ({}));
      return { ok: true, nfr_id: Number(args.nfr_id), created: json };

  # ─────────── delete_weekly_status (destructive) ───────────
  delete_weekly_status:
    description: |
      Delete a specific weekly status entry by its weekly_status id
      (NOT the NFR id — get the id from get_nfr's weekly_status[].id
      field). Verified endpoint: DELETE /adc/delete_nfr_weekly_status/{id}.
    destructive: true
    parameters:
      weekly_status_id:
        type: number
        required: true
        description: "Weekly status entry id (from get_nfr().weekly_status[].id)."
    page:
      url: "{base_url}/nfr"
      on_target: "/"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const id = Number(args.weekly_status_id);
      const r = await fetch(`${apiBase}/adc/delete_nfr_weekly_status/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' },
        credentials: 'include',
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) {
        const t = await r.text();
        return { _error: `API ${r.status}`, body: t.slice(0, 300) };
      }
      return { ok: true, deleted_weekly_status_id: id };

  # ─────────── edit_nfr_field (destructive) ───────────
  edit_nfr_field:
    description: |
      Edit one or more fields on an NFR. TP's edit endpoint requires
      the FULL detail object back as multipart FormData on every save
      (it's a treat-the-NFR-as-one-form contract). This tool reads the
      current detail, overlays your `patch` object, and re-submits the
      full record.

      Verified endpoint: POST /adc/edit_nfr_detail (FormData, all
      ~50 fields + id + user).

      Pass `patch` as an object of field_name → new_value. Only the
      fields you want to change need to be in `patch`. Common
      editable fields:
        subject, release, priority, status, progress,
        pd_assignee, backend_assignee, frontend_assignee,
        at_assignee, qa_assignee, nfr_owner, git, git_branch, pmdb,
        mantis_nfr, mantis_dev, mantis_doc, description,
        story_point_backend, story_point_frontend,
        pd_due, backend_due, frontend_due, qa_due, toi_due, ...
    destructive: true
    parameters:
      id:
        type: number
        required: true
        description: "NFR id."
      patch:
        type: json
        required: true
        description: |
          Object of fields to update, e.g. { "progress": "75%",
          "qa_due": "2026-04-30" }. Other fields are preserved from
          the current detail.
    page:
      url: "{base_url}/nfr-detail?id={args.id}"
      on_target: "/nfr-detail"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      let userEmail = '';
      try {
        const p = JSON.parse(atob(jwt.split('.')[1]));
        userEmail = p.email || p.username || '';
      } catch {}
      if (!userEmail) return { _error: 'Could not extract user email from JWT.' };

      // 1) Fetch current detail (we need to send ALL fields back)
      const detailResp = await fetch(`${apiBase}/adc/get_nfr_detail/${Number(args.id)}`, {
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' },
        credentials: 'include',
      });
      if (detailResp.status === 401 || detailResp.status === 403) return { _error: `Auth ${detailResp.status}` };
      if (!detailResp.ok) return { _error: `Could not load current detail: HTTP ${detailResp.status}` };
      const current = await detailResp.json();

      // 2) Parse patch (LLM may pass as object OR JSON string)
      let patch = args.patch;
      if (typeof patch === 'string') {
        try { patch = JSON.parse(patch); } catch { return { _error: 'patch is not valid JSON' }; }
      }
      if (!patch || typeof patch !== 'object' || Array.isArray(patch)) {
        return { _error: 'patch must be a JSON object of field → value' };
      }

      // 3) Merge — known editable fields only; reject unknown to surface typos.
      const merged = { ...current };
      const declined = [];
      for (const [k, v] of Object.entries(patch)) {
        if (!(k in current) && !['mantis_dev', 'description'].includes(k)) {
          declined.push(k);
          continue;
        }
        merged[k] = v;
      }
      if (declined.length > 0 && Object.keys(patch).length === declined.length) {
        return { _error: `Unknown field(s): ${declined.join(', ')}. Valid fields: ${Object.keys(current).join(', ')}` };
      }

      // 4) Build FormData. CRITICAL: send ONLY the fields the page's own
      // edit form submits (captured from a real /adc/edit_nfr_detail POST).
      // get_nfr_detail returns ~22 EXTRA read-only/derived fields (all the
      // *_due dates, *_doc links, nfr_test_task_*, qa_test_result, etc.) that
      // the page NEVER posts; including them (as empty strings) makes the
      // backend silently drop the save — the bug behind "edit had no effect".
      // Whitelist below = exact field set from the page's FormData.
      const EDITABLE = [
        'id', 'release', 'subject', 'source', 'category', 'status', 'progress',
        'priority', 'git', 'git_branch', 'pmdb', 'pd_assignee', 'backend_assignee',
        'frontend_assignee', 'at_assignee', 'qa_assignee', 'nfr_owner', 'created_time',
        'doc', 'description', 'doc_status', 'mantis_dev', 'mantis_nfr', 'mantis_doc',
        'merged', 'story_point_backend', 'story_point_frontend',
        'conceptual_design_progress', 'ux_design_progress',
        'dev_implement_backend_progress', 'dev_implement_frontend_progress',
        'dev_integration_progress', 'qa_test_progress', 'qa_toi_progress',
      ];
      const fd = new FormData();
      for (const k of EDITABLE) {
        const v = merged[k];
        if (v == null) fd.append(k, '');
        else if (typeof v === 'object') fd.append(k, JSON.stringify(v));
        else fd.append(k, String(v));
      }
      fd.append('user', userEmail);

      // 5) Submit
      const r = await fetch(`${apiBase}/adc/edit_nfr_detail`, {
        method: 'POST',
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' },
        // Don't set Content-Type — browser sets boundary automatically for FormData
        credentials: 'include',
        body: fd,
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status}` };
      if (!r.ok) {
        const t = await r.text();
        return { _error: `API ${r.status}`, body: t.slice(0, 500) };
      }
      const json = await r.json().catch(() => ({}));
      return {
        ok: true,
        id: Number(args.id),
        changed: Object.keys(patch).filter(k => !declined.includes(k)),
        declined_fields: declined,
        result: json,
      };

  # ═══════════════ Automation module ═══════════════
  # Endpoints from docs/tp-automation-api.md (the /automation page's
  # Automation.jsx contract). Same JWT-in-localStorage auth as the NFR
  # tools above. The `user` field these endpoints want is the TP login
  # name (usedby lists show names like "alice"), derived from the JWT
  # payload (username → email); pass `user` explicitly if that's wrong.

  # ─────────── list_automation_versions ───────────
  list_automation_versions:
    description: |
      List the FortiNAC versions the automation pipeline tracks
      (populates the version dropdown). GET /adc/automation-verion/.
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const r = await fetch(`${apiBase}/adc/automation-verion/`, { headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' }, credentials: 'include' });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) return { _error: `API ${r.status}` };
      return await r.json();

  # ─────────── list_automation_labs ───────────
  list_automation_labs:
    description: |
      List the automation testbeds (labs) the calling user can see —
      owned or shared. Each entry has a live `status` ("Available" /
      "Running"). POST /adc/get_automation_lab { user }.
    parameters:
      user:
        type: string
        description: "TP login name. Default: derived from JWT. Override if the lab list comes back empty."
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      let user = (args.user || '').trim();
      if (!user) { try { const p = JSON.parse(atob(jwt.split('.')[1])); user = p.username || p.email || ''; } catch {} }
      if (!user) return { _error: 'Could not determine TP username; pass `user` explicitly.' };
      const r = await fetch(`${apiBase}/adc/get_automation_lab`, {
        method: 'POST',
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json', 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ user }),
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) return { _error: `API ${r.status}`, body: (await r.text()).slice(0, 300) };
      return { user, labs: await r.json() };

  # ─────────── list_testcases ───────────
  list_testcases:
    description: |
      List available pytest test cases as a module → file → test tree.
      GET /adc/get_testcases.

      SIDE-EFFECT: the backend pulls the latest `main` of TP's local
      test-framework clone before parsing. Harmless in normal use, but
      it will rebase any branch a developer is hand-testing on the TP
      host. Don't call this on a tight loop.

      `flatten: true` → return a flat list of pytest ids
      ("tests/<module>/<file>::<test>") ready to pass to run_pytest.
      `module` → return only that top-level module's subtree/ids.
    parameters:
      flatten:
        type: boolean
        default: false
        description: "true = flat pytest-id list instead of the nested tree."
      module:
        type: string
        description: "Restrict to one top-level module (e.g. 'L2'). Empty = all."
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const r = await fetch(`${apiBase}/adc/get_testcases`, { headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' }, credentials: 'include' });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) return { _error: `API ${r.status}` };
      const body = await r.json();
      // tree shape: { tests: { <module>: { <file.py>: [<test>, ...] } } }
      const root = body && body.tests ? body.tests : body;
      const rootKey = body && body.tests ? 'tests' : '';
      const modFilter = (args.module || '').trim();
      if (!args.flatten) {
        if (modFilter) return { module: modFilter, tree: (root || {})[modFilter] ?? null };
        return body;
      }
      const ids = [];
      for (const [mod, files] of Object.entries(root || {})) {
        if (modFilter && mod !== modFilter) continue;
        if (!files || typeof files !== 'object') continue;
        for (const [file, tests] of Object.entries(files)) {
          const base = [rootKey, mod, file].filter(Boolean).join('/');
          if (Array.isArray(tests) && tests.length) {
            for (const t of tests) ids.push(`${base}::${t}`);
          } else {
            ids.push(base);
          }
        }
      }
      return { module: modFilter || 'all', count: ids.length, testcase_ids: ids };

  # ─────────── run_pytest (destructive) ───────────
  run_pytest:
    description: |
      Kick off a pytest run on an automation lab. Asynchronous — returns
      an exec_id you then poll with get_test_execution. POST
      /adc/pytest_run { user, lab, testcase[], argument }.

      `testcase` is a list of pytest ids (from list_testcases flatten=true),
      e.g. ["tests/L2/test_l2_radius.py::test_basic_auth"]. A bare file
      ("tests/L2/test_l2_radius.py") or dir ("tests/L2/") runs everything
      under it.

      `argument` is raw pytest CLI flags injected verbatim (-vv, -x,
      -k 'expr', --collect-only, marker expressions, etc.).

      The lab must be owned by / shared with you and not already Running.
      On lab conflict the result has conflict_labs + usable_labs instead
      of exec_id.
    destructive: true
    parameters:
      lab:
        type: string
        description: "AT lab name (from list_automation_labs), e.g. 'AT16_Combined_FSW'. Comma-separate to span labs ('L2Mode_7,L2Mode_9'). If omitted and you own exactly one lab, it's auto-selected; if you own several, the tool returns the list so you can pick."
      testcase:
        type: json
        required: true
        description: "List of pytest ids (or a single string / CSV). e.g. [\"tests/L2/test_l2_radius.py::test_basic_auth\"]."
      argument:
        type: string
        default: ""
        description: "Raw pytest CLI args, e.g. \"-vv -x\" or \"-k 'radius and not flaky'\". Empty = none."
      user:
        type: string
        description: "TP login name. Default: derived from JWT."
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      let user = (args.user || '').trim();
      if (!user) { try { const p = JSON.parse(atob(jwt.split('.')[1])); user = p.username || p.email || ''; } catch {} }
      if (!user) return { _error: 'Could not determine TP username; pass `user` explicitly.' };
      let lab = String(args.lab || '').trim();
      if (!lab) {
        // No lab given — auto-pick if the user owns exactly one, else
        // surface the choices (don't guess when there are several).
        const lr = await fetch(`${apiBase}/adc/get_automation_lab`, { method: 'POST', headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json', 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ user }) });
        if (!lr.ok) return { _error: `lab not given and could not auto-resolve (labs HTTP ${lr.status}).` };
        const labs = await lr.json();
        const names = Array.isArray(labs) ? labs.map(l => l && l.name).filter(Boolean) : [];
        if (names.length === 1) lab = String(names[0]);
        else if (names.length === 0) return { _error: 'No automation labs are available to you.' };
        else return { _error: `Multiple labs available — specify which via lab=. Options: ${names.join(', ')}`, available_labs: names };
      }
      // Normalize testcase → array of strings (accept array, JSON string, or CSV)
      let tc = args.testcase;
      if (typeof tc === 'string') {
        const s = tc.trim();
        if (s.startsWith('[')) { try { tc = JSON.parse(s); } catch { tc = s.split(',').map(x => x.trim()).filter(Boolean); } }
        else tc = s.split(',').map(x => x.trim()).filter(Boolean);
      }
      if (!Array.isArray(tc) || tc.length === 0) return { _error: 'testcase must be a non-empty list of pytest ids' };
      tc = tc.map(String);
      const body = JSON.stringify({ user, lab, testcase: tc, argument: String(args.argument || '') });
      const r = await fetch(`${apiBase}/adc/pytest_run`, {
        method: 'POST',
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json', 'Content-Type': 'application/json' },
        credentials: 'include',
        body,
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) return { _error: `API ${r.status}`, body: (await r.text()).slice(0, 500) };
      const json = await r.json().catch(() => ({}));
      if (json && json.conflict_labs) return { ok: false, conflict: true, conflict_labs: json.conflict_labs, usable_labs: json.usable_labs, _hint: 'Lab busy with another run; pick a usable_lab or wait.' };
      if (json && json.error) return { _error: json.error };
      return { ok: true, lab, testcase: tc, argument: String(args.argument || ''), exec_id: json.exec_id ?? json.id ?? null, result: json };

  # ─────────── get_test_results ───────────
  get_test_results:
    description: |
      List the calling user's recent test executions with computed
      progress %. POST /adc/get_test_result { user }. Use this for "how
      are my runs doing"; use get_test_execution for one run's detail.
    parameters:
      user:
        type: string
        description: "TP login name. Default: derived from JWT."
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      let user = (args.user || '').trim();
      if (!user) { try { const p = JSON.parse(atob(jwt.split('.')[1])); user = p.username || p.email || ''; } catch {} }
      if (!user) return { _error: 'Could not determine TP username; pass `user` explicitly.' };
      const r = await fetch(`${apiBase}/adc/get_test_result`, {
        method: 'POST',
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json', 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ user }),
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) return { _error: `API ${r.status}`, body: (await r.text()).slice(0, 300) };
      const rows = await r.json();
      // report/log paths are server-relative; surface absolute URLs.
      if (Array.isArray(rows)) {
        for (const row of rows) {
          if (row && row.report_file_path) row.report_url = `${location.protocol}//${location.hostname}:8000/${String(row.report_file_path).replace(/^\//, '')}`;
          if (row && row.log_file_path) row.log_url = `${location.protocol}//${location.hostname}:8000/${String(row.log_file_path).replace(/^\//, '')}`;
        }
      }
      return { user, results: rows };

  # ─────────── get_test_execution ───────────
  get_test_execution:
    description: |
      Fetch one execution's full record (steps, counts, environment,
      timestamps, status, progress) for a run id from run_pytest or
      get_test_results. POST /adc/get_test_execution_by_id { id }.
    parameters:
      id:
        type: number
        required: true
        description: "Execution id (exec_id from run_pytest, or id from get_test_results)."
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      if (args.id == null) return { _error: 'id is required' };
      const r = await fetch(`${apiBase}/adc/get_test_execution_by_id`, {
        method: 'POST',
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json', 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ id: Number(args.id) }),
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (r.status === 404) return { _error: `Execution ${args.id} not found` };
      if (!r.ok) return { _error: `API ${r.status}`, body: (await r.text()).slice(0, 300) };
      return await r.json();

  # ─────────── lock_lab (destructive) ───────────
  lock_lab:
    description: |
      Lock or unlock an automation testbed to serialize exclusive
      hardware access. POST /adc/automation_lock { action, user, name }.
      `action` is "lock" or "unlock". Lock before a manual session;
      always unlock when done so others aren't blocked.
    destructive: true
    parameters:
      name:
        type: string
        required: true
        description: "Testbed name (from list_automation_labs)."
      action:
        type: select
        options: ["lock", "unlock"]
        default: "lock"
        description: "lock = mark in-use; unlock = release."
      user:
        type: string
        description: "TP login name. Default: derived from JWT."
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      let user = (args.user || '').trim();
      if (!user) { try { const p = JSON.parse(atob(jwt.split('.')[1])); user = p.username || p.email || ''; } catch {} }
      if (!user) return { _error: 'Could not determine TP username; pass `user` explicitly.' };
      const name = String(args.name || '').trim();
      if (!name) return { _error: 'name is required' };
      const action = (args.action === 'unlock') ? 'unlock' : 'lock';
      const r = await fetch(`${apiBase}/adc/automation_lock`, {
        method: 'POST',
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json', 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ action, user, name }),
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) return { _error: `API ${r.status}`, body: (await r.text()).slice(0, 300) };
      const json = await r.json().catch(() => ({}));
      return { ok: true, action, name, user, result: json };

  # ─────────── kill_test_execution (destructive) ───────────
  kill_test_execution:
    description: |
      Abort a running execution. The row stays in the DB with a terminal
      status; the pytest subprocess is sent SIGTERM. POST
      /adc/test_exec_kill { id }.
    destructive: true
    parameters:
      id:
        type: number
        required: true
        description: "Execution id to abort."
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      if (args.id == null) return { _error: 'id is required' };
      const r = await fetch(`${apiBase}/adc/test_exec_kill`, {
        method: 'POST',
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json', 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ id: Number(args.id) }),
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) return { _error: `API ${r.status}`, body: (await r.text()).slice(0, 300) };
      const json = await r.json().catch(() => ({}));
      return { ok: true, killed_exec_id: Number(args.id), result: json };

  # ═══════════════ NAC upgrade ═══════════════
  # An automation run targeting a specific build needs the testbed
  # upgraded first. Two modes: per-device (upgrade_device) and whole
  # testbed (upgrade_lab). Both are async — poll check_upgrade_status.
  # docs/tp-automation-api.md "NAC upgrade APIs".

  # ─────────── upgrade_lab (destructive) ───────────
  upgrade_lab:
    description: |
      Upgrade every NAC/NCM device in an automation testbed at once.
      POST /adc/nac-upgrade-testbed/ (multipart). Asynchronous — the
      call returns once the jobs are queued; poll completion with
      check_lab_upgrade_status (preferred) or check_upgrade_status
      per IP.

      Identify the testbed by `lab` (name) — its deployinfo (device →
      ip map) is resolved from list_automation_labs — or pass
      `deployinfo` directly as a JSON object/string.

      upgrade_type:
        GA      → latest GA image (no extra field)
        build   → a specific build; requires build_number (e.g. 7.6.6.0123)
        command → raw upgrade CLI; requires command
      ('file' mode isn't supported here — no way to attach an image
      from chat.)

      NOTE (from the API docs): testbed-mode `build` does NOT update
      is_upgrading while running — it only writes SUCCESS at the end.
      For live progress on a build upgrade, read the `log` field from
      check_upgrade_status instead of trusting is_upgrading.

      command/file upgrades block server-side for MINUTES (a NAC restore
      is ~5-10 min). This tool does NOT hold the call open that long: it
      sends the request, waits up to `wait_seconds` (default 25) just to
      confirm the server accepted it, then returns
      { ok:true, dispatched:true, fired_at }. The server keeps upgrading
      after the client disconnects (verified). Then poll
      check_lab_upgrade_status (pass the returned `fired_at` as `since`)
      until done:true.
    destructive: true
    timeout_ms: 120000
    parameters:
      lab:
        type: string
        description: "Testbed name (from list_automation_labs). Used to resolve deployinfo. Omit if you pass deployinfo directly."
      deployinfo:
        type: json
        description: |
          Full device map for the testbed — the SAME object the page
          posts: { dev0, ip0, dev1, ip1, ... } (0-indexed; include every
          device, the backend picks the NAC/NCM ones). Example:
          {"ip0":"10.15.52.151","dev0":"FortiGate","ip1":"10.15.52.152","dev1":"FortiNAC","ip2":"10.15.52.153","dev2":"FortiSwitch_Managed", ...}
          Optional if `lab` is given AND the lab record carries deployinfo.
      wait_seconds:
        type: number
        default: 25
        description: "How long to wait for the upgrade request to be accepted before detaching and returning dispatched:true. The upgrade continues server-side regardless."
      upgrade_type:
        type: select
        options: ["command", "build", "GA"]
        default: "command"
        description: "command (the common path here) / build / GA."
      build_number:
        type: string
        description: "Required when upgrade_type=build, e.g. '7.6.6.0123'."
      command:
        type: string
        description: |
          Required when upgrade_type=command. The raw NAC CLI upgrade
          command, run on every NAC/NCM in the testbed. Typical form
          (scp the built image off the jenkins server and restore):
          'execute restore image scp /var/lib/jenkins/jobs/fortinac-build-7.6-token/builds/17/archive/nacos/FNAC_ESX-v7-build6957-FORTINET_job1_17.out 10.15.33.5 jenkins fortinet'
          (the IP is the scp SOURCE server; 'jenkins fortinet' = scp user/pass).
      user:
        type: string
        description: "TP login name (for lab resolution). Default: derived from JWT."
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const hdr = { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' };
      const upgrade_type = ['GA', 'build', 'command'].includes(args.upgrade_type) ? args.upgrade_type : 'build';
      if (upgrade_type === 'build' && !String(args.build_number || '').trim()) return { _error: 'build_number is required when upgrade_type=build' };
      if (upgrade_type === 'command' && !String(args.command || '').trim()) return { _error: 'command is required when upgrade_type=command' };

      // Resolve deployinfo: explicit arg wins, else look it up by lab name.
      let deploy = args.deployinfo;
      if (typeof deploy === 'string' && deploy.trim()) { try { deploy = JSON.parse(deploy); } catch { return { _error: 'deployinfo is not valid JSON' }; } }
      if (!deploy || typeof deploy !== 'object') {
        const lab = String(args.lab || '').trim();
        if (!lab) return { _error: 'Pass `lab` (to resolve deployinfo) or `deployinfo` directly.' };
        let user = (args.user || '').trim();
        if (!user) { try { const p = JSON.parse(atob(jwt.split('.')[1])); user = p.username || p.email || ''; } catch {} }
        const lr = await fetch(`${apiBase}/adc/get_automation_lab`, { method: 'POST', headers: { ...hdr, 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ user }) });
        if (!lr.ok) return { _error: `Could not load labs to resolve deployinfo: HTTP ${lr.status}` };
        const labs = await lr.json();
        const row = Array.isArray(labs) ? labs.find(l => l && l.name === lab) : null;
        if (!row) return { _error: `Lab '${lab}' not found in your labs.` };
        let di = row.deployinfo;
        if (typeof di === 'string') { try { di = JSON.parse(di); } catch {} }
        if (!di || typeof di !== 'object') return { _error: `Lab '${lab}' has no usable deployinfo; pass deployinfo explicitly.`, _lab_row: row };
        deploy = di;
      }

      const fd = new FormData();
      fd.append('deployinfo', JSON.stringify(deploy));
      fd.append('upgrade_type', upgrade_type);
      if (upgrade_type === 'build') fd.append('build_number', String(args.build_number).trim());
      if (upgrade_type === 'command') fd.append('command', String(args.command).trim());

      // NAC/NCM IPs in this testbed (dev<N> value contains nac|ncm → ip<N>).
      const ips = [];
      for (const [k, v] of Object.entries(deploy)) {
        const m = /^dev(\d+)$/.exec(k);
        if (m && /nac|ncm/i.test(String(v))) { const ip = deploy[`ip${m[1]}`]; if (ip) ips.push(String(ip)); }
      }
      const firedAt = new Date().toISOString();
      // command/file block server-side for minutes. Don't hold the call:
      // wait `wait_seconds` just to confirm acceptance, then detach. The
      // server keeps upgrading after we disconnect (verified in the field).
      const waitMs = Math.max(5, Number(args.wait_seconds) || 25) * 1000;
      const ctrl = new AbortController();
      const to = setTimeout(() => ctrl.abort(), waitMs);
      try {
        const r = await fetch(`${apiBase}/adc/nac-upgrade-testbed/`, { method: 'POST', headers: hdr, credentials: 'include', body: fd, signal: ctrl.signal });
        clearTimeout(to);
        if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
        if (!r.ok) return { _error: `API ${r.status}`, body: (await r.text()).slice(0, 500) };
        const json = await r.json().catch(() => ({}));
        return { ok: true, dispatched: true, completed: true, upgrade_type, build_number: args.build_number || null, queued_ips: ips, fired_at: firedAt, result: json, _hint: `Returned before detach — upgrade finished fast. Verify with check_lab_upgrade_status (since='${firedAt}').` };
      } catch (e) {
        clearTimeout(to);
        if (e && e.name === 'AbortError') {
          return { ok: true, dispatched: true, completed: false, upgrade_type, build_number: args.build_number || null, queued_ips: ips, fired_at: firedAt, _hint: `Upgrade request accepted and detached after ${waitMs/1000}s; it runs server-side (~5-10 min for NAC). Poll check_lab_upgrade_status with lab/deployinfo and since='${firedAt}' until done:true.` };
        }
        return { _error: `Upgrade request failed: ${String(e)}` };
      }

  # ─────────── upgrade_device (destructive) ───────────
  upgrade_device:
    description: |
      Upgrade a single FortiNAC device by IP. POST /adc/nac-upgrade/
      (multipart). command/file block for minutes; like upgrade_lab this
      detaches after `wait_seconds` and returns dispatched:true + fired_at.
      Poll check_upgrade_status { ip } (with since=fired_at) until done.

      upgrade_type: GA (no extra field) / build (build_number) /
      command (command). 'file' mode not supported here.
    destructive: true
    timeout_ms: 120000
    parameters:
      ip:
        type: string
        required: true
        description: "Target device IP."
      wait_seconds:
        type: number
        default: 25
        description: "Seconds to wait for acceptance before detaching. Upgrade continues server-side."
      upgrade_type:
        type: select
        options: ["command", "build", "GA"]
        default: "command"
      build_number:
        type: string
        description: "Required when upgrade_type=build, e.g. '7.6.6.0123'."
      command:
        type: string
        description: |
          Required when upgrade_type=command. Raw NAC CLI upgrade cmd, e.g.
          'execute restore image scp /var/lib/jenkins/jobs/fortinac-build-7.6-token/builds/17/archive/nacos/FNAC_ESX-v7-build6957-FORTINET_job1_17.out 10.15.33.5 jenkins fortinet'
          (IP = scp source server; 'jenkins fortinet' = scp user/pass).
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const ip = String(args.ip || '').trim();
      if (!ip) return { _error: 'ip is required' };
      const upgrade_type = ['GA', 'build', 'command'].includes(args.upgrade_type) ? args.upgrade_type : 'build';
      if (upgrade_type === 'build' && !String(args.build_number || '').trim()) return { _error: 'build_number is required when upgrade_type=build' };
      if (upgrade_type === 'command' && !String(args.command || '').trim()) return { _error: 'command is required when upgrade_type=command' };
      const fd = new FormData();
      fd.append('ip', ip);
      fd.append('upgrade_type', upgrade_type);
      if (upgrade_type === 'build') fd.append('build_number', String(args.build_number).trim());
      if (upgrade_type === 'command') fd.append('command', String(args.command).trim());
      const firedAt = new Date().toISOString();
      const waitMs = Math.max(5, Number(args.wait_seconds) || 25) * 1000;
      const ctrl = new AbortController();
      const to = setTimeout(() => ctrl.abort(), waitMs);
      try {
        const r = await fetch(`${apiBase}/adc/nac-upgrade/`, { method: 'POST', headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' }, credentials: 'include', body: fd, signal: ctrl.signal });
        clearTimeout(to);
        if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
        if (!r.ok) return { _error: `API ${r.status}`, body: (await r.text()).slice(0, 500) };
        const json = await r.json().catch(() => ({}));
        return { ok: true, dispatched: true, completed: true, ip, upgrade_type, build_number: args.build_number || null, fired_at: firedAt, result: json, _hint: `Returned before detach. Verify with check_upgrade_status { ip } (since='${firedAt}').` };
      } catch (e) {
        clearTimeout(to);
        if (e && e.name === 'AbortError') {
          return { ok: true, dispatched: true, completed: false, ip, upgrade_type, build_number: args.build_number || null, fired_at: firedAt, _hint: `Request accepted and detached after ${waitMs/1000}s; upgrade runs server-side (~5-10 min). Poll check_upgrade_status { ip } with since='${firedAt}' until done.` };
        }
        return { _error: `Upgrade request failed: ${String(e)}` };
      }

  # ─────────── check_upgrade_status ───────────
  check_upgrade_status:
    description: |
      Poll the upgrade status of one device by IP. POST
      /adc/check-upgrade-status/ { ip }. Returns is_upgrading,
      last_task_status (SUCCESS/FAILURE/PENDING/PROGRESS), build/image
      info, updated_at, and a `log` tail.

      CAVEAT (testbed-mode build): is_upgrading stays false during a
      testbed `build` upgrade — it only flips on the final SUCCESS.
      For live progress, read the `log` field. (Set include_log=false
      to drop the potentially-large log from the response.)
    parameters:
      ip:
        type: string
        required: true
        description: "Device IP to poll."
      include_log:
        type: boolean
        default: true
        description: "false = strip the `log` field (can be large)."
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const ip = String(args.ip || '').trim();
      if (!ip) return { _error: 'ip is required' };
      const r = await fetch(`${apiBase}/adc/check-upgrade-status/`, { method: 'POST', headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json', 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ ip }) });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (r.status === 404) return { ip, found: false, _note: 'No upgrade record for this IP (never upgraded, or testbed-GA stub).' };
      if (!r.ok) return { _error: `API ${r.status}`, body: (await r.text()).slice(0, 300) };
      const json = await r.json().catch(() => ({}));
      if (args.include_log === false && json && typeof json === 'object') delete json.log;
      return json;

  # ─────────── check_lab_upgrade_status ───────────
  check_lab_upgrade_status:
    description: |
      Answer "is the testbed upgrade finished?" Resolves the NAC/NCM
      devices in a testbed (by `lab` name or explicit `deployinfo`),
      polls check-upgrade-status for each, and aggregates one verdict.

      IMPORTANT — avoid false "done": check-upgrade-status returns the
      LAST upgrade record, which may be days old (a stale SUCCESS from a
      previous build). last_task_status=SUCCESS alone is NOT proof the
      current upgrade finished. Two ways to disambiguate, both supported:
        • `since` (recommended): pass the `fired_at` returned by
          upgrade_lab. A device only counts as done if its `updated_at`
          is at/after `since` (i.e. the record was written by THIS run).
          A device still showing an older record → reported not-done
          (it's probably still upgrading / rebooting).
        • `target_image`: a substring of the image/build you're moving
          to (e.g. 'build6957' or '6957'). A device is done only if its
          last_image_name/last_build_number contains it.
      Each device also reports `minutes_since_update` so you can eyeball
      freshness. Poll every ~30-60s; a NAC upgrade is ~5-10 min.
    parameters:
      lab:
        type: string
        description: "Testbed name (resolves deployinfo via list_automation_labs)."
      deployinfo:
        type: json
        description: "Device map (0-indexed dev0/ip0…), if you'd rather pass it directly than resolve by lab."
      since:
        type: string
        description: "ISO timestamp (the upgrade_lab `fired_at`). A device is only 'done' if its updated_at >= since. Strongly recommended to avoid stale-SUCCESS false positives."
      target_image:
        type: string
        description: "Optional substring of the target build/image (e.g. '6957'). Device is done only if last_image_name/last_build_number contains it."
      include_log:
        type: boolean
        default: false
        description: "true = keep each device's `log` tail (large). Default false."
      user:
        type: string
        description: "TP login name (for lab resolution). Default: derived from JWT."
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const hdr = { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' };

      let deploy = args.deployinfo;
      if (typeof deploy === 'string' && deploy.trim()) { try { deploy = JSON.parse(deploy); } catch { return { _error: 'deployinfo is not valid JSON' }; } }
      if (!deploy || typeof deploy !== 'object') {
        const lab = String(args.lab || '').trim();
        if (!lab) return { _error: 'Pass `lab` or `deployinfo`.' };
        let user = (args.user || '').trim();
        if (!user) { try { const p = JSON.parse(atob(jwt.split('.')[1])); user = p.username || p.email || ''; } catch {} }
        const lr = await fetch(`${apiBase}/adc/get_automation_lab`, { method: 'POST', headers: { ...hdr, 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ user }) });
        if (!lr.ok) return { _error: `Could not load labs: HTTP ${lr.status}` };
        const labs = await lr.json();
        const row = Array.isArray(labs) ? labs.find(l => l && l.name === lab) : null;
        if (!row) return { _error: `Lab '${lab}' not found.` };
        let di = row.deployinfo;
        if (typeof di === 'string') { try { di = JSON.parse(di); } catch {} }
        if (!di || typeof di !== 'object') return { _error: `Lab '${lab}' has no usable deployinfo; pass deployinfo explicitly.` };
        deploy = di;
      }

      // Collect NAC/NCM IPs (dev<N> value contains nac|ncm → ip<N>).
      const targets = [];
      for (const [k, v] of Object.entries(deploy)) {
        const m = /^dev(\d+)$/.exec(k);
        if (m && /nac|ncm/i.test(String(v))) { const ip = deploy[`ip${m[1]}`]; if (ip) targets.push({ dev: String(v), ip: String(ip) }); }
      }
      if (!targets.length) return { _error: 'No NAC/NCM devices found in deployinfo.', deployinfo: deploy };

      const now = Date.now();
      const sinceMs = args.since ? Date.parse(String(args.since)) : null;
      const target = String(args.target_image || '').trim().toLowerCase();
      const devices = [];
      for (const t of targets) {
        try {
          const r = await fetch(`${apiBase}/adc/check-upgrade-status/`, { method: 'POST', headers: { ...hdr, 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ ip: t.ip }) });
          if (r.status === 404) { devices.push({ ...t, found: false, last_task_status: null, is_upgrading: false, fresh: false }); continue; }
          if (!r.ok) { devices.push({ ...t, _error: `HTTP ${r.status}` }); continue; }
          const j = await r.json().catch(() => ({}));
          if (args.include_log !== true && j && typeof j === 'object') delete j.log;
          const updMs = j.updated_at ? Date.parse(String(j.updated_at)) : NaN;
          const minsSince = Number.isFinite(updMs) ? Math.round((now - updMs) / 60000) : null;
          const fresh = sinceMs == null ? null : (Number.isFinite(updMs) && updMs >= sinceMs - 2000);
          const imgStr = `${j.last_image_name || ''} ${j.last_build_number || ''}`.toLowerCase();
          const imageMatch = target ? imgStr.includes(target) : null;
          devices.push({ ...t, found: true, is_upgrading: !!j.is_upgrading, last_task_status: j.last_task_status, last_build_number: j.last_build_number, last_image_name: j.last_image_name, updated_at: j.updated_at, minutes_since_update: minsSince, ...(fresh != null ? { fresh } : {}), ...(imageMatch != null ? { image_matches_target: imageMatch } : {}), ...(args.include_log === true ? { log: j.log } : {}) });
        } catch (e) { devices.push({ ...t, _error: String(e) }); }
      }
      const anyUpgrading = devices.some(d => d.is_upgrading);
      const anyFailure = devices.some(d => d.last_task_status === 'FAILURE');
      // A device is "done for THIS run" only if: terminal status, not
      // upgrading, fresh (when `since` given), and image matches (when
      // `target_image` given). Stale/old records → not done.
      const isDone = (d) => {
        if (d._error) return false;
        if (d.is_upgrading) return false;
        if (!(d.last_task_status === 'SUCCESS' || d.last_task_status === 'FAILURE')) return false;
        if (sinceMs != null && d.fresh !== true) return false;
        if (target && d.image_matches_target !== true) return false;
        return true;
      };
      const done = devices.length > 0 && devices.every(isDone);
      const stale = sinceMs != null && devices.filter(d => d.found && d.fresh === false);
      return {
        lab: args.lab || null,
        device_count: devices.length,
        done,
        any_upgrading: anyUpgrading,
        any_failure: anyFailure,
        since: args.since || null,
        target_image: args.target_image || null,
        ...(sinceMs != null ? { stale_devices: (stale || []).map(d => d.ip) } : {}),
        ...((sinceMs == null && !target) ? { _warn: 'No `since`/`target_image` given — `done` trusts last_task_status, which may be a STALE success from a previous upgrade. Pass since=fired_at for a reliable verdict.' } : {}),
        devices,
      };

test:
  description: "Opens TP and verifies the session JWT is in localStorage."
  probe: browser
  timeout_ms: 20000
