id: tp
name: FortiNAC Test Platform
icon: 🧪
version: "0.7.1"
author: forge
category: connector
mode: browser-side
description: |
  FortiNAC Test Platform (TP) — browser-side connector reusing the
  user's logged-in session. Calls TP's internal REST API directly
  using the JWT held in localStorage (no DOM scraping, no token in
  Forge settings — re-login refreshes automatically).

  v0.3 — 5 read tools.
  v0.4 — 3 destructive tools: add_weekly_status, add_comment,
    edit_nfr_field. Endpoints captured by intercepting the page's
    own XHR submit (weekly_status + edit verified; add_comment
    follows the same naming convention but the modal didn't auto-
    open during probing, so a first call may surface 404 if the
    convention is off — try a single call to verify).

  v0.5 — automation workflow (same connector, shared JWT auth):
    versions / labs / testcases discovery, run_pytest (destructive),
    test result + execution polling, lab lock + kill (destructive).
    Endpoints from docs/tp-automation-api.md (Automation.jsx contract).

  v0.6 — NAC firmware upgrade REMOVED from here (it was unstable via
    TP's automation page). Use the dedicated `nac` connector (direct
    SSH). TP now only exposes get_lab_devices to find a lab's NAC IP,
    which you then upgrade via nac.upgrade.

  v0.7 — run_pytest + get_test_execution switched to the v2 automation
    API (docs/tp-automation-api-v2.md). Endpoints, status enum, and
    response shape all changed:
      run_pytest          → POST /adc/automation/pytest/    (was /adc/pytest_run)
      get_test_execution  → GET  /adc/automation/pytest/<id>/  (was POST /adc/get_test_execution_by_id)
    Polling fields: status ∈ {Initiating, Running, Done, Failed,
    Cancelled} — `Done` is terminal (pass/fail inferred from counts).
    Counts (pass_count/fail_count/skip_count/error_count/total_count)
    populated mid-run. Also: list_testcases flatten paths are now
    relative to /root/fnac_auto/tests (no `tests/` prefix) — the v1
    prefix double-pathed against the v2 server (`teststests/...`).

  v0.7.1 — list_testcases rewritten: /adc/get_testcases now returns
    a recursive `{children: [{identifier, name, children?}]}` tree
    (the old flat `{tests: {<mod>: {<file>: [tests]}}}` shape is
    gone). The old flatten walked it as `Object.entries` and
    produced garbage like `children/0`, `children/1`. New impl
    walks the tree properly and joins names with `/` for dirs,
    `::` for the final TestClass/test_method leaf. Adds `search`
    param for substring filter (so the LLM can grep e.g.
    `_01_administrators` without dumping the whole 500KB tree).

settings:
  base_url:
    type: string
    label: TP base URL
    description: "e.g. https://nac-tp.fortinet-us.com"
    required: true
    default: "https://nac-tp.fortinet-us.com"
  api_base_url:
    type: string
    label: TP API base URL
    description: "TP's internal REST API host. NAC TP uses port 8000."
    required: true
    default: "https://nac-tp.fortinet-us.com:8000"
  username:
    type: string
    label: Your TP username
    description: |
      Used by 'owner_filter: me' to find NFRs you own across any of
      the assignee fields. Match the name as it appears in TP
      (e.g. 'Ryan Sun' — full name, not the email prefix).
    required: true

host_match: "{base_url}/*"
login_redirect: "/login"
runner: main
# Always open a fresh background tab per call (closed afterwards).
# Costs ~5-10s per call cold-load + SAML round-trip, but isolates
# every call from whatever stale state (expired JWT, wrong route,
# old SAML challenge) the user's existing TP tab might be in.
# Trade-off accepted in v0.4.3 after a session where a stale tab on
# the SSO login page made every API call return nginx 405.
tab_strategy: ephemeral

# ─── Shared script preamble (injected via {settings.*} expansion) ──
# Each tool's script duplicates the JWT lookup + fetch helper. Could
# be DRY'd via a shared file later — manifests don't support imports.

tools:

  # ─────────── list_nfrs (CA & NCM) ───────────
  list_nfrs:
    description: |
      List NFRs from the CA & NCM module via TP's REST API. Returns the
      full set for the given release in one call (no pagination).

      `owner_filter` searches nfr_owner / pd_assignee / backend_assignee /
      frontend_assignee / at_assignee / qa_assignee. Special value 'me'
      resolves to settings.username.

      `verbose: false` (default) → slim 14-field view (LLM-friendly).
      `verbose: true` → full ~50-field record per NFR.
    parameters:
      release:
        type: string
        default: "all"
        description: "Release filter. 'all' = every release; or an exact tag like '7.6.7' / '7.4.0'. Partial like '7.6' returns nothing — must be exact (call list_releases to see valid tags)."
      owner_filter:
        type: string
        description: "Filter rows where any owner/assignee column contains this string. 'me' = settings.username. Empty = no filter."
      verbose:
        type: boolean
        default: false
        description: "false = slim view. true = full payload (incl. dates, doc links, bugs list)."
    page:
      url: "{base_url}/nfr"
      on_target: "/nfr"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP. Open the TP tab and sign in, then retry.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const url = `${apiBase}/adc/get_nfr_list/${encodeURIComponent(args.release || 'all')}`;
      const r = await fetch(url, { headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' }, credentials: 'include' });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — JWT expired, re-login.`, url };
      if (!r.ok) return { _error: `API ${r.status}`, url };
      const all = await r.json();
      if (!Array.isArray(all)) return { _error: 'API did not return an array', url };
      const myName = '{settings.username}';
      let effOwner = (args.owner_filter || '').trim();
      if (effOwner === 'me') effOwner = myName;
      let filtered = all;
      if (effOwner) {
        const q = effOwner.toLowerCase();
        const matchFields = ['nfr_owner', 'pd_assignee', 'backend_assignee', 'frontend_assignee', 'at_assignee', 'qa_assignee'];
        filtered = all.filter(r => matchFields.some(f => (r[f] || '').toLowerCase().includes(q)));
      }
      const slim = (r) => ({
        id: r.id, subject: r.subject, release: r.release, priority: r.priority,
        category: r.category, source: r.source, status: r.status, progress: r.progress,
        nfr_owner: r.nfr_owner, qa_assignee: r.qa_assignee, backend_assignee: r.backend_assignee,
        bugs: r.bugs ? { total: r.bugs.total, assigned: r.bugs.assigned } : null,
        pmdb: r.pmdb, mantis_nfr: r.mantis_nfr,
        detail_url: `${location.origin}/nfr-detail?id=${r.id}`,
      });
      const rows = args.verbose ? filtered : filtered.map(slim);
      return { release: args.release || 'all', owner_filter: effOwner || null, total: all.length, returned: rows.length, verbose: !!args.verbose, rows };

  # ─────────── list_device_integration ───────────
  list_device_integration:
    description: |
      List items from the Device Integration module. Same shape as
      list_nfrs (owner_filter / verbose) — different upstream module.
      Useful when the user asks about device-integration NFRs.
    parameters:
      release:
        type: string
        default: "all"
        description: "Release tag (e.g. '7.6.7') or 'all'. Call list_releases module='Device Integration' to see valid tags."
      owner_filter:
        type: string
        description: "Same as list_nfrs. 'me' = settings.username."
      verbose:
        type: boolean
        default: false
    page:
      url: "{base_url}/device-integration"
      on_target: "/device-integration"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const url = `${apiBase}/adc/get_device_integration_agent_list/${encodeURIComponent(args.release || 'all')}/Device%20Integration`;
      const r = await fetch(url, { headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' }, credentials: 'include' });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — JWT expired, re-login.`, url };
      if (!r.ok) return { _error: `API ${r.status}`, url };
      const all = await r.json();
      if (!Array.isArray(all)) return { _error: 'API did not return an array', url };
      const myName = '{settings.username}';
      let effOwner = (args.owner_filter || '').trim();
      if (effOwner === 'me') effOwner = myName;
      let filtered = all;
      if (effOwner) {
        const q = effOwner.toLowerCase();
        const matchFields = ['nfr_owner', 'pd_assignee', 'backend_assignee', 'frontend_assignee', 'at_assignee', 'qa_assignee'];
        filtered = all.filter(r => matchFields.some(f => (r[f] || '').toLowerCase().includes(q)));
      }
      const slim = (r) => ({
        id: r.id, subject: r.subject, release: r.release, priority: r.priority,
        category: r.category, source: r.source, status: r.status, progress: r.progress,
        nfr_owner: r.nfr_owner, qa_assignee: r.qa_assignee,
        bugs: r.bugs ? { total: r.bugs.total, assigned: r.bugs.assigned } : null,
        pmdb: r.pmdb, mantis_nfr: r.mantis_nfr,
        detail_url: `${location.origin}/nfr-detail?id=${r.id}`,
      });
      const rows = args.verbose ? filtered : filtered.map(slim);
      return { module: 'Device Integration', release: args.release || 'all', owner_filter: effOwner || null, total: all.length, returned: rows.length, verbose: !!args.verbose, rows };

  # ─────────── list_agent ───────────
  list_agent:
    description: |
      List items from the Agent module. Same shape as list_nfrs.
    parameters:
      release:
        type: string
        default: "all"
        description: "Release tag or 'all'. Call list_releases module='Agent' to see valid tags."
      owner_filter:
        type: string
        description: "Same as list_nfrs. 'me' = settings.username."
      verbose:
        type: boolean
        default: false
    page:
      url: "{base_url}/agent"
      on_target: "/agent"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const url = `${apiBase}/adc/get_device_integration_agent_list/${encodeURIComponent(args.release || 'all')}/Agent`;
      const r = await fetch(url, { headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' }, credentials: 'include' });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — JWT expired, re-login.`, url };
      if (!r.ok) return { _error: `API ${r.status}`, url };
      const all = await r.json();
      if (!Array.isArray(all)) return { _error: 'API did not return an array', url };
      const myName = '{settings.username}';
      let effOwner = (args.owner_filter || '').trim();
      if (effOwner === 'me') effOwner = myName;
      let filtered = all;
      if (effOwner) {
        const q = effOwner.toLowerCase();
        const matchFields = ['nfr_owner', 'pd_assignee', 'backend_assignee', 'frontend_assignee', 'at_assignee', 'qa_assignee'];
        filtered = all.filter(r => matchFields.some(f => (r[f] || '').toLowerCase().includes(q)));
      }
      const slim = (r) => ({
        id: r.id, subject: r.subject, release: r.release, priority: r.priority,
        category: r.category, source: r.source, status: r.status, progress: r.progress,
        nfr_owner: r.nfr_owner, qa_assignee: r.qa_assignee,
        bugs: r.bugs ? { total: r.bugs.total, assigned: r.bugs.assigned } : null,
        pmdb: r.pmdb, mantis_nfr: r.mantis_nfr,
        detail_url: `${location.origin}/nfr-detail?id=${r.id}`,
      });
      const rows = args.verbose ? filtered : filtered.map(slim);
      return { module: 'Agent', release: args.release || 'all', owner_filter: effOwner || null, total: all.length, returned: rows.length, verbose: !!args.verbose, rows };

  # ─────────── get_nfr (full detail) ───────────
  get_nfr:
    description: |
      Fetch a single NFR with everything: full record fields, weekly
      status history, change history, and comments. Use when the
      user asks "what's the latest on NFR <id>" or wants to see
      progress notes.

      Pass `include` to slim the response — accepts a CSV of:
      detail, weekly, history, comments. Default: all four.
    parameters:
      id:
        type: number
        required: true
        description: "NFR id (the number in subject_url / detail page URL)."
      include:
        type: string
        default: "detail,weekly,history,comments"
        description: "CSV of sections to fetch. Default fetches everything. Use 'detail,weekly' to skip history+comments."
      weekly_limit:
        type: number
        default: 10
        description: "Cap the number of weekly status entries returned (newest first). Set 0 for no cap."
    page:
      url: "{base_url}/nfr-detail?id={args.id}"
      on_target: "/nfr-detail"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const hdr = { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' };
      const id = args.id;
      if (id == null) return { _error: 'id is required' };
      const include = String(args.include || 'detail,weekly,history,comments').split(',').map(s => s.trim()).filter(Boolean);
      const inc = new Set(include);
      const get = async (path) => {
        try {
          const r = await fetch(`${apiBase}${path}`, { headers: hdr, credentials: 'include' });
          if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status}` };
          if (!r.ok) return { _error: `${r.status}`, _path: path };
          const ct = r.headers.get('content-type') || '';
          return ct.includes('json') ? await r.json() : (await r.text()).slice(0, 500);
        } catch (e) { return { _error: String(e) }; }
      };
      const out = { id };
      if (inc.has('detail')) out.detail = await get(`/adc/get_nfr_detail/${id}`);
      if (inc.has('weekly')) {
        const w = await get(`/adc/get_nfr_weekly_status/${id}`);
        if (Array.isArray(w)) {
          const cap = Number(args.weekly_limit ?? 10);
          out.weekly_status = cap > 0 ? w.slice(0, cap) : w;
          out.weekly_status_total = w.length;
        } else {
          out.weekly_status = w;
        }
      }
      if (inc.has('history')) out.history = await get(`/adc/get_nfr_history/${id}`);
      if (inc.has('comments')) out.comments = await get(`/adc/get_nfr_comment/${id}`);
      return out;

  # ─────────── list_releases ───────────
  list_releases:
    description: |
      List valid release tags for a TP module. Call before list_*
      tools when the user doesn't know the exact release tag (TP
      requires exact tags like '7.6.7' — '7.6' returns nothing).
    parameters:
      module:
        type: select
        options: ["NFR", "Device Integration", "Agent"]
        default: "NFR"
        description: "Which TP module to query release tags for."
    page:
      url: "{base_url}/nfr"
      on_target: "/"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const url = `${apiBase}/adc/get_version_list/${encodeURIComponent(args.module || 'NFR')}`;
      const r = await fetch(url, { headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' }, credentials: 'include' });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.`, url };
      if (!r.ok) return { _error: `API ${r.status}`, url };
      const body = await r.json();
      return { module: args.module || 'NFR', releases: body };

  # ─────────── add_weekly_status (destructive) ───────────
  add_weekly_status:
    description: |
      Add a weekly status entry to an NFR. Status_message is HTML
      (the upstream UI uses a Quill rich-text editor — plain text or
      simple <p>...</p> wrappers are fine).

      Verified endpoint shape: POST /adc/add_nfr_weekly_status/ with
      JSON { nfr_id, week_starting_date, week_ending_date,
      status_message, user }. The user email is auto-derived from
      the JWT payload — no need to pass.

      Dates accept YYYY-MM-DD. If you omit them, the script defaults
      to the current week (Monday → Sunday).
    destructive: true
    parameters:
      nfr_id:
        type: number
        required: true
        description: "NFR id."
      status_message:
        type: string
        required: true
        description: "Status text. Plain text gets wrapped in <p>; full HTML is preserved."
      week_starting_date:
        type: string
        description: "YYYY-MM-DD. Default: this Monday."
      week_ending_date:
        type: string
        description: "YYYY-MM-DD. Default: this Sunday."
    page:
      url: "{base_url}/nfr-detail?id={args.nfr_id}"
      on_target: "/nfr-detail"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      // Decode JWT payload to grab the user email.
      let userEmail = '';
      try {
        const p = JSON.parse(atob(jwt.split('.')[1]));
        userEmail = p.email || p.username || '';
      } catch {}
      if (!userEmail) return { _error: 'Could not extract user email from JWT payload.' };

      // Default dates → current week (Mon..Sun)
      const today = new Date();
      const dow = today.getDay() === 0 ? 7 : today.getDay();   // Sunday=7 not 0
      const mon = new Date(today); mon.setDate(today.getDate() - (dow - 1));
      const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
      const iso = (d) => d.toISOString().slice(0, 10);
      const weekStart = args.week_starting_date || iso(mon);
      const weekEnd = args.week_ending_date || iso(sun);

      // Wrap plain text in <p> if it doesn't already look like HTML
      let msg = String(args.status_message || '');
      if (msg && !/<[a-z][^>]*>/i.test(msg)) msg = `<p>${msg.replace(/\n/g, '</p><p>')}</p>`;

      const body = JSON.stringify({
        nfr_id: Number(args.nfr_id),
        week_starting_date: weekStart,
        week_ending_date: weekEnd,
        status_message: msg,
        user: userEmail,
      });

      const r = await fetch(`${apiBase}/adc/add_nfr_weekly_status/`, {
        method: 'POST',
        headers: {
          'Authorization': `JWT ${jwt}`,
          'Accept': 'application/json',
          'Content-Type': 'application/json',
        },
        credentials: 'include',
        body,
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) {
        const t = await r.text();
        return { _error: `API ${r.status}`, body: t.slice(0, 500) };
      }
      const json = await r.json().catch(() => ({}));
      return {
        ok: true,
        nfr_id: Number(args.nfr_id),
        week_starting_date: weekStart,
        week_ending_date: weekEnd,
        created: json,
      };

  # ─────────── add_comment (destructive) ───────────
  add_comment:
    description: |
      Add a comment to an NFR. Verified endpoint:
      POST /adc/add_nfr_comment (no trailing slash) with JSON
      { id, comment, user, action: "add" }. Comment is plain text
      (the upstream UI wraps via Quill but the API accepts raw).
    destructive: true
    parameters:
      nfr_id:
        type: number
        required: true
        description: "NFR id."
      comment:
        type: string
        required: true
        description: "Comment text."
    page:
      url: "{base_url}/nfr-detail?id={args.nfr_id}"
      on_target: "/nfr-detail"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      let userEmail = '';
      try {
        const p = JSON.parse(atob(jwt.split('.')[1]));
        userEmail = p.email || p.username || '';
      } catch {}
      if (!userEmail) return { _error: 'Could not extract user email from JWT.' };

      const body = JSON.stringify({
        user: userEmail,
        comment: String(args.comment || ''),
        id: Number(args.nfr_id),
        action: 'add',
      });

      const r = await fetch(`${apiBase}/adc/add_nfr_comment`, {
        method: 'POST',
        headers: {
          'Authorization': `JWT ${jwt}`,
          'Accept': 'application/json, text/plain, */*',
          'Content-Type': 'application/json;charset=UTF-8',
        },
        credentials: 'include',
        body,
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) {
        const t = await r.text();
        return { _error: `API ${r.status}`, body: t.slice(0, 500) };
      }
      const json = await r.json().catch(() => ({}));
      return { ok: true, nfr_id: Number(args.nfr_id), created: json };

  # ─────────── delete_weekly_status (destructive) ───────────
  delete_weekly_status:
    description: |
      Delete a specific weekly status entry by its weekly_status id
      (NOT the NFR id — get the id from get_nfr's weekly_status[].id
      field). Verified endpoint: DELETE /adc/delete_nfr_weekly_status/{id}.
    destructive: true
    parameters:
      weekly_status_id:
        type: number
        required: true
        description: "Weekly status entry id (from get_nfr().weekly_status[].id)."
    page:
      url: "{base_url}/nfr"
      on_target: "/"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const id = Number(args.weekly_status_id);
      const r = await fetch(`${apiBase}/adc/delete_nfr_weekly_status/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' },
        credentials: 'include',
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) {
        const t = await r.text();
        return { _error: `API ${r.status}`, body: t.slice(0, 300) };
      }
      return { ok: true, deleted_weekly_status_id: id };

  # ─────────── edit_nfr_field (destructive) ───────────
  edit_nfr_field:
    description: |
      Edit one or more fields on an NFR. TP's edit endpoint requires
      the FULL detail object back as multipart FormData on every save
      (it's a treat-the-NFR-as-one-form contract). This tool reads the
      current detail, overlays your `patch` object, and re-submits the
      full record.

      Verified endpoint: POST /adc/edit_nfr_detail (FormData, all
      ~50 fields + id + user).

      Pass `patch` as an object of field_name → new_value. Only the
      fields you want to change need to be in `patch`. Common
      editable fields:
        subject, release, priority, status, progress,
        pd_assignee, backend_assignee, frontend_assignee,
        at_assignee, qa_assignee, nfr_owner, git, git_branch, pmdb,
        mantis_nfr, mantis_dev, mantis_doc, description,
        story_point_backend, story_point_frontend,
        pd_due, backend_due, frontend_due, qa_due, toi_due, ...
    destructive: true
    parameters:
      id:
        type: number
        required: true
        description: "NFR id."
      patch:
        type: json
        required: true
        description: |
          Object of fields to update, e.g. { "progress": "75%",
          "qa_due": "2026-04-30" }. Other fields are preserved from
          the current detail.
    page:
      url: "{base_url}/nfr-detail?id={args.id}"
      on_target: "/nfr-detail"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      let userEmail = '';
      try {
        const p = JSON.parse(atob(jwt.split('.')[1]));
        userEmail = p.email || p.username || '';
      } catch {}
      if (!userEmail) return { _error: 'Could not extract user email from JWT.' };

      // 1) Fetch current detail (we need to send ALL fields back)
      const detailResp = await fetch(`${apiBase}/adc/get_nfr_detail/${Number(args.id)}`, {
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' },
        credentials: 'include',
      });
      if (detailResp.status === 401 || detailResp.status === 403) return { _error: `Auth ${detailResp.status}` };
      if (!detailResp.ok) return { _error: `Could not load current detail: HTTP ${detailResp.status}` };
      const current = await detailResp.json();

      // 2) Parse patch (LLM may pass as object OR JSON string)
      let patch = args.patch;
      if (typeof patch === 'string') {
        try { patch = JSON.parse(patch); } catch { return { _error: 'patch is not valid JSON' }; }
      }
      if (!patch || typeof patch !== 'object' || Array.isArray(patch)) {
        return { _error: 'patch must be a JSON object of field → value' };
      }

      // 3) Merge — known editable fields only; reject unknown to surface typos.
      const merged = { ...current };
      const declined = [];
      for (const [k, v] of Object.entries(patch)) {
        if (!(k in current) && !['mantis_dev', 'description'].includes(k)) {
          declined.push(k);
          continue;
        }
        merged[k] = v;
      }
      if (declined.length > 0 && Object.keys(patch).length === declined.length) {
        return { _error: `Unknown field(s): ${declined.join(', ')}. Valid fields: ${Object.keys(current).join(', ')}` };
      }

      // 4) Build FormData. CRITICAL: send ONLY the fields the page's own
      // edit form submits (captured from a real /adc/edit_nfr_detail POST).
      // get_nfr_detail returns ~22 EXTRA read-only/derived fields (all the
      // *_due dates, *_doc links, nfr_test_task_*, qa_test_result, etc.) that
      // the page NEVER posts; including them (as empty strings) makes the
      // backend silently drop the save — the bug behind "edit had no effect".
      // Whitelist below = exact field set from the page's FormData.
      const EDITABLE = [
        'id', 'release', 'subject', 'source', 'category', 'status', 'progress',
        'priority', 'git', 'git_branch', 'pmdb', 'pd_assignee', 'backend_assignee',
        'frontend_assignee', 'at_assignee', 'qa_assignee', 'nfr_owner', 'created_time',
        'doc', 'description', 'doc_status', 'mantis_dev', 'mantis_nfr', 'mantis_doc',
        'merged', 'story_point_backend', 'story_point_frontend',
        'conceptual_design_progress', 'ux_design_progress',
        'dev_implement_backend_progress', 'dev_implement_frontend_progress',
        'dev_integration_progress', 'qa_test_progress', 'qa_toi_progress',
      ];
      const fd = new FormData();
      for (const k of EDITABLE) {
        const v = merged[k];
        if (v == null) fd.append(k, '');
        else if (typeof v === 'object') fd.append(k, JSON.stringify(v));
        else fd.append(k, String(v));
      }
      fd.append('user', userEmail);

      // 5) Submit
      const r = await fetch(`${apiBase}/adc/edit_nfr_detail`, {
        method: 'POST',
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' },
        // Don't set Content-Type — browser sets boundary automatically for FormData
        credentials: 'include',
        body: fd,
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status}` };
      if (!r.ok) {
        const t = await r.text();
        return { _error: `API ${r.status}`, body: t.slice(0, 500) };
      }
      const json = await r.json().catch(() => ({}));
      return {
        ok: true,
        id: Number(args.id),
        changed: Object.keys(patch).filter(k => !declined.includes(k)),
        declined_fields: declined,
        result: json,
      };

  # ═══════════════ Automation module ═══════════════
  # Discovery/list endpoints are the legacy /adc/* set. run_pytest +
  # get_test_execution use the v2 automation API (docs/tp-automation-
  # api-v2.md): POST/GET /adc/automation/pytest/. Same JWT-in-
  # localStorage auth as the NFR tools above. The `user` field these
  # endpoints want is the TP login name (usedby lists show names
  # like "alice"), derived from the JWT
  # payload (username → email); pass `user` explicitly if that's wrong.

  # ─────────── list_automation_versions ───────────
  list_automation_versions:
    description: |
      List the FortiNAC versions the automation pipeline tracks
      (populates the version dropdown). GET /adc/automation-verion/.
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const r = await fetch(`${apiBase}/adc/automation-verion/`, { headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' }, credentials: 'include' });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) return { _error: `API ${r.status}` };
      return await r.json();

  # ─────────── list_automation_labs ───────────
  list_automation_labs:
    description: |
      List the automation testbeds (labs) the calling user can see —
      owned or shared. Each entry has a live `status` ("Available" /
      "Running"). POST /adc/get_automation_lab { user }.
    parameters:
      user:
        type: string
        description: "TP login name. Default: derived from JWT. Override if the lab list comes back empty."
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      let user = (args.user || '').trim();
      if (!user) { try { const p = JSON.parse(atob(jwt.split('.')[1])); user = p.username || p.email || ''; } catch {} }
      if (!user) return { _error: 'Could not determine TP username; pass `user` explicitly.' };
      const r = await fetch(`${apiBase}/adc/get_automation_lab`, {
        method: 'POST',
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json', 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ user }),
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) return { _error: `API ${r.status}`, body: (await r.text()).slice(0, 300) };
      return { user, labs: await r.json() };

  # ─────────── list_testcases ───────────
  list_testcases:
    description: |
      Discover pytest test ids on TP. GET /adc/get_testcases returns
      a recursive `{children: [{identifier, name, children?}]}` tree
      (folders → files → TestClass::test_method leaves). We walk it
      and emit pytest ids relative to `/root/fnac_auto/tests`, ready
      to drop into run_pytest.

      SIDE-EFFECT: the backend pulls the latest `main` of TP's local
      test-framework clone before parsing. Harmless in normal use, but
      it will rebase any branch a developer is hand-testing on the TP
      host. Don't call this on a tight loop.

      Path format (matches v2 doc):
        Tests_Functional/managed_fsw/_02_users_and_hosts/_01_administrators/test_admin.py::TestAdmin::test_login
      No `tests/` prefix — TP joins onto the repo root itself.

      Default returns a flat list. Use `search` to grep — e.g.
      `search: "_01_administrators"` returns only ids whose path
      contains that substring (case-insensitive). Use `prefix` to
      filter by exact path prefix (e.g. only descend a specific dir).
      Use `tree: true` to get the raw nested response back instead.
    parameters:
      search:
        type: string
        description: "Substring filter on the full pytest id (case-insensitive). e.g. \"_01_administrators\" or \"radius\"."
      prefix:
        type: string
        description: "Path prefix filter (e.g. \"Tests_Functional/managed_fsw\"). Only ids whose path starts with this are returned."
      tree:
        type: boolean
        default: false
        description: "true = return the raw nested {children: [...]} tree instead of a flat list. Mostly for debugging — usually large."
      limit:
        type: number
        default: 500
        description: "Cap on returned ids. Default 500. Hard cap 5000."
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const r = await fetch(`${apiBase}/adc/get_testcases`, { headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' }, credentials: 'include' });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) return { _error: `API ${r.status}` };
      const body = await r.json();
      if (args.tree) return body;
      // Walk recursive {children: [{name, children?[]}]}:
      //   - dir/file names join with '/'
      //   - leaf "TestClass::test_method" names join with '::' onto the .py file
      //   - top-level body.children entries are independent roots, each is
      //     a top-level dir under /root/fnac_auto/tests
      const ids = [];
      function walk(node, prefix) {
        const name = String(node && node.name || '');
        const kids = node && Array.isArray(node.children) ? node.children : null;
        if (!kids || kids.length === 0) {
          // Leaf — name carries the TestClass::test_method (or bare test_method)
          ids.push(prefix ? `${prefix}::${name}` : name);
          return;
        }
        const here = prefix ? `${prefix}/${name}` : name;
        for (const c of kids) walk(c, here);
      }
      const roots = Array.isArray(body && body.children) ? body.children : [body];
      for (const root of roots) walk(root, '');
      let out = ids;
      const prefix = (args.prefix || '').trim();
      if (prefix) {
        const p = prefix.replace(/^\/+|\/+$/g, '');
        out = out.filter(id => id === p || id.startsWith(p + '/') || id.startsWith(p + '::'));
      }
      const search = (args.search || '').trim();
      if (search) {
        const s = search.toLowerCase();
        out = out.filter(id => id.toLowerCase().includes(s));
      }
      const totalMatched = out.length;
      const limit = Math.min(Math.max(1, Number(args.limit) || 500), 5000);
      const truncated = out.length > limit;
      if (truncated) out = out.slice(0, limit);
      return { total: ids.length, matched: totalMatched, returned: out.length, truncated, testcase_ids: out };

  # ─────────── run_pytest (destructive) ───────────
  run_pytest:
    description: |
      Kick off a pytest run on an automation lab. Asynchronous — returns
      an `exec_id` you then poll with get_test_execution. v2 endpoint:
      POST /adc/automation/pytest/ { user, lab, testcase[], argument,
      extra_pytest_options }.

      `testcase` is a list of pytest ids RELATIVE to the tests repo
      root `/root/fnac_auto/tests`, e.g.
      ["L2/test_l2_radius.py::test_basic_auth"] or
      ["/Tests_CLI/test_cli_sanity.py::TestGetBasic::test_get_system_status"].
      Leading `/` is optional. Do NOT include a `tests/` prefix — TP
      joins onto the tests repo root itself (the old prefix produced
      `/root/fnac_auto/teststests/...`).
      A bare file ("L2/test_l2_radius.py") or dir ("L2") runs every
      test under it. Use `argument: "--collect-only"` for a dry run.

      `argument` is raw pytest CLI flags injected between the testcase
      paths and the framework's `--html`/`--rack-file` flags (-vv,
      --tb=short, -k 'expr', --maxfail=N, marker expressions, etc.).

      `extra_pytest_options` is appended AFTER the framework flags on
      the real run only (skipped during the --collect-only dry-run
      phase). Use for env-specific flags.

      The lab must be owned by / shared with you and not already mid-
      run. HTTP 409 = another execution is `Running` or `Initiating`
      on this lab (per-testbed serialization).

      To poll: use start_watch on this connector's get_test_execution
      with `done_match: { path: "status", equals: "Done" }`. `Done` is
      terminal regardless of pass/fail — read pass_count/fail_count/
      error_count to classify the outcome.
    destructive: true
    parameters:
      lab:
        type: string
        description: "AT lab name (from list_automation_labs), e.g. 'AT16_Combined_FSW'. If omitted and you own exactly one lab, it's auto-selected; if you own several, the tool returns the list so you can pick."
      testcase:
        type: json
        required: true
        description: "List of pytest ids relative to /root/fnac_auto/tests (or a single string / CSV). e.g. [\"L2/test_l2_radius.py::test_basic_auth\"]. NO `tests/` prefix."
      argument:
        type: string
        default: ""
        description: "Raw pytest CLI args, e.g. \"-vv --tb=short\" or \"-k 'radius and not flaky'\". Empty = none."
      extra_pytest_options:
        type: string
        default: ""
        description: "Appended after --html/--rack-file on the real run (not the --collect-only dry-run). Env-specific flags only."
      user:
        type: string
        description: "TP login name. Default: derived from JWT."
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      let user = (args.user || '').trim();
      if (!user) { try { const p = JSON.parse(atob(jwt.split('.')[1])); user = p.username || p.email || ''; } catch {} }
      if (!user) return { _error: 'Could not determine TP username; pass `user` explicitly.' };
      let lab = String(args.lab || '').trim();
      if (!lab) {
        // No lab given — auto-pick if the user owns exactly one, else
        // surface the choices (don't guess when there are several).
        const lr = await fetch(`${apiBase}/adc/get_automation_lab`, { method: 'POST', headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json', 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ user }) });
        if (!lr.ok) return { _error: `lab not given and could not auto-resolve (labs HTTP ${lr.status}).` };
        const labs = await lr.json();
        const names = Array.isArray(labs) ? labs.map(l => l && l.name).filter(Boolean) : [];
        if (names.length === 1) lab = String(names[0]);
        else if (names.length === 0) return { _error: 'No automation labs are available to you.' };
        else return { _error: `Multiple labs available — specify which via lab=. Options: ${names.join(', ')}`, available_labs: names };
      }
      // Normalize testcase → array of strings (accept array, JSON string, or CSV)
      let tc = args.testcase;
      if (typeof tc === 'string') {
        const s = tc.trim();
        if (s.startsWith('[')) { try { tc = JSON.parse(s); } catch { tc = s.split(',').map(x => x.trim()).filter(Boolean); } }
        else tc = s.split(',').map(x => x.trim()).filter(Boolean);
      }
      if (!Array.isArray(tc) || tc.length === 0) return { _error: 'testcase must be a non-empty list of pytest ids' };
      tc = tc.map(String);
      const argument = String(args.argument || '');
      const extra = String(args.extra_pytest_options || '');
      const body = JSON.stringify({ user, lab, testcase: tc, argument, extra_pytest_options: extra });
      const r = await fetch(`${apiBase}/adc/automation/pytest/`, {
        method: 'POST',
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json', 'Content-Type': 'application/json' },
        credentials: 'include',
        body,
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (r.status === 409) {
        const j = await r.json().catch(() => ({}));
        return { ok: false, conflict: true, lab, _error: j.error || `Lab '${lab}' is busy (Running or Initiating). Wait or pick another lab.` };
      }
      if (!r.ok) return { _error: `API ${r.status}`, body: (await r.text()).slice(0, 500) };
      const json = await r.json().catch(() => ({}));
      return { ok: true, lab, testcase: tc, argument, extra_pytest_options: extra, exec_id: json.exec_id ?? null, status: json.status ?? null, testcase_count: json.testcase_count ?? tc.length, result: json };

  # ─────────── get_test_results ───────────
  get_test_results:
    description: |
      List the calling user's recent test executions with computed
      progress %. POST /adc/get_test_result { user }. Use this for "how
      are my runs doing"; use get_test_execution for one run's detail.
    parameters:
      user:
        type: string
        description: "TP login name. Default: derived from JWT."
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      let user = (args.user || '').trim();
      if (!user) { try { const p = JSON.parse(atob(jwt.split('.')[1])); user = p.username || p.email || ''; } catch {} }
      if (!user) return { _error: 'Could not determine TP username; pass `user` explicitly.' };
      const r = await fetch(`${apiBase}/adc/get_test_result`, {
        method: 'POST',
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json', 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ user }),
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) return { _error: `API ${r.status}`, body: (await r.text()).slice(0, 300) };
      const rows = await r.json();
      // report/log paths are server-relative; surface absolute URLs.
      if (Array.isArray(rows)) {
        for (const row of rows) {
          if (row && row.report_file_path) row.report_url = `${location.protocol}//${location.hostname}:8000/${String(row.report_file_path).replace(/^\//, '')}`;
          if (row && row.log_file_path) row.log_url = `${location.protocol}//${location.hostname}:8000/${String(row.log_file_path).replace(/^\//, '')}`;
        }
      }
      return { user, results: rows };

  # ─────────── get_test_execution ───────────
  get_test_execution:
    description: |
      Fetch one execution's live status + counts + log_tail. v2
      endpoint: GET /adc/automation/pytest/<exec_id>/.

      Response fields:
        status        → Initiating | Running | Done | Failed | Cancelled
                        (Done is terminal — success/failure inferred
                        from counts; Failed/Cancelled are abnormal
                        terminals.)
        pass_count, fail_count, skip_count, error_count, total_count
                        — pytest summary, updated mid-run every ~15s.
        controller    → controller VM IP.
        remote_pid    → detached pytest's pid on the controller.
        report_file_path → server-relative path to pytest-html report;
                        fetch absolute via {base_url}/<report_file_path>
                        with the JWT.
        log_file_path → on-controller live log path.
        log_size, log_tail → last 4 KB of pytest stdout.
        start_timestamp / end_timestamp → unix epoch seconds.

      To poll continuously, use start_watch on this tool with
      done_match: { path: "status", equals: "Done" } — the assistant
      then reads pass/fail counts in the completion message.
    parameters:
      id:
        type: number
        required: true
        description: "Execution id (exec_id from run_pytest, or id from get_test_results)."
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      if (args.id == null) return { _error: 'id is required' };
      const r = await fetch(`${apiBase}/adc/automation/pytest/${Number(args.id)}/`, {
        method: 'GET',
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' },
        credentials: 'include',
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (r.status === 404) return { _error: `Execution ${args.id} not found` };
      if (!r.ok) return { _error: `API ${r.status}`, body: (await r.text()).slice(0, 300) };
      const json = await r.json();
      // Surface absolute report URL alongside the server-relative path.
      if (json && json.report_file_path) {
        json.report_url = `${location.protocol}//${location.hostname}:8000/${String(json.report_file_path).replace(/^\//, '')}`;
      }
      return json;

  # ─────────── lock_lab (destructive) ───────────
  lock_lab:
    description: |
      Lock or unlock an automation testbed to serialize exclusive
      hardware access. POST /adc/automation_lock { action, user, name }.
      `action` is "lock" or "unlock". Lock before a manual session;
      always unlock when done so others aren't blocked.
    destructive: true
    parameters:
      name:
        type: string
        required: true
        description: "Testbed name (from list_automation_labs)."
      action:
        type: select
        options: ["lock", "unlock"]
        default: "lock"
        description: "lock = mark in-use; unlock = release."
      user:
        type: string
        description: "TP login name. Default: derived from JWT."
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      let user = (args.user || '').trim();
      if (!user) { try { const p = JSON.parse(atob(jwt.split('.')[1])); user = p.username || p.email || ''; } catch {} }
      if (!user) return { _error: 'Could not determine TP username; pass `user` explicitly.' };
      const name = String(args.name || '').trim();
      if (!name) return { _error: 'name is required' };
      const action = (args.action === 'unlock') ? 'unlock' : 'lock';
      const r = await fetch(`${apiBase}/adc/automation_lock`, {
        method: 'POST',
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json', 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ action, user, name }),
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) return { _error: `API ${r.status}`, body: (await r.text()).slice(0, 300) };
      const json = await r.json().catch(() => ({}));
      return { ok: true, action, name, user, result: json };

  # ─────────── kill_test_execution (destructive) ───────────
  kill_test_execution:
    description: |
      Abort a running execution. The row stays in the DB with a terminal
      status; the pytest subprocess is sent SIGTERM. POST
      /adc/test_exec_kill { id }.
    destructive: true
    parameters:
      id:
        type: number
        required: true
        description: "Execution id to abort."
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      if (args.id == null) return { _error: 'id is required' };
      const r = await fetch(`${apiBase}/adc/test_exec_kill`, {
        method: 'POST',
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json', 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ id: Number(args.id) }),
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) return { _error: `API ${r.status}`, body: (await r.text()).slice(0, 300) };
      const json = await r.json().catch(() => ({}));
      return { ok: true, killed_exec_id: Number(args.id), result: json };

  # ─────────── get_lab_devices ───────────
  get_lab_devices:
    description: |
      List the devices in an automation testbed (lab), with the NAC/NCM
      devices and their IPs called out — so you can hand an IP to the
      `nac` connector's upgrade tool. Reads the lab's deployinfo via
      get_automation_lab.

      NOTE: NAC firmware upgrades have MOVED to the dedicated `nac`
      connector (direct SSH, stable). TP no longer upgrades NAC — use
      this tool to find the NAC IP in a lab, then call nac.upgrade.
    parameters:
      lab:
        type: string
        description: "Testbed name (from list_automation_labs). If omitted and you own exactly one lab, it's used; if several, the list is returned so you can pick."
      user:
        type: string
        description: "TP login name. Default: derived from JWT."
    page:
      url: "{base_url}/automation"
      on_target: "/automation"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) return { _error: 'JWT expired. Open the TP tab and re-login, then retry.' };
      } catch {}
      const apiBase = `${location.protocol}//${location.hostname}:8000`;
      const hdr = { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json', 'Content-Type': 'application/json' };
      let user = (args.user || '').trim();
      if (!user) { try { const p = JSON.parse(atob(jwt.split('.')[1])); user = p.username || p.email || ''; } catch {} }
      if (!user) return { _error: 'Could not determine TP username; pass `user` explicitly.' };
      const r = await fetch(`${apiBase}/adc/get_automation_lab`, { method: 'POST', headers: hdr, credentials: 'include', body: JSON.stringify({ user }) });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) return { _error: `API ${r.status}`, body: (await r.text()).slice(0, 300) };
      const labs = await r.json();
      if (!Array.isArray(labs)) return { _error: 'lab list not an array' };
      let lab = (args.lab || '').trim();
      let row;
      if (lab) { row = labs.find(l => l && l.name === lab); if (!row) return { _error: `Lab '${lab}' not found.`, available_labs: labs.map(l => l && l.name) }; }
      else if (labs.length === 1) { row = labs[0]; lab = row.name; }
      else if (labs.length === 0) return { _error: 'No labs available to you.' };
      else return { _error: `Multiple labs — specify lab=. Options: ${labs.map(l => l && l.name).join(', ')}`, available_labs: labs.map(l => l && l.name) };
      let di = row.deployinfo;
      if (typeof di === 'string') { try { di = JSON.parse(di); } catch {} }
      if (!di || typeof di !== 'object') return { _error: `Lab '${lab}' has no deployinfo in get_automation_lab; can't list devices — paste the deployinfo manually if you have it.`, _lab_row: row };
      const devices = [];
      for (const [k, v] of Object.entries(di)) {
        const m = /^dev(\d+)$/.exec(k);
        if (m) { const ip = di[`ip${m[1]}`]; const dev = String(v); devices.push({ slot: Number(m[1]), dev, ip: ip ? String(ip) : null, is_nac: /nac|ncm/i.test(dev) }); }
      }
      devices.sort((a, b) => a.slot - b.slot);
      const nac_devices = devices.filter(d => d.is_nac && d.ip).map(d => ({ dev: d.dev, ip: d.ip }));
      return { lab, status: row.status, device_count: devices.length, nac_devices, devices, _hint: 'Upgrade a NAC via the `nac` connector: nac.upgrade with the nac connector pointed at <nac ip>.' };

test:
  description: "Opens TP and verifies the session JWT is in localStorage."
  probe: browser
  timeout_ms: 20000

