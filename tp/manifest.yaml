id: tp
name: FortiNAC Test Platform
icon: 🧪
version: "0.4.2"
author: forge
category: connector
mode: browser-side
description: |
  FortiNAC Test Platform (TP) — browser-side connector reusing the
  user's logged-in session. Calls TP's internal REST API directly
  using the JWT held in localStorage (no DOM scraping, no token in
  Forge settings — re-login refreshes automatically).

  v0.3 — 5 read tools.
  v0.4 — 3 destructive tools: add_weekly_status, add_comment,
    edit_nfr_field. Endpoints captured by intercepting the page's
    own XHR submit (weekly_status + edit verified; add_comment
    follows the same naming convention but the modal didn't auto-
    open during probing, so a first call may surface 404 if the
    convention is off — try a single call to verify).

  Automation module (lab lock, testcase run, device upgrade, test
  results) ships in a later version (likely as a separate
  `tp-automation` connector when its API stabilises).

settings:
  base_url:
    type: string
    label: TP base URL
    description: "e.g. https://nac-tp.fortinet-us.com"
    required: true
    default: "https://nac-tp.fortinet-us.com"
  api_base_url:
    type: string
    label: TP API base URL
    description: "TP's internal REST API host. NAC TP uses port 8000."
    required: true
    default: "https://nac-tp.fortinet-us.com:8000"
  username:
    type: string
    label: Your TP username
    description: |
      Used by 'owner_filter: me' to find NFRs you own across any of
      the assignee fields. Match the name as it appears in TP
      (e.g. 'Ryan Sun' — full name, not the email prefix).
    required: true

host_match: "{base_url}/*"
login_redirect: "/login"
runner: main
tab_strategy: reuse

# ─── Shared script preamble (injected via {settings.*} expansion) ──
# Each tool's script duplicates the JWT lookup + fetch helper. Could
# be DRY'd via a shared file later — manifests don't support imports.

tools:

  # ─────────── list_nfrs (CA & NCM) ───────────
  list_nfrs:
    description: |
      List NFRs from the CA & NCM module via TP's REST API. Returns the
      full set for the given release in one call (no pagination).

      `owner_filter` searches nfr_owner / pd_assignee / backend_assignee /
      frontend_assignee / at_assignee / qa_assignee. Special value 'me'
      resolves to settings.username.

      `verbose: false` (default) → slim 14-field view (LLM-friendly).
      `verbose: true` → full ~50-field record per NFR.
    parameters:
      release:
        type: string
        default: "all"
        description: "Release filter. 'all' = every release; or an exact tag like '7.6.7' / '7.4.0'. Partial like '7.6' returns nothing — must be exact (call list_releases to see valid tags)."
      owner_filter:
        type: string
        description: "Filter rows where any owner/assignee column contains this string. 'me' = settings.username. Empty = no filter."
      verbose:
        type: boolean
        default: false
        description: "false = slim view. true = full payload (incl. dates, doc links, bugs list)."
    page:
      url: "{base_url}/nfr"
      on_target: "/nfr"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP. Open the TP tab and sign in, then retry.' };
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = '{settings.api_base_url}'.replace(/\/$/, '');
      const url = `${apiBase}/adc/get_nfr_list/${encodeURIComponent(args.release || 'all')}`;
      const r = await fetch(url, { headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' }, credentials: 'include' });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — JWT expired, re-login.`, url };
      if (!r.ok) return { _error: `API ${r.status}`, url };
      const all = await r.json();
      if (!Array.isArray(all)) return { _error: 'API did not return an array', url };
      const myName = '{settings.username}';
      let effOwner = (args.owner_filter || '').trim();
      if (effOwner === 'me') effOwner = myName;
      let filtered = all;
      if (effOwner) {
        const q = effOwner.toLowerCase();
        const matchFields = ['nfr_owner', 'pd_assignee', 'backend_assignee', 'frontend_assignee', 'at_assignee', 'qa_assignee'];
        filtered = all.filter(r => matchFields.some(f => (r[f] || '').toLowerCase().includes(q)));
      }
      const slim = (r) => ({
        id: r.id, subject: r.subject, release: r.release, priority: r.priority,
        category: r.category, source: r.source, status: r.status, progress: r.progress,
        nfr_owner: r.nfr_owner, qa_assignee: r.qa_assignee, backend_assignee: r.backend_assignee,
        bugs: r.bugs ? { total: r.bugs.total, assigned: r.bugs.assigned } : null,
        pmdb: r.pmdb, mantis_nfr: r.mantis_nfr,
        detail_url: `${location.origin}/nfr-detail?id=${r.id}`,
      });
      const rows = args.verbose ? filtered : filtered.map(slim);
      return { release: args.release || 'all', owner_filter: effOwner || null, total: all.length, returned: rows.length, verbose: !!args.verbose, rows };

  # ─────────── list_device_integration ───────────
  list_device_integration:
    description: |
      List items from the Device Integration module. Same shape as
      list_nfrs (owner_filter / verbose) — different upstream module.
      Useful when the user asks about device-integration NFRs.
    parameters:
      release:
        type: string
        default: "all"
        description: "Release tag (e.g. '7.6.7') or 'all'. Call list_releases module='Device Integration' to see valid tags."
      owner_filter:
        type: string
        description: "Same as list_nfrs. 'me' = settings.username."
      verbose:
        type: boolean
        default: false
    page:
      url: "{base_url}/device-integration"
      on_target: "/device-integration"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = '{settings.api_base_url}'.replace(/\/$/, '');
      const url = `${apiBase}/adc/get_device_integration_agent_list/${encodeURIComponent(args.release || 'all')}/Device%20Integration`;
      const r = await fetch(url, { headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' }, credentials: 'include' });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — JWT expired, re-login.`, url };
      if (!r.ok) return { _error: `API ${r.status}`, url };
      const all = await r.json();
      if (!Array.isArray(all)) return { _error: 'API did not return an array', url };
      const myName = '{settings.username}';
      let effOwner = (args.owner_filter || '').trim();
      if (effOwner === 'me') effOwner = myName;
      let filtered = all;
      if (effOwner) {
        const q = effOwner.toLowerCase();
        const matchFields = ['nfr_owner', 'pd_assignee', 'backend_assignee', 'frontend_assignee', 'at_assignee', 'qa_assignee'];
        filtered = all.filter(r => matchFields.some(f => (r[f] || '').toLowerCase().includes(q)));
      }
      const slim = (r) => ({
        id: r.id, subject: r.subject, release: r.release, priority: r.priority,
        category: r.category, source: r.source, status: r.status, progress: r.progress,
        nfr_owner: r.nfr_owner, qa_assignee: r.qa_assignee,
        bugs: r.bugs ? { total: r.bugs.total, assigned: r.bugs.assigned } : null,
        pmdb: r.pmdb, mantis_nfr: r.mantis_nfr,
        detail_url: `${location.origin}/nfr-detail?id=${r.id}`,
      });
      const rows = args.verbose ? filtered : filtered.map(slim);
      return { module: 'Device Integration', release: args.release || 'all', owner_filter: effOwner || null, total: all.length, returned: rows.length, verbose: !!args.verbose, rows };

  # ─────────── list_agent ───────────
  list_agent:
    description: |
      List items from the Agent module. Same shape as list_nfrs.
    parameters:
      release:
        type: string
        default: "all"
        description: "Release tag or 'all'. Call list_releases module='Agent' to see valid tags."
      owner_filter:
        type: string
        description: "Same as list_nfrs. 'me' = settings.username."
      verbose:
        type: boolean
        default: false
    page:
      url: "{base_url}/agent"
      on_target: "/agent"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = '{settings.api_base_url}'.replace(/\/$/, '');
      const url = `${apiBase}/adc/get_device_integration_agent_list/${encodeURIComponent(args.release || 'all')}/Agent`;
      const r = await fetch(url, { headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' }, credentials: 'include' });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — JWT expired, re-login.`, url };
      if (!r.ok) return { _error: `API ${r.status}`, url };
      const all = await r.json();
      if (!Array.isArray(all)) return { _error: 'API did not return an array', url };
      const myName = '{settings.username}';
      let effOwner = (args.owner_filter || '').trim();
      if (effOwner === 'me') effOwner = myName;
      let filtered = all;
      if (effOwner) {
        const q = effOwner.toLowerCase();
        const matchFields = ['nfr_owner', 'pd_assignee', 'backend_assignee', 'frontend_assignee', 'at_assignee', 'qa_assignee'];
        filtered = all.filter(r => matchFields.some(f => (r[f] || '').toLowerCase().includes(q)));
      }
      const slim = (r) => ({
        id: r.id, subject: r.subject, release: r.release, priority: r.priority,
        category: r.category, source: r.source, status: r.status, progress: r.progress,
        nfr_owner: r.nfr_owner, qa_assignee: r.qa_assignee,
        bugs: r.bugs ? { total: r.bugs.total, assigned: r.bugs.assigned } : null,
        pmdb: r.pmdb, mantis_nfr: r.mantis_nfr,
        detail_url: `${location.origin}/nfr-detail?id=${r.id}`,
      });
      const rows = args.verbose ? filtered : filtered.map(slim);
      return { module: 'Agent', release: args.release || 'all', owner_filter: effOwner || null, total: all.length, returned: rows.length, verbose: !!args.verbose, rows };

  # ─────────── get_nfr (full detail) ───────────
  get_nfr:
    description: |
      Fetch a single NFR with everything: full record fields, weekly
      status history, change history, and comments. Use when the
      user asks "what's the latest on NFR <id>" or wants to see
      progress notes.

      Pass `include` to slim the response — accepts a CSV of:
      detail, weekly, history, comments. Default: all four.
    parameters:
      id:
        type: number
        required: true
        description: "NFR id (the number in subject_url / detail page URL)."
      include:
        type: string
        default: "detail,weekly,history,comments"
        description: "CSV of sections to fetch. Default fetches everything. Use 'detail,weekly' to skip history+comments."
      weekly_limit:
        type: number
        default: 10
        description: "Cap the number of weekly status entries returned (newest first). Set 0 for no cap."
    page:
      url: "{base_url}/nfr-detail?id={args.id}"
      on_target: "/nfr-detail"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = '{settings.api_base_url}'.replace(/\/$/, '');
      const hdr = { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' };
      const id = args.id;
      if (id == null) return { _error: 'id is required' };
      const include = String(args.include || 'detail,weekly,history,comments').split(',').map(s => s.trim()).filter(Boolean);
      const inc = new Set(include);
      const get = async (path) => {
        try {
          const r = await fetch(`${apiBase}${path}`, { headers: hdr, credentials: 'include' });
          if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status}` };
          if (!r.ok) return { _error: `${r.status}`, _path: path };
          const ct = r.headers.get('content-type') || '';
          return ct.includes('json') ? await r.json() : (await r.text()).slice(0, 500);
        } catch (e) { return { _error: String(e) }; }
      };
      const out = { id };
      if (inc.has('detail')) out.detail = await get(`/adc/get_nfr_detail/${id}`);
      if (inc.has('weekly')) {
        const w = await get(`/adc/get_nfr_weekly_status/${id}`);
        if (Array.isArray(w)) {
          const cap = Number(args.weekly_limit ?? 10);
          out.weekly_status = cap > 0 ? w.slice(0, cap) : w;
          out.weekly_status_total = w.length;
        } else {
          out.weekly_status = w;
        }
      }
      if (inc.has('history')) out.history = await get(`/adc/get_nfr_history/${id}`);
      if (inc.has('comments')) out.comments = await get(`/adc/get_nfr_comment/${id}`);
      return out;

  # ─────────── list_releases ───────────
  list_releases:
    description: |
      List valid release tags for a TP module. Call before list_*
      tools when the user doesn't know the exact release tag (TP
      requires exact tags like '7.6.7' — '7.6' returns nothing).
    parameters:
      module:
        type: select
        options: ["NFR", "Device Integration", "Agent"]
        default: "NFR"
        description: "Which TP module to query release tags for."
    page:
      url: "{base_url}/nfr"
      on_target: "/"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = '{settings.api_base_url}'.replace(/\/$/, '');
      const url = `${apiBase}/adc/get_version_list/${encodeURIComponent(args.module || 'NFR')}`;
      const r = await fetch(url, { headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' }, credentials: 'include' });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.`, url };
      if (!r.ok) return { _error: `API ${r.status}`, url };
      const body = await r.json();
      return { module: args.module || 'NFR', releases: body };

  # ─────────── add_weekly_status (destructive) ───────────
  add_weekly_status:
    description: |
      Add a weekly status entry to an NFR. Status_message is HTML
      (the upstream UI uses a Quill rich-text editor — plain text or
      simple <p>...</p> wrappers are fine).

      Verified endpoint shape: POST /adc/add_nfr_weekly_status/ with
      JSON { nfr_id, week_starting_date, week_ending_date,
      status_message, user }. The user email is auto-derived from
      the JWT payload — no need to pass.

      Dates accept YYYY-MM-DD. If you omit them, the script defaults
      to the current week (Monday → Sunday).
    destructive: true
    parameters:
      nfr_id:
        type: number
        required: true
        description: "NFR id."
      status_message:
        type: string
        required: true
        description: "Status text. Plain text gets wrapped in <p>; full HTML is preserved."
      week_starting_date:
        type: string
        description: "YYYY-MM-DD. Default: this Monday."
      week_ending_date:
        type: string
        description: "YYYY-MM-DD. Default: this Sunday."
    page:
      url: "{base_url}/nfr-detail?id={args.nfr_id}"
      on_target: "/nfr-detail"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = '{settings.api_base_url}'.replace(/\/$/, '');
      // Decode JWT payload to grab the user email.
      let userEmail = '';
      try {
        const p = JSON.parse(atob(jwt.split('.')[1]));
        userEmail = p.email || p.username || '';
      } catch {}
      if (!userEmail) return { _error: 'Could not extract user email from JWT payload.' };

      // Default dates → current week (Mon..Sun)
      const today = new Date();
      const dow = today.getDay() === 0 ? 7 : today.getDay();   // Sunday=7 not 0
      const mon = new Date(today); mon.setDate(today.getDate() - (dow - 1));
      const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
      const iso = (d) => d.toISOString().slice(0, 10);
      const weekStart = args.week_starting_date || iso(mon);
      const weekEnd = args.week_ending_date || iso(sun);

      // Wrap plain text in <p> if it doesn't already look like HTML
      let msg = String(args.status_message || '');
      if (msg && !/<[a-z][^>]*>/i.test(msg)) msg = `<p>${msg.replace(/\n/g, '</p><p>')}</p>`;

      const body = JSON.stringify({
        nfr_id: Number(args.nfr_id),
        week_starting_date: weekStart,
        week_ending_date: weekEnd,
        status_message: msg,
        user: userEmail,
      });

      const r = await fetch(`${apiBase}/adc/add_nfr_weekly_status/`, {
        method: 'POST',
        headers: {
          'Authorization': `JWT ${jwt}`,
          'Accept': 'application/json',
          'Content-Type': 'application/json',
        },
        credentials: 'include',
        body,
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) {
        const t = await r.text();
        return { _error: `API ${r.status}`, body: t.slice(0, 500) };
      }
      const json = await r.json().catch(() => ({}));
      return {
        ok: true,
        nfr_id: Number(args.nfr_id),
        week_starting_date: weekStart,
        week_ending_date: weekEnd,
        created: json,
      };

  # ─────────── add_comment (destructive) ───────────
  add_comment:
    description: |
      Add a comment to an NFR. Verified endpoint:
      POST /adc/add_nfr_comment (no trailing slash) with JSON
      { id, comment, user, action: "add" }. Comment is plain text
      (the upstream UI wraps via Quill but the API accepts raw).
    destructive: true
    parameters:
      nfr_id:
        type: number
        required: true
        description: "NFR id."
      comment:
        type: string
        required: true
        description: "Comment text."
    page:
      url: "{base_url}/nfr-detail?id={args.nfr_id}"
      on_target: "/nfr-detail"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = '{settings.api_base_url}'.replace(/\/$/, '');
      let userEmail = '';
      try {
        const p = JSON.parse(atob(jwt.split('.')[1]));
        userEmail = p.email || p.username || '';
      } catch {}
      if (!userEmail) return { _error: 'Could not extract user email from JWT.' };

      const body = JSON.stringify({
        user: userEmail,
        comment: String(args.comment || ''),
        id: Number(args.nfr_id),
        action: 'add',
      });

      const r = await fetch(`${apiBase}/adc/add_nfr_comment`, {
        method: 'POST',
        headers: {
          'Authorization': `JWT ${jwt}`,
          'Accept': 'application/json, text/plain, */*',
          'Content-Type': 'application/json;charset=UTF-8',
        },
        credentials: 'include',
        body,
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) {
        const t = await r.text();
        return { _error: `API ${r.status}`, body: t.slice(0, 500) };
      }
      const json = await r.json().catch(() => ({}));
      return { ok: true, nfr_id: Number(args.nfr_id), created: json };

  # ─────────── delete_weekly_status (destructive) ───────────
  delete_weekly_status:
    description: |
      Delete a specific weekly status entry by its weekly_status id
      (NOT the NFR id — get the id from get_nfr's weekly_status[].id
      field). Verified endpoint: DELETE /adc/delete_nfr_weekly_status/{id}.
    destructive: true
    parameters:
      weekly_status_id:
        type: number
        required: true
        description: "Weekly status entry id (from get_nfr().weekly_status[].id)."
    page:
      url: "{base_url}/nfr"
      on_target: "/"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = '{settings.api_base_url}'.replace(/\/$/, '');
      const id = Number(args.weekly_status_id);
      const r = await fetch(`${apiBase}/adc/delete_nfr_weekly_status/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' },
        credentials: 'include',
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status} — re-login.` };
      if (!r.ok) {
        const t = await r.text();
        return { _error: `API ${r.status}`, body: t.slice(0, 300) };
      }
      return { ok: true, deleted_weekly_status_id: id };

  # ─────────── edit_nfr_field (destructive) ───────────
  edit_nfr_field:
    description: |
      Edit one or more fields on an NFR. TP's edit endpoint requires
      the FULL detail object back as multipart FormData on every save
      (it's a treat-the-NFR-as-one-form contract). This tool reads the
      current detail, overlays your `patch` object, and re-submits the
      full record.

      Verified endpoint: POST /adc/edit_nfr_detail (FormData, all
      ~50 fields + id + user).

      Pass `patch` as an object of field_name → new_value. Only the
      fields you want to change need to be in `patch`. Common
      editable fields:
        subject, release, priority, status, progress,
        pd_assignee, backend_assignee, frontend_assignee,
        at_assignee, qa_assignee, nfr_owner, git, git_branch, pmdb,
        mantis_nfr, mantis_dev, mantis_doc, description,
        story_point_backend, story_point_frontend,
        pd_due, backend_due, frontend_due, qa_due, toi_due, ...
    destructive: true
    parameters:
      id:
        type: number
        required: true
        description: "NFR id."
      patch:
        type: json
        required: true
        description: |
          Object of fields to update, e.g. { "progress": "75%",
          "qa_due": "2026-04-30" }. Other fields are preserved from
          the current detail.
    page:
      url: "{base_url}/nfr-detail?id={args.id}"
      on_target: "/nfr-detail"
    script: |
      const jwt = localStorage.token;
      if (!jwt) return { _error: 'Not logged in to TP.' };
      // Fail-fast on expired JWT — the API redirects expired auth to
      // an HTML login page, which fetch follows opaquely and surfaces
      // as confusing 405/HTML errors. Decode payload, check `exp`.
      try {
        const _p = JSON.parse(atob(jwt.split('.')[1]));
        if (_p?.exp && _p.exp * 1000 < Date.now()) {
          return { _error: 'JWT expired. Open the TP tab and sign out + sign in to refresh, then retry.', _hint: 'TP tokens last ~12h; the page does not auto-refresh them.' };
        }
      } catch {}
      const apiBase = '{settings.api_base_url}'.replace(/\/$/, '');
      let userEmail = '';
      try {
        const p = JSON.parse(atob(jwt.split('.')[1]));
        userEmail = p.email || p.username || '';
      } catch {}
      if (!userEmail) return { _error: 'Could not extract user email from JWT.' };

      // 1) Fetch current detail (we need to send ALL fields back)
      const detailResp = await fetch(`${apiBase}/adc/get_nfr_detail/${Number(args.id)}`, {
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' },
        credentials: 'include',
      });
      if (detailResp.status === 401 || detailResp.status === 403) return { _error: `Auth ${detailResp.status}` };
      if (!detailResp.ok) return { _error: `Could not load current detail: HTTP ${detailResp.status}` };
      const current = await detailResp.json();

      // 2) Parse patch (LLM may pass as object OR JSON string)
      let patch = args.patch;
      if (typeof patch === 'string') {
        try { patch = JSON.parse(patch); } catch { return { _error: 'patch is not valid JSON' }; }
      }
      if (!patch || typeof patch !== 'object' || Array.isArray(patch)) {
        return { _error: 'patch must be a JSON object of field → value' };
      }

      // 3) Merge — known editable fields only; reject unknown to surface typos.
      const merged = { ...current };
      const declined = [];
      for (const [k, v] of Object.entries(patch)) {
        if (!(k in current) && !['mantis_dev', 'description'].includes(k)) {
          declined.push(k);
          continue;
        }
        merged[k] = v;
      }
      if (declined.length > 0 && Object.keys(patch).length === declined.length) {
        return { _error: `Unknown field(s): ${declined.join(', ')}. Valid fields: ${Object.keys(current).join(', ')}` };
      }

      // 4) Build FormData with every field. Null → empty string (TP
      // serialiser doesn't accept null literal).
      const fd = new FormData();
      for (const [k, v] of Object.entries(merged)) {
        if (v == null) fd.append(k, '');
        else if (typeof v === 'object') fd.append(k, JSON.stringify(v));
        else fd.append(k, String(v));
      }
      fd.append('user', userEmail);

      // 5) Submit
      const r = await fetch(`${apiBase}/adc/edit_nfr_detail`, {
        method: 'POST',
        headers: { 'Authorization': `JWT ${jwt}`, 'Accept': 'application/json' },
        // Don't set Content-Type — browser sets boundary automatically for FormData
        credentials: 'include',
        body: fd,
      });
      if (r.status === 401 || r.status === 403) return { _error: `Auth ${r.status}` };
      if (!r.ok) {
        const t = await r.text();
        return { _error: `API ${r.status}`, body: t.slice(0, 500) };
      }
      const json = await r.json().catch(() => ({}));
      return {
        ok: true,
        id: Number(args.id),
        changed: Object.keys(patch).filter(k => !declined.includes(k)),
        declined_fields: declined,
        result: json,
      };

test:
  description: "Opens TP and verifies the session JWT is in localStorage."
  probe: browser
  timeout_ms: 20000
