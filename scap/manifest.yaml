id: scap
name: SCAP (Fortinet PSIRT)
icon: 🔒
version: "0.3.1"
author: forge
category: connector
mode: browser-side
runner: main
min_forge_version: "0.9.17"
description: |
  Fortinet PSIRT SCAP reports — https://scap.fortinet.com/reports/ffi.

  Reads SAST/SCA scan results posted per Fortinet Federal Product build:
  Critical/High/Medium/Low counts, PDF report link, AND a raw scan-
  artifacts zip that contains the actual SARIF / Nessus / semgrep /
  Mantis-mapping files used to drive remediation.

  Auth: nothing to configure. All tools run inside your already-
  logged-in Chrome tab. Same-origin fetch() auto-attaches the httpOnly
  Django sessionid cookie even though page-context JS can't read it.
  Just keep a tab open on https://scap.fortinet.com (extension acquires
  one on demand if none).

  v0.3 tools (all browser-side):
    list_reports          DOM scrape entire /reports/ffi table
    find_for_product      filter to one product (e.g. "FortiNAC")
    extract_issues        IN-TAB fetch of the artifacts zip, parse the
                          ZIP container + the two canonical CSVs with
                          pure-JS code (DecompressionStream for deflate,
                          RFC4180 CSV reader). Filters by severity and
                          returns:
                            known_mantis[] — already-filed Mantis bugs
                                             (just trigger existing
                                             fortinet-mantis-bug-fix-batch)
                            new_sast[]     — new semgrep findings (need
                                             mantis.create_bug first)

  Coverage (verified on FortiNAC-F 7.6, 1 crit + 52 high):
    extract_issues parses mantis_vulns + sast_semgrep_vulns only. Most
    of the "high" count on the page is actually from DAST + network
    scans (nuclei / nessus / burp / invicti / qualys-was / dastardly /
    cryptolyzer / testssl) — semgrep static-analysis findings are the
    most-actionable subset (concrete code locations a fix pipeline
    can target). DAST parsers come in v0.4.

  v0.3 history note: v0.2 used a server-side shell tool with a
  user-pasted sessionid cookie (httpOnly, page JS can't read it).
  v0.3 moves to all-browser-side using same-origin fetch + inline JS
  zip+CSV parsing — no setting needed, no manual paste. The shell
  protocol path was removed.

  Roadmap:
    v0.4  parse_dast_findings    nuclei JSONL + nessus CSV + invicti
                                  JSON + burp HTML/CSV → unified list
    v0.5  pipeline scap-product-blockers-to-mantis
          → find_for_product(product) → extract_issues(latest row's
            scan_artifacts_url) → known_mantis go to bug-fix-batch
          → new_sast first go through create_bug + same pipeline

host_match: "https://scap.fortinet.com/*"

# login_redirect: substring that the URL contains when SCAP bounces you
# to login (we've observed `/login` and the Fortinet SSO redirect). The
# browser probe lands on /reports/ffi and checks the final URL — if it
# contains this substring, the user is logged out.
login_redirect: "/login"

test:
  description: "Open /reports/ffi in your Chrome tab and check whether you're still logged in (no redirect to login)."
  probe: browser
  timeout_ms: 15000

# No settings — auth rides the open Chrome tab's same-origin cookie.
settings: {}

tools:
  list_reports:
    description: |
      Scrape the entire /reports/ffi table and return all 79+ rows as
      JSON. Each row has the date, product, severity counts (critical /
      high / medium / low), pending SAST + SCA triage counts, and the
      array of report PDF download URLs for that build.

      Use this when you want a full snapshot. For "find ONE product",
      use find_for_product — same data, filtered server-side in the
      browser script.
    page:
      url: "https://scap.fortinet.com/reports/ffi"
      on_target: "scap.fortinet.com/reports/ffi"
    script: |
      // Wait for the table to render (it's SSR but sometimes hydrated)
      const table = document.querySelector('table.table-zebra');
      if (!table) return { error: 'reports table not found on page' };

      const headerCells = [...table.querySelectorAll('thead th, thead td')]
        .map(th => th.textContent.trim());
      // Per-row link extractor — last cell has icons distinguished by
      // data-tip ("PDF Report" vs "Scan Artifacts"). UUID at the tail
      // of each URL is shared, useful as a join key.
      function rowFromTr(tr) {
        const cells = [...tr.querySelectorAll('td')];
        const lastCell = cells[cells.length - 1];
        const links = [...(lastCell?.querySelectorAll('a') ?? [])];
        const pdfA = links.find(a => (a.getAttribute('data-tip') || '').toLowerCase().includes('pdf')) || links.find(a => a.href.includes('/reports/pdf/'));
        const zipA = links.find(a => (a.getAttribute('data-tip') || '').toLowerCase().includes('artifact')) || links.find(a => a.href.includes('/artifacts/'));
        const uuidMatch = (pdfA?.href || zipA?.href || '').match(/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/);
        return {
          date:         cells[0]?.textContent.trim(),
          product:      cells[1]?.textContent.trim(),
          critical:     parseInt(cells[2]?.textContent.trim() || '0', 10),
          high:         parseInt(cells[3]?.textContent.trim() || '0', 10),
          medium:       parseInt(cells[4]?.textContent.trim() || '0', 10),
          low:          parseInt(cells[5]?.textContent.trim() || '0', 10),
          sast_pending: parseInt(cells[6]?.textContent.trim() || '0', 10),
          sca_pending:  parseInt(cells[7]?.textContent.trim() || '0', 10),
          uuid:         uuidMatch ? uuidMatch[1] : null,
          report_pdf_url:    pdfA?.href || null,
          scan_artifacts_url: zipA?.href || null,
        };
      }
      const rows = [...table.querySelectorAll('tbody tr')].map(rowFromTr);

      return {
        ok: true,
        headers: headerCells,
        count: rows.length,
        rows,
      };
    returns: |
      { ok: true, headers: [...], count: N, rows: [
        { date, product, critical, high, medium, low, sast_pending, sca_pending,
          uuid, report_pdf_url, scan_artifacts_url }
      ] }

  find_for_product:
    description: |
      Find rows for a specific product. Case-insensitive substring
      match against the Product column. Use to drill into "give me the
      latest FortiNAC report" without scraping the whole table.

      If multiple rows match (e.g. multiple builds), they're all
      returned in original order — typically newest first per how
      SCAP renders the table. The CALLER decides which one to act on
      (usually rows[0] = most recent).
    parameters:
      product:
        type: string
        required: true
        description: "Product name substring, e.g. 'FortiNAC' or 'forticlient windows'. Case-insensitive."
    page:
      url: "https://scap.fortinet.com/reports/ffi"
      on_target: "scap.fortinet.com/reports/ffi"
    script: |
      const table = document.querySelector('table.table-zebra');
      if (!table) return { error: 'reports table not found on page' };

      const needle = (args.product || '').toLowerCase().trim();
      if (!needle) return { error: 'product parameter is empty' };

      const matches = [...table.querySelectorAll('tbody tr')].map(tr => {
        const cells = [...tr.querySelectorAll('td')];
        const product = cells[1]?.textContent.trim() || '';
        return { tr, cells, product };
      }).filter(r => r.product.toLowerCase().includes(needle));

      const rows = matches.map(({ tr, cells, product }) => {
        const lastCell = cells[cells.length - 1];
        const links = [...(lastCell?.querySelectorAll('a') ?? [])];
        const pdfA = links.find(a => (a.getAttribute('data-tip') || '').toLowerCase().includes('pdf')) || links.find(a => a.href.includes('/reports/pdf/'));
        const zipA = links.find(a => (a.getAttribute('data-tip') || '').toLowerCase().includes('artifact')) || links.find(a => a.href.includes('/artifacts/'));
        const uuidMatch = (pdfA?.href || zipA?.href || '').match(/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/);
        return {
          date:         cells[0]?.textContent.trim(),
          product,
          critical:     parseInt(cells[2]?.textContent.trim() || '0', 10),
          high:         parseInt(cells[3]?.textContent.trim() || '0', 10),
          medium:       parseInt(cells[4]?.textContent.trim() || '0', 10),
          low:          parseInt(cells[5]?.textContent.trim() || '0', 10),
          sast_pending: parseInt(cells[6]?.textContent.trim() || '0', 10),
          sca_pending:  parseInt(cells[7]?.textContent.trim() || '0', 10),
          uuid:         uuidMatch ? uuidMatch[1] : null,
          report_pdf_url:    pdfA?.href || null,
          scan_artifacts_url: zipA?.href || null,
        };
      });

      return {
        ok: true,
        query: args.product,
        match_count: rows.length,
        rows,
      };
    returns: |
      { ok: true, query: "...", match_count: N, rows: [...same row shape as list_reports...] }

  extract_issues:
    description: |
      Fetch the scan-artifacts zip from inside your logged-in tab,
      parse it in JS (no server-side, no cookie paste), and return the
      filtered HIGH/CRITICAL issue list split into:

        known_mantis[] — entries from mantis_vulns_*.csv
          { mantis_id, cve, cwe, cvss, severity, title }
          Vulnerabilities Fortinet PSIRT has ALREADY filed as Mantis
          bugs. Feed mantis_id straight to fortinet-mantis-bug-fix-batch.

        new_sast[] — entries from sast_semgrep_vulns_*.csv
          { title, severity, cwe, cwe_text, summary, solution }
          New semgrep static-analysis findings without a Mantis bug
          yet. Pipeline should mantis.create_bug each, then feed the
          new id into bug-fix-batch.

      `severity_filter` default "high,critical". For the mantis_vulns
      file (only has cvss, not a label), buckets are:
        cvss >= 9 → critical,  >= 7 → high,  >= 4 → medium,  > 0 → low

      Uses same-origin fetch() so the httpOnly Django sessionid cookie
      is auto-attached. No connector setting needed.
    parameters:
      scan_artifacts_url:
        type: string
        required: true
        description: "Full URL from a row's scan_artifacts_url field (list_reports / find_for_product output)."
      severity_filter:
        type: string
        default: "high,critical"
        description: "Comma-separated severity buckets to keep. e.g. 'high,critical' or 'critical' or 'high,critical,medium'."
    page:
      url: "https://scap.fortinet.com/reports/ffi"
      on_target: "scap.fortinet.com"
    script: |
      // ── Fetch zip (httpOnly cookie auto-attached, same-origin) ──
      const url = args.scan_artifacts_url;
      const sev_filter = new Set(
        (args.severity_filter || 'high,critical')
          .toLowerCase().split(',').map(s => s.trim()).filter(Boolean));

      let buf;
      try {
        const r = await fetch(url, { credentials: 'include' });
        if (!r.ok) return { error: `fetch ${url} → HTTP ${r.status}` };
        buf = new Uint8Array(await r.arrayBuffer());
      } catch (e) {
        return { error: `fetch failed: ${e.message}` };
      }

      // ── Minimal ZIP reader ──
      const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
      const u16 = (o) => dv.getUint16(o, true);
      const u32 = (o) => dv.getUint32(o, true);

      // Find End of Central Directory (search last 65557 bytes)
      const EOCD_SIG = 0x06054b50;
      let eocd = -1;
      for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) {
        if (u32(i) === EOCD_SIG) { eocd = i; break; }
      }
      if (eocd < 0) return { error: 'ZIP EOCD not found' };
      const cdSize = u32(eocd + 12);
      const cdOff = u32(eocd + 16);
      const nEntries = u16(eocd + 10);

      // Walk Central Directory entries
      const entries = [];
      const td = new TextDecoder('utf-8');
      let off = cdOff;
      for (let i = 0; i < nEntries; i++) {
        if (u32(off) !== 0x02014b50) return { error: `CD entry ${i} bad signature at ${off}` };
        const method = u16(off + 10);
        const compSize = u32(off + 20);
        const fnLen = u16(off + 28);
        const extraLen = u16(off + 30);
        const commentLen = u16(off + 32);
        const localOff = u32(off + 42);
        const name = td.decode(buf.subarray(off + 46, off + 46 + fnLen));
        entries.push({ name, method, compSize, localOff });
        off += 46 + fnLen + extraLen + commentLen;
      }

      async function readEntry(e) {
        const lfnLen = u16(e.localOff + 26);
        const lextraLen = u16(e.localOff + 28);
        const dataStart = e.localOff + 30 + lfnLen + lextraLen;
        const data = buf.subarray(dataStart, dataStart + e.compSize);
        if (e.method === 0) return td.decode(data);             // stored
        if (e.method === 8) {                                    // deflate
          const stream = new Blob([data]).stream()
            .pipeThrough(new DecompressionStream('deflate-raw'));
          const reader = stream.getReader();
          const chunks = [];
          let total = 0;
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value); total += value.length;
          }
          const out = new Uint8Array(total);
          let p = 0; for (const c of chunks) { out.set(c, p); p += c.length; }
          return td.decode(out);
        }
        throw new Error(`unsupported zip compression method ${e.method} for ${e.name}`);
      }

      // ── Find the 2 canonical CSVs ──
      const mantisEntry = entries.find(e => /^mantis_vulns_/.test(e.name));
      const sastEntry   = entries.find(e => /^sast_semgrep_vulns_.*\.csv$/.test(e.name));

      let mantisCsv = null, sastCsv = null;
      try {
        if (mantisEntry) mantisCsv = await readEntry(mantisEntry);
        if (sastEntry)   sastCsv   = await readEntry(sastEntry);
      } catch (e) {
        return { error: `zip extract failed: ${e.message}` };
      }

      // ── Minimal RFC4180 CSV parser (handles quoted commas + newlines + "" escape) ──
      function parseCsv(text) {
        const rows = [];
        let row = [], field = '', inQ = false, i = 0;
        while (i < text.length) {
          const ch = text[i];
          if (inQ) {
            if (ch === '"') {
              if (text[i+1] === '"') { field += '"'; i += 2; continue; }
              inQ = false; i++; continue;
            }
            field += ch; i++; continue;
          }
          if (ch === '"') { inQ = true; i++; continue; }
          if (ch === ',') { row.push(field); field = ''; i++; continue; }
          if (ch === '\r') { i++; continue; }
          if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
          field += ch; i++;
        }
        if (field !== '' || row.length) { row.push(field); rows.push(row); }
        // First row = headers; rest as dicts
        if (!rows.length) return [];
        const headers = rows[0].map(h => h.trim());
        return rows.slice(1).filter(r => r.some(c => c.length))
          .map(r => Object.fromEntries(headers.map((h, idx) => [h, r[idx] ?? ''])));
      }

      function bucketCvss(v) {
        const c = parseFloat(v);
        if (isNaN(c)) return 'unknown';
        if (c >= 9) return 'critical';
        if (c >= 7) return 'high';
        if (c >= 4) return 'medium';
        if (c >  0) return 'low';
        return 'unknown';
      }

      const known_mantis = [];
      if (mantisCsv) {
        for (const r of parseCsv(mantisCsv)) {
          const sev = bucketCvss(r.cvss);
          if (!sev_filter.has(sev)) continue;
          known_mantis.push({
            mantis_id: (r.mantis_id || '').trim(),
            cve:       (r.cve || '').trim(),
            cwe:       (r.cwe || '').trim(),
            cvss:      parseFloat(r.cvss) || 0,
            severity:  sev,
            title:     (r.title || '').trim(),
          });
        }
      }

      const new_sast = [];
      if (sastCsv) {
        for (const r of parseCsv(sastCsv)) {
          const sev = (r.severity || '').trim().toLowerCase();
          if (!sev_filter.has(sev)) continue;
          let summary = (r.summary || '').trim();
          if (summary.length > 500) summary = summary.slice(0, 500) + '… (truncated)';
          new_sast.push({
            title:    (r.title || '').trim(),
            severity: sev,
            cwe:      (r.cwe || '').trim(),
            cwe_text: (r.cwe_text || '').trim(),
            summary,
            solution: (r.solution || '').trim().slice(0, 300),
          });
        }
      }

      return {
        ok: true,
        source_url: url,
        zip_size_bytes: buf.length,
        severity_filter: [...sev_filter].join(','),
        mantis_csv_found: !!mantisCsv,
        sast_csv_found:   !!sastCsv,
        known_mantis_count: known_mantis.length,
        new_sast_count:     new_sast.length,
        known_mantis,
        new_sast,
      };
    returns: |
      { ok, source_url, zip_size_bytes, severity_filter,
        mantis_csv_found, sast_csv_found,
        known_mantis_count, new_sast_count,
        known_mantis: [ { mantis_id, cve, cwe, cvss, severity, title } ],
        new_sast:     [ { title, severity, cwe, cwe_text, summary, solution } ] }
