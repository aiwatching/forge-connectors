id: mantis
name: MantisBT
icon: "🐞"
version: "0.25.7"
author: forge
category: connector
mode: browser-side
# Open a fresh background tab per call + close on completion. Avoids
# hijacking the user's open Mantis tab — important since Mantis is hit
# many times per pipeline run (fetch-bug-details, mark-fixed,
# add_comment, …). Slight per-call cost (~5s cold tab load), invisible.
tab_strategy: ephemeral
description: |
  Read + comment on MantisBT bugs from the user's logged-in browser session.

  All tool scripts are declared in this manifest and shipped to the Forge
  browser extension's generic runner. No extension code changes when adding
  or updating Mantis tools — bump `version` and refresh.

  Reuses the user's PHPSESSID cookie. Targets Mantis 1.x classic URL style
  (bug_view_page.php?bug_id=N). Column layout in #bug_list varies per
  instance (Mantis "Manage Columns"); scripts build a header → index map
  at runtime instead of hardcoding cell positions.

settings:
  base_url:
    type: string
    label: Mantis base URL
    description: "e.g. https://mantis.mycompany.com (no trailing slash)"
    required: true
  default_project:
    type: string
    label: Default project name
    description: "Optional — used when no project specified in queries"
  filter_form_mapping:
    type: object
    label: "Filter-form field mapping (advanced)"
    description: |
      For heavily customized Mantis installs where auto-detection
      picks the wrong filter widget. Maps a logical filter name to
      the actual `show_<group>` marker name on your filter page.
      Inspect via DevTools on view_all_bug_page.php: find the
      <input name="show_X"> hidden input that precedes the Source /
      Keyword / etc. multicheckbox[] select.
      Example:
        source:  reportsource   # not show_source — Fortinet skin
        keyword: key            # show_key on this install

# Plugin-level: how the extension's runner finds / opens authenticated tabs.
host_match: "{base_url}/*"
login_redirect: "/login_page.php"

test:
  description: "Opens a Mantis tab; ✓ if the session is alive, ✗ if you're not logged in."
  probe: browser

tools:
  list_my_bugs:
    description: |
      List bugs visible to the current user via their saved Mantis filter
      ("View All Issues" page). Returns id, summary, status, severity,
      priority, project, last_updated.
    parameters:
      status:
        type: select
        label: Status filter (client-side)
        description: "Status group filter (open=non-resolved, closed=resolved+closed, all=no filter)."
        options: ["open", "closed", "all"]
        default: "open"
      limit:
        type: number
        label: Max results
        description: "Maximum rows to return after client-side filtering."
        default: 50
    returns: "{ bugs: [...], total, rawCount, _page, _columnsDetected }"
    page:
      url: "{base_url}/view_all_bug_page.php"
      on_target: "/view_all_bug_page.php"
    script: |
      const list = document.querySelector('#bug_list');
      if (!list) {
        return { bugs: [], total: 0, _error: '#bug_list not found on ' + location.pathname };
      }

      const allRows = Array.from(list.querySelectorAll('tr'));
      const headerRow = allRows.find(r => r.className === 'row-category');
      const dataRows = allRows.filter(r => r.querySelector('input[name*="bug"]'));

      const headerIdx = {};
      if (headerRow) {
        Array.from(headerRow.querySelectorAll('td, th')).forEach((c, i) => {
          const name = (c.textContent || '').trim().toLowerCase();
          if (name) headerIdx[name] = i;
        });
      }

      const col = (cells, header) => {
        const idx = headerIdx[header.toLowerCase()];
        if (idx === undefined) return '';
        return (cells[idx]?.innerText || '').trim();
      };

      const STATUS_RE = /^(new|feedback|acknowledged|confirmed|assigned|open|resolved|closed|reopened)$/i;
      const FILTERS = {
        open: /^(new|feedback|acknowledged|confirmed|assigned|open|reopened)$/i,
        closed: /^(resolved|closed)$/i,
        all: /./,
      };

      const all = dataRows.map(r => {
        const cells = Array.from(r.querySelectorAll('td'));
        const checkbox = r.querySelector('input[type="checkbox"][name*="bug"]');
        const link = r.querySelector('a[href*="bug_view_page.php?bug_id="]');
        const id = checkbox?.value
          ? Number(checkbox.value)
          : Number(link?.href.match(/bug_id=(\d+)/)?.[1] || 0);
        if (!id) return null;

        // Forge quirk: "Status" column shows handler; real status under "Resolution"
        let status = col(cells, 'Status');
        if (!STATUS_RE.test(status)) {
          const resolution = col(cells, 'Resolution');
          if (STATUS_RE.test(resolution)) status = resolution;
        }

        return {
          id,
          summary: link?.getAttribute('title')?.trim() || col(cells, 'Summary'),
          status,
          priority: col(cells, 'Priority'),
          severity: col(cells, 'Severity') || col(cells, 'S'),
          keywords: col(cells, 'Keyword') || col(cells, 'Category'),
          reporter: col(cells, 'Reporter'),
          assignee: (col(cells, 'Status') || col(cells, 'Handler') || col(cells, 'Assigned To'))
            .replace(/^\(|\)$/g, '')
            .trim(),
          source: col(cells, 'Source'),
          product_version: col(cells, 'Reported Version') || col(cells, 'Product Version'),
          fix_schedule: col(cells, 'Fix Schedule'),
          last_updated: col(cells, 'Updated') || col(cells, 'Last Updated'),
          created_at: col(cells, 'Date Submitted') || col(cells, 'Date'),
          url: link?.href || '',
        };
      }).filter(Boolean);

      const key = (args.status || 'all').toLowerCase();
      const filter = FILTERS[key] || FILTERS.all;
      const filtered = all.filter(b => filter.test(b.status));

      return {
        bugs: filtered.slice(0, args.limit || 50),
        total: filtered.length,
        rawCount: all.length,
        _page: location.href,
        _columnsDetected: Object.keys(headerIdx),
      };

  get_bug:
    description: |
      Get full details of a single bug — all fields, notes (comments),
      and history. Returns a structured object with summary, description,
      status, resolution, priority, severity, reporter, assignee, notes,
      history, and the raw field map.
    parameters:
      bug_id:
        type: number
        label: Bug ID
        description: "Mantis bug numeric id (e.g. 1213844)."
        required: true
    returns: "{ id, summary, description, status, resolution, ..., notes: [{id, idx, author, date, body}, ...], history: [...] }"
    page:
      url: "{base_url}/bug_view_page.php?bug_id={args.bug_id}"
      on_target: "bug_id={args.bug_id}"
    script: |
      // Wait up to 5s for the bug-detail DOM to render. Most "bug
      // detail table not found" errors are timing races: the runner
      // navigates to bug_view_page.php?bug_id=N, on_target matches
      // the URL, but the page hasn't finished rendering when the
      // script eval'd. Poll for the .form-title element instead of
      // failing immediately.
      const findDetailsTitle = () => Array.from(document.querySelectorAll('.form-title'))
        .find(e => e.textContent && e.textContent.trim().startsWith('Viewing Bug'));
      let detailsTitle = findDetailsTitle();
      if (!detailsTitle) {
        for (let i = 0; i < 50 && !detailsTitle; i++) {
          await new Promise(r => setTimeout(r, 100));
          detailsTitle = findDetailsTitle();
        }
      }
      const detailsTable = detailsTitle ? detailsTitle.closest('table') : null;
      if (!detailsTable) {
        return { _error: 'bug detail table not found after 5s wait on ' + location.pathname };
      }

      // Top header row pattern (row 1 = labels, row 2 = values)
      const rows = Array.from(detailsTable.querySelectorAll('tr'));
      const fields = {};
      if (rows[1] && rows[2]) {
        const labelCells = Array.from(rows[1].querySelectorAll('td'));
        const valueCells = Array.from(rows[2].querySelectorAll('td'));
        labelCells.forEach((l, i) => {
          const label = l.innerText.trim();
          const val = valueCells[i] ? valueCells[i].innerText.trim() : '';
          if (label && !fields[label]) fields[label] = val;
        });
      }

      // Walk td.category labels (the rest of the fields)
      Array.from(document.querySelectorAll('td.category')).forEach(label => {
        const labelText = label.textContent?.trim() || '';
        if (labelText.includes('\n') && labelText.length > 100) return;
        if (labelText.startsWith('Select File') || labelText === 'Bugnote') return;
        const v = label.nextElementSibling;
        if (!v || v.tagName !== 'TD' || v.classList.contains('category')) return;
        if (!fields[labelText]) fields[labelText] = v.innerText.trim();
      });

      // Bug notes
      const notesTitle = Array.from(document.querySelectorAll('.form-title'))
        .find(e => e.textContent && e.textContent.trim().startsWith('Bug Notes'));
      const notesTable = notesTitle?.closest('table');
      // Stable note key for Jobs dedup. Different Mantis themes put the
      // note id in different places — try several before falling back to
      // a content hash so `id` is NEVER null.
      function pickNoteId(row) {
        // 1. <tr id="c12345">
        const rowId = row.getAttribute('id') || '';
        let m = rowId.match(/^c(\d+)$/);
        if (m) return Number(m[1]);
        // 2. <a id="c12345"> / <a name="c12345"> inside the row (most themes)
        const anchor = row.querySelector('[id^="c"], [name^="c"]');
        const aId = anchor?.getAttribute('id') || anchor?.getAttribute('name') || '';
        m = aId.match(/^c(\d+)$/);
        if (m) return Number(m[1]);
        // 3. <a href="...#c12345"> — present in some custom skins
        const hashLink = row.querySelector('a[href*="#c"]');
        m = hashLink?.getAttribute('href')?.match(/#c(\d+)/);
        if (m) return Number(m[1]);
        // 4. bug_revision_view_page.php?bugnote_id=12345 — Mantis core links to it
        const editLink = row.querySelector('a[href*="bugnote_id="]');
        m = editLink?.getAttribute('href')?.match(/bugnote_id=(\d+)/);
        if (m) return Number(m[1]);
        return null;
      }

      // Synthetic stable key when no native id is found. SubtleCrypto would
      // be cleaner but isn't always allowed in MAIN world; a cheap FNV-1a
      // 32-bit hash is plenty to distinguish notes from each other.
      function fnv1a(s) {
        let h = 0x811c9dc5;
        for (let i = 0; i < s.length; i++) {
          h ^= s.charCodeAt(i);
          h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
        }
        return h.toString(16);
      }

      const notes = Array.from(notesTable?.querySelectorAll('tr.bugnote') || []).map((r, i) => {
        const cells = r.querySelectorAll('td');
        const header = cells[0]?.innerText.trim() || '';
        const body = cells[1]?.innerText.trim() || '';
        const m = header.match(/^(.*?)\n(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})/);
        const author = m && m[1] ? m[1].trim() : (header.split('\n')[0] || '').trim();
        const date = m && m[2] ? m[2] : '';

        const nativeId = pickNoteId(r);
        // `id` is what Jobs dedups on — always populate it. Native numeric id
        // when available; else synthetic 'note-<hash>' from date + first 200
        // body chars (stable across reloads even if the note isn't edited).
        const id = nativeId != null
          ? nativeId
          : `note-${fnv1a(date + '' + body.slice(0, 200))}`;
        return {
          id,
          idx: i,
          author,
          date,
          body,
          // Surface which mechanism gave us the id for easier debugging
          _id_source: nativeId != null ? 'native' : 'hash(date+body)',
        };
      });

      // Bug history (4-column table)
      const historyTitle = Array.from(document.querySelectorAll('.form-title'))
        .find(e => e.textContent && e.textContent.trim().startsWith('Bug History'));
      const historyTable = historyTitle?.closest('table');
      const history = Array.from(historyTable?.querySelectorAll('tr') || [])
        .filter(r => r.querySelectorAll('td').length === 4)
        .slice(1)
        .map(r => {
          const c = Array.from(r.querySelectorAll('td')).map(x => x.innerText.trim());
          return { date: c[0], user: c[1], field: c[2], change: c[3] };
        });

      const id = Number(fields.ID || args.bug_id);

      return {
        id,
        summary: fields.Summary || '',
        description: fields.Description || '',
        additional_information: fields['Additional Information'] || '',
        status: fields.Status || '',
        resolution: fields.Resolution || '',
        priority: fields.Priority || '',
        severity: fields.Severity || '',
        reproducibility: fields.Reproducibility || '',
        category: fields.Category || '',
        keywords: fields.Keyword || '',
        reporter: fields.Reporter || '',
        assignee: fields['Assigned To'] || '',
        qa_assignee: fields['QA Assignee'] || '',
        view_status: fields['View Status'] || '',
        eta: fields.ETA || '',
        date_submitted: fields['Date Submitted'] || '',
        last_update: fields['Last Update'] || '',
        reported_version: fields['Reported Version'] || '',
        fix_schedule: fields['Fix Schedule'] || '',
        source: fields.Source || '',
        tag: fields.Tag || '',
        notes,
        history,
        url: location.href,
        _fields_raw: fields,
      };

  search_bugs:
    description: |
      Search bugs with optional status / project / fix-schedule filters.

      `query` is free-text on summary + description ONLY. DO NOT pass
      pseudo-syntax like `status:assigned` / `project:Foo` / a version
      number inside the query — those become literal search terms and
      match nothing.

      Use these dedicated params instead:
        - status         — by Mantis status (open / new / assigned / ...)
        - project_id     — by Mantis project (numeric id from list_projects)
        - fix_schedule   — Fix Schedule text — uses Mantis search_fixforecast
                           URL param (server-side; fast). Example "7.6.7".
        - assignee       — Username (e.g. "jdoe"), full name, or numeric user
                           id. Resolves to handler_id URL param. Falls back
                           to client-side substring match on the Assigned To
                           column if the user can't be looked up.
        - reporter       — Same matching as assignee. Becomes reporter_id.
        - qa_assignee    — Same matching as assignee. Becomes qa_assignee_id.
                           (Some Mantis installs expose QA as a first-class
                           field, not a custom field — this is one of them.)
        - extra_params   — Object of { name: value } passed verbatim to
                           Mantis filter URL. Use for fields we don't
                           model directly: bug_type, dev_status,
                           review_required, escalated_by, eco_checked_in,
                           feedback_requested, bug_type, search_type,
                           multicheckbox_tags[], etc. Discover them on
                           your Mantis filter page (DevTools → form fields).
    parameters:
      query:
        type: string
        description: |
          Mantis full-text search (search= URL param). Searches ONLY
          summary + description + additional info + bug notes — does
          NOT search the Keyword field, Source field, or any custom
          field. To filter by the Keyword column use the `keyword`
          parameter, by Source use `source`, etc. Supports Mantis
          boolean operators if your install enables full-text mode:
          -word (NOT), +word (AND), "phrase" (exact), word1|word2 (OR).
        label: Search query (full-text — summary / description / notes)
        required: false
      status:
        type: string
        description: "Mantis status name, comma list, 'open' (all <80), or 'all' (no filter)."
        label: |
          Status filter. Accepts a single name or comma list:
            new, feedback, acknowledged, confirmed, assigned,
            resolved, closed, reopened.
          Aliases:
            "open" → new,feedback,acknowledged,confirmed,assigned (everything <80)
            "all"  → no filter
        default: "open"
      project_id:
        type: number
        description: "Mantis internal numeric project id (from list_projects). Sets PHP-session current project."
        label: |
          Mantis INTERNAL numeric project id (NOT the "#N" prefix shown
          in the picker — those are display labels). Call `list_projects`
          first; use the `id` field from the result. Example: a project
          might display as "#17 MyProject" but its internal id could be
          123 — pass 123 here.

          This is the SAME field as the top-right "current project"
          switcher. The connector POSTs it to set_project.php before
          running the filter (the filter form has no project_id field —
          the project is purely PHP-session state). STRONGLY RECOMMENDED
          to set on every job; without it the search runs against
          "All Projects".

          Alternative: pass `project_name` (human-readable, e.g.
          "MyProject") and the connector resolves it to the right id by
          scanning the project switcher's options.
        required: false
      project_name:
        type: string
        description: "Human-readable project name (case-insensitive); resolved against the project switcher options."
        label: |
          Human-readable project name (case-insensitive). Resolved
          against the top-right project-switcher options at run time —
          the "#N " display prefix is stripped before matching, so
          "MyProject" matches "#17 MyProject".

          Use this OR `project_id` (id takes precedence when both are
          set). Easier to remember than the numeric id and survives
          Mantis reordering projects.
        required: false
      fix_schedule:
        type: string
        description: "Fix Schedule custom field value (e.g. '7.6.7'); maps to Mantis search_fixforecast URL param."
        label: |
          Fix Schedule custom field (e.g. "7.6.7"). Case-insensitive
          substring match. Walks Mantis pagination until `limit` matches
          found or the scan cap is reached.
        required: false
      assignee:
        type: string
        description: "Assignee filter — username, full name, or numeric user id. Resolves to handler_id."
        label: |
          Assignee — accepts username ("jdoe"), full name ("Jane Doe"),
          or numeric user id ("8806"). Looked up via the filter form's
          handler_id dropdown that Mantis already serves on view_all_bug_page.
          Resolves to URL param handler_id=<id> (server-side filter, fast).
          Falls back to client-side substring match on the Assigned To
          column if lookup fails.
        required: false
      reporter:
        type: string
        description: "Reporter filter — username, full name, or numeric user id. Resolves to reporter_id."
        label: |
          Reporter — same matching as assignee. Resolves to reporter_id.
        required: false
      qa_assignee:
        type: string
        description: "QA assignee filter — username, full name, or numeric user id. Resolves to qa_assignee_id."
        label: |
          QA Assignee — same matching as assignee. Resolves to
          qa_assignee_id (treated as a first-class field on customized
          Mantis installs that expose it directly rather than as a
          custom field).
        required: false
      keyword:
        type: string
        description: |
          Mantis Keyword field filter (the "Keyword" column shown on
          the bug row, e.g. "QA Automation Test"). This is the CORRECT
          way to find bugs tagged with a given Keyword — the `query`
          parameter does NOT search the Keyword field. Comma-separate
          for multi-value (e.g. "regression,security").
        label: Keyword field filter (NOT the same as `query`)
        required: false
      source:
        type: string
        description: "Source field filter (e.g. 'QA', 'Customer', 'Internal'); comma-separate for multi-value."
        label: |
          Mantis Source field filter (the "Source" column shown on
          search results — e.g. "QA", "Customer", "Internal"). Comma-
          separate for multi-value. Forge first tries the standard
          `source` URL param; if your install uses a custom field id
          instead (custom_field_N), pass that via `extra_params`.
        required: false
      severity:
        type: string
        description: "Severity filter — comma list of names ('major'), ids ('60'), or Fortinet S-codes ('S1,S2')."
        label: |
          Severity filter — comma-separated. Accepts human names OR
          numeric ids OR Fortinet S-codes:
            feature(10), trivial(20), text(30), tweak(40),
            minor(50)/S4, major(60)/S3, crash(70)/S2, block(80)/S1.
          Examples: "high", "S1,S2", "block,crash".
        required: false
      resolution:
        type: string
        description: "Resolution filter — comma list of names ('fixed,duplicate') or numeric ids ('20,60')."
        label: |
          Resolution filter — accepts human names OR numeric ids.
          Comma-separated for multi-value (matches ANY of them).
          Names: open(10), fixed(20), reopened(30), unable_to_reproduce(40),
          not_fixable(50), duplicate(60), not_a_bug(70), suspended(80),
          wont_fix(90). Examples: "open", "open,reopened", "20".
        required: false
      filter_form_mapping:
        type: object
        description: "Per-call override map of logical filter name → show_<X> marker (e.g. {source: reportsource})."
        label: |
          Per-call override for the auto-detected filter-form mapping
          (heavily customized Mantis installs). Maps a logical filter
          name to the `<input name="show_<X>">` marker name on your
          filter page. Inspect via DevTools on view_all_bug_page.php.
          Example:
            { "source": "reportsource", "keyword": "key" }
          Forge picks the marker's adjacent multicheckbox[] select.
          Use the `_filter_diagnostics._form_applied` field in the
          response to confirm the override hit.
        required: false
      extra_params:
        type: object
        description: "Extra Mantis filter URL params (e.g. {bug_type: 'Regression', custom_field_5: 'X'})."
        label: |
          Raw Mantis filter URL params. Useful for install-specific custom
          fields we don't model directly. Examples (your install may have
          others — inspect the filter form in DevTools to find names):
            bug_type            (Regression / Suggestion / ...)
            dev_status          (discuss / pending / fixme-hi / ...)
            review_required     (any / v1-v5)
            feedback_requested  (Yes / No / any)
            eco_checked_in      (Yes / No)
            escalated_by        (numeric user id)
            search_type         (1=AND, 2=OR)
            multicheckbox_tags[] (tag id)
            submit_starttime, submit_endtime
            start_reported_version, end_reported_version
            css_tickets_cnt, etc.
          Pass as { "bug_type": "Regression", "dev_status": "pending" }.
        required: false
      limit:
        type: number
        description: "Max matching bugs to return; the scan walks pagination until reached or cap hit."
        default: 25
    returns: "{ bugs: [{id, summary, status, priority, severity, reporter, assignee, qa_assignee, fix_schedule, …}], total (returned), total_matching (server-side total across all pages, from 'Viewing Bugs (a - b / N)'), rawCount, scanned, pages_walked, query, status, project_id, fix_schedule, assignee, reporter, qa_assignee, _filter_url, _page }"
    page:
      url: "{base_url}/view_all_bug_page.php"
      on_target: "/view_all_bug_page.php"
    script: |
      // Status enum probed live from a customized Mantis filter form.
      // Note: 'reopened' (70) is NOT in every install — the probed one
      // dropped it. If your Mantis is standard MantisBT (with reopened),
      // add 70 here.
      const STATUS_IDS = {
        new: 10, feedback: 20, acknowledged: 30, confirmed: 40,
        assigned: 50, resolved: 80, closed: 90,
      };
      const OPEN_GROUP = ['new','feedback','acknowledged','confirmed','assigned'];

      function resolveStatuses(raw) {
        const v = String(raw || 'open').toLowerCase().trim();
        if (v === 'all' || v === '') return [];
        if (v === 'open') return OPEN_GROUP.map(n => STATUS_IDS[n]);
        const names = v.split(',').map(s => s.trim()).filter(Boolean);
        return names
          .map(n => STATUS_IDS[n])
          .filter(id => id != null);
      }

      const statusIds = resolveStatuses(args.status);
      const limit = Number(args.limit) || 25;

      // ─── User resolution (username / full name / numeric id → user_id) ─
      // The filter form on view_all_bug_page.php already has loaded select
      // elements for reporter_id / handler_id / qa_assignee_id with EVERY
      // Mantis user. We mine that DOM rather than making a separate lookup
      // call — zero extra HTTP, instant.
      //
      // Match priority for each input string:
      //   1. Numeric input → use as-is (skip lookup)
      //   2. Exact "(username)" at end of any option's label
      //   3. Case-insensitive substring on full label ("liz zhang")
      // Returns the first match's value. Null if nothing matches; caller
      // falls back to client-side substring filtering on the result rows.
      function resolveUserId(value) {
        const v = String(value || '').trim();
        if (!v) return null;
        if (/^\d+$/.test(v)) return v;
        const lv = v.toLowerCase();
        const sels = document.querySelectorAll('select[name="handler_id"], select[name="reporter_id"], select[name="qa_assignee_id"]');
        let fallbackSubstring = null;
        for (const sel of sels) {
          for (const opt of sel.options) {
            const id = opt.value;
            if (!/^\d+$/.test(id)) continue;
            const label = (opt.textContent || '').toLowerCase().trim();
            const m = label.match(/\(([a-z0-9_.-]+)\)\s*$/);
            if (m && m[1] === lv) return id;
            if (!fallbackSubstring && label.includes(lv)) fallbackSubstring = id;
          }
        }
        return fallbackSubstring; // may be null
      }

      const handlerId = resolveUserId(args.assignee);
      const reporterId = resolveUserId(args.reporter);
      const qaAssigneeId = resolveUserId(args.qa_assignee);

      // ── Enum cache pre-pass ──────────────────────────────────────
      // If refresh_enum_cache has been run we have a snapshot of every
      // install-specific multicheckbox enum (Keyword, Source, Severity,
      // Category, Status, Resolution) — including each option's
      // (value=id, label=human name) pair AND the form param that
      // Mantis uses to submit it. Translate string-named args
      // ("QA Automation Test", "open,reopened") into the numeric ids
      // the server actually accepts, BEFORE we hit applyMultiValueFilter
      // and the form-POST. The whole point of the cache.
      //
      // Falls back to the previous label-based matching if the cache
      // is missing or stale.
      let _enumCache = null;
      try {
        const _raw = localStorage.getItem('__forge_mantis_enum_cache_v1');
        if (_raw) {
          const _obj = JSON.parse(_raw);
          if (_obj && _obj.ts && (Date.now() - _obj.ts) < 24 * 60 * 60 * 1000 && _obj.enums) {
            _enumCache = _obj.enums;
          }
        }
      } catch {}
      function _enumLookupIds(logicalKey, rawValue) {
        if (!_enumCache || !rawValue) return null;
        const e = _enumCache[logicalKey];
        if (!e || !Array.isArray(e.options) || e.options.length === 0) return null;
        const items = String(rawValue).split(',').map(s => s.trim()).filter(Boolean);
        const ids = [];
        for (const item of items) {
          const lc = item.toLowerCase();
          // value exact (already an id) > label exact > label substring
          let hit = e.options.find(o => String(o.value).toLowerCase() === lc);
          if (!hit) hit = e.options.find(o => o.label.toLowerCase() === lc);
          if (!hit) hit = e.options.find(o => o.label.toLowerCase().includes(lc));
          if (hit) ids.push(String(hit.value));
        }
        return ids.length > 0 ? ids : null;
      }
      // Note: connector arg keys → enum cache logical keys.
      // Keyword field is named "key" on Mantis filter form.
      const _enumArgMap = {
        keyword: 'key',
        source: 'source',
        category: 'category',
        severity: 'severity',
        status: 'status',
        resolution: 'resolution',
      };
      const _enumApplied = {};
      for (const [argKey, logicalKey] of Object.entries(_enumArgMap)) {
        if (!args[argKey]) continue;
        const ids = _enumLookupIds(logicalKey, args[argKey]);
        if (ids && ids.length > 0) {
          _enumApplied[argKey] = { original: args[argKey], resolved_ids: ids, via_enum_cache: true };
          args[argKey] = ids.join(',');
        }
      }

      // Fix Schedule → server-side URL param (search_fixforecast).
      const fixForecast = String(args.fix_schedule || '').trim();

      // ── Client-side sanity needles ───────────────────────────────
      // Belt-and-suspenders for installs where form-POST applies
      // keyword cleanly but Mantis drops co-submitted URL-only
      // filters (fix_schedule / status / resolution). We re-check
      // these THREE stable list columns AFTER the server returns,
      // using the user's ORIGINAL human-readable values (not the
      // id strings the enum cache rewrote into args.*). Keyword is
      // deliberately NOT in this list — its list column is
      // unreliable on Fortinet's custom theme. Columns that come
      // back empty get a free pass (column hidden → trust server).
      const _origStatus = _enumApplied.status?.original ?? args.status ?? '';
      const _origResolution = _enumApplied.resolution?.original ?? args.resolution ?? '';
      const _toNeedles = (raw) => String(raw || '')
        .split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
      const _statusNeedles = _toNeedles(_origStatus);
      const _resolutionNeedles = _toNeedles(_origResolution);
      const _fixNeedles = fixForecast ? [fixForecast.toLowerCase()] : [];
      let _droppedBySanity = 0;

      // Server-side filters trust completely — no client-side row
      // verification anymore. Page budget defaults to 2 pages × 100 rows.
      // Source / Keyword / Severity needles are still populated below
      // (by applyMultiValueFilter), but only for the form-POST path
      // which feeds them into the Mantis filter form — NOT for row
      // verification.
      let PAGE_SIZE = 100;
      let MAX_PAGES = 2;
      // Adaptive scan budget — when we KNOW the server's total filter is
      // weaker than ours (sanity check drops most rows), we need to walk
      // enough pages to find the rare true matches. Computed after page 1
      // from serverTotal + actual per-page count. Capped to keep latency
      // bounded; user can lower with `limit` once the right rows surface.
      const MAX_PAGES_ADAPTIVE = 20;
      let actualPageSize = 0;

      // ─── Build & submit filter via the page's REAL form ──────────────
      // Some customized Mantis installs ignore URL params like \`status_id[]\`
      // entirely; they expect you to POST the *whole* filter form to view_all_set.php
      // with multicheckbox[] entries appearing in the SAME order as the
      // preceding show_<group>=y hidden markers (severity → status →
      // priority → resolution). Probed live via chrome MCP, May 2026.
      //
      // Strategy: take the form currently rendered on the page,
      // FormData-ify it, then override only the fields we care about.
      const baseDir = `${location.origin}${location.pathname.replace(/[^/]*$/, '')}`;

      // ── Resolve args.project_name → numeric id ────────────────
      // The user gives us a name (e.g. "FortiNAC") and we always
      // resolve it to the numeric id ourselves — Mantis filters
      // require the id, not the name. v0.24 adds a localStorage
      // cache (key __forge_mantis_project_cache_v1, 24h TTL) so the
      // dropdown only gets walked when the cache is cold or stale.
      // If the first lookup misses, we force-refresh once before
      // failing — that catches the "Mantis just got a new project"
      // case without forcing the user to manually refresh.
      // If args.project_id is set it wins (explicit id always overrides).
      let resolvedProjectId = args.project_id ? String(args.project_id) : '';
      let resolvedProjectName = '';
      if (!resolvedProjectId && args.project_name) {
        const PROJ_CACHE_KEY = '__forge_mantis_project_cache_v1';
        const PROJ_TTL_MS = 24 * 60 * 60 * 1000;
        const normName = (s) => String(s).replace(/^\s*#\d+\s+/, '').trim().toLowerCase();
        const wanted = normName(args.project_name);

        function readCache() {
          try {
            const raw = localStorage.getItem(PROJ_CACHE_KEY);
            if (raw) {
              const obj = JSON.parse(raw);
              if (obj && obj.ts && Date.now() - obj.ts < PROJ_TTL_MS && Array.isArray(obj.projects)) {
                return obj.projects;
              }
            }
          } catch {}
          return null;
        }
        function buildAndCache() {
          const switchForm = Array.from(document.querySelectorAll('form'))
            .find(f => /set_project\.php/.test(f.action || ''));
          const sel = switchForm?.querySelector('select[name="project_id"]');
          const opts = sel ? Array.from(sel.options) : [];
          const fresh = opts
            .map(o => ({ id: Number(o.value), name: (o.text || '').trim() }))
            .filter(p => p.id > 0);
          try { localStorage.setItem(PROJ_CACHE_KEY, JSON.stringify({ ts: Date.now(), projects: fresh })); } catch {}
          return fresh;
        }
        function findExact(projects) {
          return projects.filter(p => normName(p.name) === wanted);
        }

        let projects = readCache() || buildAndCache();
        let exact = findExact(projects);

        // First-attempt miss → maybe project was added recently, force
        // refresh once and try again.
        if (exact.length === 0) {
          projects = buildAndCache();
          exact = findExact(projects);
        }

        if (exact.length === 1) {
          resolvedProjectId = String(exact[0].id);
          resolvedProjectName = exact[0].name;
        } else {
          const substr = projects.filter(p => normName(p.name).includes(wanted) && normName(p.name) !== wanted);
          return {
            bugs: [], total: 0,
            _error: exact.length > 1
              ? `project_name "${args.project_name}" matches ${exact.length} projects exactly. Pass project_id to disambiguate.`
              : `project_name "${args.project_name}" did not exactly match any project (cache refreshed). Use list_projects to see the list, then either rename your input or pass project_id.`,
            _candidates: {
              exact: exact.map(p => ({ id: p.id, name: p.name })),
              by_substring: substr.slice(0, 10).map(p => ({ id: p.id, name: p.name })),
            },
          };
        }
      }

      // ── STEP 0: switch the PHP-session "current project" (the
      // top-right project switcher in the page header) BEFORE any
      // filter work. Probed live with chrome MCP: the filter form on
      // view_all_bug_page.php has 55 fields and NONE of them is
      // `project_id` — the filter operates against whatever project
      // is set in the session by set_project.php. So we POST that
      // first.
      //
      // If args.project_id is unset, we still POST `0` (= All Projects)
      // to clear any stale project picked by a previous job — the
      // same session-leak class as handler_id / reporter_id.
      //
      // Single POST, ~50 ms. No-op if the session already matches.
      const projectIdForSession = resolvedProjectId || '0';
      try {
        const fdProj = new FormData();
        fdProj.set('project_id', projectIdForSession);
        await fetch(baseDir + 'set_project.php', {
          method: 'POST',
          body: fdProj,
          credentials: 'include',
        });
      } catch (e) {
        // Non-fatal: if this fails the search will still run, just
        // against whatever project the session had.
        console.warn('[mantis] set_project.php failed:', (e && e.message) || e);
      }

      // ── Filter application via URL query with temporary=y ─────────
      //
      // Earlier versions tried to mutate + POST the in-DOM filter form.
      // That worked on stock MantisBT but FAILED on customized installs
      // (e.g. heavily customized enterprise installs): the multicheckbox[] / show_status
      // serialization ends up disagreeing and Mantis returns 0 rows.
      //
      // The URL-query path is documented Mantis behaviour and avoids
      // the whole DOM serialization minefield:
      //
      //   GET /view_all_set.php?type=1&temporary=y&status_id[]=10&...
      //
      // `temporary=y` tells Mantis NOT to save this filter to the user's
      // session, so we sidestep the cross-job session-leak class entirely.
      // The `set_project.php` POST in STEP 0 above stays — it sets the
      // session's CURRENT PROJECT (not the filter), and view_all_set.php
      // operates within that project.
      //
      // User filters (handler_id/reporter_id/qa_assignee_id) are resolved
      // from the in-DOM filter form's <select> options BEFORE this point;
      // we use the numeric IDs in the URL query.
      const params = new URLSearchParams();
      params.set('type', '1');
      params.set('temporary', 'y');
      params.set('print', '0');
      params.set('search', String(args.query || ''));
      params.set('per_page', String(PAGE_SIZE));
      if (handlerId)        params.set('handler_id', handlerId);
      if (reporterId)       params.set('reporter_id', reporterId);
      if (qaAssigneeId)     params.set('qa_assignee_id', qaAssigneeId);
      if (fixForecast)      params.set('search_fixforecast', fixForecast);
      // Customized installs only honour `show_status`; the documented
      // `status_id[]` is silently ignored on those.
      if (statusIds.length > 0) params.set('show_status', statusIds.join(','));

      // Resolution — accept human names + comma-list, translate to ids.
      // Mantis URL takes `resolution[]=<id>` (multi-value).
      const RESOLUTION_IDS = {
        open: 10, fixed: 20, reopened: 30, unable_to_reproduce: 40,
        not_fixable: 50, duplicate: 60, not_a_bug: 70, suspended: 80,
        wont_fix: 90,
      };
      const _resolutionIds = [];
      const _resolutionRaw = String(args.resolution || '').trim();
      if (_resolutionRaw) {
        for (const tok of _resolutionRaw.split(',').map(s => s.trim()).filter(Boolean)) {
          const norm = tok.toLowerCase().replace(/[\s-]+/g, '_');
          const id = /^\d+$/.test(norm) ? norm : RESOLUTION_IDS[norm];
          if (id != null) _resolutionIds.push(String(id));
        }
        if (_resolutionIds.length > 0) {
          params.delete('resolution[]');
          for (const id of _resolutionIds) params.append('resolution[]', id);
        }
      }

      // Keywords + Source — top-level filters. Mantis instances vary
      // wildly: standard installs use literal `keywords` / `source`
      // URL params; customized installs (e.g. Fortinet) wire these as
      // `custom_field_<id>` selects. We scan the entire page for an
      // element whose accessible label matches "source"/"keyword" and
      // return its `name`. Falls back to a literal URL key + records
      // what we did in _diagnostics for the caller.
      const _filterDiag = {};

      // Build a debug index of every visible form input on the filter
      // page along with its nearest text label. The user pastes this
      // back when source/keyword detection fails so we can target the
      // real field name (custom_field_<N>) explicitly.
      const _availableFilterFields = [];
      try {
        for (const inp of document.querySelectorAll('select, input[type="text"], input[type="hidden"]')) {
          const nm = inp.getAttribute('name');
          if (!nm) continue;
          // Try to find a label: same-row <th>, preceding sibling cell,
          // or <label for=id> text.
          let label = '';
          const id = inp.id;
          if (id) {
            const labFor = document.querySelector(`label[for="${id}"]`);
            if (labFor) label = (labFor.textContent || '').trim();
          }
          if (!label) {
            // Walk up to find a containing cell, then look at its row
            const cell = inp.closest('td, th');
            if (cell) {
              let prev = cell.previousElementSibling;
              let hops = 0;
              while (prev && hops < 3) {
                const t = (prev.textContent || '').trim().replace(/\s+/g, ' ');
                if (t && t.length < 80) { label = t; break; }
                prev = prev.previousElementSibling;
                hops += 1;
              }
            }
          }
          if (!label) {
            const cell = inp.closest('td, th');
            const row = cell?.closest('tr');
            if (row) {
              // First <th> in the row often holds the label.
              const th = row.querySelector('th');
              if (th && !th.contains(inp)) label = (th.textContent || '').trim();
            }
          }
          _availableFilterFields.push({ name: nm, label: label.replace(/[:：]\s*$/, ''), tag: inp.tagName });
        }
      } catch {}

      function detectFormParamName(wantedLabel) {
        const want = String(wantedLabel).toLowerCase();
        const wantPlural = want + 's';
        // Strategy A (PREFERRED): label-anchored.
        // Find a <th>/<td>/<label> whose TRIMMED text is "Source",
        // "Sources", "Bug Source", "Source of Bug" etc. — anything
        // where the wanted word stands alone (word-boundary), short
        // enough that it's a field label, not a paragraph. Trailing
        // colon stripped. Then look at next 1-3 sibling cells for
        // the actual <select>/<input>.
        const wbRe = new RegExp('(^|[\\s|/])' + want + '($|[\\s:|/])', 'i');
        const labelEls = Array.from(document.querySelectorAll('th, td, label'));
        for (const lab of labelEls) {
          const t = (lab.textContent || '').trim().replace(/[:：]\s*$/, '');
          if (!t || t.length > 40) continue;
          if (!wbRe.test(t.toLowerCase())) continue;
          let n = lab.nextElementSibling;
          let hops = 0;
          while (n && hops < 3) {
            const inp = n.querySelector?.('select, input[type="text"], input[type="hidden"]');
            if (inp && inp.getAttribute('name')) return inp.getAttribute('name');
            n = n.nextElementSibling;
            hops += 1;
          }
        }
        // Strategy B (fallback): exact-name match (NOT substring) on
        // any select/input. Matches standard MantisBT URL params
        // `source` / `keywords` when there are no labels at all.
        const directExact = Array.from(document.querySelectorAll('select, input'))
          .find(el => {
            const nm = (el.getAttribute('name') || '').toLowerCase().replace(/\[\]$/, '');
            return nm === want || nm === wantPlural;
          });
        if (directExact) return directExact.getAttribute('name');
        return null;
      }
      // Apply each filter as TWO best-effort layers:
      //   1. URL param IF a matching form field exists. Narrows the
      //      server-side response (saves bandwidth, finds more pages).
      //   2. Client-side substring match on the result row's column.
      //      The Fortinet-style Mantis exposes Source as a result
      //      COLUMN but doesn't have a Source filter widget — so the
      //      URL layer no-ops and we rely on client-side here.
      //
      // Tracked as client-side needles consumed AFTER the result
      // table is fetched + parsed (further down in this script).
      function applyMultiValueFilter(rawValue, fallbackName, diagKey) {
        const raw = String(rawValue || '').trim();
        if (!raw) return null;
        const detected = detectFormParamName(diagKey);
        const vals = raw.split(',').map(s => s.trim()).filter(Boolean);
        let urlParam = null;
        if (detected) {
          const isArrayLike = detected.endsWith('[]');
          if (isArrayLike || vals.length > 1) {
            params.delete(detected);
            vals.forEach(v => params.append(detected, v));
          } else {
            params.set(detected, vals[0]);
          }
          urlParam = detected;
        }
        _filterDiag[diagKey] = {
          input: raw,
          param_used: urlParam,           // null when no URL field
          detected_from_form: !!detected,
          client_side_needles: vals.map(v => v.toLowerCase()),
          values: vals,
        };
        return vals.map(v => v.toLowerCase());
      }
      const keywordNeedles = applyMultiValueFilter(args.keyword, 'keywords', 'keyword') || [];
      const sourceNeedles  = applyMultiValueFilter(args.source,  'source',   'source')  || [];

      // Severity needles — translate Fortinet S-codes / human names to
      // numeric ids before passing to applyMultiValueFilter so the
      // option-text matcher hits correctly.
      const SEVERITY_IDS = {
        feature: 10, trivial: 20, text: 30, tweak: 40,
        minor: 50, major: 60, crash: 70, block: 80,
        s4: 50, s3: 60, s2: 70, s1: 80,
      };
      function translateEnumValue(map, raw) {
        if (!raw) return '';
        return String(raw).split(',').map(s => s.trim()).filter(Boolean).map(t => {
          const norm = t.toLowerCase().replace(/[\s-]+/g, '_');
          if (/^\d+$/.test(norm)) return norm;
          return map[norm] != null ? String(map[norm]) : t;
        }).join(',');
      }
      const _severityTranslated = translateEnumValue(SEVERITY_IDS, args.severity);
      const severityNeedles = applyMultiValueFilter(_severityTranslated, 'severity', 'severity') || [];

      // Page budget stays at defaults — server filters every field, so
      // we no longer need the 6000-row scan window that the (removed)
      // client-side fallback required.

      // extra_params override — set last so callers can patch anything
      // the above didn't cover (custom_field_X, sort=, dir=, etc.).
      // Tolerant: accept either a plain object OR a JSON-encoded string
      // (LLM callers often JSON.stringify nested args before passing).
      // Without this, Object.entries(string) iterates the string's
      // character map (0='{', 1='"', 2='m', ...) and shoves nonsense
      // into the URL — exactly what one chat run produced before.
      let extra = args.extra_params || {};
      if (typeof extra === 'string') {
        try { extra = JSON.parse(extra); }
        catch { extra = {}; }
      }
      if (extra && typeof extra === 'object' && !Array.isArray(extra)) {
        for (const [k, v] of Object.entries(extra)) {
          if (v == null || v === '') continue;
          if (Array.isArray(v)) { params.delete(k); v.forEach((x) => params.append(k, String(x))); }
          else params.set(k, String(v));
        }
      }
      const filterUrl = baseDir + 'view_all_set.php?' + params.toString();
      let appliedVia = 'url-query';

      // ── server-side filter via form POST ─────────────────────
      //
      // Some filters (Source, Keyword, custom multicheckbox groups)
      // can't be set by URL params alone on customized Mantis installs
      // (Fortinet etc.) — the form has many `<select name="multicheckbox[]">`
      // and Mantis identifies which one is which by DOM position
      // (preceding `show_<group>` marker). To target them we need to
      // mutate the actual <select>.selected on the form, then POST.
      //
      // Generic helper — reusable for any browser-protocol connector
      // whose backend is a form-driven filter page (Mantis, Jira
      // queue view, PMDB advanced search, ...). Strategy:
      //   1. Pair every `<input name="show_<X>">` marker with the
      //      next `<select name="multicheckbox[]">` after it.
      //   2. Treat <X> (and any associated <td class="category">
      //      label nearby) as the filter's logical key.
      //   3. Settings can override the map via `filter_form_mapping`
      //      for installs where auto-detection misses.
      //
      // Returns a Map<wantedLabel, HTMLSelectElement | null>.
      const filterFormMap = (() => {
        const map = new Map();
        // Strategy 0 (BEST): Fortinet-style stable id `multi_<field>`.
        // Probed live on mantis.fortinet.com — every filter multi-
        // checkbox has id like multi_source / multi_keyword /
        // multi_status / multi_severity / multi_priority /
        // multi_resolution / multi_tag. Strip `multi_` → logical key.
        // This sidesteps the fragile marker-walking that broke on
        // Fortinet's deeply-nested filter table layout.
        for (const sel of document.querySelectorAll('select[id^="multi_"]')) {
          const key = sel.id.slice(6).toLowerCase();
          if (key && !map.has(key)) map.set(key, sel);
        }
        // Strategy 1: `show_<X>` hidden marker → next multicheckbox[]
        // in **document order** (not sibling-walk — the marker and the
        // select are typically in different <tr>s, sibling-walk loses
        // them). Use a single linear scan: index all elements once,
        // then for each marker find the first multicheckbox[] after.
        const allEls = Array.from(document.querySelectorAll('*'));
        const markers = Array.from(document.querySelectorAll('input[name^="show_"], input[name="reportsource"]'));
        for (const marker of markers) {
          const raw = marker.getAttribute('name') || '';
          const key = raw.startsWith('show_') ? raw.slice(5).toLowerCase() : raw.toLowerCase();
          if (map.has(key)) continue;  // Strategy 0 wins
          const startIdx = allEls.indexOf(marker);
          for (let i = startIdx + 1; i < allEls.length; i++) {
            const el = allEls[i];
            if (el.tagName === 'SELECT' && /^multicheckbox(_tags)?\[\]$/.test(el.getAttribute('name') || '')) {
              map.set(key, el);
              break;
            }
            // Stop if we hit the NEXT marker — never cross marker boundaries.
            if (el.tagName === 'INPUT' && /^(show_|reportsource$|resolution$)/.test(el.getAttribute('name') || '')) {
              if (el !== marker) break;
            }
          }
        }
        // Strategy 2: <td class="category">LABEL</td> → next <td>'s input/select
        // (Mantis standard layout — gives canonical labels)
        const cats = Array.from(document.querySelectorAll('td.category, th.category'));
        for (const cat of cats) {
          const label = (cat.textContent || '').trim().toLowerCase().replace(/[:：]\s*$/, '');
          if (!label) continue;
          let n = cat.nextElementSibling;
          let hops = 0;
          while (n && hops < 4) {
            if (n.tagName === 'TD' || n.tagName === 'TH') {
              const sel = n.querySelector?.('select[name], input[type="text"][name]');
              if (sel && !map.has(label)) map.set(label, sel);
              if (sel) break;
            }
            n = n.nextElementSibling;
            hops += 1;
          }
        }
        return map;
      })();

      function selectOptions(sel, needles) {
        if (!sel || sel.tagName !== 'SELECT') return 0;
        const lc = needles.map(n => String(n).toLowerCase());
        let matched = 0;
        for (const opt of sel.options) {
          const txt = (opt.textContent || '').trim().toLowerCase();
          const val = (opt.value || '').toLowerCase();
          const hit = lc.some(n =>
            txt === n || val === n || (n.length > 1 && txt.includes(n))
          );
          opt.selected = hit;
          if (hit) matched++;
        }
        return matched;
      }

      // User's optional override: a dict like
      //   { "source": "reportsource", "keyword": "key" }
      // tells us which marker name to use for each logical filter.
      // Browser scripts only see `args` (not `settings`), so users
      // pass overrides per-call via args.filter_form_mapping. A
      // `settings` global may exist on future runners — try it
      // defensively so when we add bridge-level injection later this
      // just works.
      let userOverrides = {};
      try {
        if (typeof settings !== 'undefined' && settings && settings.filter_form_mapping) {
          userOverrides = settings.filter_form_mapping;
        }
      } catch (e) { /* settings undefined — ignore */ }
      if (args.filter_form_mapping && typeof args.filter_form_mapping === 'object') {
        userOverrides = { ...userOverrides, ...args.filter_form_mapping };
      }
      function getFilterSelect(want) {
        const key = String(want).toLowerCase();
        // Try user override → auto-mapped marker → category-label
        const override = userOverrides[key];
        if (override) {
          const el = filterFormMap.get(String(override).toLowerCase());
          if (el) return { el, src: 'override' };
        }
        const direct = filterFormMap.get(key);
        if (direct) return { el: direct, src: 'marker-or-label' };
        // Fallback: try plural / common variants
        for (const variant of [key + 's', key.replace(/s$/, ''), 'report' + key]) {
          const el = filterFormMap.get(variant);
          if (el) return { el, src: `variant:${variant}` };
        }
        return null;
      }

      // ── Form-POST filter path — v0.25.5 (probed live via CDP) ────
      // Mantis stores filter state in the user's session (cookie
      // MANTIS_VIEW_ALL_COOKIE1). URL params on view_all_bug_page.php
      // are SILENTLY IGNORED. The only way to apply a filter is to
      // POST the FULL filter form to view_all_set.php, preserving
      // every field's DOM order — Mantis pairs each `multicheckbox[]`
      // entry to the preceding `show_X` hidden marker by position.
      //
      // Form layout (mantis.fortinet.com, verified 2026-06-03):
      //   show_severity     → SELECT#multi_severity   (multicheckbox[])
      //   show_status       → SELECT#multi_status     (multicheckbox[])
      //   show_key          → SELECT#multi_keyword    (multicheckbox[])
      //   priority          → SELECT#multi_priority   (multicheckbox[])
      //   reportsource      → SELECT#multi_source     (multicheckbox[])
      //   resolution        → SELECT#multi_resolution (multicheckbox[])
      //   show_tag          → SELECT#multi_tag        (multicheckbox_tags[])
      //   search_fixforecast → text input (Fix Schedule string)
      //
      // Key gotchas that broke earlier versions:
      //   • POST URL must be `form.action` (?f=3) — NOT ?f=0. f=0 is
      //     anonymous, doesn't persist; Mantis serves a redirect to
      //     view_all_bug_page.php which reads cookie state instead of
      //     applying our submission.
      //   • Pre-existing form state (user's saved filter) carries OLD
      //     selections — we MUST reset all relevant multi-selects AND
      //     marker hidden inputs before applying ours, otherwise the
      //     saved state ANDs into our new filter and returns 0 rows.
      //   • `filter=Apply` must be appended (submit button isn't in
      //     FormData), tells Mantis "apply" vs "save as new".
      let usedFormPost = false;
      const _formApplied = {};

      // Fetch the live filter form. The script runs in the user's
      // already-logged-in Mantis tab; if it's not currently on
      // view_all_bug_page.php we GET that URL and parse the form via
      // DOMParser. fetch() inherits session cookies.
      // v0.25.7: REVERT v0.25.6 — fetching fresh with show_advance=1 broke
      // Fortinet's Mantis instance: ALL queries returned 0 (including bare
      // query with just project_id), even though _post_status was 200.
      // Hypothesis: the fetched form has differently-defaulted hidden
      // fields than the live one, so submitting it corrupts the user's
      // f=3 saved filter slot on the server. Going back to the v0.25.5
      // behavior — prefer live form, only fetch as fallback — restores
      // working state. The keyword-not-rendered case remains an issue
      // but a partial result is better than zero.
      let form = document.getElementById('filters');
      let formSource = 'live';
      if (!form) {
        try {
          const fr = await fetch(baseDir + 'view_all_bug_page.php?view_type=advanced',
            { credentials: 'include' });
          const html = await fr.text();
          const doc = new DOMParser().parseFromString(html, 'text/html');
          form = doc.getElementById('filters');
          formSource = 'fetched';
        } catch (e) {
          _formApplied._fetch_error = e.message;
        }
      }
      _formApplied._form_source = formSource;

      // Single-source-of-truth table — connector arg → (hidden marker,
      // SELECT id, expected SELECT name). Adding a new filterable field
      // is one row.
      const FILTER_MAP = [
        { argKey: 'status',     marker: 'show_status',   selectId: 'multi_status',     ids: statusIds.map(String) },
        { argKey: 'severity',   marker: 'show_severity', selectId: 'multi_severity',   ids: severityNeedles.map(String) },
        { argKey: 'keyword',    marker: 'show_key',      selectId: 'multi_keyword',    ids: keywordNeedles.map(String) },
        { argKey: 'source',     marker: 'reportsource',  selectId: 'multi_source',     ids: sourceNeedles.map(String) },
        { argKey: 'resolution', marker: 'resolution',    selectId: 'multi_resolution', ids: _resolutionIds.map(String) },
      ];

      const anyFilter = FILTER_MAP.some(f => f.ids.length > 0) || !!fixForecast;
      if (form && anyFilter) {
        // ── Reset old filter state (CRITICAL) ──
        // Any multicheckbox[] / multicheckbox_tags[] selection AND
        // marker value from the user's previously-saved filter would
        // get ANDed with our submission, returning 0 rows.
        for (const sel of form.querySelectorAll('select[name="multicheckbox[]"], select[name="multicheckbox_tags[]"]')) {
          for (const opt of sel.options) opt.selected = false;
        }
        const MARKERS_TO_CLEAR = [
          'show_status', 'show_severity', 'show_key', 'show_tag',
          'priority', 'reportsource', 'resolution',
        ];
        for (const name of MARKERS_TO_CLEAR) {
          const el = form.querySelector(`input[name="${name}"]`);
          if (el) el.value = '';
        }
        const fixInp = form.querySelector('input[name="search_fixforecast"]');
        if (fixInp) fixInp.value = '';

        // ── Apply each user-requested filter ──
        for (const f of FILTER_MAP) {
          if (f.ids.length === 0) continue;
          const marker = form.querySelector(`input[name="${f.marker}"]`);
          const sel = form.querySelector('#' + f.selectId);
          if (marker) marker.value = f.ids.join(',');
          let matched = 0;
          if (sel) {
            const want = new Set(f.ids);
            for (const opt of sel.options) {
              opt.selected = want.has(String(opt.value));
              if (opt.selected) matched++;
            }
          }
          _formApplied[f.argKey] = {
            marker: f.marker, select_id: f.selectId,
            requested_ids: f.ids, matched_options: matched,
            select_found: !!sel, marker_found: !!marker,
          };
        }
        if (fixForecast && fixInp) {
          fixInp.value = fixForecast;
          _formApplied.fix_schedule = { applied: fixForecast, field: 'search_fixforecast' };
        }

        // ── Serialize + POST ──
        // URLSearchParams preserves duplicate multicheckbox[] keys in
        // DOM order. FormData with File entries would matter for
        // multipart, but this form has none — urlencoded is correct.
        try {
          const fd = new FormData(form);
          const body = new URLSearchParams();
          for (const [k, v] of fd.entries()) body.append(k, typeof v === 'string' ? v : '');
          body.append('filter', 'Apply');
          // Use form.action verbatim (?f=3). The connector spent v0.14
          // → v0.17 swapping action URLs; f=3 is what actually works.
          const action = form.action || (baseDir + 'view_all_set.php?f=3&view_type=0');
          const resp = await fetch(action, {
            method: 'POST',
            body: body.toString(),
            credentials: 'include',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            redirect: 'follow',
          });
          _formApplied._post_action = action;
          _formApplied._post_status = resp.status;
          _formApplied._post_final_url = resp.url;
          if (resp.ok) {
            appliedVia = 'form-post';
            usedFormPost = true;
          }
        } catch (e) {
          _formApplied._post_error = e.message;
        }
      } else if (anyFilter) {
        _formApplied._error = 'form not found — falling back to URL-param path';
      }
      _filterDiag._form_applied = _formApplied;
      _filterDiag._applied_via = appliedVia;
      _filterDiag._enum_applied = _enumApplied;
      _filterDiag._enum_cache_available = !!_enumCache;

      const r = usedFormPost
        ? { ok: true }  // form POST already applied filter
        : await fetch(filterUrl, { credentials: 'include' }).catch((e) => ({ _err: e.message }));
      if (r?._err) return { bugs: [], total: 0, _error: `filter set failed: ${r._err}`, _filter_url: filterUrl };

      const STATUS_RE = /^(new|feedback|acknowledged|confirmed|assigned|open|resolved|closed|reopened)$/i;
      const matched = [];
      let scanned = 0, pagesWalked = 0, lastUrl = '';
      // Hoisted so the return block (after the loop) can echo the actual
      // column names back for debugging missed filters.
      let lastHeaderIdx = {};
      // Total matching the filter (NOT slice-limited by \`limit\`). Mantis
      // Classic renders \`Viewing Bugs (1 - 50 / 151)\` above the bug list;
      // 151 is what callers actually want to know how many bugs are out
      // there. Parsed from the first page only — total is constant across
      // pages.
      let serverTotal = null;

      for (let page = 1; page <= MAX_PAGES; page++) {
        const listUrl = `${baseDir}view_all_bug_page.php?page_number=${page}`;
        lastUrl = listUrl;
        const html = await fetch(listUrl, { credentials: 'include' }).then(r => r.text())
          .catch(e => `__FETCH_ERR__:${e.message}`);
        if (html.startsWith('__FETCH_ERR__:')) {
          return { bugs: matched, total: matched.length, _error: html.slice('__FETCH_ERR__:'.length), _filter_url: filterUrl, _page: listUrl, scanned, pages_walked: pagesWalked };
        }
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const list = doc.querySelector('#bug_list');
        if (!list) {
          return { bugs: matched, total: matched.length, _error: '#bug_list not found', _filter_url: filterUrl, _page: listUrl, scanned, pages_walked: pagesWalked };
        }
        const allRows = Array.from(list.querySelectorAll('tr'));
        const headerRow = allRows.find(r => r.className === 'row-category');
        const dataRows = allRows.filter(r => r.querySelector('input[name*="bug"]'));
        if (dataRows.length === 0) break;        // out of rows
        pagesWalked++;

        // Parse Mantis pagination header: "Viewing Bugs (1 - 50 / 151)".
        // First page only — total is constant across pages. YAML `|` block
        // passes backslashes through verbatim, so regex shorthands use a
        // SINGLE backslash (matches the rest of the file's regex style).
        if (serverTotal === null) {
          const docText = (doc.body?.textContent || '');
          const m = docText.match(/Viewing\s+(?:Bugs|Issues)\s*\(\s*\d+\s*-\s*\d+\s*\/\s*(\d+)\s*\)/i);
          if (m) serverTotal = Number(m[1]);
        }
        // First page: lock actualPageSize and bump MAX_PAGES so we can
        // walk enough rows to find sanity-passing matches in a big
        // server result set. Without this, Mantis serving per_page=50
        // (despite our per_page=100 request) caused the loop to think
        // page 1 was already the last page and stop at scanned=50.
        if (page === 1) {
          actualPageSize = dataRows.length;
          if (serverTotal && actualPageSize > 0) {
            const needed = Math.ceil(serverTotal / actualPageSize);
            MAX_PAGES = Math.min(MAX_PAGES_ADAPTIVE, Math.max(MAX_PAGES, needed));
          }
        }

        const headerIdx = {};
        if (headerRow) {
          Array.from(headerRow.querySelectorAll('td, th')).forEach((c, i) => {
            const name = (c.textContent || '').trim().toLowerCase();
            if (name) headerIdx[name] = i;
          });
        }
        lastHeaderIdx = headerIdx;
        const col = (cells, header) => {
          const idx = headerIdx[header.toLowerCase()];
          if (idx === undefined) return '';
          return (cells[idx]?.textContent || '').replace(/\s+/g, ' ').trim();
        };
        // Fuzzy column lookup — tries any header containing one of the
        // probe words. Survives Mantis themes that rename "Handler" to
        // "Assigned", or include a sort indicator like "Assigned ↑" in the
        // header text. First matching header wins.
        const colMatch = (cells, ...probes) => {
          const lower = probes.map(s => s.toLowerCase());
          for (const [hdr, idx] of Object.entries(headerIdx)) {
            if (lower.some(p => hdr.includes(p))) {
              return (cells[idx]?.textContent || '').replace(/\s+/g, ' ').trim();
            }
          }
          return '';
        };

        for (const r of dataRows) {
          scanned++;
          const cells = Array.from(r.querySelectorAll('td'));
          const checkbox = r.querySelector('input[type="checkbox"][name*="bug"]');
          const link = r.querySelector('a[href*="bug_view_page.php?bug_id="]');
          const id = checkbox?.value
            ? Number(checkbox.value)
            : Number(link?.getAttribute('href')?.match(/bug_id=(\d+)/)?.[1] || 0);
          if (!id) continue;
          let status = col(cells, 'Status');
          if (!STATUS_RE.test(status)) {
            const resolution = col(cells, 'Resolution');
            if (STATUS_RE.test(resolution)) status = resolution;
          }
          const fixSchedule = col(cells, 'Fix Schedule');
          const resolutionCell = col(cells, 'Resolution');
          // ─── Client-side sanity check (stable list columns only) ───
          // Mantis sometimes accepts the form-POST keyword filter but
          // silently drops the URL-only fix_schedule / show_status /
          // resolution[] co-params (POST replaces the view-state, URL
          // params from the same request get ignored). Verify HERE
          // against the row's own column text — but ONLY if the column
          // is non-empty. Empty column → trust server (Fortinet's theme
          // hides several fields from list view, so absence ≠ mismatch).
          const _matchNeedles = (hay, needles) => {
            if (!needles.length) return true;
            const h = String(hay || '').trim().toLowerCase();
            if (!h) return true;
            return needles.some(n => h === n || h.includes(n));
          };
          if (!_matchNeedles(fixSchedule, _fixNeedles)
            || !_matchNeedles(status, _statusNeedles)
            || !_matchNeedles(resolutionCell, _resolutionNeedles)) {
            _droppedBySanity++;
            continue;
          }
          const assigneeText = colMatch(cells, 'handler', 'assigned', 'assignee')
            .replace(/^\(|\)$/g, '').trim();
          const reporterText = colMatch(cells, 'reporter');
          const qaText = colMatch(cells, 'qa assignee', 'qa-assignee', 'qa_assignee');

          matched.push({
            id,
            summary: link?.getAttribute('title')?.trim() || col(cells, 'Summary'),
            status,
            priority: col(cells, 'Priority'),
            severity: col(cells, 'Severity') || col(cells, 'S'),
            keywords: colMatch(cells, 'keyword', 'keywords', 'category'),
            source: colMatch(cells, 'source'),
            reporter: reporterText,
            assignee: assigneeText,
            qa_assignee: qaText,
            fix_schedule: fixSchedule,
            product_version: col(cells, 'Reported Version') || col(cells, 'Product Version'),
            last_updated: col(cells, 'Updated') || col(cells, 'Last Updated'),
            url: link?.getAttribute('href') ? new URL(link.getAttribute('href'), location.origin).toString() : '',
          });

          if (matched.length >= limit) break;
        }
        if (matched.length >= limit) break;
        if (dataRows.length < PAGE_SIZE) break;  // last page (short)
      }

      return {
        bugs: matched,
        // total returned (post-limit) — what the caller iterates over.
        total: matched.length,
        // total_matching — how many bugs Mantis says match the filter
        // across ALL pages (parsed from "Viewing Bugs (1 - 50 / 151)").
        // null if the parser couldn't find that header (theme variation).
        total_matching: serverTotal,
        rawCount: scanned,
        scanned,
        pages_walked: pagesWalked,
        query: args.query || '',
        status: args.status || 'open',
        project_id: resolvedProjectId || (args.project_id || null),
        project_name: resolvedProjectName || (args.project_name || ''),
        fix_schedule: args.fix_schedule || '',
        assignee: args.assignee || '',
        reporter: args.reporter || '',
        qa_assignee: args.qa_assignee || '',
        keyword: args.keyword || '',
        source: args.source || '',
        // Diagnostics for keyword / source: which URL param they hit,
        // whether the form-introspection found a match, the values
        // applied. If `detected_from_form: false` and you're getting
        // wrong results, your Mantis install probably uses
        // custom_field_<id> for that field — open the filter page,
        // inspect the corresponding <select>'s `name` attribute, and
        // pass it via `extra_params: { custom_field_N: "QA" }`.
        _filter_diagnostics: _filterDiag,
        // Dump every (label, name) pair on the filter form so callers
        // can see EXACTLY what params their Mantis exposes. Paste back
        // when source/keyword detection picks the wrong field — the
        // right `custom_field_<N>` to put in `extra_params` will be
        // here.
        _available_filter_fields: _availableFilterFields,
        // Echo back what resolved to user IDs vs fell through to client
        // substring. If a value was passed but neither resolved nor matched
        // anything, you'll see resolved_*=null AND zero results.
        resolved_handler_id: handlerId,
        resolved_reporter_id: reporterId,
        resolved_qa_assignee_id: qaAssigneeId,
        // Actual column headers Mantis emitted on the list page — useful
        // when the client-side fallback doesn't catch anything.
        _columns: Object.keys(lastHeaderIdx),
        _applied_via: appliedVia,
        _filter_url: filterUrl,
        _page: lastUrl,
        // Number of rows the server returned that failed local
        // sanity check (fix_schedule / status / resolution column
        // didn't match the user's request). High value here = the
        // server-side filter for that arg silently failed; total
        // is still bounded by `limit` so the caller still gets up
        // to N true matches.
        _dropped_by_sanity: _droppedBySanity,
      };

  list_projects:
    description: |
      List projects the current user can see. Returns a cached snapshot
      (24-hour TTL) of every (id, name) the project switcher shows;
      pass refresh=true to bypass the cache. Cache lives in localStorage
      under `__forge_mantis_project_cache_v1` (per-Mantis-origin).

      Used internally by search_bugs to resolve project_name → id without
      asking the user for the numeric id every time.
    parameters:
      refresh:
        type: boolean
        label: Force refresh
        description: "If true, ignore the local cache and re-pull the list from the project switcher."
        required: false
    returns: "{ projects: [{id, name, depth}], total, from_cache, ttl_remaining_sec }"
    page:
      url: "{base_url}/view_all_bug_page.php"
      on_target: "/view_all_bug_page.php"
    script: |
      const STORAGE_KEY = '__forge_mantis_project_cache_v1';
      const TTL_MS = 24 * 60 * 60 * 1000;
      const force = !!args.refresh;
      if (!force) {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const obj = JSON.parse(raw);
            if (obj && obj.ts && Date.now() - obj.ts < TTL_MS && Array.isArray(obj.projects)) {
              return {
                projects: obj.projects,
                total: obj.projects.length,
                from_cache: true,
                ttl_remaining_sec: Math.floor((TTL_MS - (Date.now() - obj.ts)) / 1000),
              };
            }
          }
        } catch {}
      }
      const sel = document.querySelector('select[name="project_id"]');
      if (!sel) return { _error: 'project_id select not found on page' };
      const projects = Array.from(sel.options)
        .map(o => ({
          id: Number(o.value),
          name: (o.text || '').trim(),
          depth: ((o.text || '').match(/^[\s ]+/)?.[0]?.length) || 0,
        }))
        .filter(p => p.id > 0);
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ ts: Date.now(), projects }));
      } catch {}
      return {
        projects, total: projects.length, from_cache: false,
        ttl_remaining_sec: Math.floor(TTL_MS / 1000),
      };

  refresh_enum_cache:
    description: |
      Probe the Mantis filter form and snapshot the full (name → id +
      form-param) map of every multicheckbox-style enum field on this
      install (Keyword, Source, Category, Severity, Status, Resolution,
      anything else with a `show_<X>` marker + adjacent <select>).

      Snapshot is cached in localStorage (key __forge_mantis_enum_cache_v1,
      24h TTL) — search_bugs reads it to translate human-readable
      string filter values ("QA Automation Test", "open,reopened") into
      the numeric ids Mantis actually accepts on its filter URL.

      Call this when Mantis adds / renames a Keyword or other enum
      option; otherwise the cache renews itself every 24h.
    parameters:
      refresh:
        type: boolean
        label: Force refresh
        description: "Ignore the cached snapshot and re-probe the form."
        required: false
    returns: "{ enums: { <logicalKey>: { marker, param, options: [{value,label}] } }, total_enums, total_options, from_cache, ttl_remaining_sec }"
    page:
      url: "{base_url}/view_all_bug_page.php"
      on_target: "/view_all_bug_page.php"
    script: |
      const STORAGE_KEY = '__forge_mantis_enum_cache_v1';
      const TTL_MS = 24 * 60 * 60 * 1000;
      const force = !!args.refresh;

      if (!force) {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const obj = JSON.parse(raw);
            if (obj && obj.ts && Date.now() - obj.ts < TTL_MS && obj.enums) {
              const totalOpts = Object.values(obj.enums)
                .reduce((s, e) => s + (e.options?.length || 0), 0);
              return {
                enums: obj.enums,
                total_enums: Object.keys(obj.enums).length,
                total_options: totalOpts,
                from_cache: true,
                ttl_remaining_sec: Math.floor((TTL_MS - (Date.now() - obj.ts)) / 1000),
              };
            }
          }
        } catch {}
      }

      // Probe the filter form. Mantis renders each enum filter as:
      //   <input type="hidden" name="show_<logicalKey>" ... />   ← marker
      //   <select name="<actualParam>" ...>                        ← the field
      //     <option value="<id>">Human label</option>
      //     ...
      // The marker's `name` (e.g. show_key / show_source) tells us
      // which logical filter this is; the *next* SELECT in DOM order
      // is the actual multicheckbox. We harvest (value, label) pairs
      // and remember the select's `name=` so callers know which URL
      // param to fill in.
      const form = document.querySelector('form#filter_form, form[action*="view_all_set"], form[action*="view_all"]')
        || document.forms[0];
      if (!form) return { _error: 'filter form not found on view_all_bug_page.php — are you logged in?' };

      const enums = {};
      // DOM-order pairing: Mantis renders <input name="show_X"> as a
      // marker, then later (often in a different <td>/<tr>, NOT a
      // sibling) renders a <select name="multicheckbox[]">. The first
      // multicheckbox[] AFTER each marker belongs to that marker.
      // nextElementSibling failed on keyword/category/source because
      // they cross table-cell boundaries. Use a flat DOM-order list.
      const flow = Array.from(form.querySelectorAll(
        'input[name^="show_"], select[name^="show_"], select[name="multicheckbox[]"], select[name^="multicheckbox_"]'
      ));
      const consumedSelects = new Set();
      flow.forEach((el, idx) => {
        if (el.tagName === 'INPUT' && el.getAttribute('name')?.startsWith('show_')) {
          const markerName = el.getAttribute('name') || '';
          const logicalKey = markerName.replace(/^show_/, '');
          if (!logicalKey) return;
          // Find the first SELECT AFTER this marker that hasn't been
          // claimed by an earlier marker.
          for (let j = idx + 1; j < flow.length; j++) {
            const cand = flow[j];
            if (cand.tagName !== 'SELECT') continue;
            if (consumedSelects.has(j)) continue;
            const selectName = cand.getAttribute('name') || '';
            // Skip if it's another show_X marker rendered as SELECT —
            // that's a standalone filter, paired with itself below.
            if (selectName.startsWith('show_')) break;
            const options = Array.from(cand.options || [])
              .map(o => ({ value: String(o.value || '').trim(), label: String(o.text || '').trim() }))
              .filter(o => o.value && o.value !== '0' && o.label);
            if (options.length === 0) { consumedSelects.add(j); continue; }
            enums[logicalKey] = { marker: markerName, param: selectName, options };
            consumedSelects.add(j);
            break;
          }
        } else if (el.tagName === 'SELECT' && el.getAttribute('name')?.startsWith('show_')) {
          // Standalone show_X SELECT (no INPUT marker) — the SELECT
          // itself is the filter. Used by some installs for category.
          const selectName = el.getAttribute('name') || '';
          const logicalKey = selectName.replace(/^show_/, '');
          if (!logicalKey) return;
          const options = Array.from(el.options || [])
            .map(o => ({ value: String(o.value || '').trim(), label: String(o.text || '').trim() }))
            .filter(o => o.value && o.value !== '0' && o.label);
          if (options.length === 0) return;
          enums[logicalKey] = { marker: null, param: selectName, options };
        }
      });

      // Also probe stand-alone SELECTs with well-known names that don't
      // use a marker pattern (some installs render Status / Resolution
      // this way). Only include if we haven't already covered them via
      // the marker walk above.
      for (const known of ['reportsource', 'resolution']) {
        if (enums[known]) continue;
        const sel = form.querySelector(`select[name="${known}"], select[name="${known}[]"]`);
        if (!sel) continue;
        const options = Array.from(sel.options || [])
          .map(o => ({ value: String(o.value || '').trim(), label: String(o.text || '').trim() }))
          .filter(o => o.value && o.value !== '0' && o.label);
        if (options.length > 0) {
          enums[known] = { marker: null, param: sel.getAttribute('name') || known, options };
        }
      }

      if (Object.keys(enums).length === 0) {
        return { _error: 'no enum fields detected in the filter form — Mantis page layout may have changed' };
      }

      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ ts: Date.now(), enums })); } catch {}

      const totalOpts = Object.values(enums).reduce((s, e) => s + e.options.length, 0);
      return {
        enums,
        total_enums: Object.keys(enums).length,
        total_options: totalOpts,
        from_cache: false,
        ttl_remaining_sec: Math.floor(TTL_MS / 1000),
      };

  list_attachments:
    description: |
      List the Attached Files on a single bug. Returns file_id, filename,
      size, uploaded_at + the canonical download URL.

      Implementation: scrape file_download.php?file_id=N&type=bug links
      from bug_view_page.php. Each file appears twice (icon-link + name-
      link); dedup by file_id. Filename / size / date are parsed from
      the row text "<filename> (<N> bytes) <YYYY-MM-DD HH:MM>".
    parameters:
      bug_id:
        type: number
        label: Bug ID
        description: "Mantis bug numeric id whose attachments you want listed."
        required: true
    returns: "{ attachments: [{ file_id, filename, size, uploaded_at, download_url }], total }"
    page:
      url: "{base_url}/bug_view_page.php?bug_id={args.bug_id}"
      on_target: "bug_id={args.bug_id}"
    script: |
      const out = { attachments: [], total: 0 };
      const seen = new Set();
      const anchors = Array.from(document.querySelectorAll('a[href*="file_download.php?file_id="]'));
      for (const a of anchors) {
        const m = a.href.match(/file_id=(\d+)/);
        if (!m) continue;
        const fileId = Number(m[1]);
        if (seen.has(fileId)) continue;
        seen.add(fileId);

        // The filename text is on the OTHER anchor for the same id
        // (icon-link is empty). Find a sibling anchor that has text.
        let filename = (a.textContent || '').trim();
        if (!filename) {
          const sib = anchors.find(x => x !== a && x.href === a.href && (x.textContent || '').trim());
          filename = (sib?.textContent || '').trim();
        }
        // Parent text holds "filename (NN bytes) DATE" for THIS file +
        // possibly other files. Slice from filename onwards, parse first
        // "(N bytes)" + "(YYYY-MM-DD HH:MM)" after it.
        const parent = (a.closest('td, li, tr, p, div')?.textContent || '').replace(/\s+/g, ' ');
        let size = 0, uploadedAt = '';
        if (filename) {
          const idx = parent.indexOf(filename);
          const chunk = idx >= 0 ? parent.slice(idx + filename.length, idx + filename.length + 80) : parent;
          const sm = chunk.match(/\(\s*([\d,]+)\s*bytes?\s*\)/i);
          if (sm) size = Number(sm[1].replace(/,/g, ''));
          const dm = chunk.match(/(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2})/);
          if (dm) uploadedAt = dm[1];
        }
        out.attachments.push({
          file_id: fileId,
          filename,
          size,
          uploaded_at: uploadedAt,
          download_url: a.href,
        });
      }
      out.total = out.attachments.length;
      return out;

  download_attachment:
    description: |
      Download a single bug attachment as base64. Caller is responsible
      for checking size first (via list_attachments) — \`max_size_bytes\`
      hard-aborts before reading if the response Content-Length exceeds
      it (default 5 MB), keeping the wire and base64 cost bounded.

      Returns { filename, mime, size, content_b64 }. Pipelines write
      content_b64 → \`base64 -d\` → a real file in .attachments/.
    parameters:
      file_id:
        type: number
        label: File ID (from list_attachments)
        description: "Attachment file_id from list_attachments — used in file_download.php?file_id=<N>."
        required: true
      max_size_bytes:
        type: number
        label: "Max size — files larger than this are SKIPPED (returns { skipped: true, size })"
        description: "Skip download if HEAD reports size above this many bytes (default 5 MB)."
        default: 5242880
    returns: "{ filename, mime, size, content_b64, skipped? }"
    page:
      url: "{base_url}/bug_view_page.php"
      on_target: "/bug_view_page.php"
    script: |
      // HEAD first to learn size + filename without buffering the body.
      const url = `${location.origin}/file_download.php?file_id=${args.file_id}&type=bug`;
      const headResp = await fetch(url, { method: 'HEAD', credentials: 'include' }).catch(e => ({ _err: e.message }));
      if (headResp && headResp._err) return { _error: 'HEAD failed: ' + headResp._err };
      if (!headResp.ok) return { _error: `HEAD HTTP ${headResp.status}` };
      const cl = Number(headResp.headers.get('content-length') || 0);
      const mime = headResp.headers.get('content-type') || 'application/octet-stream';
      // Try to pull filename from Content-Disposition.
      let filename = '';
      const cd = headResp.headers.get('content-disposition') || '';
      const fm = cd.match(/filename\*?=(?:UTF-8'')?"?([^"\;\n]+)"?/i);
      if (fm) filename = decodeURIComponent(fm[1]);

      const cap = Number(args.max_size_bytes) || 5242880;
      if (cl > cap) {
        return { filename, mime, size: cl, content_b64: '', skipped: true, reason: `size ${cl} > cap ${cap}` };
      }
      // GET full payload.
      const buf = await fetch(url, { credentials: 'include' }).then(r => r.arrayBuffer());
      // arraybuffer → base64. btoa wants binary string.
      let bin = '';
      const bytes = new Uint8Array(buf);
      const CHUNK = 0x8000;
      for (let i = 0; i < bytes.length; i += CHUNK) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
      }
      return { filename, mime, size: bytes.length, content_b64: btoa(bin) };

  add_comment:
    description: |
      Add a note (comment) to a bug. Requires user confirmation in the
      extension before sending. Mantis 1.x has no CSRF token on this
      form — session cookie alone authorises.
    destructive: true
    parameters:
      bug_id:
        type: number
        label: Bug ID
        description: "Mantis bug numeric id to comment on."
        required: true
      text:
        type: string
        label: Comment text
        description: "Note body; sent as bugnote_text to bugnote_add.php."
        required: true
    returns: "{ ok, status, finalUrl, success }"
    page:
      url: "{base_url}/bug_view_page.php?bug_id={args.bug_id}"
      on_target: "bug_id={args.bug_id}"
    script: |
      const body = new URLSearchParams({
        bug_id: String(args.bug_id),
        bugnote_text: args.text,
      });
      try {
        const r = await fetch('bugnote_add.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: body.toString(),
          credentials: 'include',
          redirect: 'follow',
        });
        return {
          ok: r.ok,
          status: r.status,
          finalUrl: r.url,
          success: r.ok && r.url.includes('bug_id=' + args.bug_id),
        };
      } catch (e) {
        return { ok: false, error: e.message };
      }

  update_bug:
    description: |
      Update a bug's status / resolution / assignee. Loads the
      `bug_update_page.php` form, overrides the fields you specify,
      and submits back to the form's own action URL (typically
      `bug_update.php`). All params except `bug_id` are optional —
      omit to leave that field alone. Accepts human names ('feedback',
      'fixed') OR numeric ids. Mantis 1.x has no CSRF token on this
      form — session cookie alone authorises.
    destructive: true
    parameters:
      bug_id:
        type: number
        label: Bug ID
        description: "Mantis bug numeric id to update."
        required: true
      status:
        type: string
        label: New status
        description: "New status — name ('feedback', 'resolved') or numeric id (10/20/.../80/90)."
        help: |
          One of: new, feedback, acknowledged, confirmed, assigned,
          resolved, closed. Or a numeric status_id (10/20/30/40/50/80/90).
      resolution:
        type: string
        label: New resolution
        description: "New resolution — name ('fixed', 'duplicate') or numeric id (10–90)."
        help: |
          One of: open, fixed, reopened, unable_to_reproduce, not_fixable,
          duplicate, not_a_bug, suspended, wont_fix. Or numeric (10/20/30/
          40/50/60/70/80/90).
      handler:
        type: string
        label: Assignee (username or numeric id)
        description: "New assignee — username or numeric user id; resolved against the handler_id select."
    returns: "{ ok, status, finalUrl, applied: {...} }"
    page:
      url: "{base_url}/bug_update_page.php?bug_id={args.bug_id}"
      on_target: "bug_id={args.bug_id}"
    script: |
      const STATUS_IDS = {
        new: 10, feedback: 20, acknowledged: 30, confirmed: 40,
        assigned: 50, resolved: 80, closed: 90,
      };
      const RESOLUTION_IDS = {
        open: 10, fixed: 20, reopened: 30, unable_to_reproduce: 40,
        not_fixable: 50, duplicate: 60, not_a_bug: 70, suspended: 80,
        wont_fix: 90,
      };
      function toId(map, raw) {
        const v = String(raw || '').trim().toLowerCase().replace(/[\s-]+/g, '_');
        if (!v) return null;
        if (/^\d+$/.test(v)) return v;
        return map[v] != null ? String(map[v]) : null;
      }
      function resolveHandler(value) {
        const v = String(value || '').trim();
        if (!v) return null;
        if (/^\d+$/.test(v)) return v;
        const lv = v.toLowerCase();
        // Mantis renders ALL users in the handler_id <select> on this page.
        const sel = document.querySelector('select[name="handler_id"]');
        if (!sel) return null;
        for (const opt of sel.options) {
          const id = opt.value;
          if (!/^\d+$/.test(id)) continue;
          const label = (opt.textContent || '').toLowerCase().trim();
          const m = label.match(/\(([a-z0-9_.-]+)\)\s*$/);
          if (m && m[1] === lv) return id;
          if (label === lv || label.includes(lv)) return id;
        }
        return null;
      }

      // Grab the page's own update form so we POST EVERY existing field
      // (custom fields, hidden tokens, etc) — same trick search_bugs uses.
      const form = document.querySelector(
        'form[name="update_bug_form"], form[action*="bug_update"]',
      );
      if (!form) return { _error: 'bug_update form not found — page not loaded or layout changed' };

      const fd = new FormData(form);
      const applied = {};

      const statusId = toId(STATUS_IDS, args.status);
      if (statusId) { fd.set('status', statusId); applied.status = statusId; }
      const resId = toId(RESOLUTION_IDS, args.resolution);
      if (resId) { fd.set('resolution', resId); applied.resolution = resId; }
      const handlerId = resolveHandler(args.handler);
      if (handlerId) { fd.set('handler_id', handlerId); applied.handler_id = handlerId; }

      // Mantis sometimes wants `bugnote_text` too; leave existing value
      // unchanged. Don't echo anything sensitive into the field.
      if (Object.keys(applied).length === 0) {
        return { ok: false, error: 'no updatable fields supplied (need status / resolution / handler)' };
      }

      const action = form.getAttribute('action') || 'bug_update.php';
      try {
        const r = await fetch(action, {
          method: 'POST',
          body: fd,
          credentials: 'include',
          redirect: 'follow',
        });
        return {
          ok: r.ok,
          status: r.status,
          finalUrl: r.url,
          applied,
          success: r.ok && (r.url.includes('bug_view') || r.url.includes('bug_id=' + args.bug_id)),
        };
      } catch (e) {
        return { ok: false, error: e.message, applied };
      }
